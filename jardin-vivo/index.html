// Espiga de florecitas (lavanda, salvia, albahaca)
function spike(g, x, y, len, w, col, open) {
  w *= 1.3;
  const n = Math.max(3, Math.round(len / Math.max(1.2, w * 0.9)));
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), py = y - len * t, sw = w * (1 - t * 0.55);
    const on = open > 0.35 ? 1 : 0.3;
    g.fillStyle = css(on ? shade(col, -0.12 + t * 0.25) : mix(col, [110, 140, 90], 0.6));
    g.beginPath(); g.ellipse(x - sw * 0.35, py, sw * 0.5, sw * 0.42, -0.4, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(x + sw * 0.35, py - sw * 0.3, sw * 0.5, sw * 0.42, 0.4, 0, TAU); g.fill();
  }
}
// Racimo colgante (glicina)
function raceme(g, x, y, len, w, col) {
  const n = Math.max(4, Math.round(len / (w * 0.7)));
  for (let i = 0; i < n; i++) {
    const t = i / (n - 1), sw = w * (1 - t * 0.7);
    g.fillStyle = css(shade(col, 0.12 - t * 0.3));
    g.beginPath(); g.ellipse(x + Math.sin(i * 1.7) * sw * 0.4, y + len * t, sw * 0.55, sw * 0.4, 0, 0, TAU); g.fill();
  }
}
// Campanitas colgando de una vara (dedalera, hosta, arándano)
function bells(g, x, y, len, n, R, col, open, lean) {
  R *= 1.5;
  g.strokeStyle = css(shade(col, -0.4), 0.7); g.lineWidth = Math.max(0.6, R * 0.12);
  g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + lean * 0.5, y - len * 0.5, x + lean, y - len); g.stroke();
  for (let i = 0; i < n; i++) {
    const t = 0.15 + 0.85 * i / n, bx = x + lean * t * t, by = y - len * t, r = R * (1 - t * 0.45);
    if (open < 0.35 || t > 0.85) { disk(g, bx + r * 0.4, by, r * 0.35, mix(col, [110, 140, 90], 0.5)); continue; }
    g.fillStyle = css(shade(col, (i % 2) * 0.06));
    g.beginPath(); g.moveTo(bx, by); g.quadraticCurveTo(bx + r * 1.4, by - r * 0.2, bx + r * 1.1, by + r * 1.0);
    g.quadraticCurveTo(bx + r * 0.5, by + r * 1.25, bx - r * 0.1, by + r * 0.85); g.closePath(); g.fill();
    g.fillStyle = css(shade(col, -0.35), 0.6); g.beginPath(); g.ellipse(bx + r * 0.55, by + r * 0.95, r * 0.4, r * 0.18, -0.3, 0, TAU); g.fill();
  }
}

// ---------- Frutos ----------

      g.fillStyle = 'rgba(255,255,255,0.38)'; g.beginPath(); g.arc(x - R * 0.35, y - R * 0.35, R * 0.32, 0, TAU); g.fill();
      if (s === 'round') { g.fillStyle = '#3f6f2a'; g.beginPath(); g.arc(x, y - R * 0.85, R * 0.3, 0, TAU); g.fill(); }

    case 'long':

      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + R * 1.2, y + R * 2.2, x + R * 0.4, y + R * 4.2); g.stroke();
      g.fillStyle = css(shade(c, 0.25)); for (let k = 1; k < 4; k++) { g.beginPath(); g.arc(x + R * 0.7 - k * 0.1 * R, y + R * k * 1.05, R * 0.3, 0, TAU); g.fill(); }
      break;
    case 'strawberry':

// ---------- Formas ----------
const FORMS = {};

// Plántula: dos hojitas
function seedling(g, S, vs, sp) {
  const h = S * (0.04 + vs.g * 0.4), c = vs.lc;
  g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.8, S * 0.008);
  g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -h); g.stroke();
  if (sp.type === 'bulb' || sp.art.f === 'strap') {
    for (const a of [-0.25, 0.2]) leaf(g, 0, 0, -Math.PI / 2 + a, h * 1.3, S * 0.012, c, 'lance');
    return;
  }
  leaf(g, 0, -h, -0.35, S * 0.05, S * 0.02, c, 'oval');
  leaf(g, 0, -h, Math.PI + 0.35, S * 0.05, S * 0.02, shade(c, -0.08), 'oval');
}

// Planta en reposo: una estaca de jardinero y unos tallos secos
function dormantStub(g, S, vs, sp) {
  g.fillStyle = 'rgba(80,58,38,0.55)'; g.beginPath(); g.ellipse(0, 0, S * 0.12, S * 0.05, 0, 0, TAU); g.fill();
  if (sp.type !== 'bulb' && sp.type !== 'aquatic') {
    g.strokeStyle = css(C_DEAD); g.lineWidth = Math.max(0.8, S * 0.008); g.lineCap = 'round';
    for (let i = 0; i < 4; i++) { const a = -Math.PI / 2 + (i - 1.5) * 0.3; g.beginPath(); g.moveTo(0, 0); g.lineTo(Math.cos(a) * S * 0.12, Math.sin(a) * S * 0.12); g.stroke(); }
  }
  // etiqueta
  g.fillStyle = '#d9c9a3'; g.fillRect(S * 0.06, -S * 0.2, S * 0.012, S * 0.2);
  g.fillStyle = '#f4ecd8'; g.fillRect(S * 0.035, -S * 0.24, S * 0.07, S * 0.06);
  g.strokeStyle = 'rgba(80,60,40,0.5)'; g.lineWidth = 0.6; g.strokeRect(S * 0.035, -S * 0.24, S * 0.07, S * 0.06);
}

FORMS.stem = (g, sp, vs, S, r) => {
  const a = sp.art, sz = 0.18 + 0.82 * vs.g, droop = vs.wilt * 0.9 + (vs.dead ? 0.8 : 0);
  const lwk = a.lf === 'lance' || a.lf === 'grass' ? 0.2 : a.lf === 'heart' ? 0.46 : a.lf === 'feather' ? 0.35 : 0.36;
  const stems = [];
  for (let i = 0; i < a.st; i++) {
    stems.push({ bx: (r() - 0.5) * a.w * S * 0.25, tx: (a.st > 1 ? (i / (a.st - 1) - 0.5) : 0) * a.w * S * 0.75 + (r() - 0.5) * a.w * S * 0.2,
      h: a.h * S * (0.78 + 0.22 * r()), lr: Array.from({ length: 16 }, r), fr: Array.from({ length: 8 }, r) });
  }
  const basal = Array.from({ length: 7 }, () => [r(), r(), r()]);
  // tutor de caña para los tomates
  if (a.stake && vs.g > 0.25) {
    g.strokeStyle = '#b89a62'; g.lineWidth = Math.max(1, S * 0.014); g.lineCap = 'round';
    g.beginPath(); g.moveTo(S * 0.03, S * 0.01); g.lineTo(S * 0.02, -a.h * S * 1.02); g.stroke();
  }
  // hojas basales: dan cuerpo a la planta
  if (!a.nobasal) {
    const nb = Math.round((3 + a.st) * (0.5 + 0.5 * vs.g));
    basal.slice(0, Math.min(7, nb)).forEach(([u, v, w], i) => {
      const side = i % 2 ? 1 : -1, ang = -Math.PI / 2 + side * (0.7 + u * 0.7) + side * droop * 0.5;
      const L = a.ls * S * 1.45 * (0.6 + 0.4 * sz) * (0.8 + v * 0.4);
      leaf(g, (w - 0.5) * S * 0.04, 0, ang, L, L * lwk, shade(vs.lc, -0.16 + w * 0.08), a.lf);
    });
  }
  const fl = a.fl, showFl = fl && vs.bloom > 0.05 && !vs.dead;
  for (const s of stems) {
    const h = s.h * sz * (1 - droop * 0.18), tx = s.tx * sz + droop * s.tx * 0.6, cx = s.bx + (tx - s.bx) * 0.15;
    const pt = t => [lerp(lerp(s.bx, cx, t), lerp(cx, tx, t), t), lerp(lerp(0, -h * 0.6, t), lerp(-h * 0.6, -h, t), t)];
    g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.9, S * 0.012 * Math.sqrt(a.h) * (0.5 + 0.5 * sz)); g.lineCap = 'round';
    g.beginPath(); g.moveTo(s.bx, 0); g.quadraticCurveTo(cx, -h * 0.6, tx, -h); g.stroke();
    const n = Math.max(2, Math.round(a.ld * (0.5 + 0.5 * vs.g)));
    for (let i = 0; i < n; i++) {
      const t = 0.1 + 0.8 * i / n, [x, y] = pt(t), side = i % 2 ? 1 : -1;
      const ang = -Math.PI / 2 + side * (0.85 + s.lr[i % 16] * 0.45) + side * droop * 0.7;
      const L = a.ls * S * 1.45 * (0.55 + 0.45 * sz) * (1.1 - t * 0.45) * (0.85 + s.lr[(i + 5) % 16] * 0.3);
      leaf(g, x, y, ang, L, L * lwk, shade(vs.lc, -0.12 + t * 0.2 + s.lr[(i + 9) % 16] * 0.06), a.lf);
    }
    if (a.fr && vs.fruit > 0.15 && !vs.dead) {
      const nf = Math.ceil(a.fr.n * Math.min(1, vs.fruit * 1.2) / Math.max(1, a.st * 0.7));
      for (let i = 0; i < nf; i++) { const [x, y] = pt(0.3 + 0.45 * s.fr[i % 8]); fruit(g, x + (s.fr[(i + 3) % 8] - 0.5) * S * 0.12, y + S * 0.04, a.fr.r * S * 1.15 * (0.7 + 0.3 * vs.fruit), a.fr.s, a.fr.c, vs.fruit); }
    }
    if (showFl) {
      const R = fl.r * S * 1.15;
      if (fl.s === 'spike') spike(g, tx, -h + S * 0.01, (fl.len || 0.1) * S, R * 1.6, vs.fc, vs.bloom);
      else if (fl.s === 'umbel') flower(g, tx, -h - R * 0.4, R, 'umbel', vs.fc, vs.fc2, vs.bloom, s.lr[0] * 6);
      else {
        const nf = Math.max(1, Math.round(fl.n * (fl.n > 1 ? 0.5 + 0.5 * vs.bloom : 1)));
        for (let i = 0; i < nf; i++) {
          let x = tx, y = -h;
          if (i > 0) {
            const [px, py] = pt(0.8 - i * 0.08);
            x = px + (i % 2 ? 1 : -1) * R * (a.st > 1 ? 1.2 : 1.6); y = py - R * 0.5;
            g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.6, S * 0.006); g.beginPath(); g.moveTo(px, py); g.lineTo(x, y); g.stroke();
          }
          flower(g, x, y, R * (i ? 0.85 : 1), fl.s, vs.fc, vs.fc2, vs.bloom, s.lr[i % 16] * 6);
        }
      }
    }
  }
};

FORMS.bush = (g, sp, vs, S, r) => {
  const a = sp.art, sz = 0.18 + 0.82 * vs.g, W = a.w * S * sz, H = a.h * S * sz * (1 - vs.wilt * 0.12);
  const bare = vs.dorm && sp.life === 'deciduous', needle = a.lf === 'needle';
  // ramas
  const branches = [];
  for (let i = 0; i < 7; i++) branches.push([(i / 6 - 0.5) * 1.6 + (r() - 0.5) * 0.3, 0.6 + r() * 0.4]);
  g.strokeStyle = css(shade(vs.stem, -0.1)); g.lineCap = 'round';
  for (const [ang, l] of branches) {
    g.lineWidth = Math.max(0.8, S * 0.014 * sz);
    const ex = Math.sin(ang) * W * 0.45 * l, ey = -H * (a.up ? 0.95 : 0.8) * l * Math.cos(ang * 0.6);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(ex * 0.2, ey * 0.6, ex, ey); g.stroke();
    if (bare) { g.lineWidth = Math.max(0.5, S * 0.006); g.beginPath(); g.moveTo(ex * 0.7, ey * 0.7); g.lineTo(ex * 0.95 + W * 0.08, ey * 0.95 - H * 0.08); g.moveTo(ex * 0.8, ey * 0.8); g.lineTo(ex * 0.7 - W * 0.06, ey * 1.05); g.stroke(); }
  }
  // follaje: tantas hojas como hagan falta para cubrir la cúpula
  const cy = -H * (a.low ? 0.4 : 0.5), rx = W / 2, ry = H * (a.low ? 0.42 : 0.5);
  const L = a.ls * S * 1.5 * (0.55 + 0.45 * sz), lw = L * (needle ? 0.07 : a.lf === 'lance' ? 0.2 : a.lf === 'feather' ? 0.3 : 0.38);
  const MAX = 420, pts = [];
  for (let i = 0; i < MAX; i++) {
    const ang = r() * TAU, d = Math.sqrt(r()), k = r(), j = r();
    const x = Math.cos(ang) * d * rx, y = cy + Math.sin(ang) * d * ry * 0.95;
    pts.push({ x, y: Math.min(y, -S * 0.015), a: Math.atan2(y - cy * 0.2, x * 1.3) + (k - 0.5) * 0.9, k, j, d });
  }
  const need = Math.PI * rx * ry / Math.max(4, L * (needle ? L * 0.35 : lw * 2)) * (needle ? 2.4 : 1.6);
  const N = Math.round(clamp(need, 14, MAX) * (0.55 + 0.45 * vs.g));
  if (!bare) {
    g.fillStyle = css(shade(vs.lc, -0.3)); g.beginPath(); g.ellipse(0, cy + ry * 0.1, rx * 0.8, ry * 0.78, 0, 0, TAU); g.fill();
    pts.slice(0, N).sort((p, q) => p.y - q.y).forEach(p => {
      const light = (cy - p.y) / ry * 0.2 - p.x / rx * 0.07 + p.j * 0.1 - 0.08;
      const col = shade(vs.lc, light);
      if (needle) {
        const ang = p.a - Math.PI * 0.1 * Math.sign(p.x);
        g.strokeStyle = css(col); g.lineWidth = Math.max(0.7, S * 0.009); g.lineCap = 'round';
        g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(p.x + Math.cos(ang) * L * (0.6 + p.k * 0.6), p.y + Math.sin(ang) * L * (0.6 + p.k * 0.6) - L * 0.3); g.stroke();
      } else leaf(g, p.x, p.y, p.a + vs.wilt * 0.8 * Math.sign(Math.cos(p.a)), L * (0.75 + p.k * 0.5), lw * (0.75 + p.k * 0.5), col, a.lf);
    });
  }
  // flores y frutos en la superficie
  const fl = a.fl;
  if (fl && vs.bloom > 0.05 && !vs.dead && !bare) {
    const n = Math.round(fl.n * (0.35 + 0.65 * vs.bloom) * (0.5 + 0.5 * vs.g)), R = fl.r * S * 1.15;
    const fls = [];
    for (let i = 0; i < fl.n; i++) {
      const ang = -Math.PI * (0.06 + 0.88 * r()), d = 0.62 + r() * 0.38;
      fls.push({ x: Math.cos(ang) * rx * d, y: cy + Math.sin(ang) * ry * d * 0.9 + ry * 0.12 * r(), rr: r(), lean: (r() - 0.5) });
    }
    fls.slice(0, n).sort((p, q) => p.y - q.y).forEach(({ x, y, rr, lean }) => {
      if (fl.sh) {
        const top = y - fl.sh * S * sz * (0.8 + rr * 0.35), tx = x + lean * S * 0.1;
        g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.5, S * 0.005); g.beginPath(); g.moveTo(x * 0.85, y + ry * 0.25); g.lineTo(tx, top); g.stroke();
        if (fl.s === 'spike') spike(g, tx, top + (fl.len || 0.08) * S * 0.2, (fl.len || 0.08) * S, R * 1.4, vs.fc, vs.bloom);
        else flower(g, tx, top, R, fl.s, vs.fc, vs.fc2, vs.bloom, rr * 6);
      } else if (fl.s === 'spike') spike(g, x, y, (fl.len || 0.06) * S, R * 1.5, vs.fc, vs.bloom);
      else if (fl.s === 'bells') bells(g, x, y + R, R * 3, 3, R, vs.fc, vs.bloom, R);
      else if (fl.s === 'fuchsia') { g.strokeStyle = css(vs.stem); g.lineWidth = 0.6; g.beginPath(); g.moveTo(x, y); g.lineTo(x + R * 0.3, y + R * 0.8); g.stroke(); flower(g, x + R * 0.3, y + R * 0.9, R, 'fuchsia', vs.fc, vs.fc2, vs.bloom, rr); }

    });
  }

    for (let i = 0; i < a.fr.n * vs.fruit; i++) {
      const ang = -Math.PI * (0.1 + 0.8 * r()), d = 0.55 + r() * 0.4;
      fruit(g, Math.cos(ang) * rx * d, cy + Math.sin(ang) * ry * d + ry * 0.2, a.fr.r * S * 1.2, a.fr.s, a.fr.c, vs.fruit);
    }
  }
};

FORMS.topiary = (g, sp, vs, S, r) => {
  const a = sp.art, sz = 0.25 + 0.75 * vs.g, R = a.w * S * sz / 2;
  g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(1, S * 0.02); g.beginPath(); g.moveTo(0, 0); g.lineTo(0, -R * 0.4); g.stroke();
  const grd = g.createRadialGradient(-R * 0.35, -R * 1.45, R * 0.1, 0, -R, R * 1.1);
  grd.addColorStop(0, css(shade(vs.lc, 0.28))); grd.addColorStop(0.6, css(vs.lc)); grd.addColorStop(1, css(shade(vs.lc, -0.4)));
  g.fillStyle = grd; g.beginPath(); g.arc(0, -R, R, 0, TAU); g.fill();
  for (let i = 0; i < 90; i++) {
    const ang = r() * TAU, d = Math.sqrt(r()) * R * 0.95, x = Math.cos(ang) * d, y = -R + Math.sin(ang) * d;
    g.fillStyle = css(shade(vs.lc, (y < -R ? 0.2 : -0.15) + (r() - 0.5) * 0.2), 0.7);
    g.fillRect(x, y, Math.max(1, S * 0.015), Math.max(1, S * 0.012));
  }
};

FORMS.rosette = (g, sp, vs, S, r) => {
  const a = sp.art, sz = 0.2 + 0.8 * vs.g, L0 = a.ls * S * sz;
  const leaves = [];
  const succ = a.lf === 'succ', erect = ['lance', 'monstera', 'calathea', 'heartbig', 'aloe', 'agave'].includes(a.lf);
  for (let i = 0; i < a.n; i++) {
    const th = i * 2.39996 + r() * 0.3, ring = succ ? i / a.n : 0;
    leaves.push({ th, ring, k: r(), j: r() });
  }
  const clusters = a.cluster ? [[-L0 * 1.3, -L0 * 0.25, 0.65], [L0 * 1.4, -L0 * 0.2, 0.6], [0, 0, 1], [L0 * 0.5, L0 * 0.55, 0.5]] : [[0, 0, 1]];
  for (const [ox, oy, cs] of clusters) {
    const n = Math.round(a.n * (0.4 + 0.6 * vs.g));
    leaves.slice(0, n).map(l => ({ ...l, dy: Math.sin(l.th) })).sort((p, q) => p.dy - q.dy).forEach(l => {
      let L = L0 * cs * (succ ? 1 - l.ring * 0.7 : 0.75 + l.k * 0.35);
      const lift = succ ? 0.25 + l.ring * 0.9 : erect ? 0.75 + l.k * 0.25 : 0.45 + l.k * 0.3;
      const droop = vs.wilt * 0.6 + (vs.dead ? 0.5 : 0);
      const dx = Math.cos(l.th), dy = Math.sin(l.th) * 0.5;
      const up = Math.max(0.1, lift - droop);
      const tipx = dx * L * (1 - up * 0.35), tipy = dy * L - L * up * (a.lf === 'monstera' ? 0.9 : 0.6);
      const base = succ ? [ox, oy - S * 0.01 * (1 - l.ring)] : [ox, oy];
      const ang = Math.atan2(tipy, tipx), len = Math.hypot(tipx, tipy);
      if (a.lf === 'monstera' || a.lf === 'heartbig' || a.lf === 'paddle' || a.lf === 'calathea') {
        // pecíolo largo y hoja grande al final
        const px = base[0] + tipx * 0.55, py = base[1] + tipy * 0.55;
        g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.8, S * 0.012); g.beginPath(); g.moveTo(base[0], base[1]); g.quadraticCurveTo(base[0] + tipx * 0.2, base[1] + tipy * 0.6, px, py); g.stroke();
        leaf(g, px, py, ang + (dx > 0 ? 0.5 : -0.5), len * 0.75, len * 0.38, shade(vs.lc, (dy < 0 ? -0.12 : 0.04) + l.j * 0.06), a.lf);
      } else {
        const w = a.lf === 'succ' ? L * 0.42 : a.lf === 'aloe' || a.lf === 'agave' ? L * 0.13 : a.lf === 'frilly' ? L * 0.5 : a.lf === 'hosta' ? L * 0.42 : a.lf === 'trap' ? L * 0.3 : L * 0.3;
        leaf(g, base[0], base[1], ang, len, w, shade(vs.lc, (dy < 0 ? -0.12 : 0.05) + l.j * 0.06 + (succ ? l.ring * 0.15 : 0)), a.lf, { edge: a.edge, tip: a.tip });
      }
    });
  }
  const fl = a.fl;
  if (fl && vs.bloom > 0.05 && !vs.dead) {
    const R = fl.r * S, n = fl.s === 'bells' || fl.s === 'orchid' ? 1 : Math.max(1, Math.round(fl.n * (0.4 + 0.6 * vs.bloom)));
    for (let i = 0; i < n; i++) {
      const th = r() * TAU, d = r() * 0.4, bx = Math.cos(th) * L0 * d * 0.5, sh = (fl.sh || 0.1) * S * (0.8 + 0.2 * r()) * (0.6 + 0.4 * sz), lean = (r() - 0.5) * S * 0.12;
      if (fl.s === 'bells') { bells(g, bx, 0, sh, fl.n, R, vs.fc, vs.bloom, lean); continue; }
      if (fl.s === 'torch') { g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.6, S * 0.008); g.beginPath(); g.moveTo(bx, 0); g.lineTo(bx, -sh); g.stroke(); spike(g, bx, -sh * 0.85, sh * 0.3, R * 1.4, vs.fc, vs.bloom); continue; }
      g.strokeStyle = css(vs.stem); g.lineWidth = Math.max(0.6, S * 0.007);
      if (fl.s === 'orchid') {
        g.beginPath(); g.moveTo(bx, 0); g.quadraticCurveTo(bx, -sh * 1.1, bx + sh * 0.5, -sh * 0.9); g.stroke();
        for (let k = 0; k < fl.n; k++) {
          const t = 0.45 + 0.55 * k / fl.n, fx = lerp(bx, bx + sh * 0.5, t * t), fy = lerp(-sh * 0.5, -sh * 0.9, t) - Math.sin(t * Math.PI) * sh * 0.25;

        }

    }

    for (let i = 0; i < a.fr.n * vs.fruit; i++) { const th = r() * TAU; fruit(g, Math.cos(th) * L0 * 0.7, Math.sin(th) * L0 * 0.32 + S * 0.01, a.fr.r * S, a.fr.s, a.fr.c, vs.fruit); }
  }
};

FORMS.strap = (g, sp, vs, S, r) => {
  const a = sp.art, sz = 0.2 + 0.8 * vs.g, H = a.h * S * sz, droop = vs.wilt * 0.7 + (vs.dead ? 0.6 : 0);
  const n = Math.round(a.n * (0.5 + 0.5 * vs.g));
  const ls = [];
  for (let i = 0; i < a.n; i++) ls.push({ a: (i / Math.max(1, a.n - 1) - 0.5) * (a.wide ? 1.4 : 1.9) + (r() - 0.5) * 0.3, k: r(), j: r(), b: (r() - 0.5) * S * 0.05 });

    const len = H * (0.75 + l.k * 0.35), ang = l.a * (1 + droop), w = a.wide ? len * 0.17 : a.lf === 'arrow' || a.lf === 'paddle' ? len * 0.05 : len * 0.06;
    const tx = Math.sin(ang) * len * 0.75, ty = -Math.cos(ang) * len * (1 - droop * 0.4);
    if (a.lf === 'arrow' || a.lf === 'paddle') {

// Tamaño del dibujo (en metros) para reservar el lienzo
function artBox(sp) {
  const a = sp.art, f = a.f;
  let w = a.w || 0.4, up = a.h || 0.3, down = 0.08;

  if (f === 'fern') { w = a.w * 1.6; up = a.h * 1.1; }

  if (f === 'tree') { w *= 1.12; up *= 1.04; }
  if (f === 'vine') { w = Math.max(w * 1.2, 0.6); up += 0.15; }
  if (f === 'corn') { w = 1.0; up += 0.15; }
  if (f === 'papyrus') { w = 1.2; up += 0.15; }

// Dibuja una planta (o una especie de muestra) en su propio lienzo

// Silueta negra para la sombra

// Miniatura de una especie en flor (para el catálogo y el herbario)
const THUMBS = new Map();

// ===== Pantalla: vista isométrica del jardín, sombras del sol, luz del día y clima =====
const TW = 64, TH = 32, ZS = PX_M;

const SLAB = 1.1;              // grosor de la tierra del diorama

const cam = { x: 0, y: 0, z: 1, rot: 0 };

const bumpVis = () => { VIS_VER++; };

function initRender() {

  ctx = canvas.getContext('2d');

  addEventListener('resize', resizeView);
}
function resizeView() {

// La vista se puede girar en pasos de 90°: (u, v) son las coordenadas del mundo ya giradas.
// D es el fondo del mundo contando la calle.
const DEPTH = () => GH + STREET;
function toView(x, y) {

}

const P = (x, y, z = 0) => { const [u, v] = toView(x, y); return [cam.x + (u - v) * TW / 2 * cam.z, cam.y + (u + v) * TH / 2 * cam.z - z * ZS * cam.z]; };

// Gira la vista manteniendo en el centro lo que se estaba mirando
function rotateView(d) {
  const [wx, wy] = screenToWorld(VW / 2, VH / 2);
  cam.rot = (cam.rot + d + 4) % 4;
  centerOn(wx, wy);
  clampCam(); TEX.z = 0;
}
function zoomAt(f, sx, sy) {
  const nz = clamp(cam.z * f, ZMIN, ZMAX), k = nz / cam.z;
  cam.x = sx - (sx - cam.x) * k; cam.y = sy - (sy - cam.y) * k; cam.z = nz;
  clampCam();
}
function clampCam() {
  // que el jardín nunca se pierda de la pantalla
  const cs = [P(0, 0), P(GW, 0), P(GW, DEPTH()), P(0, DEPTH())];
  const l = Math.min(...cs.map(c => c[0])), r = Math.max(...cs.map(c => c[0])), t = Math.min(...cs.map(c => c[1])), b = Math.max(...cs.map(c => c[1]));
  const mx = VW * 0.45, my = VH * 0.45;
  if (r < mx) cam.x += mx - r;
  if (l > VW - mx) cam.x -= l - (VW - mx);
  if (b < my) cam.y += my - b;
  if (t > VH - my) cam.y -= t - (VH - my);
}

// ---------- Sol y colores del cielo ----------
function sunNow() { return sunVector(G.day % DAYS_YEAR, G.hour); }
function sunStrength(s) { return clamp(s.z * 4, 0, 1) * (1 - G.w.cloud * 0.75); }
const SKY = [
  [-0.35, '#0b1230', '#1d2650'], [-0.12, '#16204a', '#3a3f74'], [-0.03, '#3b3f78', '#b07a98'], [0.03, '#6a7fb8', '#f4a47c'],
  [0.15, '#8db4dc', '#f6d6ae'], [0.35, '#86bde6', '#d9edf3'], [1, '#7fb8e6', '#dcf0f5']
];
function skyColors(sz) {
  for (let i = 1; i < SKY.length; i++) if (sz <= SKY[i][0]) {
    const [a0, t0, b0] = SKY[i - 1], [a1, t1, b1] = SKY[i], k = clamp((sz - a0) / (a1 - a0), 0, 1);
    return [mix(t0, t1, k), mix(b0, b1, k)];
  }
  return [rgbOf(SKY[6][1]), rgbOf(SKY[6][2])];
}
const GRADE = [[-0.3, '#4a5a96'], [-0.08, '#7a76b0'], [0.0, '#e0a0a0'], [0.06, '#ffc9a8'], [0.18, '#ffe8cf'], [0.4, '#ffffff']];
function gradeColor(sz) {
  if (sz <= GRADE[0][0]) return rgbOf(GRADE[0][1]);
  for (let i = 1; i < GRADE.length; i++) if (sz <= GRADE[i][0]) return mix(GRADE[i - 1][1], GRADE[i][1], (sz - GRADE[i - 1][0]) / (GRADE[i][0] - GRADE[i - 1][0]));
  return [255, 255, 255];
}
const nightness = sz => clamp((0.02 - sz) / 0.14, 0, 1);

// ---------- Texturas del suelo (se regeneran al cambiar el zoom) ----------
const TEX = { z: 0 };
function makeTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h);
  const g = c.getContext('2d');
  g.beginPath(); g.moveTo(w / 2, 0); g.lineTo(w, h / 2); g.lineTo(w / 2, h); g.lineTo(0, h / 2); g.closePath(); g.clip();
  draw(g, w, h); return c;
}
function buildTextures() {
  const z = cam.z * DPR, w = TW * z, h = TH * z;
  TEX.z = cam.z * DPR;
  TEX.grass = [0, 1, 2, 3].map(v => makeTex(w, h, g => {
    const r = rng(77 + v);
    for (let i = 0; i < 70; i++) {
      const x = r() * w, y = r() * h, l = (2 + r() * 3) * z * 0.5;
      g.strokeStyle = r() < 0.5 ? 'rgba(255,255,220,0.18)' : 'rgba(20,60,10,0.16)'; g.lineWidth = Math.max(0.6, z * 0.5);
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (r() - 0.5) * l, y - l); g.stroke();
    }
    if (v === 3) for (let i = 0; i < 4; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.8)' : 'rgba(250,220,90,0.8)'; g.beginPath(); g.arc(r() * w, r() * h, z * 0.9, 0, TAU); g.fill(); }
  }));
  TEX.soil = [0, 1].map(v => makeTex(w, h, g => {
    const r = rng(99 + v);
    for (let i = 0; i < 90; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,240,210,0.13)' : 'rgba(0,0,0,0.16)'; g.beginPath(); g.ellipse(r() * w, r() * h, z * (0.5 + r()), z * (0.35 + r() * 0.6), 0, 0, TAU); g.fill(); }
    g.strokeStyle = 'rgba(0,0,0,0.08)'; g.lineWidth = z * 0.6;
    for (let i = 1; i < 4; i++) { g.beginPath(); g.moveTo(w * i / 4 - w * 0.25, h * i / 4 + h * 0.25); g.lineTo(w * i / 4 + w * 0.25, h * i / 4 - h * 0.25); g.stroke(); }
  }));
  TEX.mulch = makeTex(w, h, g => {
    const r = rng(5);
    for (let i = 0; i < 120; i++) { g.fillStyle = css(mix('#b07a45', '#6e4a2a', r())); g.save(); g.translate(r() * w, r() * h); g.rotate(r() * 3); g.fillRect(-z * 1.4, -z * 0.5, z * 2.8, z); g.restore(); }
  });
  TEX.path = [0, 1, 2, 3].map(v => makeTex(w, h, g => {
    const r = rng(300 + v);
    g.fillStyle = '#a99e8a'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 40; i++) { g.fillStyle = r() < 0.5 ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.1)'; g.fillRect(r() * w, r() * h, z, z); }
    for (let i = 0; i < 4; i++) {
      const cx = w * (0.25 + (i % 2) * 0.5) + (r() - 0.5) * w * 0.08, cy = h * (0.25 + Math.floor(i / 2) * 0.5) + (r() - 0.5) * h * 0.08;
      const rx = w * (0.17 + r() * 0.04), ry = h * (0.17 + r() * 0.04);
      g.fillStyle = 'rgba(70,60,50,0.35)'; g.beginPath(); g.ellipse(cx + z, cy + z, rx, ry, 0, 0, TAU); g.fill();
      g.fillStyle = css(mix('#d9cfbb', '#c2b49a', r())); g.beginPath();
      for (let k = 0; k < 8; k++) { const a = k / 8 * TAU, d = 0.85 + r() * 0.2; g.lineTo(cx + Math.cos(a) * rx * d, cy + Math.sin(a) * ry * d); }
      g.fill();
    }
  }));
  TEX.meadow = [0, 1, 2].map(v => makeTex(w, h * 1, g => {
    const r = rng(500 + v);
    for (let i = 0; i < 90; i++) {
      const x = r() * w, y = r() * h, l = (3 + r() * 5) * z * 0.6;
      g.strokeStyle = r() < 0.4 ? 'rgba(230,230,150,0.35)' : 'rgba(40,80,20,0.25)'; g.lineWidth = Math.max(0.6, z * 0.6);
      g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + (r() - 0.5) * l, y - l * 0.6, x + (r() - 0.5) * l * 1.5, y - l); g.stroke();
    }
    for (let i = 0; i < 6; i++) { g.fillStyle = pick(['rgba(255,255,255,0.85)', 'rgba(250,210,60,0.85)', 'rgba(200,140,230,0.8)', 'rgba(240,120,120,0.8)']); g.beginPath(); g.arc(r() * w, r() * h, z * 1.1, 0, TAU); g.fill(); }
  }));
}

// ---------- Colores del suelo ----------
function grassColor(t, yd) {
  const s = seasonOf(yd);
  let c = rgbOf(['#79ad48', '#93ad4e', '#86a547', '#6c9a49'][s]);
  const next = rgbOf(['#93ad4e', '#86a547', '#6c9a49', '#79ad48'][s]);
  c = mix(c, next, (yd % DAYS_SEASON) / DAYS_SEASON * 0.5);
  if (t.moist < 0.28 && s === 1) c = mix(c, '#c4b46c', clamp((0.28 - t.moist) * 2.6, 0, 0.75));
  return shade(c, (t.v - 0.5) * 0.09);
}
function soilColor(t) {
  let c = rgbOf('#8b6845');
  if (t.drain > 0.55) c = mix(c, '#c9a572', clamp((t.drain - 0.55) / 0.35, 0, 1));
  else c = mix(c, '#9c6345', clamp((0.45 - t.drain) / 0.3, 0, 1));
  c = mix(c, '#4c372a', clamp((t.org - 0.45) / 0.4, 0, 0.8));
  return shade(c, -t.moist * 0.36 + (t.v - 0.5) * 0.05);
}

// ---------- Fondo: cielo, cordillera y nubes ----------
const MOUNTAINS = (() => {
  // perfil de la cordillera con varias escalas de ruido para que se vea escarpado
  const ridge = (n, seed, k) => Array.from({ length: n + 1 }, (_, i) => {
    const x = i / n;
    let y = 0, a = 1, f = k, tot = 0;
    for (let o = 0; o < 5; o++) { y += Math.abs(noise2(x * f, o * 7.3, seed) - 0.5) * 2 * a; tot += a; a *= 0.5; f *= 2.1; }
    return [x, Math.pow(y / tot, 1.6) * 1.25];
  });
  return { far: ridge(160, 11, 4), mid: ridge(120, 23, 6), hills: ridge(80, 37, 3) };
})();
const CLOUDS = Array.from({ length: 9 }, (_, i) => ({ x: Math.random(), y: 0.05 + Math.random() * 0.22, s: 0.6 + Math.random() * 0.9, v: 0.004 + Math.random() * 0.006, k: i }));

function drawBackground(g, s) {
  const [top, bot] = skyColors(s.z);
  const cl = G.w.cloud, grey = [160, 168, 178], night = nightness(s.z);
  const hz = VH * 0.36 + (cam.y - VH * 0.3) * 0.05, px = (cam.x - VW / 2) * 0.05;
  const sky = g.createLinearGradient(0, 0, 0, hz);
  sky.addColorStop(0, css(mix(top, grey, cl * 0.5)));
  sky.addColorStop(1, css(mix(bot, grey, cl * 0.35)));
  g.fillStyle = sky; g.fillRect(0, 0, VW, hz + 2);
  if (night > 0.2) {
    const r = rng(9);
    for (let i = 0; i < 140; i++) { const tw = 0.5 + 0.5 * Math.sin(R.t * 2 + i); g.fillStyle = `rgba(255,255,240,${(night - 0.2) * 0.9 * tw})`; g.fillRect(r() * VW, r() * hz, 1.4, 1.4); }
    g.fillStyle = `rgba(250,248,230,${night})`; g.beginPath(); g.arc(VW * 0.82, hz * 0.3, 15, 0, TAU); g.fill();
    g.fillStyle = css(mix(top, grey, cl * 0.5)); g.beginPath(); g.arc(VW * 0.82 + 6, hz * 0.3 - 4, 13, 0, TAU); g.fill();
  }
  // el sol, bajando hacia la cordillera
  if (s.z > -0.06) {
    // ángulo del sol respecto de la dirección en que mira la cámara (0 = al fondo de la escena)
    const [su, sv] = vecView(s.x, s.y), th = Math.atan2(su - sv, -(su + sv));
    const sx = VW * clamp(0.5 + th / (Math.PI / 2) * 0.42, 0.04, 0.96), sy = hz - clamp(s.z, -0.05, 1) * hz * 1.3;
    const a = (1 - cl * 0.8) * clamp((s.z + 0.06) * 8, 0, 1) * clamp((2.4 - Math.abs(th)) / 0.5, 0, 1), R0 = 26 + (1 - clamp(s.z * 3, 0, 1)) * 10;
    const sg = g.createRadialGradient(sx, sy, 2, sx, sy, R0 * 5);
    sg.addColorStop(0, `rgba(255,250,225,${0.95 * a})`); sg.addColorStop(0.18, `rgba(255,238,190,${0.5 * a})`); sg.addColorStop(1, 'rgba(255,225,170,0)');
    g.fillStyle = sg; g.fillRect(sx - R0 * 5, sy - R0 * 5, R0 * 10, R0 * 10);
  }
  // nubes altas
  const nCl = Math.round(3 + cl * 6);
  for (let i = 0; i < nCl; i++) {
    const c = CLOUDS[i];
    c.x += c.v * 0.016 * (0.5 + R.wind);
    if (c.x > 1.25) c.x = -0.25;
    const x = c.x * VW, y = c.y * hz, w = 100 * c.s;
    const lit = mix(mix([255, 252, 246], bot, 0.35), [175, 182, 192], cl);
    g.fillStyle = css(mix(lit, [60, 70, 110], night * 0.8), 0.85 - night * 0.35);
    for (let k = 0; k < 6; k++) { g.beginPath(); g.ellipse(x + (k - 2.5) * w * 0.27, y - Math.sin(k * 1.3 + 1) * w * 0.1, w * 0.3, w * 0.17, 0, 0, TAU); g.fill(); }
    g.fillStyle = css(mix(lit, [120, 130, 150], 0.3), 0.35 - night * 0.2); g.fillRect(x - w * 0.8, y + w * 0.05, w * 1.6, 2);
  }
  // cordillera de los Andes: lejana, pálida y con nieve en invierno y primavera
  const yd = G.day % DAYS_YEAR, snow = [0.8, 0.35, 0.5, 1][seasonOf(yd)];
  const haze = mix(bot, grey, cl * 0.4);
  const layer = (pts, h, col, snowK, off) => {
    const X = x => -60 + x * (VW + 120) + px * off;
    g.fillStyle = css(col); g.beginPath(); g.moveTo(-60, hz + 4);
    for (const [x, y] of pts) g.lineTo(X(x), hz - y * h);
    g.lineTo(VW + 60, hz + 4); g.closePath(); g.fill();
    if (!snowK) return;
    g.save(); g.clip();
    g.fillStyle = css(mix([250, 252, 255], col, 0.15 + night * 0.5), 0.92);
    g.beginPath(); g.moveTo(-60, hz - h * (0.62 - snowK * 0.12));
    for (const [x, y] of pts) g.lineTo(X(x), Math.min(hz - y * h + 2, hz - h * (0.6 - snowK * 0.12) + Math.sin(x * 90) * h * 0.04));
    g.lineTo(VW + 60, hz - h * (0.62 - snowK * 0.12)); g.lineTo(VW + 60, -10); g.lineTo(-60, -10); g.closePath();
    g.globalCompositeOperation = 'source-atop'; g.fill(); g.globalCompositeOperation = 'source-over';
    g.restore();
  };
  // un volcán: cono con la punta redondeada y nieve arriba
  const cone = (cx, w, h, col, snowK, flat = 0) => {
    const X = cx + px * 0.4;
    g.fillStyle = css(col); g.beginPath(); g.moveTo(X - w / 2, hz + 4);
    g.quadraticCurveTo(X - w * 0.2, hz - h * 0.55, X - w * (0.07 + flat), hz - h);
    g.quadraticCurveTo(X, hz - h * 1.02, X + w * (0.07 + flat), hz - h);
    g.quadraticCurveTo(X + w * 0.2, hz - h * 0.55, X + w / 2, hz + 4); g.closePath(); g.fill();
    if (!snowK) return;
    g.save(); g.clip();
    g.fillStyle = css(mix([250, 252, 255], col, 0.12 + night * 0.5), 0.95);
    g.beginPath(); g.moveTo(X - w, hz - h * (1 - 0.32 * snowK));
    for (let i = 0; i <= 12; i++) g.lineTo(X - w * 0.5 + i * w / 12, hz - h * (1 - 0.32 * snowK) + (i % 2 ? h * 0.06 : 0));
    g.lineTo(X + w, hz - h * 1.2); g.lineTo(X - w, hz - h * 1.2); g.closePath(); g.fill();
    g.restore();
  };
  const nightC = c => mix(c, '#1a2242', night * 0.76);
  if (CL.sky === 'volcano') {
    cone(VW * 0.74, VH * 0.5, VH * 0.3, nightC(mix('#9fb0c8', haze, 0.45)), Math.max(0.6, snow));
    layer(MOUNTAINS.mid, VH * 0.12, nightC(mix('#6f9078', haze, 0.4)), 0, 0.7);
  } else if (CL.sky === 'dryhills') {
    layer(MOUNTAINS.far, VH * 0.16, nightC(mix('#c4b49a', haze, 0.55)), 0, 0.4);
    layer(MOUNTAINS.mid, VH * 0.09, nightC(mix('#b09a78', haze, 0.4)), 0, 0.7);
  } else if (CL.sky === 'volcanoes') {
    cone(VW * 0.2, VH * 0.5, VH * 0.3, nightC(mix('#9aa6c0', haze, 0.45)), 0.9);
    cone(VW * 0.5, VH * 0.75, VH * 0.22, nightC(mix('#a4b0c8', haze, 0.5)), 0.8, 0.18);
    layer(MOUNTAINS.mid, VH * 0.1, nightC(mix('#8f9f98', haze, 0.4)), 0, 0.7);
  } else {
    layer(MOUNTAINS.far, VH * 0.34, mix(mix('#a9b8d4', haze, 0.5), '#1d2445', night * 0.75), snow, 0.4);
    layer(MOUNTAINS.mid, VH * 0.15, mix(mix('#8fa6b8', haze, 0.4), '#172038', night * 0.78), snow * 0.3, 0.7);
  }
  layer(MOUNTAINS.hills, VH * 0.06, nightC(mix(CL.sky === 'dryhills' ? '#b8a880' : '#8daa94', haze, 0.3)), 0, 1);
  // valle con bruma y una hilera de árboles lejanos
  const val = g.createLinearGradient(0, hz, 0, VH);
  const dry = CL.sky === 'dryhills';
  val.addColorStop(0, css(mix(mix(dry ? '#d8d0b4' : '#c7d8b8', haze, 0.45), [24, 32, 58], night * 0.8)));
  val.addColorStop(1, css(mix(mix(dry ? '#c8bc98' : '#b3c99a', haze, 0.2), [18, 26, 48], night * 0.85)));
  g.fillStyle = val; g.fillRect(0, hz, VW, VH - hz);
  const r = rng(77), treeC = mix(mix('#6f8f6a', haze, 0.35), [20, 28, 45], night * 0.8);
  g.fillStyle = css(treeC, 0.7);
  for (let i = 0; i < 70; i++) { const x = ((r() * (VW + 200) + px * 1.4) % (VW + 200)) - 100, y = hz + 6 + r() * 10, w = 10 + r() * 16; g.beginPath(); g.ellipse(x, y, w, w * 0.6, 0, Math.PI, TAU); g.fill(); }
}

// ---------- Base del diorama, calle y vereda ----------
function drawSlab(g) {
  const D = SLAB, E = DEPTH();
  // sombra suave bajo el diorama
  const [sx, sy] = P(GW / 2, E / 2, -D - 0.5);
  const sh = g.createRadialGradient(sx, sy + 40 * cam.z, 10, sx, sy + 40 * cam.z, (GW + E) * 22 * cam.z);
  sh.addColorStop(0, 'rgba(30,40,30,0.28)'); sh.addColorStop(1, 'rgba(30,40,30,0)');
  g.fillStyle = sh; g.fillRect(sx - 2000, sy - 600, 4000, 1600);
  // los cuatro costados del terreno; solo se ven los que miran a la cámara
  const sides = [
    { a: [0, E], b: [GW, E], n: [0, 1], grass: null },
    { a: [GW, 0], b: [GW, E], n: [1, 0], grass: [GW, 0, GW, GH] },
    { a: [0, 0], b: [GW, 0], n: [0, -1], grass: [0, 0, GW, 0] },
    { a: [0, 0], b: [0, E], n: [-1, 0], grass: [0, 0, 0, GH] }
  ].filter(f => facing(...f.n) > 0);
  const r = rng(4);
  for (const f of sides) {
    const [vu] = vecView(...f.n), col = vu > 0 ? '#5f412b' : '#7a5639';
    const p1 = P(...f.a), p2 = P(...f.b), p3 = P(...f.b, -D), p4 = P(...f.a, -D);
    g.fillStyle = col; g.beginPath(); g.moveTo(...p1); g.lineTo(...p2); g.lineTo(...p3); g.lineTo(...p4); g.closePath(); g.fill();
    // capas de tierra y piedritas
    for (let k = 1; k < 4; k++) {
      g.strokeStyle = `rgba(40,25,15,${0.12 + k * 0.04})`; g.lineWidth = 1.2 * cam.z;
      g.beginPath(); g.moveTo(...P(...f.a, -D * k / 4)); g.lineTo(...P(...f.b, -D * k / 4)); g.stroke();
    }
    g.fillStyle = 'rgba(200,180,150,0.35)';
    for (let i = 0; i < 30; i++) {
      const t = r(), zz = -D * (0.2 + r() * 0.75);
      const [x, y] = P(lerp(f.a[0], f.b[0], t), lerp(f.a[1], f.b[1], t), zz);
      g.beginPath(); g.ellipse(x, y, (2 + r() * 4) * cam.z, (1.4 + r() * 2) * cam.z, 0, 0, TAU); g.fill();
    }
    if (f.grass) { g.strokeStyle = '#6d9a45'; g.lineWidth = 3 * cam.z; g.beginPath(); g.moveTo(...P(f.grass[0], f.grass[1], -0.04)); g.lineTo(...P(f.grass[2], f.grass[3], -0.04)); g.stroke(); }
  }
}

function drawStreet(g) {
  const E = GH + STREET;
  const quad = (x0, y0, x1, y1, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(...P(x0, y0)); g.lineTo(...P(x1, y0)); g.lineTo(...P(x1, y1)); g.lineTo(...P(x0, y1)); g.closePath(); g.fill(); };
  quad(0, GH, GW, GH + 1.3, '#d8d0c0');            // vereda
  g.strokeStyle = 'rgba(120,110,95,0.35)'; g.lineWidth = 1 * cam.z;
  for (let x = 1; x < GW; x++) { g.beginPath(); g.moveTo(...P(x, GH)); g.lineTo(...P(x, GH + 1.3)); g.stroke(); }
  g.beginPath(); g.moveTo(...P(0, GH + 0.65)); g.lineTo(...P(GW, GH + 0.65)); g.stroke();
  quad(0, GH + 1.3, GW, GH + 1.45, '#b8b0a0');      // solera
  quad(0, GH + 1.45, GW, E, '#6b6b70');              // calle
  g.strokeStyle = 'rgba(245,240,220,0.7)'; g.lineWidth = 2 * cam.z;
  for (let x = 0.5; x < GW; x += 2) { g.beginPath(); g.moveTo(...P(x, GH + 2.15)); g.lineTo(...P(x + 1, GH + 2.15)); g.stroke(); }
}

// ---------- Suelo del jardín ----------
function diamond(g, x, y, e = 0.6) {
  const [cx, cy] = P(x + 0.5, y + 0.5), hw = TW / 2 * cam.z + e, hh = TH / 2 * cam.z + e * 0.5;
  g.beginPath(); g.moveTo(cx, cy - hh); g.lineTo(cx + hw, cy); g.lineTo(cx, cy + hh); g.lineTo(cx - hw, cy); g.closePath();
}
function drawTex(g, tex, x, y) {
  const [cx, cy] = P(x + 0.5, y + 0.5);

function bedEdges(g, x, y) {

  const face = (p1, p2, col) => {
    const a = P(...p1), b = P(...p2), c = P(p2[0], p2[1], hz), d = P(p1[0], p1[1], hz);
    g.fillStyle = col; g.beginPath(); g.moveTo(...a); g.lineTo(...b); g.lineTo(...c); g.lineTo(...d); g.closePath(); g.fill();
  };
  g.lineWidth = 2.2 * cam.z; g.strokeStyle = wood;

  const edges = [[0, -1, [x, y], [x + 1, y]], [-1, 0, [x, y], [x, y + 1]], [0, 1, [x, y + 1], [x + 1, y + 1]], [1, 0, [x + 1, y + 1], [x + 1, y]]];
  for (const [dx, dy, p1, p2] of edges) {

    else { g.beginPath(); g.moveTo(...P(...p1, hz)); g.lineTo(...P(...p2, hz)); g.stroke(); }
  }
}
function pondEdges(g, x, y) {
  const isW = (i, j) => { const n = tileAt(i, j); return n && n.t === 'water'; };
  const r = rng(x * 31 + y * 17);
  const edge = (ax, ay, bx, by) => {
    for (let k = 0; k < 4; k++) {
      const t = (k + 0.5) / 4, [px, py] = P(lerp(ax, bx, t), lerp(ay, by, t), 0.03);
      g.fillStyle = css(mix('#b9b2a2', '#8e877a', r())); g.beginPath(); g.ellipse(px, py, 5.5 * cam.z, 3.2 * cam.z, 0, 0, TAU); g.fill();

// Manguera de goteo: una línea negra que cruza el cantero con su gotero

// ---------- Capas de información (luz, agua, suelo…) ----------

  water: t => mix('#e8dcc0', '#2a5fb0', t.moist),

  if (k === 'feed') return Math.round(t.fert * 100) + '%';

}
function drawLens(g) {

  for (const t of G.tiles) {

const SUIT_CACHE = new Map();
function suitability(sp, t) {
  const key = sp.id + ':' + t.x + ',' + t.y + ':' + VIS_VER;
  let v = SUIT_CACHE.get(key);
  if (v === undefined) {
    if (SUIT_CACHE.size > 6000) SUIT_CACHE.clear();
    v = evaluate(sp, t, null, G.w, true).cond;
    SUIT_CACHE.set(key, v);
  }

function drawHover(g) {
  const h = R.hover;
  if (!h) return;
  const rad = R.area || 0;
  g.lineWidth = 2; g.strokeStyle = h.bad ? 'rgba(255,120,100,0.95)' : 'rgba(255,255,240,0.95)';
  g.fillStyle = h.bad ? 'rgba(255,100,80,0.18)' : 'rgba(255,255,240,0.16)';
  const w = h.w || 1, hh = h.h || 1;
  if (w > 1 || hh > 1) {
    g.beginPath(); g.moveTo(...P(h.x, h.y)); g.lineTo(...P(h.x + w, h.y)); g.lineTo(...P(h.x + w, h.y + hh)); g.lineTo(...P(h.x, h.y + hh)); g.closePath(); g.fill(); g.stroke();
    return;

    if (!inside(x, y) || Math.hypot(x - h.x, y - h.y) > rad + 0.3) continue;
    diamond(g, x, y, -1); g.fill(); g.stroke();

// ---------- Sombras ----------
function shadowVec(s) {

  const m = l > 2.6 ? 2.6 / l : 1;
  return [vx * m, vy * m];
}
function drawShadows(s) {
  const g = shadowCtx, str = sunStrength(s);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, shadowCv.width, shadowCv.height);
  if (str < 0.03) return;
  const [vx, vy] = shadowVec(s);
  g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = '#000';
  // la casa
  const H = HOUSE, pts = [];
  const add = (x, y, z) => pts.push([x + vx * z, y + vy * z]);

  add(H.x0 - 0.3, my, H.ridge); add(H.x1 + 0.3, my, H.ridge); add(1.2, 1.4, 6.6); add(1.8, 1.4, 6.6);

  // cerco del fondo
  g.beginPath(); g.moveTo(...P(0, 0)); g.lineTo(...P(GW, 0)); g.lineTo(...P(GW + vx * 1.2, vy * 1.2)); g.lineTo(...P(vx * 1.2, vy * 1.2)); g.fill();
  g.beginPath(); g.moveTo(...P(0, 0)); g.lineTo(...P(0, GH)); g.lineTo(...P(vx * 1.2, GH + vy * 1.2)); g.lineTo(...P(vx * 1.2, vy * 1.2)); g.fill();

  for (const p of G.plants) {
    const spr = p._spr;
    if (!spr || !p._scr) continue;
    const [bx, by] = p._scr;
    if (bx < -400 || bx > VW + 400 || by < -200 || by > VH + 900) continue;
    if (!spr.sil) spr.sil = silhouette(spr.cv);
    const f = cam.z / spr.z, Ssp = PX_M * spr.z * DPR;
    g.setTransform(f, 0, -sx / Ssp, -sy / Ssp, bx * DPR - f * spr.ox + spr.oy * sx / Ssp, by * DPR + spr.oy * sy / Ssp);

function hull(pts) {

  const { x, y, w, h } = st;
  switch (st.k) {

    case 'pergola': case 'arch':

      if (st.k === 'pergola') for (let i = 0; i < 5; i++) { const yy = y + 0.1 + i * (h - 0.2) / 4; polyFill(g, [[x + vx * 2.4, yy - 0.05 + vy * 2.4], [x + w + vx * 2.4, yy - 0.05 + vy * 2.4], [x + w + vx * 2.4, yy + 0.05 + vy * 2.4], [x + vx * 2.4, yy + 0.05 + vy * 2.4]]); }
      break;
    case 'fountain': boxShadow(g, x + 0.3, y + 0.3, x + w - 0.3, y + h - 0.3, 1.2, vx, vy); break;
    case 'statue': boxShadow(g, x + 0.3, y + 0.3, x + 0.7, y + 0.7, 2.0, vx, vy); break;
    case 'lantern': boxShadow(g, x + 0.45, y + 0.45, x + 0.55, y + 0.55, 1.6, vx, vy); break;
    case 'bench': boxShadow(g, x + 0.15, y + 0.35, x + 0.85, y + 0.65, 0.5, vx, vy); break;
    case 'birdbath': case 'sundial': boxShadow(g, x + 0.35, y + 0.35, x + 0.65, y + 0.65, 0.9, vx, vy); break;
    case 'beehive': boxShadow(g, x + 0.25, y + 0.25, x + 0.75, y + 0.75, 0.6, vx, vy); break;
  }
}

function drawHouse(g, s) {
  const H = HOUSE, x0 = H.x0, x1 = H.x1, y0 = H.y0, y1 = H.y1, w = H.wall, rd = H.ridge, my = (y0 + y1) / 2;
  const night = nightness(s.z), wallC = rgbOf('#efe2c4'), roofC = rgbOf('#bf5f3a');
  R.houseGlows = [];
  for (const W of HOUSE_WALLS) {
    if (facing(...W.n) <= 0) continue;
    const lit = faceLight(W.n[0], W.n[1], 0, s) - (vecView(...W.n)[0] > 0 ? 1.06 : 1);
    quadW(g, [wallPt(W, 0, 0), wallPt(W, W.L, 0), wallPt(W, W.L, w), wallPt(W, 0, w)], shade(wallC, lit));
    if (W.gable) quadW(g, [wallPt(W, 0, w), wallPt(W, W.L, w), wallPt(W, W.L / 2, rd)], shade(wallC, lit));
    // zócalo de piedra
    quadW(g, [wallPt(W, 0, 0, 0.01), wallPt(W, W.L, 0, 0.01), wallPt(W, W.L, 0.45, 0.01), wallPt(W, 0, 0.45, 0.01)], shade('#a4998a', lit));
    for (const [sa, sb] of W.wins) { window3(g, W, sa, sb, 1.1, 2.4, night, s); R.houseGlows.push(wallPt(W, (sa + sb) / 2, 1.7, 0.3)); }
    if (W.door) {
      const [da, db] = W.door;
      quadW(g, [wallPt(W, da, 0, 0.01), wallPt(W, db, 0, 0.01), wallPt(W, db, 2.25, 0.01), wallPt(W, da, 2.25, 0.01)], '#6f4630');
      quadW(g, [wallPt(W, da + 0.1, 0.1, 0.02), wallPt(W, db - 0.1, 0.1, 0.02), wallPt(W, db - 0.1, 2.1, 0.02), wallPt(W, da + 0.1, 2.1, 0.02)], '#8a5a3a');
      const [kx, ky] = P(...wallPt(W, db - 0.22, 1.05, 0.03));
      g.fillStyle = '#e8c36a'; g.beginPath(); g.arc(kx, ky, 1.6 * cam.z, 0, TAU); g.fill();
      // farol junto a la puerta
      const [lx, ly] = P(...wallPt(W, db + 0.25, 2.0, 0.05));
      g.fillStyle = '#3a3a3a'; g.fillRect(lx - 2.5 * cam.z, ly - 4 * cam.z, 5 * cam.z, 7 * cam.z);
      g.fillStyle = night > 0.2 ? '#ffe9a8' : '#d9d2b8'; g.fillRect(lx - 1.6 * cam.z, ly - 3 * cam.z, 3.2 * cam.z, 4.5 * cam.z);
      R.houseGlows.push(wallPt(W, db + 0.25, 2.0, 0.3));
    }
    if (W.gable) {
      const [ox, oy] = P(...wallPt(W, W.L / 2, w + 1.1, 0.02));
      g.fillStyle = '#e8dcc0'; g.beginPath(); g.ellipse(ox, oy, 9 * cam.z, 8 * cam.z, 0, 0, TAU); g.fill();
      g.fillStyle = night > 0.3 ? '#ffd98a' : css(mix('#6f8fa8', skyColors(s.z)[1], 0.4)); g.beginPath(); g.ellipse(ox, oy, 6.5 * cam.z, 6 * cam.z, 0, 0, TAU); g.fill();
    }
    // jardineras con cardenales bajo las ventanas que dan a la calle
    if (W.street) for (const [sa] of W.wins) {
      quadW(g, [wallPt(W, sa - 0.05, 0.95, 0.18), wallPt(W, sa + 1.25, 0.95, 0.18), wallPt(W, sa + 1.25, 1.15, 0.18), wallPt(W, sa - 0.05, 1.15, 0.18)], '#8a5a3a');
      const r = rng(sa * 10);
      for (let i = 0; i < 9; i++) {
        const [fx, fy] = P(...wallPt(W, sa + 0.05 + i * 0.14, 1.2 + r() * 0.12, 0.12));
        g.fillStyle = r() < 0.4 ? '#3f7a35' : '#4f8a3a'; g.beginPath(); g.arc(fx, fy + 2 * cam.z, 3.2 * cam.z, 0, TAU); g.fill();
        if (i % 2 === 0) { g.fillStyle = '#e8283c'; g.beginPath(); g.arc(fx, fy - 1 * cam.z, 2.6 * cam.z, 0, TAU); g.fill(); }
      }
    }
  }
  // techo a dos aguas: primero el faldón que mira hacia atrás, después el de adelante; la chimenea va sobre el faldón del lado y0
  const o = 0.35, ez = w - 0.35, cx = 1.2, cy = 1.0;
  const slopes = [
    { ny: -1, pts: [[x0 - o, my, rd], [x1 + o, my, rd], [x1 + o, y0 - o, ez], [x0 - o, y0 - o, ez]], eave: y0 - o, chim: 1 },
    { ny: 1, pts: [[x0 - o, my, rd], [x1 + o, my, rd], [x1 + o, y1 + o, ez], [x0 - o, y1 + o, ez]], eave: y1 + o }
  ].sort((a, b) => facing(0, a.ny) - facing(0, b.ny));
  for (const sl of slopes) {
    const col = shade(roofC, faceLight(0, sl.ny * 0.7, 0.7, s) - 1 - (facing(0, sl.ny) < 0 ? 0.12 : 0));
    quadW(g, sl.pts, col);
    g.strokeStyle = css(shade(col, -0.22)); g.lineWidth = 1 * cam.z;
    for (let i = 1; i < 8; i++) { const t = i / 8, yy = lerp(my, sl.eave, t), zz = lerp(rd, ez, t); g.beginPath(); g.moveTo(...P(x0 - o, yy, zz)); g.lineTo(...P(x1 + o, yy, zz)); g.stroke(); }
    g.strokeStyle = css(shade(col, -0.12)); g.lineWidth = 0.8 * cam.z;
    for (let i = 1; i < 18; i++) { const xx = lerp(x0 - o, x1 + o, i / 18); g.beginPath(); g.moveTo(...P(xx, my, rd)); g.lineTo(...P(xx, sl.eave, ez)); g.stroke(); }
    if (sl.chim) boxW(g, cx, cy, cx + 0.6, cy + 0.6, 4.2, 6.6, '#a85a40', s, '#5a3a2a');
  }
  // cantos del techo sobre los frontones que se ven, y la cumbrera
  g.strokeStyle = css(shade(roofC, -0.35)); g.lineWidth = 3 * cam.z;
  for (const gx of [x0 - o, x1 + o]) {
    if (facing(gx < x0 ? -1 : 1, 0) <= 0) continue;
    g.beginPath(); g.moveTo(...P(gx, y0 - o, ez)); g.lineTo(...P(gx, my, rd)); g.lineTo(...P(gx, y1 + o, ez)); g.stroke();
  }
  g.strokeStyle = css(shade(roofC, 0.1)); g.lineWidth = 3.5 * cam.z;
  g.beginPath(); g.moveTo(...P(x0 - o, my, rd)); g.lineTo(...P(x1 + o, my, rd)); g.stroke();
  // humo de la chimenea en días fríos
  if (G.w.tmin < 9) {
    for (let i = 0; i < 6; i++) {
      const ph = (R.t * 0.25 + i / 6) % 1, [hx, hy] = P(cx + 0.3 + ph * 0.8 * (0.5 + R.wind), cy + 0.3 - ph * 0.5, 6.8 + ph * 2.2);
      g.fillStyle = `rgba(230,230,235,${0.35 * (1 - ph)})`; g.beginPath(); g.arc(hx, hy, (4 + ph * 10) * cam.z, 0, TAU); g.fill();
    }
  }
}

// Una caja vista desde cualquier lado: solo se pintan las caras que miran a la cámara, y la tapa
function boxW(g, x0, y0, x1, y1, z0, z1, col, s, top) {
  const faces = [[[x0, y1], [x1, y1], 0, 1], [[x1, y1], [x1, y0], 1, 0], [[x1, y0], [x0, y0], 0, -1], [[x0, y0], [x0, y1], -1, 0]];
  for (const [a, b, nx, ny] of faces) {
    if (facing(nx, ny) <= 0) continue;
    quadW(g, [[...a, z0], [...b, z0], [...b, z1], [...a, z1]], shade(col, faceLight(nx, ny, 0, s) - (vecView(nx, ny)[0] > 0 ? 1.08 : 1)));
  }
  quadW(g, [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], top || shade(col, 0.08));
}

// Ventana con marco, vidrio que refleja el cielo, luz cálida de noche y postigos
function window3(g, W, sa, sb, za, zb, night, s) {
  const a = wallPt(W, sa, za, 0.01), b = wallPt(W, sb, za, 0.01), c = wallPt(W, sb, zb, 0.01), d = wallPt(W, sa, zb, 0.01);
  quadW(g, [a, b, c, d], '#f7f1e2');
  const inset = (p, q, k) => [lerp(p[0], q[0], k), lerp(p[1], q[1], k), lerp(p[2], q[2], k)];
  const ia = inset(a, c, 0.1), ic = inset(c, a, 0.1), ib = inset(b, d, 0.1), id = inset(d, b, 0.1);
  const lit = night > 0.25;
  const glass = lit ? mix('#ffd98a', '#ffb860', 0.3) : mix('#5f7f98', skyColors(s.z)[1], 0.35);
  quadW(g, [ia, ib, ic, id], glass);
  if (!lit) { g.fillStyle = 'rgba(255,255,255,0.18)'; g.beginPath(); g.moveTo(...P(...ia)); g.lineTo(...P(...inset(ia, ib, 0.4))); g.lineTo(...P(...inset(id, ic, 0.15))); g.lineTo(...P(...id)); g.fill(); }
  g.strokeStyle = '#f7f1e2'; g.lineWidth = 1.4 * cam.z;
  g.beginPath(); g.moveTo(...P(...inset(ia, ib, 0.5))); g.lineTo(...P(...inset(id, ic, 0.5))); g.moveTo(...P(...inset(ia, id, 0.5))); g.lineTo(...P(...inset(ib, ic, 0.5))); g.stroke();
  const sh = shade('#6f8f6a', vecView(...W.n)[0] > 0 ? -0.08 : 0), sw = 0.32;
  quadW(g, [wallPt(W, sa - sw, za, 0.02), wallPt(W, sa - 0.02, za, 0.02), wallPt(W, sa - 0.02, zb, 0.02), wallPt(W, sa - sw, zb, 0.02)], sh);
  quadW(g, [wallPt(W, sb + 0.02, za, 0.02), wallPt(W, sb + sw, za, 0.02), wallPt(W, sb + sw, zb, 0.02), wallPt(W, sb + 0.02, zb, 0.02)], sh);
}

// La casa se dibuja en un lienzo aparte y se reparte en franjas verticales, cada una con la profundidad
// del frente de la casa en esa franja: así tapa bien lo que está detrás y no lo que está delante.
let houseCv = null, houseCtx = null;
function houseItems(items, g, s) {
  const H = HOUSE, o = 0.6;
  const corners = [[H.x0 - o, H.y0 - o], [H.x1 + o, H.y0 - o], [H.x1 + o, H.y1 + o], [H.x0 - o, H.y1 + o]];
  const pts = corners.flatMap(([x, y]) => [P(x, y, 0), P(x, y, 9.5)]);
  const bx0 = Math.floor(Math.min(...pts.map(p => p[0]))) - 2, bx1 = Math.ceil(Math.max(...pts.map(p => p[0]))) + 2;
  const by0 = Math.floor(Math.min(...pts.map(p => p[1]))) - 2, by1 = Math.ceil(Math.max(...pts.map(p => p[1]))) + 2;
  if (bx1 < 0 || bx0 > VW || by1 < 0 || by0 > VH) return;
  const w = bx1 - bx0, h = by1 - by0;
  if (!houseCv) { houseCv = document.createElement('canvas'); houseCtx = houseCv.getContext('2d'); }
  if (houseCv.width < w * DPR || houseCv.height < h * DPR) { houseCv.width = Math.ceil(w * DPR) + 64; houseCv.height = Math.ceil(h * DPR) + 64; }
  houseCtx.setTransform(1, 0, 0, 1, 0, 0); houseCtx.clearRect(0, 0, houseCv.width, houseCv.height);
  houseCtx.setTransform(DPR, 0, 0, DPR, -bx0 * DPR, -by0 * DPR);
  drawHouse(houseCtx, s);
  // la huella de la casa en coordenadas de la vista
  const vc = [[H.x0, H.y0], [H.x1, H.y0], [H.x1, H.y1], [H.x0, H.y1]].map(([x, y]) => toView(x, y));
  const u0 = Math.min(...vc.map(c => c[0])), u1 = Math.max(...vc.map(c => c[0])), v0 = Math.min(...vc.map(c => c[1])), v1 = Math.max(...vc.map(c => c[1]));
  const colW = TW / 2 * cam.z;
  const frontAt = n => { const m = clamp(n + 0.5, u0 - v1, u1 - v0); return m >= u1 - v1 ? 2 * u1 - m : 2 * v1 + m; };
  // si la casilla señalada queda escondida detrás de la casa, la casa se vuelve transparente
  const hv = R.hover || UI.sel;
  let alpha = 1;
  if (hv && hv.x < POT_X) {
    const [hx, hy] = P(hv.x + 0.5, hv.y + 0.5);
    if (hx > bx0 && hx < bx1 && hy > by0 && hy < by1 && frontAt(Math.floor((hx - cam.x) / colW)) - 0.5 > keyOf(hv.x + 0.5, hv.y + 0.5) && tileAt(hv.x, hv.y)?.t !== 'house') alpha = 0.35;
  }
  for (let n = Math.floor(u0 - v1) - 2; n < Math.ceil(u1 - v0) + 2; n++) {
    const sx = cam.x + n * colW;
    if (sx + colW < bx0 || sx > bx1) continue;
    items.push({ k: frontAt(n) - 0.5, f: () => {
      const x = Math.max(sx, bx0), x2 = Math.min(sx + colW, bx1);
      g.globalAlpha = alpha;
      if (x2 > x) g.drawImage(houseCv, (x - bx0) * DPR, 0, (x2 - x) * DPR, h * DPR, x, by0, x2 - x, h);
      g.globalAlpha = 1;
    } });
  }
}

// ---------- Cercos ----------
// Cerco de madera del fondo (y = 0) y del costado (x = 0), por tramos de un metro para ordenarlo con lo demás.
// Donde está la casa no hay cerco: el muro hace de límite.
function backFenceItems(items, g) {
  for (let x = HOUSE.x1; x < GW; x++) items.push({ k: keyOf(x + 0.5, 0) - 0.02, f: () => backFenceSeg(g, [x, 0], [x + 1, 0]) });
  for (let y = HOUSE.y1; y < GH; y++) items.push({ k: keyOf(0, y + 0.5) - 0.02, f: () => backFenceSeg(g, [0, y], [0, y + 1]) });
}
function backFenceSeg(g, a, b) {
  const hz = 1.2, wood = '#b08b62', dark = '#8a6a48', i0 = Math.round((a[0] + a[1]) * 3);
  g.lineCap = 'round';
  for (let i = 0; i < 3; i++) {
    const t = i / 3, x = lerp(a[0], b[0], t), y = lerp(a[1], b[1], t), n = i0 + i;
    g.strokeStyle = n % 3 ? wood : dark; g.lineWidth = (n % 3 ? 3.4 : 4.2) * cam.z;
    g.beginPath(); g.moveTo(...P(x, y)); g.lineTo(...P(x, y, hz * (0.9 + 0.1 * (n % 2)))); g.stroke();
  }
  g.strokeStyle = dark; g.lineWidth = 2 * cam.z;
  for (const zz of [0.35, 0.9]) { g.beginPath(); g.moveTo(...P(...a, zz)); g.lineTo(...P(...b, zz)); g.stroke(); }
}
// Reja de madera blanca hacia la calle: se dibuja por tramos para ordenarla con las plantas
function fenceSegment(g, x) {
  if (x === GATE_X) return gateDraw(g, x);
  const hz = 0.9;
  for (let k = 0; k < 4; k++) {
    const t = x + (k + 0.5) / 4, [px, py] = P(t, GH), [qx, qy] = P(t, GH, hz);
    g.fillStyle = '#f4efe2'; g.beginPath(); g.moveTo(px - 2.4 * cam.z, py); g.lineTo(qx - 2.4 * cam.z, qy + 2 * cam.z); g.lineTo(qx, qy - 1 * cam.z); g.lineTo(qx + 2.4 * cam.z, qy + 2 * cam.z); g.lineTo(px + 2.4 * cam.z, py); g.closePath(); g.fill();
    g.fillStyle = 'rgba(120,110,90,0.25)'; g.fillRect(px + 0.8 * cam.z, qy + 2 * cam.z, 1.6 * cam.z, py - qy - 2 * cam.z);
  }
  g.strokeStyle = '#e4ddcc'; g.lineWidth = 2 * cam.z;
  for (const zz of [0.25, 0.65]) { g.beginPath(); g.moveTo(...P(x, GH, zz)); g.lineTo(...P(x + 1, GH, zz)); g.stroke(); }
}
function gateDraw(g, x) {
  const hz = 1.05;
  for (const t of [x + 0.04, x + 0.96]) { const [px, py] = P(t, GH), [qx, qy] = P(t, GH, hz); g.strokeStyle = '#e8e2d2'; g.lineWidth = 4 * cam.z; g.beginPath(); g.moveTo(px, py); g.lineTo(qx, qy); g.stroke(); }
  // reja abierta
  const open = G.open && G.hour >= 9 && G.hour < 18;
  g.strokeStyle = '#f4efe2'; g.lineWidth = 1.6 * cam.z;
  const ang = open ? 1.1 : 0;
  for (let k = 0; k <= 4; k++) {
    const t = k / 4 * 0.9, gx = x + 0.05 + t * Math.cos(ang), gy = GH - t * Math.sin(ang);
    g.beginPath(); g.moveTo(...P(gx, gy, 0.1)); g.lineTo(...P(gx, gy, 0.85)); g.stroke();
  }
  // cartel del jardín sobre la reja
  const [cx, cy] = P(x + 0.5, GH, 1.35);
  g.fillStyle = '#6f4f35'; g.fillRect(cx - 18 * cam.z, cy - 6 * cam.z, 36 * cam.z, 12 * cam.z);
  g.fillStyle = open ? '#f7e7a8' : '#d8cdb8'; g.font = `700 ${7 * cam.z}px ui-rounded, system-ui`; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(open ? L().gateOpen : L().gateClosed, cx, cy + 0.5);
}

// ---------- Objetos del jardín ----------
function drawStruct(g, st, part, s) {
  const { x, y, w, h } = st, night = nightness(s.z);
  const [cx, cy] = P(x + w / 2, y + h / 2);
  const z = cam.z;
  switch (st.k) {
    case 'bench': {
      const wood = '#9a6b42';
      quadW(g, [[x + 0.15, y + 0.4, 0.45], [x + 0.85, y + 0.4, 0.45], [x + 0.85, y + 0.65, 0.45], [x + 0.15, y + 0.65, 0.45]], wood);
      quadW(g, [[x + 0.15, y + 0.4, 0.45], [x + 0.85, y + 0.4, 0.45], [x + 0.85, y + 0.4, 0.95], [x + 0.15, y + 0.4, 0.95]], shade(wood, -0.1));
      g.strokeStyle = '#3f3a35'; g.lineWidth = 2.2 * z;
      for (const xx of [0.2, 0.8]) for (const yy of [0.42, 0.63]) { g.beginPath(); g.moveTo(...P(x + xx, y + yy)); g.lineTo(...P(x + xx, y + yy, 0.45)); g.stroke(); }
      break;
    }
    case 'lantern': {
      const [bx, by] = P(x + 0.5, y + 0.5), [tx, ty] = P(x + 0.5, y + 0.5, 1.5);
      g.strokeStyle = '#3a3a3a'; g.lineWidth = 2.5 * z; g.beginPath(); g.moveTo(bx, by); g.lineTo(tx, ty); g.stroke();
      g.fillStyle = '#3a3a3a'; g.fillRect(tx - 4 * z, ty - 9 * z, 8 * z, 2 * z);
      g.fillStyle = night > 0.2 ? '#ffe7a0' : '#e8e2cc'; g.fillRect(tx - 3 * z, ty - 7 * z, 6 * z, 7 * z);
      break;
    }
    case 'gnome': {
      const [bx, by] = P(x + 0.5, y + 0.5);
      g.fillStyle = '#3f6fb0'; g.beginPath(); g.ellipse(bx, by - 5 * z, 4.5 * z, 5.5 * z, 0, 0, TAU); g.fill();
      g.fillStyle = '#f7f3ea'; g.beginPath(); g.moveTo(bx - 4 * z, by - 9 * z); g.lineTo(bx + 4 * z, by - 9 * z); g.lineTo(bx, by - 2 * z); g.fill();
      g.fillStyle = '#f2c9a0'; g.beginPath(); g.arc(bx, by - 11 * z, 3 * z, 0, TAU); g.fill();
      g.fillStyle = '#d63a2f'; g.beginPath(); g.moveTo(bx - 4 * z, by - 12 * z); g.lineTo(bx + 4 * z, by - 12 * z); g.lineTo(bx + 1 * z, by - 22 * z); g.fill();
      break;
    }
    case 'birdbath': case 'sundial': {
      const [bx, by] = P(x + 0.5, y + 0.5), [tx, ty] = P(x + 0.5, y + 0.5, 0.8);
      g.fillStyle = '#c9c2b4'; g.fillRect(bx - 3 * z, ty, 6 * z, by - ty);
      g.fillStyle = '#b3ab9c'; g.beginPath(); g.ellipse(bx, by, 8 * z, 4 * z, 0, 0, TAU); g.fill();
      g.fillStyle = '#d6cfc1'; g.beginPath(); g.ellipse(tx, ty, 13 * z, 6.5 * z, 0, 0, TAU); g.fill();
      if (st.k === 'birdbath') { g.fillStyle = css(mix('#6aa0b8', skyColors(s.z)[1], 0.3)); g.beginPath(); g.ellipse(tx, ty, 10 * z, 4.6 * z, 0, 0, TAU); g.fill(); }
      else { g.fillStyle = '#8a7a50'; g.beginPath(); g.moveTo(tx - 1 * z, ty); g.lineTo(tx + 6 * z, ty - 1 * z); g.lineTo(tx, ty - 6 * z); g.fill(); }
      break;
    }
    case 'sprinkler': {
      const [bx, by] = P(x + 0.5, y + 0.5);
      g.fillStyle = '#3f6f9f'; g.fillRect(bx - 1.5 * z, by - 7 * z, 3 * z, 7 * z);
      g.fillStyle = '#9fb3c3'; g.beginPath(); g.arc(bx, by - 8 * z, 2.5 * z, 0, TAU); g.fill();
      break;
    }
    case 'beehive': {
      boxW(g, x + 0.25, y + 0.25, x + 0.75, y + 0.75, 0, 0.6, '#f2e6c4', s);
      quadW(g, [[x + 0.2, y + 0.2, 0.6], [x + 0.8, y + 0.2, 0.6], [x + 0.8, y + 0.8, 0.6], [x + 0.2, y + 0.8, 0.6]], '#9a7a52');
      g.strokeStyle = 'rgba(120,100,60,0.4)'; g.lineWidth = 1 * z;
      for (const zz of [0.2, 0.4]) { g.beginPath(); g.moveTo(...P(x + 0.25, y + 0.75, zz)); g.lineTo(...P(x + 0.75, y + 0.75, zz)); g.lineTo(...P(x + 0.75, y + 0.25, zz)); g.stroke(); }
      break;
    }
    case 'statue': {
      boxW(g, x + 0.25, y + 0.25, x + 0.75, y + 0.75, 0, 0.7, '#cfc8b8', s);

// ---------- Bichos del jardín ----------
const BUTTERFLY = [['#f7f3e8', '#d8d2c0'], ['#f6c73a', '#d89a1a'], ['#f08a2a', '#2a2a2a'], ['#7fb0e8', '#3a5f9a'], ['#e8a0c8', '#a05080']];
function updateCritters(dt, s) {
  const day = s.z > 0.12 && !G.w.rain && tempAt(G.w, G.hour) > 11;
  const blooming = G.plants.filter(p => p.bloom > 0.4 && !p.dead && tileAt(p.x, p.y).own && !tileAt(p.x, p.y).pot);
  const want = day ? Math.min(16, Math.round(blooming.length * 0.45)) : 0;
  const bf = FX.critters;
  if (bf.length < want && blooming.length && Math.random() < dt * 1.5) {
    const p = pick(blooming), sp = spOf(p);
    const bird = (sp.id === 'fuchsia' || sp.id === 'salvia' || sp.id === 'copihue') && Math.random() < 0.35;
    const kind = bird ? 'hummer' : sp.insect && Math.random() < 0.55 ? 'bee' : 'butterfly';
    const edge = Math.random() < 0.5;
    bf.push({ kind, x: edge ? -1 : p.x + rand(-6, 6), y: edge ? p.y + rand(-4, 4) : -1, z: 2 + Math.random(), tgt: p, t: 0, rest: 0,
      col: pick(BUTTERFLY), ph: Math.random() * TAU, life: 25 + Math.random() * 30 });
  }
  for (let i = bf.length - 1; i >= 0; i--) {
    const c = bf[i];
    c.t += dt; c.life -= dt;
    const leaving = c.life < 0 || !day;
    let tx, ty, tz;
    if (leaving) { tx = c.x + (c.x < GW / 2 ? -8 : 8); ty = c.y - 6; tz = 3; }
    else {
      if (!c.tgt || c.tgt.dead || c.tgt.bloom < 0.3 || (c.rest <= 0 && Math.random() < dt * 0.25)) { c.tgt = blooming.length ? pick(blooming) : null; c.rest = 0; }
      if (!c.tgt) { c.life = -1; continue; }
      const h = plantSize(c.tgt).h;
      tx = c.tgt.x + 0.5 + Math.sin(c.ph) * 0.15; ty = c.tgt.y + 0.5; tz = h * 0.95 + 0.05;
    }
    const sp = c.kind === 'bee' ? 2.4 : c.kind === 'hummer' ? 3.2 : 1.3;
    const dx = tx - c.x, dy = ty - c.y, dz = tz - c.z, d = Math.hypot(dx, dy, dz);
    if (d < 0.15 && !leaving) { c.rest += dt; c.z = tz + Math.sin(c.t * (c.kind === 'butterfly' ? 2 : 20)) * 0.03; }
    else {
      const k = Math.min(1, sp * dt / Math.max(d, 0.01));
      c.x += dx * k + Math.sin(c.t * 3 + c.ph) * dt * 0.5; c.y += dy * k + Math.cos(c.t * 2.3 + c.ph) * dt * 0.4;
      c.z += dz * k + (c.kind === 'butterfly' ? Math.sin(c.t * 5) * dt * 0.6 : 0);
    }
    if (leaving && (c.x < -6 || c.x > GW + 6 || c.y < -6)) bf.splice(i, 1);
  }
}
function drawCritter(g, c) {
  const [x, y] = P(c.x, c.y, c.z), z = cam.z;
  if (c.kind === 'butterfly') {
    const flap = Math.abs(Math.sin(c.t * (c.rest > 0 ? 4 : 14) + c.ph));
    g.fillStyle = css(c.col[0]);
    g.beginPath(); g.ellipse(x - 2.5 * z * flap, y - 1 * z, 3.4 * z * flap, 2.6 * z, -0.4, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(x + 2.5 * z * flap, y - 1 * z, 3.4 * z * flap, 2.6 * z, 0.4, 0, TAU); g.fill();
    g.fillStyle = css(c.col[1]);
    g.beginPath(); g.ellipse(x - 1.8 * z * flap, y + 1.5 * z, 2 * z * flap, 1.6 * z, -0.6, 0, TAU); g.fill();
    g.beginPath(); g.ellipse(x + 1.8 * z * flap, y + 1.5 * z, 2 * z * flap, 1.6 * z, 0.6, 0, TAU); g.fill();
    g.fillStyle = '#2a2a2a'; g.fillRect(x - 0.5 * z, y - 2.5 * z, 1 * z, 5 * z);
  } else if (c.kind === 'bee') {
    g.fillStyle = 'rgba(255,255,255,0.7)'; g.beginPath(); g.ellipse(x, y - 2 * z, 2 * z, 1.2 * z + Math.abs(Math.sin(c.t * 40)) * z, 0, 0, TAU); g.fill();
    g.fillStyle = '#f2c230'; g.beginPath(); g.ellipse(x, y, 2.4 * z, 1.7 * z, 0, 0, TAU); g.fill();
    g.fillStyle = '#2a2a2a'; g.fillRect(x - 0.6 * z, y - 1.6 * z, 1.1 * z, 3.2 * z);
  } else {
    const dir = Math.sign((c.tgt ? PV(c.tgt.x - c.x, c.tgt.y - c.y)[0] : 1) || 1);
    g.fillStyle = '#2f8a5a'; g.beginPath(); g.ellipse(x, y, 4 * z, 2.4 * z, dir * -0.3, 0, TAU); g.fill();
    g.fillStyle = '#c8304a'; g.beginPath(); g.arc(x + dir * 2 * z, y - 0.5 * z, 1.4 * z, 0, TAU); g.fill();
    g.strokeStyle = '#2a2a2a'; g.lineWidth = 1 * z; g.beginPath(); g.moveTo(x + dir * 3.5 * z, y - 1 * z); g.lineTo(x + dir * 7.5 * z, y - 0.5 * z); g.stroke();
    g.fillStyle = 'rgba(200,230,210,0.6)'; const w = Math.sin(c.t * 60) * 4 * z;
    g.beginPath(); g.ellipse(x - dir * z, y - 2 * z, 1.5 * z, Math.abs(w), 0, 0, TAU); g.fill();
  }
}

// Hojas de otoño, pétalos de cerezo y polen
function updateParts(dt) {
  const ps = FX.parts;
  for (let i = ps.length - 1; i >= 0; i--) {
    const p = ps[i];
    p.t += dt;
    if (p.t < 0) continue;
    if (p.kind === 'leaf') { p.x += (p.vx + R.wind * 0.6) * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz = -0.5 - Math.sin(p.t * 3) * 0.3; }
    else { p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt; p.vz -= p.g * dt; }
    if (p.z < 0) { p.z = 0; p.vx *= 0.5; p.vy *= 0.5; p.vz = 0; if (p.kind === 'leaf') p.life = Math.min(p.life, p.t + 3); }
    if (p.t > p.life) ps.splice(i, 1);
  }
  // árboles que sueltan hojas o pétalos
  if (ps.length < 160 && Math.random() < dt * 4) {
    for (const p of G.plants) {
      if (p.dead || (!isTree(spOf(p)) && spOf(p).art.f !== 'bush') || p.x >= POT_X) continue;
      const sp = spOf(p), vs = p._vs;
      const falling = vs && vs.fall > 0.4, petals = sp.art.nb && p.bloom > 0.5;
      if (!(falling || petals) || Math.random() > (isTree(sp) ? 0.5 : 0.1)) continue;
      const sz = plantSize(p);
      ps.push({ x: p.x + 0.5 + rand(-sz.w / 2, sz.w / 2), y: p.y + 0.5 + rand(-sz.w / 3, sz.w / 3), z: sz.h * rand(0.5, 0.95), vx: rand(-0.2, 0.2), vy: rand(-0.1, 0.3), vz: -0.5,
        col: petals ? (vs ? css(vs.fc) : '#f7c6d9') : css(shade(sp.fall, rand(-0.15, 0.1))), t: 0, life: 9, r: petals ? 1.8 : 2.4, g: 0, kind: 'leaf', rot: Math.random() * 6 });
    }
  }
}
function drawPart(g, p) {
  if (p.t < 0) return;
  const [x, y] = P(p.x, p.y, p.z), z = cam.z, a = clamp(1 - p.t / p.life, 0, 1) * (p.kind === 'leaf' ? 1 : 1);
  g.globalAlpha = p.kind === 'leaf' ? Math.min(1, a * 3) : a;
  g.fillStyle = p.col;
  if (p.kind === 'leaf') { g.save(); g.translate(x, y); g.rotate(p.rot + p.t * 2); g.beginPath(); g.ellipse(0, 0, p.r * z, p.r * 0.55 * z, 0, 0, TAU); g.fill(); g.restore(); }
  else if (p.kind === 'star') { g.beginPath(); for (let k = 0; k < 8; k++) { const r = (k % 2 ? 0.4 : 1) * p.r * 1.6 * z, an = k / 8 * TAU + p.t * 4; g.lineTo(x + Math.cos(an) * r, y + Math.sin(an) * r); } g.fill(); }
  else { g.beginPath(); g.arc(x, y, p.r * z, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
}

function fxItems(items, g) {
  for (const c of FX.critters) items.push({ k: keyOf(c.x, c.y) + 1.2 + c.z * 0.4, f: () => drawCritter(g, c) });

// ---------- Clima: sombra de nubes, lluvia, relámpagos ----------
function drawWeatherFx(g, s, dt) {
  const w = G.w;
  // sombras de nubes que cruzan el jardín
  if (w.cloud > 0.15 && w.cloud < 0.85 && s.z > 0.05) {
    while (FX.cloudShade.length < 4) FX.cloudShade.push({ x: rand(-0.4, 1.2), y: rand(0, 1), r: rand(0.18, 0.32) });

      c.x += dt * 0.012 * (0.6 + R.wind);

  } else if (rn.length) rn.length = Math.max(0, rn.length - 20);

      d.y += d.v * dt; d.x += d.v * dt * wx;

      g.moveTo(d.x, d.y); g.lineTo(d.x - d.l * wx, d.y - d.l);

}

function drawOverlayFx(g, s, dt) {

}

// ===== Visitantes: llegan por la vereda, pagan la entrada, recorren el jardín y comentan =====
const VIS = { list: [], queue: [], pois: [], poiVer: -1, walkVer: -1, walk: null, passT: 0 };
const OPEN_H = 9, CLOSE_H = 18, MAX_ON_SCREEN = 28;
const WALK_SPEED = 4.4;          // casillas por hora del juego
const SIDEWALK_Y = GH + 0.62;

const SKIN = ['#f3d2b5', '#e8b98f', '#c98e62', '#a86b45', '#7a4a30', '#f6dcc6'];
const HAIR = ['#2a1f18', '#4a3020', '#8a5a2a', '#c9a060', '#e8d8b0', '#9a9a9a', '#6a2a1a'];
const SHIRT = ['#e86a5a', '#5a9ad8', '#f2c14e', '#7ac08a', '#c48ad8', '#f29ab8', '#ffffff', '#4a6a8a', '#e8954a', '#3fa7a0'];

function newLook(type) {

  if (type === 'jury') return { skin: pick(SKIN), hair: pick(HAIR), shirt: pick(['#3a4050', '#4a3a48', '#2f4a44']), pants: '#2a2a30', hat: null, long: false, kid: false, old: Math.random() < 0.3, clip: true, h: 1.6 + Math.random() * 0.15 };

    camera: Math.random() < 0.2, bag: Math.random() < 0.25, long: Math.random() < 0.45, kid, old, h: kid ? 1.05 + Math.random() * 0.2 : 1.55 + Math.random() * 0.25
  };
