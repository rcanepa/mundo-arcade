// ---------- Por dónde se puede caminar ----------
function walkable(x, y) {
  const t = tileAt(x, y);
  if (!t || !t.own || (t.t !== 'grass' && t.t !== 'path') || t.plant) return false;
  if (t.obj) { const st = G.structs.find(s => s.id === t.obj); return st && BUILD[st.k].walk; }
  return true;
}
function walkGrid() {
  if (VIS.walkVer === VIS_VER && VIS.walk) return VIS.walk;
  const wk = new Uint8Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) wk[idx(x, y)] = walkable(x, y) ? 1 : 0;
  VIS.walk = wk; VIS.walkVer = VIS_VER;
  return wk;
}
function findPath(sx, sy, tx, ty) {
  const wk = walkGrid();
  if (!inside(tx, ty) || !wk[idx(tx, ty)]) return null;
  const prev = new Int32Array(GW * GH).fill(-1), start = idx(sx, sy), goal = idx(tx, ty);
  const q = [start]; prev[start] = start;
  for (let h = 0; h < q.length; h++) {
    const c = q[h];
    if (c === goal) break;
    const cx = c % GW, cy = (c / GW) | 0;
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = cx + dx, ny = cy + dy;
      if (!inside(nx, ny)) continue;
      const n = idx(nx, ny);
      if (prev[n] !== -1 || !wk[n]) continue;
      prev[n] = c; q.push(n);
    }
  }
  if (prev[goal] === -1) return null;
  const path = [];
  for (let c = goal; c !== start; c = prev[c]) path.push([(c % GW) + 0.5, ((c / GW) | 0) + 0.5]);
  return path.reverse();
}

// Lugares interesantes para mirar: plantas lindas (o con problemas), la fuente, los bancos…
function buildPOIs() {
  if (VIS.poiVer === VIS_VER) return VIS.pois;
  const wk = walkGrid(), pois = [];
  const spotNear = (x0, y0, w = 1, h = 1) => {
    const out = [];
    for (let y = y0 - 1; y <= y0 + h; y++) for (let x = x0 - 1; x <= x0 + w; x++) if (inside(x, y) && wk[idx(x, y)]) out.push([x, y]);
    return out;
  };
  for (const p of G.plants) {
    const t = tileAt(p.x, p.y);
    if (!t.own || t.pot) continue;
    const problem = p.dead || (p.fac && p.cond < 0.6) || p.pests;
    const w = Math.max(0, p.beauty || 0) + (p.bloom > 0.5 ? 2 : 0) + (problem ? 1.2 : 0);
    if (w < 0.6) continue;
    const spots = spotNear(p.x, p.y);
    if (spots.length) pois.push({ p, spots, w });
  }
  for (const s of G.structs) {
    const b = BUILD[s.k];
    if (s.k === 'bench') { pois.push({ s, spots: [[s.x, s.y]], w: 2.5, sit: 1 }); continue; }
    if (!b.beauty) continue;
    const spots = spotNear(s.x, s.y, s.w, s.h);
    if (spots.length) pois.push({ s, spots, w: b.beauty * 0.4 });
  }
  const water = G.tiles.filter(t => t.own && t.t === 'water');
  if (water.length) {
    const t = water[Math.floor(water.length / 2)], spots = spotNear(t.x, t.y);
    if (spots.length) pois.push({ pond: 1, spots, w: 3 + water.length * 0.3 });
  }
  VIS.pois = pois; VIS.poiVer = VIS_VER;
  return pois;
}

// ---------- Programar las visitas del día ----------
function planVisitors() {
  VIS.queue = [];
  const n = expectedVisitors(), count = Math.floor(n) + (Math.random() < n % 1 ? 1 : 0);
  for (let i = 0; i < count; i++) VIS.queue.push(OPEN_H + Math.random() * (CLOSE_H - OPEN_H - 1.2));
  VIS.queue.sort((a, b) => a - b);
}

function spawnVisitor(enter, type) {
  const side = Math.random() < 0.5 ? -1 : 1;
  // a veces llega una botánica que viene a ver especies raras
  if (enter && !type && G.repMax >= 1.5 && Math.random() < 0.1) type = 'botanist';
  const v = {
    id: Math.random(), x: side < 0 ? -1.5 : GW + 1.5, y: SIDEWALK_Y + (Math.random() - 0.5) * 0.3, look: newLook(type), type: type || 'guest', rare: 0,
    state: enter ? 'toGate' : 'pass', side, path: [], t: 0, wait: 0, sat: 0.55, stops: 0, maxStops: 4 + Math.floor(Math.random() * 5),
    seen: new Set(), bubble: null, phase: Math.random() * 6, fx: -side, fy: 0, paid: false, timeLeft: 3.5 + Math.random() * 2.5
  };
  VIS.list.push(v);
  return v;
}

function payEntry(v) {
  v.paid = true;
  const ratio = G.price / Math.max(1, G.fair);
  v.sat += clamp((1 - ratio) * 0.18, -0.25, 0.12);
  G.money += G.price; G.today.income += G.price; G.today.visitors++; G.stats.visitors++; G.stats.income += G.price;
  if (G.price > 0 && !UI.title) { fxFloat(GATE_X + 0.5, GH - 0.4, '+' + money(G.price), '#2f6a2a'); Sound.sfx.coin(); }
  if (ratio > 1.35 && Math.random() < 0.5) say(v, 'expensive');
}

// Un visitante "invisible" (cuando hay demasiada gente en pantalla): paga y se lleva una impresión general
function ghostVisit() {
  G.money += G.price; G.today.income += G.price; G.today.visitors++; G.stats.visitors++; G.stats.income += G.price;
  const ratio = G.price / Math.max(1, G.fair);
  const sat = clamp(0.5 + Math.min(0.35, G.beauty / 2500) + (1 - ratio) * 0.18, 0, 1);
  G.today.sat += sat; G.today.satN++;
}

function updateVisitors(dtH, dtReal) {
  // llegan según lo programado
  while (VIS.queue.length && VIS.queue[0] <= G.hour) {
    VIS.queue.shift();
    if (VIS.list.filter(v => v.state !== 'pass').length < MAX_ON_SCREEN) spawnVisitor(true); else ghostVisit();
  }
  // gente que pasa por la calle
  VIS.passT -= dtH;
  if (VIS.passT <= 0 && G.hour > 7 && G.hour < 21 && !G.w.storm) {
    VIS.passT = 0.6 + Math.random() * 1.6;
    if (VIS.list.length < MAX_ON_SCREEN + 6) spawnVisitor(false);
  }
  for (let i = VIS.list.length - 1; i >= 0; i--) {
    const v = VIS.list[i];
    v.t += dtH;
    if (v.bubble) { v.bubble.t -= dtReal; if (v.bubble.t <= 0) v.bubble = null; }
    if (!stepVisitor(v, dtH)) VIS.list.splice(i, 1);
  }
}

function moveAlong(v, dtH) {
  let d = WALK_SPEED * dtH * (v.look.old ? 0.7 : v.look.kid ? 1.2 : 1);
  while (d > 0 && v.path.length) {
    const [tx, ty] = v.path[0], dx = tx - v.x, dy = ty - v.y, l = Math.hypot(dx, dy);
    if (l > 0.01) { v.fx = dx; v.fy = dy; }
    if (l <= d) { v.x = tx; v.y = ty; v.path.shift(); d -= l; }
    else { v.x += dx / l * d; v.y += dy / l * d; d = 0; }
  }
  v.moving = v.path.length > 0;
  return v.path.length === 0;
}

function stepVisitor(v, dtH) {
  const closing = G.hour >= CLOSE_H || !G.open;
  switch (v.state) {
    case 'pass': // camina por la vereda
      if (!v.path.length) v.path = [[v.side < 0 ? GW + 2 : -2, v.y]];
      moveAlong(v, dtH * 0.9);
      if (v.x < -1.8 || v.x > GW + 1.8) return v.path.length > 0;
      return true;
    case 'toGate':
      if (!v.path.length) v.path = [[GATE_X + 0.5, SIDEWALK_Y], [GATE_X + 0.5, GH - 0.5]];
      if (moveAlong(v, dtH)) { payEntry(v); v.state = 'choose'; }
      return true;
    case 'choose': {
      if (closing || v.stops >= v.maxStops || v.t > v.timeLeft + 2) { v.state = 'leave'; return true; }
      const poi = choosePOI(v);
      if (!poi) { v.state = 'leave'; return true; }
      const path = findPath(Math.floor(v.x), Math.floor(v.y), poi.spot[0], poi.spot[1]);
      if (!path) { v.seen.add(poi.poi); return true; }
      v.path = path; v.target = poi; v.state = 'walk';
      return true;
    }
    case 'walk':
      if (moveAlong(v, dtH)) { v.state = 'look'; v.wait = v.target.poi.sit ? 0.9 + Math.random() * 0.8 : 0.3 + Math.random() * 0.4; react(v, v.target.poi); }
      return true;
    case 'look':
      v.wait -= dtH;
      if (v.target && v.target.poi.p) { v.fx = v.target.poi.p.x + 0.5 - v.x; v.fy = v.target.poi.p.y + 0.5 - v.y; }
      if (v.wait <= 0) { v.stops++; v.state = 'choose'; v.sitting = false; }
      return true;
    case 'leave': {
      const path = findPath(Math.floor(v.x), Math.floor(v.y), GATE_X, GH - 1) || [];
      v.path = path.concat([[GATE_X + 0.5, GH - 0.5], [GATE_X + 0.5, SIDEWALK_Y], [v.side < 0 ? -2 : GW + 2, SIDEWALK_Y]]);
      v.state = 'exit';
      if (v.paid) {
        v.sat = clamp(v.sat, 0, 1);
        G.today.sat += v.sat; G.today.satN++;
        if (v.type === 'botanist' && v.rare && v.sat > 0.6) {
          const tip = 3 + v.rare * 4;
          G.money += tip; G.today.income += tip; G.stats.income += tip;
          fxFloat(v.x, v.y, L().tip(money(tip)), '#b8860b'); say(v, 'botanistBye');
        } else if (v.sat > 0.85 && Math.random() < 0.3) {
          const tip = 1 + Math.floor(Math.random() * Math.max(2, G.price));
          G.money += tip; G.today.income += tip; G.stats.income += tip;
          fxFloat(v.x, v.y, L().tip(money(tip)), '#b8860b'); say(v, 'thanks');
        }
      }
      return true;
    }
    case 'exit':
      moveAlong(v, dtH);
      return v.path.length > 0;
  }
  return false;
}

function choosePOI(v) {
  const pois = buildPOIs();
  let tot = 0;
  const opts = [];
  for (const poi of pois) {
    if (v.seen.has(poi)) continue;
    let best = null, bd = 1e9;
    for (const s of poi.spots) { const d = Math.abs(s[0] + 0.5 - v.x) + Math.abs(s[1] + 0.5 - v.y); if (d < bd) { bd = d; best = s; } }
    let w = poi.w / (1 + bd * 0.12);
    if (v.type !== 'guest' && poi.p) { const sp = spOf(poi.p); w *= sp.rare || sp.tier >= 3 ? 3 : 1; if (v.type === 'jury') w *= poi.p.bloom > 0.5 ? 2 : 1; }
    opts.push([poi, best, w]); tot += w;
  }
  if (!opts.length) return null;
  let r = Math.random() * tot;
  for (const [poi, spot, w] of opts) { r -= w; if (r <= 0) { v.seen.add(poi); return { poi, spot }; } }
  const [poi, spot] = opts[opts.length - 1]; v.seen.add(poi);
  return { poi, spot };
}

// Qué siente al ver algo
function react(v, poi) {
  const chatty = Math.random() < 0.62;
  if (poi.sit) { v.sitting = true; v.sat += 0.03; if (chatty) say(v, 'bench'); return; }
  if (poi.pond) { v.sat += 0.05; if (chatty) say(v, 'pond'); return; }
  if (poi.s) {
    v.sat += 0.02 + (BUILD[poi.s.k].beauty || 0) * 0.002;
    if (chatty) say(v, poi.s.k === 'fountain' ? 'fountain' : poi.s.k === 'greenhouse' ? 'greenhouse' : 'decor');
    return;
  }
  const p = poi.p, sp = spOf(p), name = sp;
  if (p.dead) { v.sat -= 0.06; say(v, 'dead', name); return; }
  const f = p.fac;
  if (p.pests) { v.sat -= 0.03; say(v, 'pests', name); return; }
  if (f && p.cond < 0.62) {
    v.sat -= 0.03;
    const issue = f.water < 0.75 ? (f.dry ? 'thirsty' : 'soggy') : f.light < 0.75 ? (f.lightLow ? 'dark' : 'burnt') : f.ph < 0.75 ? 'yellow' : f.heat < 0.8 ? 'hot' : f.hum < 0.8 ? 'dry_air' : f.drain < 0.8 ? 'soil' : f.feed < 0.8 ? 'pale' : 'sad';
    say(v, issue, name);
    return;
  }
  const b = Math.max(0, p.beauty || 0);
  v.sat += 0.015 + b * 0.007;
  if (v.type === 'botanist') {
    if (sp.rare || sp.tier >= 3) v.rare++;
    if (Math.random() < 0.7) say(v, 'botanist', sp);
    return;
  }
  if (v.type === 'jury') { if (Math.random() < 0.6) say(v, p.bloom > 0.5 ? 'jury' : 'juryMeh', sp); return; }
  if (sp.rare && p.bloom > 0.4) { v.sat += 0.05; say(v, 'rare', name); return; }
  if (!chatty) return;
  if (p.fruit >= 1) say(v, 'fruit', name);
  else if (p.bloom > 0.5 && sp.scent && Math.random() < 0.5) say(v, 'scent', name);
  else if (p.bloom > 0.5) { say(v, 'bloom', name); if (v.look.camera) fxSparkle(p.x + 0.5, p.y + 0.5, '#ffffff'); }
  else if (seasonOf(G.day % DAYS_YEAR) === 2 && sp.fall && p._vs && p._vs.fall > 0.3) say(v, 'autumn', name);
  else if (b > 1) say(v, 'leaves', name);
}

function say(v, kind, sp) {
  const pool = L().vc[kind];
  if (!pool) return;
  let text = pick(pool);
  if (sp) text = text.replace('{p}', noun(sp)).replace('{P}', noun(sp, true)).replace('{n}', spName(sp).toLowerCase()).replace('{la}', sp.la);
  if (LANG === 'es') text = fixES(text);
  v.bubble = { text, t: 2.8, kind };
  G.log.unshift({ day: G.day, h: Math.floor(G.hour), text, kind });
  if (G.log.length > 40) G.log.length = 40;
}

// ---------- Dibujo ----------
function visitorItems(items, g) {
  for (const v of VIS.list) items.push({ k: keyOf(v.x, v.y) + (v.state === 'pass' || v.y > GH ? 0.3 : 0.02), f: () => drawVisitor(g, v) });
}
function drawVisitor(g, v) {
  const [x, y] = P(v.x, v.y), z = cam.z, L0 = v.look, H = L0.h * ZS * z;
  // hacia dónde mira en la pantalla, según hacia dónde mira en el jardín y cómo está girada la vista
  const dir = Math.sign(PV(v.fx, v.fy)[0]) || 1;
  if (x < -40 || x > VW + 40 || y < -100 || y > VH + 100) return;
  const fade = clamp(Math.min(v.x + 1.8, GW + 1.8 - v.x), 0, 1);
  g.globalAlpha = fade;
  const walk = v.moving ? Math.sin((v.t * 26 + v.phase) * (v.look.kid ? 1.3 : 1)) : 0;
  g.fillStyle = 'rgba(20,20,10,0.22)'; g.beginPath(); g.ellipse(x, y, 7 * z, 3.2 * z, 0, 0, TAU); g.fill();
  const sit = v.sitting ? 0.22 * ZS * z : 0, hip = y - H * 0.47 + sit, sh = y - H * 0.8 + sit, head = y - H * 0.89 + sit;
  const lw = Math.max(2, 3.4 * z * (L0.kid ? 0.85 : 1));
  // piernas
  g.strokeStyle = L0.pants; g.lineWidth = lw; g.lineCap = 'round';
  if (v.sitting) { g.beginPath(); g.moveTo(x - 2 * z, hip); g.lineTo(x - 2 * z + dir * 6 * z, hip + 1); g.lineTo(x - 2 * z + dir * 6 * z, y - 1); g.moveTo(x + 2 * z, hip); g.lineTo(x + 2 * z + dir * 6 * z, hip + 1); g.lineTo(x + 2 * z + dir * 6 * z, y - 1); g.stroke(); }
  else { g.beginPath(); g.moveTo(x - 1.8 * z, hip); g.lineTo(x - 1.8 * z + walk * 3.5 * z, y - 1); g.moveTo(x + 1.8 * z, hip); g.lineTo(x + 1.8 * z - walk * 3.5 * z, y - 1); g.stroke(); }
  // cuerpo
  g.fillStyle = L0.shirt;
  g.beginPath(); g.roundRect(x - 5 * z * (L0.kid ? 0.8 : 1), sh, 10 * z * (L0.kid ? 0.8 : 1), hip - sh + 2 * z, 4 * z); g.fill();
  if (L0.long) { g.fillStyle = css(shade(L0.shirt, -0.15)); g.beginPath(); g.moveTo(x - 5 * z, hip - 1); g.lineTo(x + 5 * z, hip - 1); g.lineTo(x + 6.5 * z, hip + H * 0.18); g.lineTo(x - 6.5 * z, hip + H * 0.18); g.fill(); }
  // brazos
  g.strokeStyle = css(shade(L0.shirt, -0.08)); g.lineWidth = lw * 0.8;
  g.beginPath(); g.moveTo(x - 4.5 * z, sh + 2 * z); g.lineTo(x - 5.5 * z - walk * 2.5 * z, sh + H * 0.27); g.moveTo(x + 4.5 * z, sh + 2 * z); g.lineTo(x + 5.5 * z + walk * 2.5 * z, sh + H * 0.27); g.stroke();
  if (L0.camera) { g.fillStyle = '#2a2a2a'; g.fillRect(x + dir * 4 * z - 2.5 * z, sh + 5 * z, 5 * z, 3.5 * z); }
  if (L0.book) { g.fillStyle = '#5a7a4a'; g.fillRect(x + dir * 4 * z - 2 * z, sh + 4 * z, 4.5 * z, 5.5 * z); }
  if (L0.clip) { g.fillStyle = '#f4f0e4'; g.fillRect(x + dir * 4.5 * z - 2.5 * z, sh + 3 * z, 5 * z, 6.5 * z); g.fillStyle = '#8a6a48'; g.fillRect(x + dir * 4.5 * z - 1 * z, sh + 2.5 * z, 2 * z, 1.2 * z); }
  if (L0.bag) { g.fillStyle = '#8a6a4a'; g.beginPath(); g.roundRect(x - dir * 7 * z - 2.5 * z, hip - 5 * z, 5 * z, 6 * z, 1.5 * z); g.fill(); }
  if (L0.old && !v.sitting) { g.strokeStyle = '#6a4a2a'; g.lineWidth = 1.4 * z; g.beginPath(); g.moveTo(x + dir * 7 * z, sh + H * 0.27); g.lineTo(x + dir * 8 * z, y); g.stroke(); }
  // cabeza
  const hr = (L0.kid ? 4.4 : 4.8) * z;
  g.fillStyle = L0.skin; g.beginPath(); g.arc(x, head, hr, 0, TAU); g.fill();
  g.fillStyle = L0.hair; g.beginPath(); g.arc(x - dir * 0.8 * z, head - 1 * z, hr * 1.02, Math.PI * 0.95, Math.PI * 2.05); g.fill();
  if (L0.long && !L0.hat) { g.fillRect(x - dir * hr - (dir > 0 ? 1.5 * z : -0), head - 1 * z, 2.5 * z, hr * 1.4); }
  if (L0.hat === 'sun') { g.fillStyle = L0.hatCol; g.beginPath(); g.ellipse(x, head - hr * 0.6, hr * 1.9, hr * 0.55, 0, 0, TAU); g.fill(); g.beginPath(); g.arc(x, head - hr * 0.6, hr * 0.9, Math.PI, TAU); g.fill(); }
  else if (L0.hat === 'cap') { g.fillStyle = L0.hatCol; g.beginPath(); g.arc(x, head - hr * 0.3, hr, Math.PI, TAU); g.fill(); g.fillRect(x + (dir > 0 ? 0 : -hr * 1.6), head - hr * 0.4, hr * 1.6, hr * 0.3); }
  else if (L0.hat === 'beret') { g.fillStyle = L0.hatCol; g.beginPath(); g.ellipse(x, head - hr * 0.75, hr * 1.1, hr * 0.45, -0.2, 0, TAU); g.fill(); }
  g.globalAlpha = 1;
  if (v.bubble) R.bubbles.push([x, head - hr - 8 * z, v.bubble]);
}

function drawBubble(g, x, y, b) {
  const a = clamp(Math.min(b.t * 3, (2.8 - b.t) * 6), 0, 1);
  if (a <= 0) return;
  g.globalAlpha = a;
  g.font = '600 12px ui-rounded, "SF Pro Rounded", system-ui, sans-serif';
  const words = b.text.split(' '), lines = [];
  let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > 170 && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  const w = Math.max(...lines.map(l => g.measureText(l).width)) + 16, h = lines.length * 15 + 10;
  const bx = clamp(x - w / 2, 6, VW - w - 6), by = y - h;
  const bad = ['thirsty', 'soggy', 'dark', 'burnt', 'yellow', 'hot', 'dry_air', 'soil', 'pale', 'sad', 'dead', 'pests', 'expensive'].includes(b.kind);
  g.fillStyle = bad ? 'rgba(255,244,232,0.97)' : 'rgba(255,253,246,0.97)';
  g.strokeStyle = bad ? 'rgba(200,110,70,0.6)' : 'rgba(90,110,80,0.35)'; g.lineWidth = 1.2;
  g.beginPath(); g.roundRect(bx, by, w, h, 9); g.fill(); g.stroke();
  g.beginPath(); g.moveTo(x - 5, by + h); g.lineTo(x, by + h + 6); g.lineTo(x + 5, by + h); g.fill();
  g.fillStyle = '#2c3a2e'; g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach((l, i) => g.fillText(l, bx + w / 2, by + 12 + i * 15));
  g.globalAlpha = 1;
}

// ===== Acciones del jugador, objetivos y encargos =====
function spend(cost) {
  if (G.money < cost) { toast(L().noMoney, 'bad'); Sound.sfx.nope(); return false; }
  G.money -= cost;
  return true;
}
function changed() { bumpVis(); G.lightDirty = true; }

function actPlant(id, x, y) {
  const sp = SP[id], t = tileAt(x, y), own = (G.inv[id] || 0) > 0;
  if (sp.tier > unlockedTier() && !own) { toast(L().locked(sp.tier), 'bad'); return false; }
  if (!canPlantHere(sp, t)) {
    if (!t || !t.own) toast(L().notYours, 'bad');
    else if (t.plant) toast(L().occupied, 'bad');
    else toast(sp.water === 'aquatic' ? L().needPond : t.t === 'water' ? L().notInWater : L().needBed, 'bad');
    Sound.sfx.nope(); return false;
  }
  // lo que hay en el semillero se planta gratis
  if (own) G.inv[id]--;
  else if (!spend(sp.price)) return false;
  const p = addPlant(id, x, y, { hp: 85, g: own ? Math.min(sp.start, 0.12) : undefined });
  p.fac = evaluate(sp, t, p, G.w, false); p.cond = p.fac.cond;
  G.stats.planted++;
  if (!G.herb[id]) G.herb[id] = 1;
  fxPuff(x + 0.5, y + 0.5, css(soilColor(t)));
  if (!own) fxFloat(x + 0.5, y + 0.5, '−' + money(sp.price), '#8a4a2a');
  Sound.sfx.plant();
  changed();
  return true;
}

function actWater(x, y, rad) {
  let n = 0;
  for (let j = y - rad; j <= y + rad; j++) for (let i = x - rad; i <= x + rad; i++) {
    if (Math.hypot(i - x, j - y) > rad + 0.3) continue;
    const t = tileAt(i, j);
    if (!t || !t.own || t.t === 'water' || t.t === 'house') continue;
    if (waterTile(t)) { n++; fxSplash(i + 0.5, j + 0.5); }
  }
  if (n) { G.stats.watered += n; Sound.sfx.water(); bumpVis(); }
  return n > 0;
}

function actPrune(p) {
  const sp = spOf(p);
  if (!sp.prune) { toast(L().noPrune, 'info'); return false; }
  if (!canPrune(p)) { toast(L().notPruneTime(L().seasonRange(sp.prune)), 'info'); return false; }
  p.prunedDay = G.day;
  G.stats.pruned = (G.stats.pruned || 0) + 1;
  if (sp.type !== 'vine') p.g = Math.max(0.85, p.g - 0.05);
  fxPuff(p.x + 0.5, p.y + 0.5, '#6f9a45'); fxFloat(p.x + 0.5, p.y + 0.5, L().pruned, '#3a6b35');
  Sound.sfx.care(); changed();
  return true;
}

// Juntar semillas, sacar esquejes o dividir la mata: van al semillero y se plantan gratis
function actPropagate(p) {
  const n = propCount(p), sp = spOf(p), how = propMethod(sp);
  if (!n) return false;
  G.inv[sp.id] = (G.inv[sp.id] || 0) + n;
  p.propYear = Math.floor(G.day / DAYS_YEAR);
  if (how === 'cutting') p.hp -= 8;
  if (how === 'division') p.hp -= 12;
  G.stats.propagated = (G.stats.propagated || 0) + n;
  fxSparkle(p.x + 0.5, p.y + 0.5, '#bfe6a0');
  toast(L().propDone(n, spName(sp), L().propK[how]), 'good');
  Sound.sfx.harvest(); changed();
  return true;
}

function actBuyPot(i) {
  const t = G.pots[i];
  if (!t || t.own || !spend(POT_PRICE)) return false;
  t.own = 1; t.moist = 0.5;
  Sound.sfx.build(); changed();
  return true;
}

function actWaterThirsty() {
  const list = thirstyPlants();
  if (!list.length) { toast(L().noneThirsty, 'info'); return false; }
  const cost = list.length * THIRSTY_PRICE;
  if (!spend(cost)) return false;
  G.today.water = (G.today.water || 0) + cost;
  for (const p of list) { const t = tileAt(p.x, p.y); waterTile(t, waterTarget(spOf(p)) - t.moist); fxSplash(p.x + 0.5, p.y + 0.5); }
  G.stats.watered += list.length;
  toast(L().thirstyDone(list.length, money(cost)), 'good');
  Sound.sfx.water(); bumpVis();
  return true;
}

function actCare(k, x, y) {
  const t = tileAt(x, y), c = CARE[k];
  if (!t || !t.own || t.t === 'house' || t.t === 'water' || t.t === 'path') { toast(L().careWhere, 'bad'); Sound.sfx.nope(); return false; }
  const p = t.plant;
  if ((k === 'spray' || k === 'cloth') && (!p || p.dead)) { toast(L().needPlant, 'bad'); Sound.sfx.nope(); return false; }
  if (k === 'spray' && !p.pests) { toast(L().noPests, 'info'); return false; }
  if (k === 'weed' && t.weeds < 0.1) return false;
  if (k === 'prune') return p && !p.dead ? actPrune(p) : (toast(L().needPlant, 'bad'), false);
  if (k === 'tray' && (!t.pot || t.tray)) return false;
  if (k === 'cloth' && p.cloth) { p.cloth = 0; Sound.sfx.click(); changed(); return true; } // quitar la manta es gratis
  if (!spend(c.cost)) return false;
  switch (k) {

    case 'sand': t.drain = clamp(t.drain + 0.15, 0, 1); t.org = Math.max(0.02, t.org - 0.03); t.fert = Math.max(0, t.fert - 0.03); break;

    case 'sulfur': t.ph = clamp(t.ph - 0.6, 3.8, 9); t.ph0 = clamp(t.ph0 - 0.15, 4, 9); break;
    case 'lime': t.ph = clamp(t.ph + 0.5, 3.8, 9); t.ph0 = clamp(t.ph0 + 0.12, 4, 9); break;
    case 'fert': t.fert = clamp(t.fert + 0.35, 0, 1); break;

// ---------- Construir ----------
function footprint(k, x, y) { const b = BUILD[k]; return { w: b.w || 1, h: b.h || 1 }; }
function canBuild(k, x, y) {
  const b = BUILD[k], { w, h } = footprint(k, x, y);
  if (b.tier && b.tier > unlockedTier()) return L().locked(b.tier);
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) {
    const t = tileAt(i, j);
    if (!t || !t.own) return L().notYours;
    if (t.t === 'house') return L().occupied;
    if (b.tile) {
      if (t.t === b.tile) return L().already;
      if (t.plant || t.obj || t.gh) return L().occupied;
      // la entrada desde la reja y la puerta de la casa quedan libres para pasar
      if (b.tile !== 'path' && b.tile !== 'grass' && i === GATE_X && (j === GH - 1 || j === HOUSE.y1)) return L().occupied;
      continue;
    }
    if (k === 'shade') { if (t.shade) return L().already; continue; }
    if (k === 'drip') { if (t.drip) return L().already; if (t.t !== 'bed') return L().dripWhere; continue; }
    if (i === GATE_X && (j === GH - 1 || j === HOUSE.y1)) return L().occupied;
    if (t.plant || t.obj || t.gh || (b.overhead && t.over) || t.t === 'water') return L().occupied;
    if (k === 'greenhouse' && t.over) return L().occupied;
  }
  return null;
}
function actBuild(k, x, y) {
  const b = BUILD[k], err = canBuild(k, x, y);
  if (err) { if (err !== L().already) { toast(err, 'bad'); Sound.sfx.nope(); } return false; }
  if (!spend(b.cost)) return false;
  if (b.tile) {
    const t = tileAt(x, y);
    t.t = b.tile; t.weeds = 0;
    if (b.tile === 'bed') { G.stats.beds = (G.stats.beds || 0) + 1; t.moist = Math.max(t.moist, 0.35); }
    if (b.tile === 'water') t.moist = 1;
    if (b.tile !== 'bed') t.mulch = 0;
  } else if (k === 'shade') tileAt(x, y).shade = 1;
  else if (k === 'drip') tileAt(x, y).drip = 1;
  else addStruct(k, x, y);
  const { w, h } = footprint(k, x, y);
  fxPuff(x + w / 2, y + h / 2, b.tile === 'water' ? '#6aa8c0' : '#c8b89a');
  if (b.cost >= 10) fxFloat(x + w / 2, y + h / 2, '−' + money(b.cost), '#8a4a2a');
  Sound.sfx.build();
  changed();
  return true;
}

// Quitar: plantas (las secas se vuelven compost), malezas, estructuras
function actRemove(x, y) {
  const t = tileAt(x, y);
  if (!t || !t.own) return false;
  if (t.plant) {
    const p = t.plant;
    if (p.old && spOf(p).walnut && !confirm(L().confirmWalnut)) return false;
    if (p.dead) { t.org = clamp(t.org + 0.06, 0, 1); t.fert = clamp(t.fert + 0.05, 0, 1); }
    removePlant(p); fxPuff(x + 0.5, y + 0.5, '#7a5a3a'); Sound.sfx.dig();
    if (R.sel === p) R.sel = null;
    changed(); return true;
  }
  if (t.weeds > 0.1) { t.weeds = 0; Sound.sfx.dig(); changed(); return true; }
  const st = structAt(x, y);
  if (st) {
    if (st.k === 'greenhouse' && G.plants.some(p => tileAt(p.x, p.y).gh === st.id)) { toast(L().emptyFirst, 'bad'); return false; }
    removeStruct(st);
    const back = Math.floor(BUILD[st.k].cost * 0.5);
    G.money += back; fxFloat(x + 0.5, y + 0.5, '+' + money(back), '#2f6a2a');
    Sound.sfx.dig(); changed(); return true;
  }
  if (t.shade) { t.shade = 0; changed(); return true; }
  if (t.drip) { t.drip = 0; Sound.sfx.dig(); changed(); return true; }
  if (t.t === 'bed' || t.t === 'path' || t.t === 'water') { t.t = 'grass'; t.mulch = 0; Sound.sfx.dig(); changed(); return true; }
  return false;
}

// ---------- Cosechar ----------
function canHarvest(p) {

  const k = sp.harv[0];
  if (k === 'fruit') return p.fruit >= 1;
  if (k === 'flower') return p.bloom >= 0.6 && !p.cut;
  return p.g >= 1 && p.hp > 35 && !p.dorm && !p.cut;
}
function actHarvest(p) {
  if (!canHarvest(p)) return false;
  const sp = spOf(p), [k, val, again] = sp.harv, year = Math.floor(G.day / DAYS_YEAR);
  const q = 0.5 + 0.5 * p.hp / 100, earn = Math.max(1, Math.round(val * q));
  G.money += earn; G.today.income += earn; G.stats.harvests++; G.stats.income += earn; G.today.harvest += earn;
  if (k === 'fruit') { p.fruit = 0; if (!again) { if (sp.life === 'annual') killPlant(p, 'cycle'); } }
  else if (k === 'flower') { p.bloom = 0.05; p.cut = 2; if (!again) p.cutYear = year; }
  else if (again) { p.g = 0.72; p.cut = 1; }

  registerHerb(p);
  fxSparkle(p.x + 0.5, p.y + 0.5); fxFloat(p.x + 0.5, p.y + 0.5, '+' + money(earn), '#2f6a2a');
  Sound.sfx.harvest();
  orderProgress(sp.id);
  changed();
  return true;
}

// ---------- Trasplantar: en reposo casi no sufre; en pleno crecimiento, sí ----------
function actTransplant(p, x, y) {

  const from = tileAt(p.x, p.y);

}

// ---------- Terreno ----------

const OLD_GOAL_ORDER = ['lens', 'plant', 'water', 'open', 'rose', 'beds', 'bloom5', 'visitors', 'harvest', 'star2', 'parcel', 'acid', 'pond',
  'blue', 'greenhouse', 'winter', 'tropic', 'herb25', 'star4', 'copihue', 'star5', 'herbAll'];
const goalDone = gl => !!G.goalsDone[gl.id];
function checkGoals() {

// ---------- Concurso de jardines: una vez al año, a fines de primavera ----------
const CONTEST_DAY = 8;
function contestScore() {
  const mine = G.plants.filter(p => !p.dead && tileAt(p.x, p.y).own && p.x < POT_X);
  const health = mine.length ? mine.reduce((a, p) => a + p.hp, 0) / mine.length / 100 : 0;
  return G.beauty * health * (1 + G.kinds * 0.01);
}
function judgeContest() {
  const year = Math.floor(G.day / DAYS_YEAR), score = contestScore();
  const th = [120, 300, 650].map(v => v * (1 + 0.3 * year));
  const place = score >= th[2] ? 1 : score >= th[1] ? 2 : score >= th[0] ? 3 : 0;
  if (!place) { news('contestNone', {}); return 0; }
  const prize = [0, 800, 400, 200][place];
  G.money += prize; G.stats.income += prize;
  G.rep = Math.min(5, G.rep + [0, 0.4, 0.25, 0.15][place]);
  G.stats.contestBest = Math.min(G.stats.contestBest || 9, place);
  news('contestWin', { place, prize: money(prize) });
  Sound.sfx.fanfare();
  return place;
}

// ---------- Encargos: florerías, restoranes y vecinos piden cosechas ----------
const CLIENTS = ['florist', 'restaurant', 'neighbor', 'market', 'wedding', 'school'];
function maybeNewOrder() {
  if (G.day < G.orderDay || G.orders.length >= 3) return;
  G.orderDay = G.day + 5 + Math.floor(Math.random() * 4);
  const pool = SPECIES.filter(s => s.harv && s.tier <= unlockedTier() && s.id !== 'walnut');
  if (!pool.length) return;
  // prefiere especies que el jugador ya conoce
  const known = pool.filter(s => G.herb[s.id]);
  const sp = pick(known.length && Math.random() < 0.7 ? known : pool);
  const n = sp.harv[0] === 'fruit' || sp.harv[0] === 'flower' ? 2 + Math.floor(Math.random() * 4) : 2 + Math.floor(Math.random() * 3);
  const client = sp.harv[0] === 'flower' ? pick(['florist', 'wedding', 'neighbor']) : pick(['restaurant', 'market', 'neighbor', 'school']);
  G.orders.push({ sp: sp.id, n, got: 0, reward: Math.round(sp.harv[1] * n * 2.4 + 20), until: G.day + 10, client, seen: false });
  news('order', { sp: sp.id, n });
}
function orderProgress(id) {

    o.got++;
    if (o.got >= o.n) {
      G.money += o.reward; G.stats.orders = (G.stats.orders || 0) + 1;
      G.rep = Math.min(5, G.rep + 0.08);
      toast(L().orderDone(L().clients[o.client], money(o.reward)), 'goal');
      Sound.sfx.fanfare();

  }
  G.orders = G.orders.filter(o => o.got < o.n);
}

  const before = G.orders.length;

  if (G.orders.length < before) news('orderLost', {});

// ===== Sonido: todo sintetizado con WebAudio (música suave, pájaros, grillos, lluvia y efectos) =====
const Sound = (() => {
  const PREFS = 'jardinvivo.sound';
  // volúmenes medidos con Sound.levels(): música suave de fondo, efectos claros, nada satura
  const MUSIC_VOL = 0.65, SFX_VOL = 1.3, AMB_VOL = 0.55;
  let ac = null, master, sfxBus, musicBus, ambBus, verb, noiseBuf, meter;
  let musicOn = true, sfxOn = true, playing = false;
  let nextT = 0, step = 0, chord = 0, birdT = 0, cricketT = 0;
  let rain = null, wind = null;
  try { const p = JSON.parse(localStorage.getItem(PREFS)); if (p) { musicOn = p.m !== false; sfxOn = p.s !== false; } } catch (e) { /* sin preferencias */ }
  const savePrefs = () => { try { localStorage.setItem(PREFS, JSON.stringify({ m: musicOn, s: sfxOn })); } catch (e) { /* sin guardado */ } };

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }

    ac = new AC();
    master = ac.createGain(); master.gain.value = 1; master.connect(ac.destination);
    meter = ac.createAnalyser(); meter.fftSize = 2048; master.connect(meter);
    // reverberación suave hecha con ruido que se apaga

    const len = ac.sampleRate * 2.6, ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

    const wet = ac.createGain(); wet.gain.value = 0.35; verb.connect(wet); wet.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = sfxOn ? SFX_VOL : 0; sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(master); musicBus.connect(verb);
    ambBus = ac.createGain(); ambBus.gain.value = sfxOn ? AMB_VOL : 0; ambBus.connect(master); ambBus.connect(verb);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    rain = loopNoise(1400, 'lowpass'); wind = loopNoise(380, 'lowpass');
    nextT = ac.currentTime + 0.3;
    setInterval(schedule, 60);
  }
  function loopNoise(freq, type) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(ambBus); s.start();

  }

  function voice(freq, at, dur, type, vol, bus, slideTo, attack = 0.005) {
    const o = ac.createOscillator(), g = ac.createGain();

    g.gain.setValueAtTime(0.0001, at); g.gain.exponentialRampToValueAtTime(vol, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

  }
  function hiss(at, dur, vol, freq, type, bus) {

    const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq;
    const g = ac.createGain(); g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

  }
  const tone = (f, dur, type = 'sine', vol = 0.2, slide = 0, delay = 0) => { if (ac && sfxOn) voice(f, ac.currentTime + delay, dur, type, vol, sfxBus, slide); };
  const noise = (dur, vol, freq, type = 'lowpass', delay = 0) => { if (ac && sfxOn) hiss(ac.currentTime + delay, dur, vol, freq, type, sfxBus); };

  const sfx = {
    click() { tone(880, 0.06, 'triangle', 0.08); },
    plant() { noise(0.12, 0.25, 600); tone(392, 0.18, 'sine', 0.15, 523, 0.04); },
    water() { noise(0.35, 0.18, 2200, 'bandpass'); noise(0.2, 0.1, 900, 'lowpass', 0.1); },
    coin() { tone(1318, 0.1, 'triangle', 0.12); tone(1760, 0.25, 'triangle', 0.1, 0, 0.07); },
    harvest() { [784, 988, 1175].forEach((f, i) => tone(f, 0.2, 'triangle', 0.12, 0, i * 0.06)); },
    build() { noise(0.15, 0.3, 300); tone(140, 0.15, 'sine', 0.2, 90); },
    dig() { noise(0.2, 0.3, 500); },
    care() { noise(0.18, 0.18, 1200, 'bandpass'); tone(660, 0.12, 'sine', 0.08, 0, 0.05); },
    nope() { tone(220, 0.18, 'triangle', 0.15, 180); },
    fanfare() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.45, 'triangle', 0.13, 0, i * 0.09)); }
  };

  // Música: arpegios pentatónicos tipo cajita de música; los acordes cambian según la estación
  const SCALES = [[0, 2, 4, 7, 9], [0, 2, 4, 7, 9], [0, 3, 5, 7, 10], [0, 3, 5, 7, 10]];
  const PROG = [[0, 7], [9, 4], [5, 0], [7, 2]];
  function schedule() {
    if (!ac) return;
    const now = ac.currentTime;
    const season = typeof G !== 'undefined' && G.day !== undefined ? seasonOf(G.day % DAYS_YEAR) : 0;
    const night = typeof G !== 'undefined' && G.hour !== undefined ? (G.hour < 6 || G.hour > 20.5) : false;

        if (step % 16 === 0) chord = (chord + 1) % PROG.length;
      }
      nextT += beat;
    }
  }
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  // Ambiente: pájaros de día, grillos de noche, lluvia y viento
  function update(dt) {
    if (!ac || typeof G === 'undefined' || !G.w) return;
    const h = G.hour, w = G.w, raining = w.rain > 0 && h >= 4 && h < 4 + Math.min(18, w.rain * 0.6);
    const t = ac.currentTime;
    rain.gain.setTargetAtTime(raining ? 0.12 + Math.min(0.15, w.rain / 120) : 0, t, 0.8);
    wind.gain.setTargetAtTime(0.04 + R.wind * 0.08, t, 1.5);
    if (!sfxOn) return;
    birdT -= dt; cricketT -= dt;
    const s = seasonOf(G.day % DAYS_YEAR);
    if (birdT <= 0 && h > 5.5 && h < 19.5 && !raining) {
      birdT = (h < 9 ? 0.6 : 2.2) + Math.random() * 3;
      const f = 2200 + Math.random() * 1800, n = 2 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) voice(f * (1 + (Math.random() - 0.5) * 0.2), t + i * 0.11, 0.09, 'sine', 0.05, ambBus, f * (1.2 + Math.random() * 0.3));
    }
    if (cricketT <= 0 && (h > 20.5 || h < 5) && s <= 1 && !raining) {
      cricketT = 0.45 + Math.random() * 0.4;
      for (let i = 0; i < 3; i++) voice(4300 + Math.random() * 200, t + i * 0.045, 0.03, 'sine', 0.025, ambBus);
    }
  }

  function thunder() { if (ac && sfxOn) { hiss(ac.currentTime + 0.3, 2.5, 0.5, 160, 'lowpass', sfxBus); hiss(ac.currentTime + 0.35, 1.2, 0.3, 400, 'lowpass', sfxBus); } }
  function play() { playing = true; }
  function toggleMusic() { musicOn = !musicOn; if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? MUSIC_VOL : 0, ac.currentTime, 0.3); savePrefs(); return musicOn; }
  function toggleSfx() {
    sfxOn = !sfxOn;
    if (sfxBus) { sfxBus.gain.setTargetAtTime(sfxOn ? SFX_VOL : 0, ac.currentTime, 0.1); ambBus.gain.setTargetAtTime(sfxOn ? AMB_VOL : 0, ac.currentTime, 0.3); }
    savePrefs(); return sfxOn;
  }
  // Nivel de lo que suena ahora (para revisar volúmenes en las pruebas)
  function levels() {
    if (!meter) return null;
    const d = new Float32Array(meter.fftSize);
    meter.getFloatTimeDomainData(d);
    let sum = 0, peak = 0;
    for (const v of d) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
    return { rms: Math.sqrt(sum / d.length), peak, state: ac.state };
  }
  return { init, play, sfx, update, thunder, toggleMusic, toggleSfx, levels, musicOn: () => musicOn, sfxOn: () => sfxOn };
})();

// ===== Interfaz: barra superior, herramientas, inspector, catálogo, herbario y menús =====
const UI = { tool: 'inspect', seed: null, care: 'compost', build: 'bed', moving: null, sel: null, recent: [], modal: null,

function renderTray() {

    }).join('') + `</div><p class="hint">${esc(T.build[UI.build][1])}</p>`;

      ${G.owned[i] ? `<em>✓ ${esc(T.yours)}</em>` : `<button class="btn small" data-buy="${i}">${esc(T.buy)} ${money(p.price)}</button>`}</div>`).join('') + `</div>`;

function trayClick(e) {

}

// ---------- Necesidades de una planta, explicadas ----------
const sunLabel = sp => (sp.sun[0] >= 6 ? L().sunFull : sp.sun[0] >= 3 ? L().sunPart : sp.sun[1] <= 4 ? L().sunShade : L().sunPart) + (sp.am ? ' · ' + L().amSun : '');
const waterLabel = sp => L().waterK[sp.water];
const drainLabel = sp => sp.water === 'aquatic' ? L().drainAq : sp.drain[0] >= 0.6 ? L().drainFast : sp.drain[1] <= 0.66 ? L().drainWet : L().drainMid;
function soilName(t) {
  if (t.t === 'water') return L().soilK.water;
  if (t.drain >= 0.8) return L().soilK.sandy;
  if (t.drain <= 0.3) return L().soilK.clay;
  if (t.org >= 0.65 && t.ph < 6) return L().soilK.peat;
  return t.org >= 0.5 ? L().soilK.rich : L().soilK.loam;
}
const pct = v => Math.round(v * 100) + '%';
const deg = v => (v < 0 ? '−' : '') + Math.abs(Math.round(v)) + ' °C';
const bloomText = sp => sp.bloom ? L().seasonRange(sp.bloom) : L().noBloom;

function needRows(sp, t, p) {
  const T = L(), w = G.w, f = p && p.fac ? p.fac : evaluate(sp, t, p, w, !p), rows = [];
  const st = v => (v >= 0.95 ? 2 : v >= 0.72 ? 1 : 0);
  rows.push({ i: '☀️', n: T.need.light, v: T.hoursSun(t.sun.toFixed(1), t.sunAm.toFixed(1), t.sunPm.toFixed(1)), ideal: `${sp.sun[0]}–${sp.sun[1]} h · ${sunLabel(sp)}`, s: st(f.light),
    h: f.lightLow ? T.hint.lightLow : f.lightHigh ? T.hint.lightHigh : '' });
  if (sp.water === 'aquatic') rows.push({ i: '💧', n: T.need.water, v: t.t === 'water' ? T.inPond : T.notPond, ideal: waterLabel(sp), s: st(f.water), h: f.water < 0.9 ? T.hint.aquatic : '' });
  else rows.push({ i: '💧', n: T.need.water, v: t.t === 'water' ? T.inPond : T.moistV(pct(t.moist)), ideal: `${pct(WATER[sp.water][0])}–${pct(Math.min(1, WATER[sp.water][1]))} · ${waterLabel(sp)}`, s: st(f.water),
    h: f.dry ? T.hint.dry : f.wet ? T.hint.wet : '' });
  if (sp.water !== 'aquatic') {
    rows.push({ i: '🪨', n: T.need.soil, v: `${soilName(t)} · ${T.drainV(pct(t.drain))}`, ideal: drainLabel(sp), s: st(f.drain), h: f.drain < 0.95 ? (t.drain < sp.drain[0] ? T.hint.heavy : T.hint.loose) : '' });
    rows.push({ i: '🧪', n: T.need.ph, v: t.ph.toFixed(1), ideal: `${sp.ph[0].toFixed(1)}–${sp.ph[1].toFixed(1)}`, s: st(f.ph), h: f.ph < 0.95 ? (t.ph > sp.ph[1] ? T.hint.alkaline : T.hint.acid) : '' });
  }
  rows.push({ i: '🌿', n: T.need.feed, v: pct(t.fert), ideal: T.feedK[sp.feed], s: sp.carniv && f.feed < 1 ? 0 : f.rich ? 1 : st(f.feed),
    h: sp.carniv && f.feed < 1 ? T.hint.carniv : f.rich ? T.hint.rich : f.feed < 0.95 ? T.hint.hungry : '' });
  rows.push({ i: '🌡️', n: T.need.temp, v: t.pot || t.gh ? `${deg(nightMin(t, p, w))} / ${deg(dayMax(t, w))}` : `${deg(w.tmin)} / ${deg(w.tmax)}`, ideal: T.hardy(deg(sp.minT)) + (sp.maxT < 34 ? ' · ' + T.heatMax(deg(sp.maxT)) : ''),
    s: f.coldRisk || (G.wNext && nightMin(t, p, G.wNext) < sp.minT) ? 0 : f.heat < 0.95 ? 1 : 2,
    h: (G.wNext && nightMin(t, p, G.wNext) < sp.minT - (p && p.dorm ? 4 : 0)) ? T.hint.frostSoon(deg(G.wNext.tmin)) : f.heat < 0.95 ? T.hint.heat : sp.minT > 5 && !t.gh && !t.pot ? T.hint.tender : '' });
  if (sp.hum) rows.push({ i: '💨', n: T.need.hum, v: pct(ambientHum(t, w)), ideal: '≥ ' + pct(sp.hum), s: st(f.hum), h: f.hum < 0.95 ? T.hint.hum : '' });
  if (f.jug < 1) rows.push({ i: '🌰', n: T.need.special, v: T.juglone, ideal: '', s: 0, h: T.hint.juglone });
  if (p && p.pests) rows.push({ i: '🐛', n: T.need.special, v: T.pestK[spOf(p).pests || 'aphid'], ideal: '', s: 0, h: T.hint.pests });
  if (t.weeds > 0.5) rows.push({ i: '🌾', n: T.need.special, v: T.weedsV, ideal: '', s: 1, h: T.hint.weeds });
  if (f.compNames && f.compNames.length) rows.push({ i: '🤝', n: T.need.comp, v: f.compNames.map(id => spName(SP[id])).join(', '), ideal: '+' + Math.round((f.comp - 1) * 100) + '%', s: 2, h: '' });
  if (p && needsPrune(p)) rows.push({ i: '✂️', n: T.need.prune, v: T.pruneLate, ideal: '', s: 1, h: T.hint.prune(L().seasonRange(sp.prune)) });
  if (sp.chill && p && !p.dorm) rows.push({ i: '🧊', n: T.need.chill, v: `${Math.round(p.chill)} h`, ideal: `${sp.chill} h`, s: p.chill >= sp.chill ? 2 : 1, h: p.chill >= sp.chill ? '' : T.hint.chill(sp.chill) });
  return rows;
}

function stageText(p) {
  const T = L(), sp = spOf(p);
  if (p.dead) return T.stage.dead;
  if (p.dorm) return T.stage.dorm;
  if (p.fruit >= 1) return T.stage.fruit;
  if (p.bloom > 0.5) return T.stage.bloom;
  if (p.g < 0.12) return sp.start === 0 ? T.stage.seed : T.stage.sprout;
  if (p.g < 0.6) return T.stage.young;
  if (p.g < 1) return T.stage.growing;
  return T.stage.adult;
}

// ---------- Inspector ----------
function selectTile(x, y, plant) {

}
function closeInspector() { UI.sel = null; R.sel = null; $('#inspector').hidden = true; }
function refreshInspector(force) {

// ---------- Guía de los primeros pasos: señala qué tocar ----------
function coachTarget() {
  if (UI.title || G.goal >= 6 || !GOALS[G.goal]) return null;
  const C = L().coach, open = !!UI.modal, ui = (sel, text) => ({ sel, text });
  switch (GOALS[G.goal].id) {
    case 'lens': return open ? null : ui('[data-lens="light"]', C.lens);
    case 'plant':
      if (open) return null;
      if (UI.tool !== 'plant' || !UI.seed) return ui('[data-tool="plant"]', C.plantTool);
      return { tiles: G.tiles.filter(t => t.own && t.t === 'bed' && !t.plant), text: C.plantBed };
    case 'water':
      if (open) return null;
      if (UI.tool !== 'water') return ui('[data-tool="water"]', C.waterTool);
      return { tiles: G.plants.filter(p => !p.dead && tileAt(p.x, p.y).own && tileAt(p.x, p.y).t !== 'water').map(p => tileAt(p.x, p.y)), text: C.waterBed };
    case 'open':
      if (UI.modal && UI.modal.kind === 'visits') return ui('[data-toggle="1"]', C.openBtn);
      return open ? null : ui('[data-open="visits"]', C.visits);
    case 'rose': {
      const rose = G.plants.find(p => p.sp === 'rose' && !p.dead);
      if (open || !rose) return null;
      if (UI.tool !== 'move') return ui('[data-tool="move"]', C.moveTool);
      if (!UI.moving) return { tiles: [tileAt(rose.x, rose.y)], text: C.rose };
      return { tiles: G.tiles.filter(t => t.own && t.t === 'bed' && !t.plant && t.sun >= 6), text: C.roseDest };
    }
    case 'beds':
      if (open) return null;
      if (UI.tool !== 'build') return ui('[data-tool="build"]', C.buildTool);
      if (UI.build !== 'bed') return ui('[data-build="bed"]', C.bedItem);
      return null;
  }
  return null;
}
function updateCoach() {
  const el = $('#coach'), c = coachTarget();
  R.coach = c && c.tiles ? c.tiles.slice(0, 60) : null;
  let x, y, w, h;
  if (c && c.sel) {
    const t = document.querySelector(c.sel), r = t && t.getBoundingClientRect();
    if (r && r.width) { x = r.left; y = r.top; w = r.width; h = r.height; }
  } else if (c && c.tiles && c.tiles.length) {
    const [sx, sy] = P(c.tiles[0].x + 0.5, c.tiles[0].y + 0.5);
    x = sx - 22; y = sy - 14; w = 44; h = 28;
  }
  if (x === undefined) { el.hidden = true; return; }
  el.hidden = false;
  const ring = el.firstElementChild, tag = el.lastElementChild;
  ring.style.cssText = c.sel ? `left:${x - 6}px;top:${y - 6}px;width:${w + 12}px;height:${h + 12}px` : 'display:none';
  if (tag.textContent !== c.text) tag.textContent = c.text;
  const below = y < VH * 0.5, tw = Math.min(260, VW - 24);
  const lx = clamp(x + w / 2 - tw / 2, 12, VW - tw - 12);
  tag.className = 'tag ' + (below ? 'down' : 'up');
  tag.style.cssText = `left:${lx}px;width:${tw}px;${below ? `top:${y + h + 14}px` : `bottom:${VH - y + 14}px`};--ax:${clamp(x + w / 2 - lx, 16, tw - 16)}px`;
}

// ---------- Avisos ----------
function toast(msg, type = 'info') {
  const box = $('#toasts'), el = document.createElement('div');
  el.className = 'toast t-' + type; el.innerHTML = msg;
  box.prepend(el);
  while (box.children.length > 4) box.lastChild.remove();
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 400); }, type === 'goal' ? 6000 : 4200);
}
// Mensajes que vienen de la simulación
const NEWS_SEEN = new Set();
function news(kind, d) {
  if (UI.title) return;
  // el mismo aviso (por ejemplo, diez caléndulas que terminan su ciclo) se muestra una vez por día
  if (d.sp && kind !== 'herb') {
    const key = G.day + kind + d.sp;
    if (NEWS_SEEN.has(key)) return;
    if (NEWS_SEEN.size > 200) NEWS_SEEN.clear();
    NEWS_SEEN.add(key);
  }
  const T = L(), name = d.sp ? spName(SP[d.sp]) : '';
  const msg = {
    frost: () => [T.news.frost(d.n, deg(d.t)), 'bad'], cycle: () => [T.news.cycle(name), 'info'], died: () => [T.news.died(name), 'bad'],
    pest: () => [T.news.pest(name, T.pestK[d.k]), 'bad'], herb: () => [T.news.herb(name), 'good'], star: () => [T.news.star(d.n), 'goal'],
    order: () => [T.news.order(d.n, name), 'info'], orderLost: () => [T.news.orderLost, 'bad'], forecast: () => [d.text, d.type],
    contestSoon: () => [T.news.contestSoon, 'info'], contestJury: () => [T.news.contestJury, 'info'],
    contestWin: () => [T.news.contestWin(d.place, d.prize), 'goal'], contestNone: () => [T.news.contestNone, 'info']

  if (!msg) return;
  const [m, type] = msg();
  toast(m, type);
  if (kind === 'star') { Sound.sfx.fanfare(); renderTray(); }
}

// ===== Bucle principal: el paso del tiempo, el control con mouse, teclado y pantalla táctil =====
const DAY_H_SEC = 3.5, NIGHT_H_SEC = 0.5;   // segundos reales por hora del juego (las noches pasan rápido)
const hourSeconds = h => (h >= 6 && h < 20.5 ? DAY_H_SEC : NIGHT_H_SEC);
const COVER = /[?&]cover\b/.test(location.search);
let lastLight = 0;

// ---------- El tiempo ----------
function advanceTime(dtReal) {
  let rem = dtReal * G.speed, dtH = 0;
  while (rem > 0) {
    const hs = hourSeconds(G.hour), toNext = (Math.floor(G.hour) + 1 - G.hour) * hs;
    if (rem < toNext) { G.hour += rem / hs; dtH += rem / hs; rem = 0; }
    else { dtH += toNext / hs; rem -= toNext; G.hour = Math.floor(G.hour) + 1; onHour(); }
  }
  return dtH;
}

function onHour() {
  if (G.hour >= 24) { G.hour -= 24; onNewDay(); }
  const h = Math.round(G.hour) % 24;
  hourTick(h);
  if (UI.title) return;
  if (h === OPEN_H && G.open) planVisitors();
  if (h === 17) forecast();
  // concurso de jardines del barrio: el jurado pasa a media mañana y da el resultado al atardecer
  if (G.day % DAYS_YEAR === CONTEST_DAY) {
    if (h === 10) { for (let i = 0; i < 3; i++) spawnVisitor(true, 'jury'); news('contestJury', {}); }
    if (h === 17) judgeContest();
  }
  if (h === CLOSE_H && G.open && G.today.visitors) toast(L().dailyReport(G.today.visitors, money(G.today.income)) + (G.today.water ? ' ' + L().waterBill(money(G.today.water)) : ''), 'info');
  if (UI.tool === 'water' && h % 3 === 0) renderTray();
  if (h % 2 === 0) updateBeauty();
  bumpVis();
  checkGoals();
  renderGoalCard();
}

function onNewDay() {
  dayTick();
  updateBeauty();
  updateRep();
  G.today = { visitors: 0, income: 0, sat: 0, satN: 0, harvest: 0 };
  G.day++;
  G.w = G.wNext;
  G.wNext = makeWeather((G.day + 1) % DAYS_YEAR, G.w, Math.random);
  computeLight();
  if (!UI.title) {
    const yd = G.day % DAYS_YEAR;
    if (yd % DAYS_SEASON === 0) toast(`${['🌷', '☀️', '🍂', '❄️'][seasonOf(yd)]} ${L().seasons[seasonOf(yd)]}`, 'goal');
    maybeNewOrder(); expireOrders();
    if (yd === CONTEST_DAY - 6) news('contestSoon', {});
    saveGame();
  }
  bumpVis();
}

// Pronóstico de la tarde: avisa de heladas, calor y lluvia
function forecast() {
  const n = G.wNext;
  if (n.tmin < 1) news('forecast', { text: L().forecastFrost(deg(n.tmin)), type: 'bad' });
  else if (n.heat) news('forecast', { text: L().forecastHeat(deg(n.tmax)), type: 'bad' });
  else if (n.rain > 0 && !G.w.rain) news('forecast', { text: L().forecastRain, type: 'info' });
}

// ---------- Herramientas sobre el mapa ----------
const PAINT = { water: 1, plant: 1, care: 1, harvest: 1, remove: 1 };
function toolTile(sx, sy) {
  const [wx, wy] = screenToWorld(sx, sy);
  let x = Math.floor(wx), y = Math.floor(wy);
  if (UI.tool === 'build') { const b = BUILD[UI.build]; x -= Math.floor(((b.w || 1) - 1) / 2); y -= Math.floor(((b.h || 1) - 1) / 2); }
  return [x, y];
}
function useTool(sx, sy, first) {
  const [x, y] = toolTile(sx, sy), t = tileAt(x, y);
  // primero la planta que está en la casilla tocada; si no hay, la copa de un árbol que la tape
  const picked = ['inspect', 'harvest', 'move'].includes(UI.tool) && !(UI.tool === 'move' && UI.moving) ? (t && t.plant) || pickPlant(sx, sy) : null;
  switch (UI.tool) {
    case 'inspect':
      if (!first) break;
      if (t && t.t === 'house' && !picked) { openHouse(); break; }
      if (picked) selectTile(picked.x, picked.y, picked); else if (t) selectTile(x, y); else closeInspector();
      break;
    case 'water': actWater(x, y, G.hose ? 1 : 0); break;
    case 'plant': if (!UI.seed) { if (first) openCatalog(); } else if (t && !t.plant) actPlant(UI.seed, x, y); else if (first && t && t.plant) selectTile(x, y); break;
    case 'harvest': { const p = picked || (t && t.plant); if (p) actHarvest(p); break; }
    case 'care': actCare(UI.care, x, y); break;
    case 'build': if (first || BUILD[UI.build].tile || UI.build === 'shade') actBuild(UI.build, x, y); break;
    case 'move':
      if (!first) break;
      if (!UI.moving) { const p = picked || (t && t.plant); if (p && !p.dead && tileAt(p.x, p.y).own) { UI.moving = p; R.sel = p; renderTray(); Sound.sfx.click(); } }
      else if (t && t.t === 'house') openHouse();
      else if (actTransplant(UI.moving, x, y)) { const p = UI.moving; UI.moving = null; renderTray(); selectTile(p.x, p.y, p); }
      break;
    case 'remove': if (first || !(t && t.plant)) actRemove(x, y); break;
    case 'land': if (first && t && !G.owned[t.parcel]) confirmBuy(t.parcel); break;
  }
  if (UI.sel && UI.tool !== 'inspect') refreshInspector(true);
  renderHUD();
}

function updateHover(sx, sy) {
  if (UI.title) { R.hover = null; return; }
  const [x, y] = toolTile(sx, sy), t = tileAt(x, y), tip = $('#tip');
  if (!t) { R.hover = null; tip.hidden = true; return; }
  const b = UI.tool === 'build' ? BUILD[UI.build] : null;
  R.hover = { x, y, w: b ? b.w || 1 : 1, h: b ? b.h || 1 : 1, bad: false };
  let html = '';
  if (UI.tool === 'plant' && UI.seed) {
    const sp = SP[UI.seed];
    if (canPlantHere(sp, t)) {
      const f = evaluate(sp, t, null, G.w, true), v = Math.round(f.cond * 100);
      const issues = [];
      if (f.light < 0.9) issues.push(f.lightLow ? '☀️ ' + L().hint.lightLow : '☀️ ' + L().hint.lightHigh);
      if (f.drain < 0.9) issues.push('🪨 ' + (t.drain < sp.drain[0] ? L().hint.heavy : L().hint.loose));
      if (f.ph < 0.9) issues.push('🧪 ' + (t.ph > sp.ph[1] ? L().hint.alkaline : L().hint.acid));
      if (f.hum < 0.9) issues.push('💨 ' + L().hint.hum);
      if (f.cold < 1) issues.push('❄️ ' + L().hint.tender);
      if (f.jug < 1) issues.push('🌰 ' + L().hint.juglone);
      if (f.water < 0.9) issues.push('💧 ' + L().waterK[sp.water]);
      html = `<b>${esc(spName(sp))}</b> · <span class="${v > 80 ? 'ok' : v > 55 ? 'mid' : 'bad'}">${v}%</span>` + issues.slice(0, 3).map(i => `<small>${esc(i)}</small>`).join('');
      R.hover.bad = v <= 55;
    } else { R.hover.bad = true; html = `<small>${esc(!t.own ? L().notYours : t.plant ? L().occupied : sp.water === 'aquatic' ? L().needPond : L().needBed)}</small>`; }
  } else if (UI.tool === 'build') {
    const err = canBuild(UI.build, x, y);
    R.hover.bad = !!err && err !== L().already;
    html = `<b>${esc(L().build[UI.build][0])}</b> · ${money(b.cost)}` + (err ? `<small>${esc(err)}</small>` : '');
  } else if (UI.tool === 'land') {
    if (R.preview) R.preview.hover = t.own ? -1 : t.parcel;
    if (!t.own) html = `<b>${esc(L().parcels[t.parcel])}</b> · ${money(PARCELS[t.parcel].price)}<small>${esc(L().parcelDesc[t.parcel])}</small>`;
  } else if (UI.tool === 'care') {
    html = `<b>${esc(L().care[UI.care][0])}</b>${CARE[UI.care].cost ? ' · ' + money(CARE[UI.care].cost) : ''}`;
  } else if (UI.tool === 'move' && UI.moving) {
    const sp = spOf(UI.moving);
    if (canPlantHere(sp, t)) { const v = Math.round(evaluate(sp, t, null, G.w, true).cond * 100); html = `<b>${esc(spName(sp))}</b> · <span class="${v > 80 ? 'ok' : v > 55 ? 'mid' : 'bad'}">${v}%</span>`; }
    else R.hover.bad = true;
  } else if (UI.tool === 'inspect' || UI.tool === 'harvest') {
    const p = t.plant || pickPlant(sx, sy);
    if (p) html = `<b>${esc(spName(spOf(p)))}</b> · ${esc(stageText(p))}${canHarvest(p) ? ' · 🧺' : ''}`;
  }
  if (html) { tip.innerHTML = html; tip.hidden = false; tip.style.left = Math.min(sx + 16, VW - 260) + 'px'; tip.style.top = (sy + 18) + 'px'; }
  else tip.hidden = true;
}

// ---------- Mouse y pantalla táctil ----------
const ptr = { down: false, btn: 0, sx: 0, sy: 0, lx: 0, ly: 0, moved: false, pan: false, last: '', touches: new Map(), pinch: 0 };
let spaceDown = false;
function bindInput() {
  canvas.addEventListener('contextmenu', e => e.preventDefault());
  canvas.addEventListener('pointerdown', e => {
    Sound.init();
    canvas.setPointerCapture(e.pointerId);
    ptr.touches.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptr.touches.size === 2) { ptr.pan = true; ptr.pinch = touchDist(); return; }
    Object.assign(ptr, { down: true, btn: e.button, sx: e.clientX, sy: e.clientY, lx: e.clientX, ly: e.clientY, moved: false, last: '' });
    ptr.pan = e.button === 1 || e.button === 2 || spaceDown || UI.title;
    if (!ptr.pan && UI.tool !== 'inspect' && !UI.title) applyAt(e.clientX, e.clientY, true);
  });
  canvas.addEventListener('pointermove', e => {
    if (ptr.touches.has(e.pointerId)) ptr.touches.set(e.pointerId, [e.clientX, e.clientY]);
    if (ptr.touches.size === 2) {
      const d = touchDist(), [cx, cy] = touchMid();
      if (ptr.pinch) zoomAt(d / ptr.pinch, cx, cy);
      ptr.pinch = d;
      cam.x += (cx - ptr.lx) * (ptr.lx ? 1 : 0); cam.y += (cy - ptr.ly) * (ptr.ly ? 1 : 0);
      ptr.lx = cx; ptr.ly = cy; clampCam();
      return;
    }
    if (!ptr.down) { updateHover(e.clientX, e.clientY); return; }
    const dx = e.clientX - ptr.lx, dy = e.clientY - ptr.ly;
    if (Math.hypot(e.clientX - ptr.sx, e.clientY - ptr.sy) > 6) ptr.moved = true;
    if (ptr.pan || (UI.tool === 'inspect' && ptr.moved)) { ptr.pan = true; cam.x += dx; cam.y += dy; clampCam(); $('#tip').hidden = true; }
    else if (PAINT[UI.tool] || (UI.tool === 'build' && (BUILD[UI.build].tile || UI.build === 'shade'))) applyAt(e.clientX, e.clientY, false);
    ptr.lx = e.clientX; ptr.ly = e.clientY;
    updateHover(e.clientX, e.clientY);
  });
  const up = e => {
    ptr.touches.delete(e.pointerId);
    if (ptr.touches.size) { ptr.lx = 0; ptr.ly = 0; return; }
    if (ptr.down && !ptr.pan && !ptr.moved && UI.tool === 'inspect' && !UI.title) applyAt(e.clientX, e.clientY, true);
    ptr.down = false; ptr.pan = false; ptr.pinch = 0;
  };
  canvas.addEventListener('pointerup', up);
  canvas.addEventListener('pointercancel', up);
  canvas.addEventListener('pointerleave', () => { if (!ptr.down) { R.hover = null; $('#tip').hidden = true; } });
  canvas.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); updateHover(e.clientX, e.clientY); }, { passive: false });

  addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    Sound.init();
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat && !UI.title) setSpeed(0); spaceDown = true; return; }
    if (e.code === 'Escape') {
      if (UI.modal) closeModal();
      else if (UI.moving) { UI.moving = null; renderTray(); }
      else if (UI.sel) closeInspector();
      else if (R.lens) { R.lens = null; renderLensBar(); }
      return;
    }
    if (UI.title || UI.modal) return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= TOOLS.length) { setTool(TOOLS[n - 1].id); return; }
    if (e.code === 'KeyL') { R.lens = R.lens === 'light' ? null : 'light'; if (R.lens) G.stats.lens = (G.stats.lens || 0) + 1; renderLensBar(); }
    if (e.code === 'KeyQ' || e.code === 'KeyE') { rotateView(e.code === 'KeyQ' ? -1 : 1); renderLensBar(); }
    if (e.key === '+' || e.key === '=') zoomAt(1.15, VW / 2, VH / 2);
    if (e.key === '-') zoomAt(1 / 1.15, VW / 2, VH / 2);
    keysDown.add(e.code);
  });
  addEventListener('keyup', e => { keysDown.delete(e.code); if (e.code === 'Space') spaceDown = false; });
  addEventListener('blur', () => keysDown.clear());
  document.addEventListener('visibilitychange', () => { if (document.hidden && !UI.title && !COVER) saveGame(); });
  addEventListener('beforeunload', () => { if (!UI.title && !COVER) saveGame(); });
}
const keysDown = new Set();
const touchDist = () => { const [a, b] = [...ptr.touches.values()]; return Math.hypot(a[0] - b[0], a[1] - b[1]); };
const touchMid = () => { const [a, b] = [...ptr.touches.values()]; return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; };
function applyAt(sx, sy, first) {
  const [x, y] = toolTile(sx, sy), key = x + ',' + y;
  if (!first && key === ptr.last) return;
  ptr.last = key;
  useTool(sx, sy, first);
}
function panKeys(dt) {
  const v = 520 * dt;
  if (keysDown.has('ArrowLeft') || keysDown.has('KeyA')) cam.x += v;
  if (keysDown.has('ArrowRight') || keysDown.has('KeyD')) cam.x -= v;
  if (keysDown.has('ArrowUp') || keysDown.has('KeyW')) cam.y += v;
  if (keysDown.has('ArrowDown') || keysDown.has('KeyS')) cam.y -= v;
  if (keysDown.size) clampCam();
}

// ---------- Jardín de muestra (pantalla de título y portada) ----------
function demoGarden(climate) {
  newGarden(4242, climate);
  G.owned = G.owned.map(() => true);
  for (const t of G.tiles) t.own = true;
  G.day = 8; G.hour = 17.6; G.open = true; G.rep = 4.2; G.repMax = 4.2;
  G.w = { yd: 8, anom: 0, rain: 0, cloud: 0.12, heat: false, frost: false, storm: false, tmax: 25, tmin: 11, hum: 0.5, kind: 'sun' };
  G.wNext = { ...G.w };
  const bed = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const t = tileAt(x, y); if (t && t.t !== 'water' && !t.plant && !t.obj) t.t = 'bed'; } };
  const path = (x0, y0, x1, y1) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const t = tileAt(x, y); if (t && !t.plant && t.t !== 'water') t.t = 'path'; } };
  const put = (id, x, y, ph) => {
    const t = tileAt(x, y);
    if (!t || t.plant || t.obj) return;
    if (SP[id].water !== 'aquatic' && t.t !== 'water') t.t = 'bed';
    if (ph) t.ph = ph;
    const p = addPlant(id, x, y, { g: 1, hp: 100 });
    const sp = SP[id];
    p.bloom = sp.bloom && inWindow(8, sp.bloom) ? 1 : 0; p.fruit = sp.fruit && inWindow(8, sp.fruit) ? 1 : 0; p.chill = 9999;
    p.dorm = isDormant(sp, 8);
  };
  for (const p of [...G.plants]) if (p.sp === 'rose' && p.old) { removePlant(p); }
  // caminos
  path(3, 12, 23, 12); path(16, 4, 16, 11); path(9, 2, 15, 2); path(16, 2, 16, 3);
  // frente de la casa: rosas, lavandas y peonías
  [['rose', 1, 6], ['rose', 2, 7], ['peony', 1, 7], ['lavender', 2, 6], ['foxglove', 1, 8]].forEach(a => put(...a));
  for (let y = 9; y <= 16; y++) { put(y % 2 ? 'lavender' : 'rose', 2, y); put(['iris', 'poppy', 'agapanthus', 'echinacea'][y % 4], 1, y); }
  for (let x = 4; x <= 9; x++) { put(['peony', 'iris', 'sweetpea', 'poppy', 'daisy', 'dianthus'][x % 6], x, 10); put(['lavender', 'salvia', 'calendula', 'cosmos'][x % 4], x, 11); }
  [['tomato', 4, 14], ['tomato', 5, 14], ['lettuce', 4, 15], ['lettuce', 5, 15], ['strawberry', 4, 16], ['strawberry', 5, 16], ['basil', 6, 15], ['tagetes', 6, 14], ['nasturtium', 6, 16]].forEach(a => put(...a));
  put('jacaranda', 9, 15);
  // lomita soleada: jardín mediterráneo
  for (let x = 10; x <= 16; x++) for (let y = 13; y <= 17; y++) put(['lavender', 'rosemary', 'poppy', 'iris', 'agapanthus', 'stipa', 'thyme'][(x * 3 + y * 5) % 7], x, y);
  for (let x = 10; x <= 15; x++) put(['zinnia', 'cosmos', 'sunflower', 'dahlia', 'alstroemeria', 'petunia'][x % 6], x, 11);
  // rincón de la vertiente: estanque grande con flores acuáticas y una pérgola con glicina
  for (const [x, y] of [[12, 4], [12, 5], [13, 5], [14, 5], [15, 3], [15, 5], [13, 6], [14, 6]]) tileAt(x, y).t = 'water';
  [['waterlily', 13, 4], ['waterlily', 14, 5], ['lotus', 13, 5], ['waterlily', 12, 5], ['lotus', 14, 6], ['waterlily', 15, 3]].forEach(a => put(...a));
  [['papyrus', 12, 3], ['yellowiris', 11, 4], ['calla', 11, 5], ['yellowiris', 12, 6], ['calla', 15, 6], ['papyrus', 15, 7], ['hosta', 11, 6]].forEach(a => put(...a));
  addStruct('pergola', 10, 7); put('wisteria', 12, 8); put('jasmine', 10, 9);
  addStruct('bench', 11, 8);
  // pedregal y el invernadero
  [['agave', 18, 14], ['barrel', 20, 13], ['echeveria', 21, 13], ['aloe', 22, 15], ['sempervivum', 20, 16], ['barrel', 22, 13], ['echeveria', 18, 16], ['aloe', 17, 15], ['opuntia', 23, 16], ['stipa', 19, 13], ['sempervivum', 21, 17]].forEach(a => put(...a));
  addStruct('greenhouse', 18, 9);
  [['orchid', 18, 9], ['anthurium', 19, 9], ['monstera', 20, 9], ['calathea', 21, 9], ['hibiscus', 18, 10], ['orchid', 19, 10], ['strelitzia', 21, 10], ['anthurium', 20, 11], ['orchid', 18, 11]].forEach(a => put(...a));
  // bosquecito
  [['camellia', 18, 2, 5.2], ['azalea', 19, 3, 5.2], ['hydrangea', 22, 6, 5.0], ['hydrangea', 23, 5, 5.0], ['hosta', 18, 6], ['hosta', 19, 7], ['fern', 20, 7], ['fern', 22, 7], ['foxglove', 21, 2], ['foxglove', 23, 2], ['hellebore', 18, 4], ['cherry', 23, 8], ['magnolia', 17, 0]].forEach(a => put(...a));
  // detalles
  addStruct('fountain', 13, 9); addStruct('lantern', 15, 12); addStruct('lantern', 8, 12); addStruct('bench', 6, 12); addStruct('birdbath', 4, 13);
  addStruct('statue', 23, 11); addStruct('beehive', 9, 14); addStruct('sundial', 13, 15); addStruct('gnome', 7, 16);
  for (const t of G.tiles) { t.moist = t.t === 'water' ? 1 : t.t === 'bed' ? 0.55 : 0.5; t.weeds = 0; resetMoistStats(t); }
  computeLight(); updateBeauty();
  for (const p of G.plants) { p.fac = evaluate(spOf(p), tileAt(p.x, p.y), p, G.w, false); p.cond = 1; }
  bumpVis();
}

// ---------- Cuadro a cuadro ----------
let last = performance.now(), hudT = 0, inspT = 0, titleT = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  let dtH = 0;
  if (COVER) { /* la portada queda quieta */ }
  else if (UI.title) {
    titleT += dt;
    G.hour += dt * 0.05;
    if (G.hour >= 21) G.hour = 7;
    cam.x -= dt * 6 * cam.z;
    if (titleT > 50) { titleT = 0; centerTitle(); }
    dtH = dt * 0.25;
  } else if (!UI.paused && !UI.modal) dtH = advanceTime(dt);
  if (!COVER) {
    panKeys(dt);
    updateVisitors(dtH, dt);
    updateFx(dt);
    Sound.update(dt);
    if (G.lightDirty && now - lastLight > 300) { computeLight(); lastLight = now; bumpVis(); }
  }
  drawWorld(dt);
  if (!UI.title && !COVER) {
    hudT -= dt; inspT -= dt;
    if (hudT <= 0) { hudT = 0.25; renderHUD(); updateCoach(); }
    if (inspT <= 0) { inspT = 1; if (UI.sel) refreshInspector(); }
  }
  // la portada se dibuja unas pocas veces y queda quieta (así se puede fotografiar)
  if (COVER && ++coverFrames > 3) {
    // deja la imagen en la página para poder guardarla como portada
    const pre = document.createElement('pre');
    pre.id = 'coverdata'; pre.hidden = true; pre.textContent = canvas.toDataURL('image/png');
    document.body.appendChild(pre);
    document.title = 'cover-ready';
    return;
  }
  requestAnimationFrame(frame);
}
let coverFrames = 0;
function centerTitle() { centerOn(13, 8, Math.min(VW / 1500, VH / 800) * 1.35); }

function boot() {
  initRender();
  demoGarden(COVER ? new URLSearchParams(location.search).get('cl') : undefined);
  buildUI();
  bindInput();
  if (COVER) {
    document.body.classList.add('cover');
    centerOn(11.4, 7.4, Math.min(VW / 1320, VH / 740));
    // parámetros para probar otras horas, estaciones y vistas: ?cover&h=12&d=40&z=0.6&rot=2
    const q = new URLSearchParams(location.search);
    if (q.get('h')) G.hour = +q.get('h');
    if (q.get('d')) { G.day = +q.get('d'); bumpVis(); for (const p of G.plants) { const sp = spOf(p); p.dorm = isDormant(sp, G.day % DAYS_YEAR); p.bloom = sp.bloom && inWindow(G.day % DAYS_YEAR, sp.bloom) ? 1 : 0; } computeLight(); }
    if (q.get('rot')) { cam.rot = +q.get('rot') & 3; centerOn(11.4, 7.4); }
    if (q.get('z')) centerOn(11.5, 9.6, +q.get('z'));
    if (q.get('rain')) Object.assign(G.w, { rain: 16, cloud: 0.92, kind: 'rain' });
    if (q.get('frost')) Object.assign(G.w, { tmin: -3 });
    // algunos visitantes paseando por el jardín
    const spots = [[3, 9, 1], [7, 12, -1], [11, 12, 1], [16, 9, -1], [16, 5, 1], [12, 2, 1], [20, 12, -1], [3, 15, -1], [14, 12, 1]];
    spots.forEach(([x, y, d]) => {
      const v = spawnVisitor(true);
      Object.assign(v, { x: x + 0.5, y: y + 0.5, state: 'look', fx: d, fy: -d, wait: 99, paid: true, moving: false });
    });
    for (let i = 0; i < 3; i++) drawWorld(0.016);
  } else {
    showTitle();
    centerTitle();
    G.hour = 8;
  }
  requestAnimationFrame(frame);
}
boot();

</script>
