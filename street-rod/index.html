<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Rod: Verano del 63</title>
<meta name="description" content="Compra un auto en el diario, ármalo en tu garaje y corre picadas en el verano de 1963. / Buy a car from the paper, build it in your garage and drag race in the summer of 1963.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  :root {
    --cream: #fbf4e2; --cream2: #efe2c0; --ink: #2b1d14; --muted: #7a6650; --red: #c8322a; --red-d: #8a1c16; --teal: #2a9d8f; --teal-d: #1d6e64;
    --gold: #e8b030; --night: rgba(16, 12, 24, 0.82); --line: rgba(43, 29, 20, 0.18);
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
    --display: "Arial Black", "Helvetica Neue", Impact, sans-serif; --script: "Brush Script MT", "Snell Roundhand", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; color: var(--ink); font: 15px/1.35 var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; box-shadow: 0 0 80px rgba(0, 0, 0, 0.8); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }

  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 999px; font-weight: 800; letter-spacing: 0.3px;
    background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-d), 0 6px 14px rgba(0, 0, 0, 0.3); transition: transform 0.08s, filter 0.15s; text-transform: uppercase; font-size: 14px; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-d); }
  .btn.teal { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d), 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.gold { background: var(--gold); color: #3a2400; box-shadow: 0 4px 0 #a67814, 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.ghost { background: var(--cream); color: var(--ink); box-shadow: 0 4px 0 #b9a47a, 0 6px 14px rgba(0, 0, 0, 0.25); }
  .btn.dark { background: #2a2230; color: #f2ecd8; box-shadow: 0 4px 0 #120e16, 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.small { padding: 5px 12px; font-size: 12px; box-shadow: 0 3px 0 var(--red-d); }
  .btn.small.teal { box-shadow: 0 3px 0 var(--teal-d); } .btn.small.ghost { box-shadow: 0 3px 0 #b9a47a; } .btn.small.dark { box-shadow: 0 3px 0 #120e16; }
  .btn.big { padding: 14px 28px; font-size: 18px; }

  .panel { position: relative; background: linear-gradient(var(--cream), var(--cream2)); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25), 0 20px 40px rgba(0, 0, 0, 0.35); }
  .dim { position: absolute; inset: 0; background: rgba(6, 4, 10, 0.55); display: flex; align-items: center; justify-content: center; }
  .x { position: absolute; top: 10px; right: 12px; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--cream); font-size: 20px; font-weight: 900; }

  /* Barra de arriba */
  .topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .pill { pointer-events: auto; background: var(--night); color: #f6eedb; padding: 7px 14px; border-radius: 999px; font-weight: 800; display: flex; gap: 8px; align-items: center; border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
  .pill b { color: var(--gold); }
  .pill.money b { color: #8dffa6; }
  .grow { flex: 1; }
  .kingbar { display: inline-flex; gap: 2px; }

  /* Portada */
  .titlemenu { position: absolute; left: 92px; top: 270px; width: 330px; display: grid; gap: 14px; }
  .titlemenu .row { display: flex; gap: 10px; }
  .titlemenu .row .btn { flex: 1; font-size: 12px; padding: 8px 10px; }
  .credit { position: absolute; left: 92px; bottom: 26px; color: rgba(255, 230, 220, 0.6); font-size: 12px; }

  /* Licencia */
  .license { width: 640px; padding: 22px 26px; }
  .story { font: italic 16px/1.5 var(--serif); margin: 0 0 14px; color: #3b2a1c; }
  .story p { margin: 0 0 6px; }
  .card { position: relative; border-radius: 14px; background: linear-gradient(135deg, #f4f0e2, #dfe8e4); border: 2px solid #5a7a8a; padding: 0 0 14px; overflow: hidden; }
  .card .hd { background: linear-gradient(90deg, #1e4a7a, #2a6aa8); color: #fff; padding: 8px 16px; display: flex; justify-content: space-between; font: 900 15px var(--display); letter-spacing: 1px; }
  .card .bd { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 14px 16px 0; }
  .card img { width: 120px; height: 140px; border-radius: 8px; background: #2b3d5c; object-fit: cover; border: 2px solid #5a7a8a; }
  .card label { font-size: 11px; font-weight: 800; color: #5a7a8a; text-transform: uppercase; letter-spacing: 1px; }
  .card input { display: block; width: 100%; font: 900 26px var(--sans); border: 0; border-bottom: 2px solid #1e4a7a; background: transparent; padding: 4px 0; color: #1a2a3a; outline: none; text-transform: uppercase; user-select: text; -webkit-user-select: text; }
  .card .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 700; }
  .card .sig { font: 34px var(--script); color: #1a2a6a; margin-top: 8px; min-height: 40px; }
  .license .go { margin-top: 16px; display: flex; justify-content: flex-end; }

  /* Cómo se juega */
  .how { width: 760px; padding: 24px 28px; }
  .how h2, .modal h2 { font: italic 900 30px var(--display); margin: 0 0 12px; color: var(--red); }
  .how .rows { display: grid; gap: 10px; }
  .how .r { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
  .how .r span { font-size: 30px; line-height: 1; }
  .how .r b { display: block; font-size: 16px; }
  .how .r p { margin: 2px 0 0; color: #4a3828; font-size: 14px; }

  /* Garaje */
  .side { position: absolute; right: 14px; top: 64px; width: 330px; padding: 14px 16px; }
  .side h3 { margin: 0; font: italic 900 22px/1.1 var(--display); color: var(--red); }
  .side .sub { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 8px 0; }
  .stat small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .stat b { font-size: 18px; }
  .bars { display: grid; gap: 5px; margin: 10px 0 6px; }
  .bar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; }
  .bar i { height: 10px; border-radius: 6px; background: rgba(43, 29, 20, 0.15); overflow: hidden; display: block; }
  .bar i em { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4ab86a, #8de08a); }
  .bar i em.mid { background: linear-gradient(90deg, #e8a030, #f0c860); }
  .bar i em.low { background: linear-gradient(90deg, #c8322a, #ea6a4a); }
  .probs { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(200, 50, 42, 0.1); color: var(--red-d); font-size: 13px; font-weight: 700; }
  .probs div + div { margin-top: 3px; }
  .fixes { display: grid; gap: 6px; margin-top: 8px; }
  .actions { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; gap: 8px; justify-content: center; }
  .act { width: 128px; padding: 10px 6px 9px; border-radius: 16px; background: var(--night); color: #f6eedb; border: 1px solid rgba(255, 255, 255, 0.14); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform 0.1s, background 0.15s; }
  .act span { font-size: 26px; line-height: 1.1; }
  .act b { font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px; }
  .act small { font-size: 10.5px; opacity: 0.7; }
  .act:hover:not(:disabled) { background: rgba(40, 30, 50, 0.95); transform: translateY(-2px); }
  .act.hot { background: linear-gradient(180deg, #d9452c, #a3241c); border-color: #ffb08a; box-shadow: 0 0 18px rgba(255, 90, 60, 0.45); }
  .bubble { position: absolute; left: 330px; top: 430px; width: 360px; padding: 14px 18px; font-weight: 800; font-size: 17px; text-align: center; }
  .hint { position: absolute; left: 14px; top: 64px; max-width: 520px; padding: 8px 14px; border-radius: 12px; background: var(--night); color: #ffe6a8; font-weight: 700; font-size: 14px; }

  /* Diario */
  .paper { position: absolute; left: 28px; top: 18px; right: 28px; bottom: 18px; background: #f3ecd9; color: #1d1712; border-radius: 6px; padding: 16px 26px 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); background-image: radial-gradient(rgba(120, 100, 70, 0.08) 1px, transparent 1px); background-size: 4px 4px; transform: rotate(-0.3deg); display: flex; flex-direction: column; font-family: var(--serif); }
  .paper .mast { text-align: center; border-bottom: 3px double #1d1712; padding-bottom: 4px; }
  .paper .mast h1 { margin: 0; font: 900 46px/1 "Old English Text MT", "UnifrakturMaguntia", var(--serif); letter-spacing: 0.5px; }
  .paper .meta { display: flex; justify-content: space-between; font: 700 12px var(--sans); text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid #1d1712; margin-top: 6px; padding-top: 3px; }
  .paper .news { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; border-bottom: 2px solid #1d1712; padding: 6px 0 8px; }
  .paper .news h4 { margin: 0; font: 900 17px/1.15 var(--serif); }
  .paper .news .lead h4 { font-size: 22px; }
  .paper .tabs { display: flex; gap: 6px; margin: 8px 0; font-family: var(--sans); }
  .paper .tabs button { padding: 5px 14px; border: 2px solid #1d1712; border-radius: 4px; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  .paper .tabs button.on { background: #1d1712; color: #f3ecd9; }
  .paper .body { flex: 1; overflow: auto; min-height: 0; padding-right: 4px; }
  .ads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ad { border: 1.5px solid #1d1712; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; background: rgba(255, 255, 255, 0.25); }
  .ad.sold { opacity: 0.4; }
  .ad h5 { margin: 0; font: 900 15px var(--sans); text-transform: uppercase; letter-spacing: 0.5px; }
  .ad img { width: 100%; height: 86px; object-fit: contain; filter: sepia(0.25) contrast(1.05); }
  .ad p { margin: 0; font-size: 13px; line-height: 1.3; }
  .ad .price { font: 900 22px var(--sans); }
  .ad .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .ad .tel { font: 700 11px var(--sans); color: #4a3a2a; }
  .cols { display: grid; grid-template-columns: 1fr 1.25fr; gap: 16px; }
  .col h3 { margin: 0 0 6px; font: 900 18px var(--sans); letter-spacing: 1px; border-bottom: 2px solid #1d1712; display: flex; justify-content: space-between; align-items: center; }
  .col h3 small { font: 700 12px var(--sans); letter-spacing: 0; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dotted rgba(29, 23, 18, 0.4); font-size: 13.5px; }
  .item b { font-family: var(--sans); font-size: 13px; }
  .item small { display: block; color: #5a4a3a; font-size: 11.5px; }
  .item small.ok { color: #1d6e3a; font-weight: 700; } .item small.no { color: #a3241c; font-weight: 700; }
  .item .price { font: 900 15px var(--sans); min-width: 54px; text-align: right; }
  .toggle { display: inline-flex; border: 1.5px solid #1d1712; border-radius: 4px; overflow: hidden; }
  .toggle button { padding: 2px 8px; font: 800 11px var(--sans); }
  .toggle button.on { background: #1d1712; color: #f3ecd9; }

  /* Taller y pintura */
  .work { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 390px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .work h3 { margin: 0; font: italic 900 24px var(--display); color: var(--red); }
  .work .help { font-size: 12.5px; color: #4a3828; margin: 0; }
  .work .seg { display: flex; gap: 6px; }
  .work .seg button { flex: 1; padding: 7px; border-radius: 10px; border: 2px solid var(--ink); font-weight: 800; font-size: 13px; }
  .work .seg button.on { background: var(--ink); color: var(--cream); }
  .bench { flex: 1; overflow: auto; min-height: 0; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; background: rgba(255, 255, 255, 0.35); }
  .bench .item { font-family: var(--sans); }
  .tune { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; }
  .tune input { width: 100%; accent-color: var(--red); }
  .tune .ping { color: var(--red); }
  .dyno { width: 100%; height: 110px; border-radius: 10px; display: block; }
  .status { font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 10px; background: rgba(42, 157, 143, 0.15); color: var(--teal-d); }
  .status.bad { background: rgba(200, 50, 42, 0.12); color: var(--red-d); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .sw { height: 36px; border-radius: 10px; border: 2px solid rgba(0, 0, 0, 0.35); box-shadow: inset 0 8px 10px rgba(255, 255, 255, 0.35), inset 0 -8px 10px rgba(0, 0, 0, 0.25); }
  .sw.on { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sw.candy { background-image: radial-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1.5px); background-size: 5px 5px; }
  .mods { display: grid; gap: 4px; overflow: auto; min-height: 0; flex: 1; }
  .mod { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.4); font-size: 13px; }
  .mod small { display: block; color: var(--muted); font-size: 11.5px; }
  .label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

  /* Bencinera */
  .pump { position: absolute; left: 24px; top: 70px; display: flex; gap: 12px; align-items: center; }
  .hold { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff6a5a, #a3241c); color: #fff; font-weight: 900; font-size: 15px; border: 5px solid #f2ede0; box-shadow: 0 8px 0 #6a1410, 0 12px 30px rgba(0, 0, 0, 0.4); line-height: 1.15; padding: 10px; touch-action: none; }
  .hold.on { transform: translateY(6px); box-shadow: 0 2px 0 #6a1410; filter: brightness(1.15); }
  .gasinfo { padding: 12px 16px; min-width: 200px; font-weight: 800; }

  /* Mis autos */
  .modal { padding: 22px 26px; max-width: 1000px; }
  .garagecars { display: grid; grid-template-columns: repeat(3, 280px); gap: 14px; }
  .gc { border: 2px solid var(--line); border-radius: 14px; padding: 10px; background: rgba(255, 255, 255, 0.4); display: grid; gap: 4px; }
  .gc.on { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.25); }
  .gc img { width: 100%; height: 100px; object-fit: contain; }
  .gc b { font-size: 15px; }
  .gc small { color: var(--muted); font-weight: 700; }

  /* Drive-in */
  .rival { position: absolute; right: 18px; top: 62px; width: 450px; padding: 14px 16px; }
  .rival .who { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .rival img { width: 96px; height: 96px; border-radius: 50%; }
  .rival h3 { margin: 0; font: italic 900 24px/1.05 var(--display); color: var(--red); }
  .rival .car { font-weight: 800; color: #3b2a1c; }
  .rival .rec { font-size: 12px; color: var(--muted); font-weight: 700; }
  .say { margin: 12px 0 10px; padding: 10px 14px; border-radius: 14px; background: #fff; border: 2px solid var(--ink); font: italic 17px var(--serif); position: relative; }
  .say::before { content: ''; position: absolute; left: 34px; top: -12px; border: 10px solid transparent; border-bottom-color: var(--ink); border-top: 0; }
  .rival .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .choose { display: grid; gap: 8px; margin-top: 10px; }
  .choose .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .choose .opts button { padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, 0.5); }
  .choose .opts button.on { background: var(--ink); color: var(--cream); }
  .choose .opts button:disabled { opacity: 0.35; }
  .kingbanner { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: italic 900 56px var(--display); color: var(--gold); text-shadow: 0 0 20px rgba(255, 210, 60, 0.7), 0 4px 0 #6a4a00; pointer-events: none; }
  .clock { font-variant-numeric: tabular-nums; }

  /* Resultado */
  .result { width: 620px; padding: 22px 26px; text-align: center; }
  .result h2 { margin: 0; font: italic 900 46px var(--display); }
  .result h2.win { color: #1d8a4a; } .result h2.lose { color: var(--red); } .result h2.void { color: #2a5aa8; }
  .result .why { font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .result table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 15px; }
  .result td, .result th { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .result th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .result .big { font: 900 24px var(--sans); margin: 8px 0; }
  .result .big.plus { color: #1d8a4a; } .result .big.minus { color: var(--red); }
  .result .lines { display: grid; gap: 4px; margin: 6px 0 12px; font-weight: 700; }
  .result .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Final */
  .endwrap { background: rgba(6, 4, 10, 0.2); align-items: flex-start; padding-top: 70px; }
  .front { width: 720px; padding: 22px 30px; background: #f3ecd9; font-family: var(--serif); text-align: center; border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .front h1 { margin: 0; font: 900 34px var(--serif); border-bottom: 3px double #1d1712; padding-bottom: 6px; }
  .front h2 { font: 900 30px/1.1 var(--sans); margin: 12px 0; }
  .front p { font-size: 17px; }
  .front .btns { display: flex; gap: 12px; justify-content: center; margin-top: 12px; font-family: var(--sans); }

  /* Pausa y avisos */
  .pause { width: 360px; padding: 22px; text-align: center; display: grid; gap: 12px; }
  .pause h2 { margin: 0; font: italic 900 36px var(--display); color: var(--red); }
  #toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--night); color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 800; pointer-events: none; white-space: nowrap; z-index: 5; border: 1px solid rgba(255, 255, 255, 0.15); }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch button { position: absolute; pointer-events: auto; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 30px; font-weight: 900; touch-action: none; }
  #touch button.on { background: rgba(255, 210, 60, 0.4); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="touch" hidden></div>
  <div id="toast" hidden></div>
</div>
<script>
'use strict';
// ===== Utilidades: números, azar con semilla, colores y dibujo =====
const W = 1280, H = 720;
// ?cover = solo la portada, quieta y sin botones (para sacar la imagen del catálogo)
const COVER = typeof location !== 'undefined' && /[?&]cover/.test(location.search || '');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));

// Azar con semilla: la ruta y los avisos del diario salen siempre iguales para la misma partida
function rng(seed) {
  let s = (seed >>> 0) || 1;

    s = (s + 0x6D2B79F5) | 0;

  const q = /[?&]lang=(es|en)\b/.exec(location.search || '');
  if (q) return q[1];
  try {
    const s = localStorage.getItem(LANG_KEY);
    if (s === 'es' || s === 'en') return s;
  } catch (e) { /* sin almacenamiento */ }
  return (navigator.language || 'es').toLowerCase().startsWith('es') ? 'es' : 'en';
})();

  LANG = l;

}

// ===== Autos y piezas: qué calza dónde, si el auto anda, cuánta potencia tiene y cuánto vale =====
let _uid = 0;
const newId = p => p + Date.now().toString(36).slice(-5) + (++_uid).toString(36);

// Una pieza suelta o instalada. c = estado (1 = nueva). m = montaje (motor al que calza), f = familia.
function makePart(t, k, o = {}) {
  const p = { id: newId('p'), t, k, c: o.c ?? 1 };
  if (t === 'intake' || t === 'exhaust') p.m = o.m;
  if (t === 'trans') p.f = o.f;
  return p;
}
function partPrice(p) {
  switch (p.t) {
    case 'engine': return ENGINES[p.k].price;
    case 'intake': return INTAKES[p.k].price;
    case 'carb': return CARBS[p.k].price;
    case 'cam': return CAMS[p.k].price;
    case 'exhaust': return EXHAUSTS[p.k].price;
    case 'trans': return TRANS[p.k].price;
    case 'axle': return AXLES[p.k];
    case 'tires': return TIRES[p.k].price;
  }
  return 0;
}
// Lo que vale una pieza usada (al venderla suelta se recibe la mitad)
const partValue = p => partPrice(p) * (0.35 + 0.65 * (p.c ?? 1));

// ----- Espacios del auto y sus pernos -----
// Para sacar una pieza primero hay que sacar las que están encima (needs).
const SLOTS = ['engine', 'cam', 'intake', 'carb0', 'carb1', 'carb2', 'exhaust', 'trans', 'axle', 'tires'];
const SLOT_INFO = {
  engine:  { t: 'engine', bolts: 4, above: ['intake', 'exhaust', 'cam'] },
  cam:     { t: 'cam', bolts: 2, above: ['intake'] },
  intake:  { t: 'intake', bolts: 6, above: ['carb0', 'carb1', 'carb2'] },
  carb0:   { t: 'carb', bolts: 4, above: [] },
  carb1:   { t: 'carb', bolts: 4, above: [] },
  carb2:   { t: 'carb', bolts: 4, above: [] },
  exhaust: { t: 'exhaust', bolts: 6, above: [] },
  trans:   { t: 'trans', bolts: 4, above: [] },
  axle:    { t: 'axle', bolts: 4, above: [] },
  tires:   { t: 'tires', bolts: 4, above: [] }
};
const BAY_SLOTS = ['engine', 'cam', 'intake', 'carb0', 'carb1', 'carb2', 'exhaust'];   // se ven bajo el capó
const UNDER_SLOTS = ['trans', 'axle', 'tires'];                                         // se ven con el auto levantado
const carbCount = car => (car.p.intake ? INTAKES[car.p.intake.k].n : 0);

// Un auto nuevo de un modelo, con sus piezas de fábrica y todos los pernos apretados
function makeCar(model, o = {}) {
  const M = MODELS[model], s = M.stock, mount = engineMount(s.engine);
  const car = {
    id: newId('c'), model, color: o.color || M.colors[0], body: o.body ?? 1, repairs: 0,
    fuel: o.fuel ?? 10, timing: 6, mods: { wheels: 'caps' }, p: {}, tight: {}
  };
  car.p.engine = makePart('engine', s.engine, { c: o.ec ?? 1 });
  car.p.intake = makePart('intake', s.intake, { m: mount });
  for (let i = 0; i < INTAKES[s.intake].n; i++) car.p['carb' + i] = makePart('carb', s.carb);
  car.p.exhaust = makePart('exhaust', 'iron', { m: mount });
  car.p.trans = makePart('trans', s.trans, { f: M.fam, c: o.tc ?? 1 });
  car.p.axle = makePart('axle', s.axle);
  car.p.tires = makePart('tires', s.tires, { c: o.tread ?? 1 });
  if (s.tires === 'ww') car.mods.wheels = 'caps';
  for (const sl of SLOTS) if (car.p[sl]) car.tight[sl] = SLOT_INFO[sl].bolts;
  return car;
}

// Arma un auto completo a partir de una ficha (la del Rey, la de un rival o una de prueba)
function buildCar(spec) {
  const car = makeCar(spec.model, { color: spec.color });
  const fam = MODELS[spec.model].fam, mount = engineMount(spec.engine || car.p.engine.k);
  const set = (sl, part) => { car.p[sl] = part; car.tight[sl] = part ? SLOT_INFO[sl].bolts : 0; };
  if (spec.engine) set('engine', makePart('engine', spec.engine));
  if (spec.intake || spec.engine) {
    const ik = spec.intake || (ENGINES[car.p.engine.k].kind === '8' ? '1x4' : '1x2');
    set('intake', makePart('intake', ik, { m: mount }));
    const n = INTAKES[ik].n, carbs = spec.carbs || Array(n).fill(INTAKES[ik].carb);
    for (let i = 0; i < 3; i++) set('carb' + i, i < n ? makePart('carb', carbs[i] || INTAKES[ik].carb) : null);
  }
  set('exhaust', makePart('exhaust', spec.exhaust || 'iron', { m: mount }));
  if (spec.cam && spec.cam !== 'stock') set('cam', makePart('cam', spec.cam));
  if (spec.trans) set('trans', makePart('trans', spec.trans, { f: fam }));
  if (spec.axle) set('axle', makePart('axle', spec.axle));
  if (spec.tires) set('tires', makePart('tires', spec.tires));
  if (spec.mods) Object.assign(car.mods, spec.mods);
  if (spec.timing) car.timing = spec.timing;
  car.fuel = 16;
  return car;
}

// ¿Esta pieza calza en este espacio del auto? Devuelve '' si sí, o el motivo si no.
function fitProblem(car, sl, part) {
  const M = MODELS[car.model], info = SLOT_INFO[sl];
  if (!part || part.t !== info.t) return 'type';
  const eng = car.p.engine, mount = eng && engineMount(eng.k);
  switch (sl) {
    case 'engine': return ENGINES[part.k].fam === M.fam ? '' : 'family';
    case 'trans': return part.f === M.fam ? '' : 'family';
    case 'cam': return !eng ? 'noEngine' : car.p.intake ? 'blocked' : '';
    case 'intake': return !eng ? 'noEngine' : part.m !== mount ? 'mount' : '';
    case 'exhaust': return !eng ? 'noEngine' : part.m !== mount ? 'mount' : '';
    default:
      if (sl.startsWith('carb')) {
        if (!car.p.intake) return 'noIntake';
        const idx = +sl.slice(4), ik = INTAKES[car.p.intake.k];
        if (idx >= ik.n) return 'noRoom';
        return CARBS[part.k].slot === ik.carb ? '' : 'carbType';
      }
      return '';
  }
}
// El primer espacio libre donde calza la pieza (o null), y si no hay, el motivo
function slotFor(car, part) {
  const cands = SLOTS.filter(sl => SLOT_INFO[sl].t === part.t);
  let why = 'type';
  for (const sl of cands) {
    if (car.p[sl]) { why = why === 'type' ? 'occupied' : why; continue; }
    const pr = fitProblem(car, sl, part);
    if (!pr) return { sl };
    why = pr;
  }
  return { sl: null, why };
}
// Piezas que impiden sacar la de este espacio
const blockers = (car, sl) => SLOT_INFO[sl].above.filter(a => car.p[a]);

// ¿Anda el auto? Devuelve la lista de problemas (vacía = listo para salir)
function carProblems(car) {
  const out = [], p = car.p;
  for (const sl of ['engine', 'intake', 'exhaust', 'trans', 'axle', 'tires']) if (!car.p[sl]) out.push('missing:' + sl);
  const n = carbCount(car);
  for (let i = 0; i < n; i++) if (!car.p['carb' + i]) { out.push('missing:carb'); break; }
  for (const sl of SLOTS) if (car.p[sl] && (car.tight[sl] || 0) < SLOT_INFO[sl].bolts) { out.push('loose:' + sl); break; }
  if (p.engine && p.engine.c <= 0.02) out.push('blown');
  if (p.trans && p.trans.c <= 0.02) out.push('broken');
  if (car.body <= 0.12) out.push('wrecked');
  if (car.fuel <= 0.05) out.push('fuel');
  return out;
}
const carRuns = car => carProblems(car).filter(p => p !== 'fuel').length === 0;

// ----- Números del auto -----
const LB = 0.4536, DRIVER_LB = 165;
const timingFactor = t => 1 - 0.004 * (t - 10) * (t - 10);

function carStats(car) {
  const M = MODELS[car.model], p = car.p;
  const s = { ok: !!(p.engine && p.intake && p.trans && p.axle && p.tires) };
  const E = ENGINES[(p.engine || { k: M.stock.engine }).k];
  const kind = E.kind, ik = p.intake ? INTAKES[p.intake.k] : INTAKES[kind === '8' ? '1x4' : '1x2'];
  const carbs = [0, 1, 2].slice(0, ik.n).map(i => p['carb' + i]).filter(Boolean);
  const raceCarbs = carbs.length === ik.n && carbs.every(c => c.k === '4R') ? CARBS['4R'].k : 1;
  const cam = CAMS[p.cam ? p.cam.k : 'stock'];
  const exh = EXHAUSTS[p.exhaust ? p.exhaust.k : 'iron'];
  const ec = p.engine ? p.engine.c : 1;
  s.engine = E; s.cyl = kind === '6' ? 6 : 8;
  s.hp = E.hp * (ik.k[kind] || 1) * raceCarbs * cam.k * exh.k * timingFactor(car.timing) * (0.62 + 0.38 * ec);
  s.peak = E.rpm + cam.rpm;
  s.red = E.red + cam.rpm * 0.8;
  s.low = cam.low;
  const tr = TRANS[p.trans ? p.trans.k : M.stock.trans];
  s.auto = !!tr.auto; s.ratios = tr.ratios;
  s.axle = parseFloat(p.axle ? p.axle.k : M.stock.axle);
  const tire = TIRES[p.tires ? p.tires.k : 'std'], tread = p.tires ? p.tires.c : 1;
  s.grip = tire.grip * (0.72 + 0.28 * tread);
  s.lat = tire.lat * (0.78 + 0.22 * tread);
  let lb = M.lb - ENGINES[M.stock.engine].lb + E.lb + DRIVER_LB;
  if (car.mods.nobump) lb -= MODS.nobump.w;
  s.lb = lb; s.mass = lb * LB;
  s.cda = M.cda * (car.mods.chop ? 1 - MODS.chop.drag : 1) * (car.mods.lowered ? 1 - MODS.lowered.drag : 1);
  s.handling = clamp(1.06 - (lb - 2700) / 9000 + (car.mods.lowered ? MODS.lowered.handling : 0) + (M.year >= 1958 && M.cda < 0.8 ? 0.06 : 0), 0.82, 1.15);
  s.tc = p.trans ? p.trans.c : 1;
  s.ec = ec;
  return s;
}

// Lo que vale el auto completo, con sus piezas, su carrocería y sus arreglos
function stockPartsValue(model) {
  const s = MODELS[model].stock, n = INTAKES[s.intake].n;
  return ENGINES[s.engine].price + INTAKES[s.intake].price + CARBS[s.carb].price * n + EXHAUSTS.iron.price +
    TRANS[s.trans].price + AXLES[s.axle] + TIRES[s.tires].price;
}
function carValue(car) {
  const M = MODELS[car.model];
  let parts = 0;
  for (const sl of SLOTS) if (car.p[sl]) parts += partValue(car.p[sl]);
  let mods = 0;
  for (const k in MODS) if (car.mods[k]) mods += MODS[k].price;
  mods += WHEELS[car.mods.wheels] || 0;
  const paint = paintOf(car.color);
  if (paint && paint.candy) mods += 40;
  const chassis = Math.max(40, M.price - 0.8 * stockPartsValue(car.model)) * (0.3 + 0.7 * car.body) * Math.pow(0.9, car.repairs);
  return Math.round(chassis + parts * 0.8 + mods * 0.5);
}
const junkValue = car => {
  let parts = 0;
  for (const sl of SLOTS) if (car.p[sl]) parts += partValue(car.p[sl]);
  return Math.round(MODELS[car.model].price * 0.1 + parts * 0.3);
};
// Arreglar el choque: cuesta más mientras peor quedó. Muy destrozado o arreglado muchas veces = solo chatarra.
const repairCost = car => Math.round(30 + (1 - car.body) * MODELS[car.model].price * 0.55);
const canRepair = car => car.body > 0.15 && car.repairs < 3;
const TANK = 16, GAS_PRICE = 0.31;

// ===== Física: motor, caja de cambios, embrague, patinazos y zona roja =====
// Todo en metros, segundos y kilos. La velocidad v va en m/s.
const TIRE_R = 0.33, IDLE = 800, G = 9.81, QUARTER = 402.3;
const NET = 0.8;            // los caballos "brutos" de los catálogos de 1963 eran optimistas
const LAUNCH = 0.68;        // a qué fracción de las rpm de potencia máxima se larga mejor
const ENGINE_I = 0.16;      // inercia del motor y volante (kg·m²)

// Potencia relativa a una fracción x de las rpm de máxima potencia (1 en x = 1, cae al pasarse)
const powerCurve = x => Math.max(0, x + x * x - x * x * x);

class Vehicle {
  constructor(stats) {
    this.s = stats;
    this.v = 0; this.dist = 0; this.acc = 0;
    this.rpm = IDLE; this.gear = 0; this.shiftT = 0; this.clutch = 0; this.spin = 0;
    this.throttle = 0; this.brake = 0; this.offroad = 0;
    this.engineDmg = 0; this.transDmg = 0; this.blown = false; this.broken = false; this.dry = false;
    this.grinds = 0; this.redT = 0; this.events = [];
    this.fuelUse = 0;
  }
  get nGears() { return this.s.ratios.length; }
  ratio(g = this.gear) { return g > 0 ? this.s.ratios[g - 1] * this.s.axle : 0; }
  wheelRpm(g = this.gear) { return this.v / TIRE_R * this.ratio(g) * 60 / TAU; }
  dead() { return this.blown || this.broken || this.dry; }

  // Torque del motor (N·m) a unas rpm, sin contar el acelerador
  torque(rpm) {
    const s = this.s, x = Math.max(rpm, IDLE) / s.peak;
    let p = s.hp * 745.7 * NET * powerCurve(x);
    if (x < 0.6) p *= lerp(s.low, 1, x / 0.6);
    return p / (Math.max(rpm, IDLE) * TAU / 60);
  }

  // Suelta el embrague (o el freno, en los automáticos) en la partida
  launch() {
    if (this.gear !== 0) return;
    this.gear = 1;
    this.clutch = this.s.auto ? 0 : this.rpm;
  }

  shiftUp() {
    if (this.gear === 0 || this.gear >= this.nGears || this.s.auto || this.shiftT > 0 || this.dead()) return;
    // Pasar el cambio con el acelerador a fondo raspa la caja y la puede romper
    if (this.throttle > 0.35) {
      this.grinds++;
      this.transDmg += (0.2 + Math.random() * 0.12) * (1.5 - 0.5 * this.s.tc);
      this.events.push('grind');
      if (this.transDmg >= 1) { this.broken = true; this.events.push('broken'); return; }
      this.shiftT = 0.55;
      if (Math.random() < 0.35) return;    // no entró el cambio
    } else {
      this.shiftT = 0.2;
      this.events.push('shift');
    }
    this.gear++;
  }
  shiftDown() {
    if (this.gear <= 1 || this.s.auto || this.shiftT > 0 || this.dead()) return;
    this.gear--;
    this.shiftT = 0.25;
    this.events.push('shift');
  }

  // Cambios automáticos: suben cerca de la potencia máxima y bajan si se pisa a fondo
  autoShift() {
    const s = this.s;
    if (this.gear < 1 || this.shiftT > 0) return;
    const up = this.throttle > 0.6 ? s.peak * 1.06 : s.peak * 0.6;
    if (this.gear < this.nGears && this.wheelRpm() > Math.min(up, s.red - 150)) { this.gear++; this.shiftT = 0.32; this.events.push('autoshift'); }
    else if (this.gear > 1 && this.throttle > 0.9 && this.wheelRpm(this.gear - 1) < s.peak * 0.85) { this.gear--; this.shiftT = 0.3; }
  }

  step(dt, inp) {
    const s = this.s;
    this.throttle = this.dead() ? 0 : clamp(inp.throttle, 0, 1);
    this.brake = clamp(inp.brake, 0, 1);
    if (s.auto) this.autoShift();
    const m = s.mass, ratio = this.ratio(), wr = this.wheelRpm();
    let force = 0, spinTarget = 0;

    if (this.gear === 0) {
      // Detenido en la partida: el motor acelera libre (embrague apretado) hasta las vueltas justas para largar
      const target = IDLE + this.throttle * (s.peak * LAUNCH - IDLE);
      this.rpm = approach(this.rpm, target, (target > this.rpm ? 7000 : 3500) * dt);
    } else if (this.shiftT > 0) {
      // Pasando el cambio: no hay tracción; el motor baja de vueltas (o sube si se acelera)
      this.shiftT -= dt;
      const free = IDLE + this.throttle * (s.red - 200 - IDLE);
      this.rpm = approach(this.rpm, Math.max(free, s.auto ? wr : IDLE), 4500 * dt);
      if (s.auto) force = this.torque(this.rpm) * this.throttle * ratio * 0.35 / TIRE_R;
      if (this.shiftT <= 0 && !s.auto) this.rpm = Math.max(IDLE, wr);
    } else {
      let rpm = wr * (1 + this.spin), mult = 1;
      if (s.auto) {
        // Convertidor de torque: deja subir las vueltas a baja velocidad y multiplica la fuerza
        const stall = 1500 + s.peak * 0.12 * this.throttle;
        if (rpm < stall) { mult = 1 + 0.9 * (1 - rpm / stall); rpm = lerp(rpm, stall, 0.85); }
      } else if (this.clutch > 0) {
        // Embrague patinando en la largada: las vueltas bajan de a poco hasta enganchar
        this.clutch -= 3200 * dt * (0.6 + this.throttle);
        if (this.clutch > rpm) rpm = this.clutch; else this.clutch = 0;
      }
      if (rpm < IDLE) rpm = IDLE;
      this.rpm = Math.min(rpm, s.red + 1400);
      const eff = s.auto ? 0.82 : 0.88;
      force = this.torque(this.rpm) * this.throttle * mult * ratio * eff / TIRE_R;
      // Agarre de las ruedas traseras (al acelerar el peso se va atrás)
      const rear = m * G * (0.5 + 0.1 * clamp(this.acc / G, 0, 1.2));
      const fmax = s.grip * rear * (this.offroad ? 0.65 : 1);
      if (force > fmax) {
        spinTarget = clamp((force / fmax - 1) * 0.9, 0, 1.3);
        force = fmax * 0.9;
      }
    }
    this.spin = approach(this.spin, spinTarget, (spinTarget > this.spin ? 4 : 2.5) * dt);

    // Zona roja: el motor aguanta un rato y después revienta
    if (this.rpm > s.red && !this.blown) {
      const over = (this.rpm - s.red) / 700;
      this.redT += dt;
      this.engineDmg += dt * (0.12 + over * 0.55) * (1.7 - 0.7 * (this.s.ec ?? 1));
      if (this.engineDmg >= 1) { this.blown = true; this.events.push('blown'); }
    } else this.redT = 0;

    const drag = 0.5 * 1.2 * s.cda * this.v * this.v;
    const roll = (0.015 + this.offroad * 0.12) * m * G * (this.v > 0.1 ? 1 : 0);
    const brake = this.brake * 0.8 * G * m * (this.v > 0.05 ? 1 : 0);
    const meff = m + ENGINE_I * (ratio / TIRE_R) * (ratio / TIRE_R) * 0.9;
    const a = (force - drag - roll - brake) / meff;
    this.acc = a;
    this.v = Math.max(0, this.v + a * dt);
    this.dist += this.v * dt;
    this.fuelUse += dt * (0.0004 + 0.0022 * this.throttle * this.rpm / s.red) * s.engine.ci / 300;
  }
}

// ----- Pilotos de la computadora -----
// Devuelve qué hacer este instante: acelerar, frenar, pasar cambios. skill = 0..1.
function makeDriver(skill, rnd = Math.random) {
  return {
    skill,
    react: lerp(0.62, 0.17, skill) + rnd() * 0.12,       // segundos que tarda en largar
    launchAt: lerp(0.45, 0.72, skill) + (rnd() - 0.5) * 0.12,
    shiftAt: lerp(0.9, 1.02, skill) + (rnd() - 0.5) * 0.06,
    lift: 0
  };
}
// Un paso del piloto automático en línea recta. target = velocidad que quiere llevar (m/s), o Infinity.
function driveStraight(veh, drv, dt, goT, target = Infinity) {
  const s = veh.s;
  const inp = { throttle: 0, brake: 0 };
  if (veh.gear === 0) {
    inp.throttle = veh.rpm < s.peak * drv.launchAt ? 1 : 0.4;
    if (goT !== null && goT >= drv.react) { veh.launch(); }
    return inp;
  }
  if (veh.v > target + 1) { inp.brake = clamp((veh.v - target) / 8, 0.15, 1); return inp; }
  inp.throttle = veh.v < target - 2 ? 1 : 0.55;
  if (veh.shiftT > 0 && !s.auto) inp.throttle = 0;
  if (!s.auto) {
    if (drv.lift > 0) { drv.lift -= dt; inp.throttle = 0; if (drv.lift <= 0) { veh.throttle = 0; veh.shiftUp(); } }
    else if (veh.gear < veh.nGears && veh.rpm > Math.min(s.peak * 1.08 * drv.shiftAt, s.red - 60) && veh.shiftT <= 0 && veh.clutch <= 0) {
      drv.lift = 0.06; inp.throttle = 0;
    }
  }
  return inp;
}

// Tiempo del cuarto de milla y velocidad final con un piloto perfecto (para el diario y para elegir rivales)
function quarterMile(stats) {
  const veh = new Vehicle(stats), drv = makeDriver(1, () => 0.5);
  drv.react = 0; drv.launchAt = 0.62; drv.shiftAt = 1;
  const dt = 1 / 120;
  let t = 0;
  for (let i = 0; i < 60 * 120 && veh.dist < QUARTER; i++) {
    veh.step(dt, driveStraight(veh, drv, dt, 1));
    if (veh.gear > 0) t += dt;
  }
  return { et: veh.dist >= QUARTER ? t : 60, trap: veh.v };
}
const _etCache = new Map();
function carET(car) {
  const key = JSON.stringify([car.model, car.timing, car.mods.chop, car.mods.lowered, car.mods.nobump, SLOTS.map(sl => car.p[sl] ? car.p[sl].k + (car.p[sl].c ?? 1).toFixed(2) : '')]);
  let r = _etCache.get(key);
  if (!r) {
    r = carRuns(car) ? quarterMile(carStats(car)) : { et: 60, trap: 0 };
    if (_etCache.size > 400) _etCache.clear();
    _etCache.set(key, r);
  }
  return r;
}
// Velocidad máxima: la menor entre lo que da el motor contra el viento y la zona roja en el último cambio
function topSpeed(stats) {
  const veh = new Vehicle(stats);
  let best = 0;
  for (let v = 10; v < 90; v += 0.5) {
    veh.v = v;
    const g = veh.nGears, rpm = veh.wheelRpm(g);
    if (rpm > stats.red) break;
    const f = veh.torque(rpm) * veh.ratio(g) * 0.86 / TIRE_R;
    if (f < 0.5 * 1.2 * stats.cda * v * v + 0.015 * stats.mass * G) break;
    best = v;
  }
  return best;
}

// ----- Materiales -----
function chromeGrad(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fbfdff'); gr.addColorStop(0.35, '#c4ccd4'); gr.addColorStop(0.5, '#59626b');
  gr.addColorStop(0.62, '#e9eef3'); gr.addColorStop(1, '#7d8790');
  return gr;
}
function goldGrad(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fff3c4'); gr.addColorStop(0.45, '#c9962e'); gr.addColorStop(0.55, '#7a5514'); gr.addColorStop(1, '#e8c060');
  return gr;
}
function polyPath(g, pts, smoothIt = false, tension = 0.5) {
  g.beginPath();
  if (smoothIt) { splinePath(g, pts, true, tension); return; }
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}
// Pintura: color base, luz de arriba, reflejo del horizonte y sombra abajo (en coordenadas del modelo, y hacia arriba)
function paintBody(g, color, top, bottom, gloss = 1) {
  g.fillStyle = css(color); g.fill();
  const gr = g.createLinearGradient(0, top, 0, bottom);
  const dark = luma(color) < 0.2;
  gr.addColorStop(0, `rgba(255,255,255,${(dark ? 0.32 : 0.42) * gloss})`);
  gr.addColorStop(0.16, `rgba(255,255,255,${0.1 * gloss})`);
  gr.addColorStop(0.42, 'rgba(255,255,255,0)');
  gr.addColorStop(0.47, `rgba(255,255,255,${0.16 * gloss})`);
  gr.addColorStop(0.5, 'rgba(0,0,0,0.12)');
  gr.addColorStop(0.8, 'rgba(0,0,0,0.26)');
  gr.addColorStop(1, 'rgba(0,0,0,0.5)');
  g.fillStyle = gr; g.fill();
}

// ----- Llantas -----
function drawWheel(g, cx, cy, r, style, ww, spin = 0, body = '#888', wide = false) {
  // neumático
  g.fillStyle = '#121214';
  g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  const tg = g.createRadialGradient(cx, cy, r * 0.5, cx, cy, r);
  tg.addColorStop(0, 'rgba(255,255,255,0)'); tg.addColorStop(0.82, 'rgba(255,255,255,0.08)'); tg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = tg; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  if (wide) { g.strokeStyle = 'rgba(255,255,255,0.08)'; g.lineWidth = r * 0.04; g.beginPath(); g.arc(cx, cy, r * 0.9, 0, TAU); g.stroke(); }
  // banda blanca
  if (ww) {
    g.fillStyle = '#efece2';
    g.beginPath(); g.arc(cx, cy, r * 0.84, 0, TAU); g.arc(cx, cy, r * 0.63, 0, TAU, true); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.18)'; g.lineWidth = r * 0.03; g.beginPath(); g.arc(cx, cy, r * 0.84, 0, TAU); g.stroke();
  }
  const rr = r * (ww ? 0.62 : 0.66);
  if (style === 'mags') {
    g.fillStyle = chromeGrad(g, cy + rr, cy - rr);
    g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    g.fillStyle = '#3b3f45'; g.beginPath(); g.arc(cx, cy, rr * 0.86, 0, TAU); g.fill();
    g.fillStyle = chromeGrad(g, cy + rr, cy - rr);
    for (let i = 0; i < 5; i++) {
      const a = spin + i * TAU / 5;
      g.save(); g.translate(cx, cy); g.rotate(a);
      g.beginPath(); g.moveTo(-rr * 0.12, 0); g.lineTo(-rr * 0.2, rr * 0.84); g.lineTo(rr * 0.2, rr * 0.84); g.lineTo(rr * 0.12, 0); g.closePath(); g.fill();
      g.restore();
    }
    g.fillStyle = '#c9cfd6'; g.beginPath(); g.arc(cx, cy, rr * 0.25, 0, TAU); g.fill();
  } else if (style === 'moons') {
    const mg = g.createRadialGradient(cx - rr * 0.3, cy + rr * 0.35, rr * 0.1, cx, cy, rr);
    mg.addColorStop(0, '#ffffff'); mg.addColorStop(0.5, '#cfd6dd'); mg.addColorStop(0.85, '#7f8891'); mg.addColorStop(1, '#e6ebef');
    g.fillStyle = mg; g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.beginPath(); g.arc(cx - rr * 0.25, cy + rr * 0.3, rr * 0.18, 0, TAU); g.fill();
  } else {
    // llanta de acero pintada con tapa cromada
    g.fillStyle = css(shade(body, -0.25)); g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    const hc = g.createRadialGradient(cx - rr * 0.25, cy + rr * 0.3, rr * 0.05, cx, cy, rr * 0.82);
    hc.addColorStop(0, '#ffffff'); hc.addColorStop(0.45, '#c3cbd3'); hc.addColorStop(0.8, '#69727b'); hc.addColorStop(1, '#d9dfe4');
    g.fillStyle = hc; g.beginPath(); g.arc(cx, cy, rr * 0.82, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(40,45,50,0.45)'; g.lineWidth = rr * 0.04;
    for (let i = 0; i < 6; i++) {
      const a = spin + i * TAU / 6;
      g.beginPath(); g.moveTo(cx + Math.cos(a) * rr * 0.28, cy + Math.sin(a) * rr * 0.28); g.lineTo(cx + Math.cos(a) * rr * 0.72, cy + Math.sin(a) * rr * 0.72); g.stroke();
    }
    g.fillStyle = '#eef2f5'; g.beginPath(); g.arc(cx, cy, rr * 0.22, 0, TAU); g.fill();
    g.fillStyle = css(shade(body, -0.1)); g.beginPath(); g.arc(cx, cy, rr * 0.12, 0, TAU); g.fill();
  }
}

// Llamas: lenguas de fuego que nacen en la trompa y se curvan hacia atrás
const FLAME_TONGUES = [[4.6, 0.42, 1.8, -1], [3, 0.7, 2.6, 1], [-3.4, 0.6, 2.4, -1], [1, 1, 3.2, -1], [-1.2, 0.82, 3, 1]];
function drawFlames(g, A, color) {
  const x0 = 101.5, len = A.highboy ? 34 : 44, yMid = A.highboy ? 18 : A.belt - 6.2;
  const fg = g.createLinearGradient(x0, 0, x0 - len, 0);
  fg.addColorStop(0, '#fff6b0'); fg.addColorStop(0.25, '#ffd23a'); fg.addColorStop(0.6, '#ff7a14'); fg.addColorStop(1, '#d4210f');
  const edge = luma(color) > 0.6 ? '#7a1a10' : '#57b4ff';
  for (const [dy, fl, th, curl] of FLAME_TONGUES) {
    const y = yMid + dy, L = len * fl, xt = x0 - L, ty = y + curl * th * 1.1;
    g.beginPath();
    g.moveTo(x0, y + th / 2);
    g.bezierCurveTo(x0 - L * 0.45, y + th * 0.75, xt + L * 0.18, ty + th * 0.55, xt, ty);
    g.bezierCurveTo(xt + L * 0.22, ty - curl * th * 0.15 - th * 0.15, x0 - L * 0.5, y - th * 0.55, x0, y - th / 2);
    g.closePath();
    g.fillStyle = fg; g.fill();
    g.strokeStyle = edge; g.lineWidth = 0.3; g.stroke();
  }
}

// Dibuja el auto de lado. x, y = centro abajo (entre las ruedas, en el suelo). size = largo en píxeles.
// o: { flip (mira a la izquierda), spin (giro de ruedas), night (0..1 oscurece), lights (faros encendidos), part (parcial para el taller) }
function drawCarSide(g, car, x, y, size, o = {}) {
  const A = ART[car.model], M = MODELS[car.model], mods = car.mods || {};
  const s = size / 100, color = car.color;
  const lower = mods.lowered ? 1.2 : 0, chop = mods.chop ? 0.74 : 1;
  const tiresK = car.p && car.p.tires ? car.p.tires.k : M.stock.tires;
  const ww = tiresK === 'ww', wideRear = tiresK === 'slick' || tiresK === 'wide';
  const wheelStyle = mods.wheels || 'caps';
  const candy = (paintOf(color) || {}).candy;
  g.save();
  g.translate(x, y);
  g.scale(o.flip ? -s : s, -s);
  g.translate(-50, 0);
  // sombra en el suelo
  const sh = g.createRadialGradient(50, 0, 4, 50, 0, 58);
  sh.addColorStop(0, `rgba(0,0,0,${o.night ? 0.6 : 0.42})`); sh.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.scale(1, 0.09); g.fillStyle = sh; g.beginPath(); g.arc(50, 0, 58, 0, TAU); g.fill(); g.restore();

  const wr = A.wr, wrR = (A.wrRear || wr) * (wideRear ? 1.04 : 1);
  const [fx, rx] = A.wheels;
  const top = 34, bottom = 4;
  // cabina (techo y pilares), por detrás de la carrocería
  const belt = A.belt;
  const chopPts = pts => pts.map(p => [p[0], p[1] > belt + 0.5 ? belt + (p[1] - belt) * chop : p[1], p[2]]);
  const bodyPts = A.cabin ? A.body : chopPts(A.body);
  const crisp = M.year >= 1957 ? 0.28 : 0.5;
  const drawGlass = () => {
    for (const gl of A.glass) {
      polyPath(g, chopPts(gl), true, crisp);
      const gg = g.createLinearGradient(0, belt + 10 * chop, 0, belt);
      gg.addColorStop(0, o.night ? '#2a3550' : '#b9d4ea'); gg.addColorStop(0.45, o.night ? '#121a2a' : '#5d7a96'); gg.addColorStop(1, o.night ? '#05070c' : '#1d2a38');
      g.fillStyle = gg; g.fill();
      g.strokeStyle = chromeGrad(g, belt + 10, belt); g.lineWidth = 0.45; g.stroke();
      // reflejos diagonales en el vidrio
      g.save(); g.clip();
      g.fillStyle = 'rgba(255,255,255,0.14)';
      const gx = gl[0][0];
      g.beginPath(); g.moveTo(gx - 6, belt); g.lineTo(gx - 2, belt); g.lineTo(gx - 8, belt + 12); g.lineTo(gx - 12, belt + 12); g.fill();
      g.beginPath(); g.moveTo(gx - 14, belt); g.lineTo(gx - 12.5, belt); g.lineTo(gx - 18.5, belt + 12); g.lineTo(gx - 20, belt + 12); g.fill();
      g.restore();
    }
  };
  g.save(); g.translate(0, -lower);
  if (A.cabin) {
    polyPath(g, chopPts(A.cabin), true, crisp);
    paintBody(g, mods.roof || color, belt + 11 * chop, belt - 2, candy ? 1.1 : 0.75);
    drawGlass();
    if (A.vent) { g.strokeStyle = chromeGrad(g, belt + 9, belt); g.lineWidth = 0.4; g.beginPath(); g.moveTo(...A.vent[0]); g.lineTo(A.vent[1][0], belt + (A.vent[1][1] - belt) * chop); g.stroke(); }
    if (A.port) {
      const [px, py, pr] = A.port, pyc = belt + (py - belt) * chop;
      g.fillStyle = o.night ? '#0a0e16' : '#3e5870'; g.beginPath(); g.arc(px, pyc, pr * chop, 0, TAU); g.fill();
      g.strokeStyle = chromeGrad(g, pyc + pr, pyc - pr); g.lineWidth = 0.5; g.stroke();
    }
  }
  // asientos y parabrisas de los descapotables
  if (A.seat) {
    polyPath(g, A.seat, true); g.fillStyle = '#7a3b22'; g.fill();
    const sg = g.createLinearGradient(0, belt + 6, 0, belt); sg.addColorStop(0, 'rgba(255,255,255,0.25)'); sg.addColorStop(1, 'rgba(0,0,0,0.3)');
    g.fillStyle = sg; g.fill();
  }
  if (A.wheelRing) { g.strokeStyle = '#1a1a1a'; g.lineWidth = 0.7; g.beginPath(); g.ellipse(A.wheelRing[0], A.wheelRing[1], 0.6, 2.6, -0.3, 0, TAU); g.stroke(); }
  if (A.shield) {
    polyPath(g, chopPts(A.shield)); g.fillStyle = 'rgba(170,205,230,0.35)'; g.fill();
    g.strokeStyle = chromeGrad(g, 36, 24); g.lineWidth = 0.7; g.stroke();
  }
  g.restore();

  // carrocería
  g.save(); g.translate(0, -lower);
  if (A.frame) { g.strokeStyle = '#1b1b1d'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(...A.frame[0]); g.lineTo(...A.frame[1]); g.stroke(); }
  polyPath(g, bodyPts, true);
  paintBody(g, color, top - 6, bottom, candy ? 1.35 : 1);
  if (candy) {
    // escarchado: puntitos brillantes
    g.save(); g.clip();
    for (let i = 0; i < 90; i++) { g.fillStyle = `rgba(255,255,255,${0.15 + hash1(i, 3) * 0.3})`; g.fillRect(hash1(i, 1) * 100, 5 + hash1(i, 2) * 20, 0.25, 0.25); }
    g.restore();
  }
  if (!A.cabin && A.glass) drawGlass();
  // sombra suave alrededor de los arcos de las ruedas
  if (!A.highboy) {
    g.save(); polyPath(g, bodyPts, true); g.clip();
    for (const [wx, wrr] of [[fx, wr], [rx, wrR]]) {
      const ag = g.createRadialGradient(wx, wrr + lower, wrr * 1.15, wx, wrr + lower, wrr * 1.6);
      ag.addColorStop(0, 'rgba(0,0,0,0.35)'); ag.addColorStop(1, 'rgba(0,0,0,0)');
      g.fillStyle = ag; g.fillRect(wx - wrr * 1.7, 0, wrr * 3.4, wrr * 3);
    }
    g.restore();
  }
  if (A.hood) {
    // capó con persianas y la línea del costado del roadster
    g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = 0.25;
    g.beginPath(); g.moveTo(A.hood[0], 11.4); g.lineTo(A.hood[0], 24.9); g.stroke();
    for (let row = 0; row < 3; row++) for (let lx = A.hood[0] + 3; lx < A.hood[1] - 2; lx += 1.6) {
      g.fillStyle = 'rgba(0,0,0,0.55)'; g.fillRect(lx, 15.5 + row * 2.6, 0.5, 1.8);
      g.fillStyle = 'rgba(255,255,255,0.18)'; g.fillRect(lx + 0.5, 15.5 + row * 2.6, 0.18, 1.8);
    }
    g.strokeStyle = 'rgba(255,255,255,0.22)'; g.lineWidth = 0.35;
    g.beginPath(); g.moveTo(4, 20.6); g.bezierCurveTo(20, 21.4, 60, 21.4, A.hood[0], 21.2); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = 0.25;
    g.beginPath(); g.moveTo(4, 20.2); g.bezierCurveTo(20, 21, 60, 21, A.hood[0], 20.8); g.stroke();
  }
  // panel de color secundario o anodizado
  if (A.cove) { polyPath(g, A.cove, true); g.fillStyle = css(luma(color) > 0.7 ? '#b3202a' : '#ece8dc'); g.fill(); g.strokeStyle = chromeGrad(g, 18, 8); g.lineWidth = 0.5; g.stroke(); }
  if (A.wedge) {
    polyPath(g, A.wedge); g.fillStyle = chromeGrad(g, 18, 11); g.fill();
    g.save(); g.clip(); g.strokeStyle = 'rgba(60,66,72,0.35)'; g.lineWidth = 0.25;
    for (let xx = 4; xx < 52; xx += 1.2) { g.beginPath(); g.moveTo(xx, 10); g.lineTo(xx, 19); g.stroke(); }
    g.restore();
  }
  if (A.gold) { polyPath(g, A.gold); g.fillStyle = goldGrad(g, 18, 12); g.fill(); }
  // decoraciones
  g.save(); polyPath(g, bodyPts, true); g.clip();
  if (mods.stripes) {
    g.fillStyle = luma(color) > 0.6 ? 'rgba(25,28,34,0.9)' : 'rgba(245,243,236,0.92)';
    g.fillRect(0, belt - 9.4, 101, 1.2); g.fillRect(0, belt - 7.6, 101, 0.6);
  }
  if (mods.flames) drawFlames(g, A, color);
  if (mods.pinstripe) {
    g.strokeStyle = luma(color) > 0.6 ? '#9b2a20' : '#f4e3a6'; g.lineWidth = 0.22;
    const py = belt - 3;
    for (const [cx, d] of [[88, 1], [12, -1]]) {
      g.beginPath();
      g.moveTo(cx - 6 * d, py); g.bezierCurveTo(cx - 2 * d, py + 2, cx + 2 * d, py - 2, cx + 5 * d, py - 0.5);
      g.bezierCurveTo(cx + 6.5 * d, py + 0.5, cx + 5 * d, py + 1.8, cx + 3.6 * d, py + 1);
      g.moveTo(cx - 6 * d, py); g.bezierCurveTo(cx - 2 * d, py - 2.2, cx + 1 * d, py - 2.6, cx + 3 * d, py - 1.6);
      g.stroke();
    }
  }
  g.restore();
  // líneas de puertas y manilla
  g.strokeStyle = 'rgba(0,0,0,0.38)'; g.lineWidth = 0.22;
  for (const d of A.doors) { g.beginPath(); g.moveTo(...d[0]); g.lineTo(...d[1]); g.stroke(); }
  if (A.handle) { g.fillStyle = chromeGrad(g, A.handle[1] + 0.5, A.handle[1] - 0.5); g.fillRect(A.handle[0], A.handle[1] - 0.35, 2.4, 0.7); }
  // molduras cromadas
  for (const t of A.trims) {
    g.strokeStyle = '#eef2f6'; g.lineWidth = 0.55; g.lineCap = 'round';
    g.beginPath(); g.moveTo(...t[0]); for (let i = 1; i < t.length; i++) g.lineTo(...t[i]); g.stroke();
    g.strokeStyle = 'rgba(70,78,86,0.7)'; g.lineWidth = 0.18;
    g.beginPath(); g.moveTo(t[0][0], t[0][1] - 0.22); for (let i = 1; i < t.length; i++) g.lineTo(t[i][0], t[i][1] - 0.22); g.stroke();
  }
  if (A.vents) for (const [vx, vy] of A.vents) { g.strokeStyle = chromeGrad(g, vy + 3, vy); g.lineWidth = 0.5; g.beginPath(); g.moveTo(vx, vy); g.lineTo(vx + 1.6, vy + 3.2); g.stroke(); }
  if (A.louvers) { g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.25; for (let lx = A.louvers[0]; lx < A.louvers[1]; lx += 1.4) { g.beginPath(); g.moveTo(lx, A.louvers[2]); g.lineTo(lx + 0.7, A.louvers[2] - 0.4); g.stroke(); } }
  if (A.ornaments) for (const [ox, oy] of A.ornaments) { g.fillStyle = chromeGrad(g, oy + 1, oy); g.beginPath(); g.moveTo(ox - 1.6, oy); g.lineTo(ox + 1.2, oy + 0.7); g.lineTo(ox + 1.4, oy); g.closePath(); g.fill(); }
  if (A.badge) { g.fillStyle = '#d33'; g.fillRect(A.badge[0], A.badge[1], 2, 0.8); g.fillStyle = '#eee'; g.fillRect(A.badge[0] + 0.2, A.badge[1] + 0.2, 1.6, 0.4); }
  if (A.scoop || mods.scoop) {
    const sc = A.scoop || [[76, belt + 0.1], [79.5, belt + 1.7], [87, belt + 1.6], [89, belt]];
    polyPath(g, sc, true); paintBody(g, color, belt + 2, belt, 1);
    g.fillStyle = '#0d0d0f'; g.fillRect(sc[2][0] - 0.2, sc[3][1] + 0.2, 0.9, (sc[2][1] - sc[3][1]) * 0.75);
  }
  // salpicaderas sueltas (autos antiguos)
  if (A.fenders) {
    for (const f of A.fenders) { polyPath(g, f, true); paintBody(g, color, 23, 9, candy ? 1.3 : 1); }
    g.fillStyle = '#1d1d1f'; polyPath(g, A.board); g.fill();
    g.fillStyle = chromeGrad(g, 9.8, 9.2); g.fillRect(A.board[0][0], 9.2, A.board[1][0] - A.board[0][0], 0.6);
  }
  if (A.grille) {
    polyPath(g, A.grille); g.fillStyle = chromeGrad(g, 25, 11); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 0.15; g.stroke();
    if (A.highboy) { g.fillStyle = chromeGrad(g, 27, 25); roundRect(g, 83.2, 25, 1.6, 1.6, 0.5); g.fill(); }
  }
  if (A.pipes) {
    // escapes laterales cromados (lakes pipes)
    g.fillStyle = chromeGrad(g, 11.4, 9.6); roundRect(g, 30, 9.6, 46, 1.8, 0.9); g.fill();
    g.fillStyle = '#222'; g.beginPath(); g.ellipse(30.2, 10.5, 0.4, 0.8, 0, 0, TAU); g.fill();
  }
  // huecos de las ruedas
  if (!A.highboy) {
    g.save();
    polyPath(g, bodyPts, true);
    if (A.fenders) for (const f of A.fenders) { splinePath(g, f, true); }
    g.clip();
    g.fillStyle = '#0b0b0c';
    for (const [wx, wrr] of [[fx, wr], [rx, wrR]]) { g.beginPath(); g.arc(wx, wrr + lower, wrr * 1.17, 0, TAU); g.fill(); }
    g.restore();
  }
  g.restore();

  // ruedas
  const spin = o.spin || 0;
  drawWheel(g, fx, wr, wr, wheelStyle, ww, spin, color);
  drawWheel(g, rx, wrR, wrR, wheelStyle, ww, spin, color, wideRear);
  g.save(); g.translate(0, -lower);
  // faldones traseros (Mercury)
  if (A.skirts && !mods.noskirt) {
    g.save(); polyPath(g, bodyPts, true); g.clip();
    g.beginPath(); g.rect(rx - wr * 1.25, 4, wr * 2.5, 24);
    paintBody(g, color, top - 6, bottom, candy ? 1.35 : 1);
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.25;
    g.beginPath(); g.moveTo(rx - wr * 1.2, 5.6); g.lineTo(rx - wr * 1.2, wr + 2); g.arc(rx, wr + 2, wr * 1.2, Math.PI, 0, true); g.lineTo(rx + wr * 1.2, 5.6); g.stroke();
    g.restore();
    g.strokeStyle = chromeGrad(g, 7, 5.5); g.lineWidth = 0.5; g.beginPath(); g.moveTo(rx - wr * 1.15, 6.4); g.lineTo(rx + wr * 1.15, 6.4); g.stroke();
  }
  // faros y focos traseros
  if (A.head) {
    const [hx, hy, hr] = A.head;
    g.fillStyle = chromeGrad(g, hy + hr, hy - hr); g.beginPath(); g.ellipse(hx, hy, hr * 0.55, hr, 0, 0, TAU); g.fill();
    g.fillStyle = o.lights ? '#fff8d8' : '#dfe8ee'; g.beginPath(); g.ellipse(hx + hr * 0.2, hy, hr * 0.32, hr * 0.78, 0, 0, TAU); g.fill();
  }
  if (A.lamp) {
    const [lx, ly, lr] = A.lamp;
    g.strokeStyle = '#1b1b1d'; g.lineWidth = 0.7; g.beginPath(); g.moveTo(lx - 1, ly - lr); g.lineTo(lx - 2.6, 13); g.stroke();
    g.fillStyle = chromeGrad(g, ly + lr, ly - lr); g.beginPath(); g.ellipse(lx, ly, lr * 0.8, lr, 0, 0, TAU); g.fill();
    g.fillStyle = o.lights ? '#fff8d8' : '#e8eef2'; g.beginPath(); g.ellipse(lx + lr * 0.5, ly, lr * 0.3, lr * 0.8, 0, 0, TAU); g.fill();
  }
  if (A.tail) { polyPath(g, A.tail); g.fillStyle = o.lights ? '#ff2a1a' : '#b3141a'; g.fill(); g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(A.tail[0][0] + 0.2, A.tail[0][1] + 0.3, 0.4, (A.tail[2][1] - A.tail[0][1]) * 0.6); }
  // parachoques
  if (!mods.nobump) {
    for (const b of [A.bumpF, A.bumpR]) {
      polyPath(g, b, true); g.fillStyle = chromeGrad(g, Math.max(...b.map(p => p[1])), Math.min(...b.map(p => p[1]))); g.fill();
      g.strokeStyle = 'rgba(40,46,52,0.5)'; g.lineWidth = 0.15; g.stroke();
    }
  }
  g.restore();
  // contorno suave para que el auto se despegue del fondo
  g.restore();
  if (o.lights) {
    const dir = o.flip ? -1 : 1, hx = x + dir * (A.head ? A.head[0] - 50 : 40) * s, hy = y - (A.head ? A.head[1] : 22) * s;
    g.save(); g.globalCompositeOperation = 'lighter';
    glow(g, hx, hy, 9 * s, '#fff1c8', 0.9);
    const beam = g.createLinearGradient(hx, hy, hx + dir * 60 * s, hy);
    beam.addColorStop(0, 'rgba(255,240,200,0.32)'); beam.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = beam; g.beginPath(); g.moveTo(hx, hy - 1.2 * s); g.lineTo(hx + dir * 60 * s, hy - 8 * s); g.lineTo(hx + dir * 60 * s, y + 2 * s); g.lineTo(hx, hy + 1.5 * s); g.fill();
    if (A.tail) glow(g, x - dir * (50 - A.tail[0][0]) * s, y - (A.tail[0][1] + 1.5) * s, 6 * s, '#ff2a1a', 0.7);
    g.restore();
  }
}

// Imagen cacheada del auto de lado (para el diario y las listas)
const _thumbs = new Map();
function carThumb(car, w = 220, h = 90) {
  const key = JSON.stringify([car.model, car.color, car.mods, car.p && car.p.tires && car.p.tires.k, w, h]);
  let url = _thumbs.get(key);
  if (!url) {
    const c = makeCanvas(w * 2, h * 2), g = c.getContext('2d');
    g.scale(2, 2);
    drawCarSide(g, car, w / 2, h - 8, w * 0.92);
    url = c.toDataURL();
    if (_thumbs.size > 120) _thumbs.clear();
    _thumbs.set(key, url);
  }
  return url;
}

// ----- De atrás: el rival en la carrera. w = ancho en píxeles; light = cuánto lo alumbran tus faros (0..1) -----
function drawCarRear(g, car, x, y, w, o = {}) {
  const A = ART[car.model], R = A.rear, light = clamp(o.light ?? 0.5, 0, 1);
  const h = w * 0.74, lit = c => css(mix('#05060a', c, 0.1 + light * 0.8));
  const paint = car.color, wide = car.p && car.p.tires && /slick|wide/.test(car.p.tires.k);
  const bodyB = -h * 0.13, belt = -h * (R.deck + (R.open ? 0 : 0.11)), roofT = -h * (R.open ? 0.66 : 0.98) + (car.mods.chop ? h * 0.06 : 0) + (car.mods.lowered ? h * 0.03 : 0);
  const low = car.mods.lowered ? h * 0.03 : 0;
  g.save(); g.translate(x, y);
  // sombra
  const sg = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.62);
  sg.addColorStop(0, 'rgba(0,0,0,0.7)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.scale(1, 0.12); g.fillStyle = sg; g.beginPath(); g.arc(0, 0, w * 0.62, 0, TAU); g.fill(); g.restore();
  g.translate(0, low);
  // neumáticos
  const tw = w * (wide ? 0.19 : 0.15);
  for (const d of [-1, 1]) {
    g.fillStyle = '#070707'; roundRect(g, d * w * 0.44 - tw / 2, -h * 0.24, tw, h * 0.24 - low, tw * 0.25); g.fill();
    g.fillStyle = `rgba(255,255,255,${0.04 + light * 0.06})`; g.fillRect(d * w * 0.44 - tw / 2 + tw * 0.15, -h * 0.22, tw * 0.12, h * 0.18);
  }
  // carrocería: maleta abombada en los autos antiguos, aletas en los de fines de los 50
  const rr = R.roundness, fin = R.fin * h * 0.13;
  g.beginPath();
  g.moveTo(-w * 0.47, bodyB);
  g.lineTo(-w * 0.5, belt + h * 0.12 * rr);
  if (fin > 1) { g.lineTo(-w * 0.5, belt - fin); g.lineTo(-w * 0.43, belt - fin * 0.3); g.lineTo(-w * 0.4, belt); }
  else g.quadraticCurveTo(-w * 0.5, belt, -w * (0.5 - 0.12 * rr), belt - h * 0.02 * rr);
  g.quadraticCurveTo(0, belt - h * (0.03 + 0.1 * rr), w * (fin > 1 ? 0.4 : 0.5 - 0.12 * rr), fin > 1 ? belt : belt - h * 0.02 * rr);
  if (fin > 1) { g.lineTo(w * 0.43, belt - fin * 0.3); g.lineTo(w * 0.5, belt - fin); g.lineTo(w * 0.5, belt + h * 0.12 * rr); }
  else g.quadraticCurveTo(w * 0.5, belt, w * 0.5, belt + h * 0.12 * rr);
  g.lineTo(w * 0.47, bodyB);
  g.closePath();
  g.fillStyle = lit(paint); g.fill();
  const bg = g.createLinearGradient(0, belt - fin, 0, bodyB);
  bg.addColorStop(0, `rgba(255,255,255,${0.1 + light * 0.28})`); bg.addColorStop(0.3, 'rgba(255,255,255,0.03)');
  bg.addColorStop(0.55, 'rgba(0,0,0,0.05)'); bg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = bg; g.fill();
  // brillo a lo ancho de la maleta y línea de la tapa
  g.save(); g.clip();
  const sp = g.createRadialGradient(0, belt + h * 0.05, 0, 0, belt + h * 0.05, w * 0.5);
  sp.addColorStop(0, `rgba(255,255,255,${light * 0.22})`); sp.addColorStop(1, 'rgba(255,255,255,0)');
  g.save(); g.scale(1, 0.25); g.fillStyle = sp; g.fillRect(-w, (belt - h * 0.2) / 0.25, w * 2, h * 0.6 / 0.25); g.restore();
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = Math.max(1, w * 0.006);
  g.beginPath(); g.moveTo(-w * 0.3, belt + h * 0.02); g.lineTo(-w * 0.3, bodyB - h * 0.12); g.lineTo(w * 0.3, bodyB - h * 0.12); g.lineTo(w * 0.3, belt + h * 0.02); g.stroke();
  // salpicaderas sueltas de los autos antiguos
  if (R.fenders) for (const d of [-1, 1]) {
    g.fillStyle = lit(shade(paint, -0.08));
    g.beginPath(); g.ellipse(d * w * 0.45, -h * 0.27, w * 0.11, h * 0.16, 0, Math.PI, 0); g.lineTo(d * w * 0.56, -h * 0.17); g.lineTo(d * w * 0.34, -h * 0.17); g.fill();
  }
  // cabina y vidrio trasero
  if (!R.open) {
    const rw = w * R.roofW * 0.88, bw = w * (0.36 + 0.03 * rr);
    const slope = R.fast ? h * 0.08 : 0;
    g.beginPath();
    g.moveTo(-bw, belt + 1);
    g.bezierCurveTo(-bw, belt - h * 0.1, -rw / 2 - w * 0.03, roofT + h * 0.06, -rw / 2, roofT + h * 0.02);
    g.quadraticCurveTo(0, roofT - h * 0.025 * (1 + rr), rw / 2, roofT + h * 0.02);
    g.bezierCurveTo(rw / 2 + w * 0.03, roofT + h * 0.06, bw, belt - h * 0.1, bw, belt + 1);
    g.closePath();
    g.fillStyle = lit(car.mods.roof || paint); g.fill();
    const cg = g.createLinearGradient(0, roofT, 0, belt);
    cg.addColorStop(0, `rgba(255,255,255,${0.12 + light * 0.2})`); cg.addColorStop(1, 'rgba(0,0,0,0.25)');
    g.fillStyle = cg; g.fill();
    // vidrio
    const gw = rw * 0.86, gb = bw * 0.82;
    g.beginPath();
    g.moveTo(-gb, belt - h * 0.06);
    g.bezierCurveTo(-gb, belt - h * 0.12, -gw / 2 - w * 0.02, roofT + h * 0.1 + slope, -gw / 2, roofT + h * 0.07 + slope);
    g.quadraticCurveTo(0, roofT + h * 0.045 + slope, gw / 2, roofT + h * 0.07 + slope);
    g.bezierCurveTo(gw / 2 + w * 0.02, roofT + h * 0.1 + slope, gb, belt - h * 0.12, gb, belt - h * 0.06);
    g.closePath();
    const gg = g.createLinearGradient(0, roofT, 0, belt);
    gg.addColorStop(0, '#2a3450'); gg.addColorStop(0.5, '#0c1220'); gg.addColorStop(1, '#03050a');
    g.fillStyle = gg; g.fill();
    g.strokeStyle = css(mix('#111', '#d9dfe5', light * 0.8)); g.lineWidth = Math.max(1, w * 0.008); g.stroke();
    // el conductor en silueta y un reflejo en el vidrio
    g.save(); g.clip();
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(-w * 0.15, belt - h * 0.1, w * 0.065, h * 0.11, 0, 0, TAU); g.fill();
    g.fillRect(-w * 0.26, belt - h * 0.04, w * 0.22, h * 0.06);
    g.fillStyle = `rgba(255,255,255,${0.05 + light * 0.1})`;
    g.beginPath(); g.moveTo(w * 0.05, roofT); g.lineTo(w * 0.13, roofT); g.lineTo(-w * 0.02, belt); g.lineTo(-w * 0.1, belt); g.fill();
    g.restore();
  } else {
    // descapotable: el parabrisas visto desde atrás y el conductor
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(-w * 0.15, belt - h * 0.12, w * 0.07, h * 0.11, 0, 0, TAU); g.fill();

  const lit = spriteCanvas(wm, hm), emit = spriteCanvas(wm, hm), dark = spriteCanvas(wm, hm);

function addSeg(T, curve, y, zone) {

  const ein = Math.max(1, Math.floor(n * 0.25)), eout = ein;
  for (let k = 0; k < n; k++) {

    addSeg(T, c, y0 + dy * (1 - Math.cos(Math.PI * t)) / 2, zone);

}

  T.segs.forEach((s, i) => {
    for (const sp of s.sprites) if (SPRITES[sp.key] && SPRITES[sp.key].lamp) {

// La ruta del cerro: sale del pueblo, cruza los naranjos, sube por el cañón, pasa los pozos de petróleo y vuelve
const ZONES = [['town', 0], ['grove', 0.14], ['canyon', 0.38], ['oil', 0.68], ['desert', 0.82], ['town', 0.93]];

  const target = 3400;
  addRun(T, Math.round(260 / SEG), 0, 0, 'town');

  while (T.segs.length * SEG < target) {
    const f = T.segs.length * SEG / target, zone = zoneAt(f);

    const kind = R();

      addRun(T, 10 + Math.floor(R() * 22), side / radius, (R() - 0.5) * 14 * hilly, zone);
    }
  }
  T.finish = T.segs.length * SEG - 40;
  addRun(T, 70, 0, 0, 'town');
  for (let i = 0; i < DRAW_SEGS; i++) addSeg(T, 0, T.segs[T.segs.length - 1].y, 'town');

  const fi = Math.floor(T.finish / SEG), si = Math.floor(T.start / SEG);

  T.segs.forEach((s, i) => {
    const r = R();

    if (i % 6 === 0) placeSprite(T, i, 'post', i % 12 ? 1 : -1, 0.5);
    switch (s.zone) {
      case 'town':
        if (i % 9 === 0) placeSprite(T, i, 'lamp', i % 18 ? 1 : -1, 1.2);
        if (i % 7 === 3) placeSprite(T, i, r < 0.3 ? 'store' + Math.floor(R() * 5) : 'house', R() < 0.5 ? -1 : 1, 7 + R() * 4);
        if (i % 5 === 1 && r > 0.5) placeSprite(T, i, 'palm', R() < 0.5 ? -1 : 1, 3 + R() * 2);
        if (i % 40 === 20) placeSprite(T, i, 'board' + Math.floor(R() * 4), R() < 0.5 ? -1 : 1, 8);
        break;
      case 'grove':
        if (i % 2 === 0) placeSprite(T, i, 'orange', 1, 4 + (i % 4) * 1.5);

        break;
      case 'canyon':
        if (i % 3 === 0) placeSprite(T, i, 'rock' + Math.floor(R() * 3), s.curve >= 0 ? -1 : 1, 3 + R() * 3);
        if (i % 5 === 0) placeSprite(T, i, 'rock' + Math.floor(R() * 3), s.curve >= 0 ? 1 : -1, 10 + R() * 10);
        if (i % 11 === 0) placeSprite(T, i, 'tree', R() < 0.5 ? -1 : 1, 6 + R() * 6);

        if (i % 8 === 0) placeSprite(T, i, 'pole', -1, 2.4);
        if (i % 4 === 2) placeSprite(T, i, 'fence', 1, 2.5);
        break;
      case 'desert':
        if (i % 3 === 0) placeSprite(T, i, 'joshua', R() < 0.5 ? -1 : 1, 3 + R() * 12);

        break;
    }
  });

    const tw = 0.6 + 0.4 * Math.sin(t * 2 + ph);

      for (let k = 0; k < 70; k++) {
        const wx = ((k * 97.3 - scroll * par) % (W + 200) + W + 200) % (W + 200) - 100;
        const on = (k * 7) % 5 !== 0 || Math.sin(t * 3 + k) > 0;
