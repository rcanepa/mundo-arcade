    if (A.head) { const [hx, hy, hr] = A.head; g.fillStyle = PAL.g5; g.beginPath(); g.ellipse(hx, hy, hr * 0.6, hr * 1.05, 0, 0, TAU); g.fill(); g.fillStyle = PAL.y3; g.beginPath(); g.ellipse(hx + hr * 0.2, hy, hr * 0.32, hr * 0.78, 0, 0, TAU); g.fill(); }

function stars(g, x0, y0, w, h, n, seed = 3) {

// Letras gigantes hechas de ampolletas (BOB'S DRIVE-IN)
function bulbText(g, s, x, y, size, on, off, lit = 1) {
  const step = size;
  let cx = x;
  for (const ch of s) {
    const pts = FONT[ch] || [];
    for (const [px, py] of pts) {
      const bx = cx + px * step, by = y + py * step;
      g.fillStyle = off; g.fillRect(bx, by, step - 1, step - 1);
      g.fillStyle = on; g.fillRect(bx + 1, by + 1, step - 3, step - 3);
      if (lit) { g.fillStyle = PAL.w; g.fillRect(bx + 1, by + 1, Math.max(1, step / 3 | 0), Math.max(1, step / 3 | 0)); }
    }
    cx += (FONT_W + 1) * step;
  }
}

function statusBar(g, left, right = '', mid = '') {

  g.fillStyle = PAL.g3; g.fillRect(0, PH - STATUS_H, PW, 1);

  const lw = left ? textWidth(left, 2) + 18 : 6, mw = mid ? textWidth(mid, 2) : 0;

  if (mid && mw > PW - lw - rw) rw = 6;
  else if (right) ptext(g, right, PW - 6, PH - STATUS_H, PAL.r4, 2, { align: 'right' });
  if (mid) ptext(g, mid, lw + Math.max(0, (PW - lw - rw - mw) / 2), PH - STATUS_H, PAL.y3, 2);

// Globo de diálogo (como "It's yours!" del original)
function speechBubble(g, text, x, y, tailX, tailY, o = {}) {
  const lines = wrapText(text, o.maxW || 300, 2);
  const w = Math.max(...lines.map(l => textWidth(l, 2))) + 24, h = lines.length * 22 + 12;
  const bx = clamp(Math.round(x - w / 2), 4, PW - w - 4), by = Math.round(y);
  g.fillStyle = PAL.t3; g.fillRect(bx - 2, by - 2, w + 4, h + 4);
  g.fillStyle = PAL.w; g.fillRect(bx, by, w, h);
  g.beginPath(); g.moveTo(clamp(tailX, bx + 10, bx + w - 30), by + h); g.lineTo(clamp(tailX, bx + 10, bx + w - 30) + 18, by + h); g.lineTo(tailX, tailY); g.fill();
  lines.forEach((l, i) => ptext(g, l, bx + w / 2, by + 8 + i * 22, PAL.k, 2, { align: 'center' }));
}

const PX_HORIZON = 118, PX_CAM_D = 1.25;

// Franja de cerros rojizos en el horizonte (como en el original), del doble del ancho para moverla con las curvas
const pxHills = (() => {
  let c = null;
  return () => {
    if (c) return c;
    c = makeCanvas(PW * 2, 40);
    const g = c.getContext('2d');
    const R = rng(11);
    for (let layer = 0; layer < 3; layer++) {
      g.fillStyle = [PAL.r1, PAL.b2, PAL.o1][layer];
      g.beginPath(); g.moveTo(0, 40);
      for (let x = 0; x <= PW * 2; x += 6) g.lineTo(x, 40 - (8 + layer * 4) - Math.abs(Math.sin(x * 0.013 + layer * 2) * 10) - R() * 6 * (layer + 1) / 2);
      g.lineTo(PW * 2, 40); g.fill();
    }
    // puntitos de matorrales verdes y rojos
    for (let i = 0; i < 260; i++) { g.fillStyle = R() < 0.5 ? PAL.e2 : PAL.r2; g.fillRect(Math.floor(R() * PW * 2), 22 + Math.floor(R() * 18), 2, 1); }
    if (g.getImageData) { const img = g.getImageData(0, 0, c.width, c.height); pixelize(img, 20, true); g.putImageData(img, 0, 0); }
    return c;
  };
})();

// El camino visto desde el asiento: cielo negro con estrellas, cerros, pasto verde, asfalto negro con la línea al centro
function pxRenderRoad(g, T, cam, objs, t) {
  const baseI = Math.floor(cam.z / SEG), baseF = cam.z / SEG - baseI;
  const camY = heightAt(T, cam.z) + CAM_H;
  const base = T.segs[clamp(baseI, 0, T.segs.length - 1)];
  g.fillStyle = PAL.k; g.fillRect(0, 0, PW, PX_HORIZON + 4);
  stars(g, 0, 0, PW, PX_HORIZON - 30, 80, 5);
  const hx = -((cam.scroll || 0) * 0.15 % PW + PW) % PW;
  g.drawImage(pxHills(), Math.round(hx), PX_HORIZON - 36);
  g.fillStyle = PAL.e3; g.fillRect(0, PX_HORIZON + 4, PW, PH - PX_HORIZON);
  const P = [];
  let x = 0, dx = -base.curve * SEG * SEG * baseF, maxy = PH;
  const K = PW / 2 * PX_CAM_D;
  for (let n = 0; n < DRAW_SEGS; n++) {
    const s = T.segs[baseI + n];
    if (!s) break;
    const z1 = (baseI + n) * SEG - cam.z, z2 = z1 + SEG;
    const pr = (zz, xx, yy) => { const sc = K / Math.max(0.1, zz); return [PW / 2 + (xx - cam.x) * sc, PX_HORIZON - (yy - camY) * sc, sc]; };
    const p1 = pr(z1, -x, s.y), p2 = pr(z2, -x - dx, (T.segs[baseI + n + 1] || s).y);
    P[n] = { s, p1, p2, z: z1, clip: maxy };
    x += dx; dx += s.curve * SEG * SEG;
    if (z1 < 0.6 || p2[1] >= p1[1] || p2[1] >= maxy) { P[n].hidden = true; continue; }
    const [x1, y1, k1] = p1, [x2, y2, k2] = p2;
    const alt = Math.floor(s.i / 3) % 2;
    g.fillStyle = alt ? PAL.e3 : PAL.e2; g.fillRect(0, y2, PW, y1 - y2 + 1);
    // cada tramo se estira un píxel hacia abajo para que no queden rayas entre tramos
    const quad = (xa, wa, xb, wb, col) => { g.fillStyle = col; g.beginPath(); g.moveTo(xa - wa, y1 + 1); g.lineTo(xa + wa, y1 + 1); g.lineTo(xb + wb, y2); g.lineTo(xb - wb, y2); g.closePath(); g.fill(); };
    quad(x1, (ROAD_W + 0.6) * k1, x2, (ROAD_W + 0.6) * k2, alt ? PAL.g3 : PAL.g2);
    quad(x1, ROAD_W * k1, x2, ROAD_W * k2, PAL.k);
    if (alt && T.kind !== 'drag') quad(x1, 0.14 * k1, x2, 0.14 * k2, PAL.w);
    if (T.kind === 'drag') quad(x1, 0.12 * k1, x2, 0.12 * k2, alt ? PAL.w : PAL.k);
    if (s.mark === 2) { for (let c = 0; c < 8; c++) quad(x1 + (-ROAD_W + (c + 0.5) * ROAD_W / 4) * k1, ROAD_W / 8 * k1, x2 + (-ROAD_W + (c + 0.5) * ROAD_W / 4) * k2, ROAD_W / 8 * k2, c % 2 ? PAL.k : PAL.w); }
    maxy = p2[1];
  }
  // adornos del costado y autos, de lejos hacia cerca
  const pool = objs.map(o => ({ o, n: Math.floor((o.z - baseI * SEG) / SEG) })).filter(it => it.n >= 0 && it.n < DRAW_SEGS && P[it.n]);
  for (let n = DRAW_SEGS - 1; n >= 1; n--) {
    const q = P[n];
    if (!q) continue;
    for (const sp of q.s.sprites) {
      const S = SPRITES[sp.key];
      if (!S || S.lamp) continue;
      const sc = q.p1[2], sx = q.p1[0] + sp.x * sc, sy = q.p1[1], w = S.w * sc, h = S.h * sc;
      if (sx + w < 0 || sx - w > PW || h < 1) continue;
      const clipH = Math.min(h, q.clip - (sy - h));
      if (clipH <= 0) continue;
      const mirror = S.flip && sp.x < 0;
      if (mirror) { g.save(); g.translate(sx * 2, 0); g.scale(-1, 1); }
      g.drawImage(S.lit, 0, 0, S.lit.width, S.lit.height * clipH / h, sx - w / 2, sy - h, w, clipH);
      if (mirror) g.restore();
    }
    for (const it of pool) if (it.n === n) {
      const o = it.o, f = (o.z - (baseI + n) * SEG) / SEG;
      const sc = lerp(q.p1[2], q.p2[2], f), sx = lerp(q.p1[0], q.p2[0], f) + o.x * sc, sy = lerp(q.p1[1], q.p2[1], f);
      if (sy > q.clip + 30) continue;
      o.draw(g, sx, sy, sc);
    }
  }
  return P;
}

// Semáforo colgado sobre la calle en la partida (rojo: prepárate; verde: ¡ya!)
function pxTrafficLight(g, sx, sy, sc, state) {
  const poleX = sx + (ROAD_W + 1.2) * sc, top = sy - 5.6 * sc;
  g.fillStyle = PAL.g2; g.fillRect(poleX - 0.12 * sc, top, 0.24 * sc, 5.6 * sc);
  g.fillRect(sx - 0.2 * sc, top, poleX - sx + 0.2 * sc, 0.18 * sc);
  const bw = 0.7 * sc, bh = 1.5 * sc, bx = sx - bw / 2, by = top + 0.2 * sc;
  g.fillStyle = PAL.g1; g.fillRect(bx, by, bw, bh);
  g.fillStyle = PAL.g4; g.fillRect(bx, by, bw, Math.max(1, sc * 0.06));
  const lamp = (cy, on, colOn, colOff) => { g.fillStyle = on ? colOn : colOff; g.beginPath(); g.arc(sx, cy, bw * 0.32, 0, TAU); g.fill(); if (on) { g.fillStyle = PAL.w; g.fillRect(sx - bw * 0.12, cy - bw * 0.15, Math.max(1, bw * 0.12), Math.max(1, bw * 0.12)); } };
  lamp(by + bh * 0.28, state === 'red', PAL.r3, PAL.r1);
  lamp(by + bh * 0.72, state === 'green', PAL.e4, PAL.e1);
}

// ----- La cabina (igual para todos los autos, como en el original; solo cambia el color del capó) -----
const COCKPIT = { wheelX: 290, wheelY: 362, wheelR: 138, gaugeY: 296, gaugeR: 44, speedX: 240, tachX: 340, gearX: 548, gearY: 292 };
function chromeTube(g, pts, width) {
  const cols = [PAL.g2, PAL.g4, PAL.g6, PAL.w, PAL.g5, PAL.g3];
  cols.forEach((c, i) => {
    g.strokeStyle = c; g.lineWidth = width * (1 - i / cols.length); g.lineCap = 'round'; g.lineJoin = 'round';
    g.beginPath(); g.moveTo(pts[0][0] - i * 0.6, pts[0][1]);
    for (let k = 1; k < pts.length; k++) g.lineTo(pts[k][0] - i * 0.6, pts[k][1]);
    g.stroke();
  });
}
function pxCockpit(hoodColor) {
  const key = 'cockpit:' + hoodColor;

  if (c) return c;
  c = makeCanvas(PW, PH);
  const g = c.getContext('2d'), C = COCKPIT, ramp = paintRamp(hoodColor);

  // marco del parabrisas: tubo cromado redondeado y pilares
  chromeTube(g, [[40, 130], [56, 40], [90, 22], [550, 22], [590, 40], [606, 130]], 16);
  chromeTube(g, [[56, 40], [34, 140], [26, 214]], 18);
  chromeTube(g, [[590, 40], [612, 140], [622, 214]], 14);
  chromeTube(g, [[16, 70], [12, 214]], 8);
  // espejo retrovisor
  g.fillStyle = PAL.g4; g.fillRect(512, 18, 6, 14);
  g.fillStyle = PAL.g5; g.fillRect(440, 30, 156, 44); g.fillStyle = PAL.w; g.fillRect(440, 30, 156, 2);
  g.fillStyle = PAL.g2; g.fillRect(444, 34, 148, 36);
  // capó del color del auto, con su pliegue al centro y el adorno cromado
  // capó abombado: tono medio, reflejo claro arriba, brillo, y sombra hacia los lados
  g.fillStyle = ramp.dk;
  g.beginPath(); g.moveTo(30, 236); g.quadraticCurveTo(300, 132, 616, 236); g.lineTo(616, 240); g.lineTo(30, 240); g.fill();
  g.fillStyle = ramp.md;
  g.beginPath(); g.moveTo(90, 228); g.quadraticCurveTo(300, 142, 560, 228); g.lineTo(560, 236); g.lineTo(90, 236); g.fill();
  g.fillStyle = ramp.lt; g.beginPath(); g.moveTo(150, 204); g.quadraticCurveTo(300, 160, 470, 204); g.lineTo(470, 210); g.quadraticCurveTo(300, 168, 150, 210); g.fill();
  g.fillStyle = ramp.hi; g.fillRect(250, 186, 90, 3); g.fillRect(280, 182, 30, 2);
  g.fillStyle = ramp.dk; g.fillRect(298, 184, 4, 52);
  g.fillStyle = PAL.g6; g.fillRect(292, 178, 16, 8); g.fillStyle = PAL.w; g.fillRect(294, 178, 8, 3); g.fillStyle = PAL.r3; g.fillRect(297, 182, 6, 3);
  // tablero cromado
  g.fillStyle = PAL.g1; g.fillRect(0, 226, PW, 10);
  const dg = g.createLinearGradient(0, 236, 0, PH);
  dg.addColorStop(0, PAL.g6); dg.addColorStop(0.35, PAL.g5); dg.addColorStop(1, PAL.g3);
  g.fillStyle = dg; g.fillRect(0, 236, PW, PH - 236);
  g.fillStyle = PAL.w; g.fillRect(0, 238, PW, 2);
  // rejillas y botones del tablero
  for (let i = 0; i < 6; i++) { g.fillStyle = PAL.g2; g.fillRect(20 + i * 12, 258, 8, 50); g.fillStyle = PAL.w; g.fillRect(20 + i * 12, 258, 2, 50); }
  for (let i = 0; i < 6; i++) { g.fillStyle = PAL.g2; g.fillRect(470 + i * 12, 352, 8, 22); g.fillStyle = PAL.w; g.fillRect(470 + i * 12, 352, 2, 22); }
  // caja del cambio
  g.fillStyle = PAL.g6; g.fillRect(C.gearX - 40, C.gearY - 36, 80, 72);

  g.fillStyle = PAL.g1; g.fillRect(C.gearX - 30, C.gearY - 26, 60, 52);

    g.fillStyle = PAL.g3; g.beginPath(); g.arc(cx, C.gaugeY, C.gaugeR + 2, 0, TAU); g.fill();
    g.fillStyle = PAL.k; g.beginPath(); g.arc(cx, C.gaugeY, C.gaugeR, 0, TAU); g.fill();
    const a0 = Math.PI * 0.8, a1 = Math.PI * 2.2;
    if (red) { g.strokeStyle = PAL.r3; g.lineWidth = 6; g.beginPath(); g.arc(cx, C.gaugeY, C.gaugeR - 6, a0 + (a1 - a0) * red, a1); g.stroke(); }
    labels.forEach((lab, i) => {
      const a = a0 + (a1 - a0) * i / (labels.length - 1);
      g.fillStyle = PAL.w; g.fillRect(Math.round(cx + Math.cos(a) * (C.gaugeR - 4)) - 1, Math.round(C.gaugeY + Math.sin(a) * (C.gaugeR - 4)) - 1, 3, 3);
      if (lab) ptext(g, lab, cx + Math.cos(a) * (C.gaugeR - 15), C.gaugeY + Math.sin(a) * (C.gaugeR - 15) - 6, PAL.w, 1, { align: 'center' });
    });
  };
  face(C.speedX, ['0', '20', '40', '60', '80', '100', '120', '140'], 0);
  face(C.tachX, ['0', '1', '2', '3', '4', '5', '6', '7', '8'], 0.72);
  ptext(g, 'MPH', C.speedX, C.gaugeY + 14, PAL.g5, 1, { align: 'center' });
  ptext(g, 'RPM', C.tachX, C.gaugeY + 14, PAL.g5, 1, { align: 'center' });
  // volante cromado con sus rayos y la bocina
  const W0 = C.wheelX, H0 = C.wheelY, R0 = C.wheelR;
  for (const [r, col] of [[R0 + 6, PAL.g2], [R0 + 3, PAL.g5], [R0, PAL.w], [R0 - 3, PAL.g6], [R0 - 6, PAL.g4], [R0 - 9, PAL.g2]]) { g.strokeStyle = col; g.lineWidth = 3.4; g.beginPath(); g.arc(W0, H0, r, Math.PI, TAU); g.stroke(); }
  for (const dir of [-1, 1]) {
    g.fillStyle = PAL.g5; g.beginPath(); g.moveTo(W0 + dir * 26, H0 - 14); g.lineTo(W0 + dir * (R0 - 4), H0 - 22); g.lineTo(W0 + dir * (R0 - 4), H0 - 8); g.lineTo(W0 + dir * 26, H0 + 2); g.fill();
    g.fillStyle = PAL.w; g.fillRect(Math.min(W0 + dir * 30, W0 + dir * (R0 - 8)), H0 - 18, Math.abs(R0 - 38), 3);
  }
  g.fillStyle = PAL.g4; g.beginPath(); g.arc(W0, H0 - 6, 30, 0, TAU); g.fill();
  g.fillStyle = PAL.g6; g.beginPath(); g.arc(W0, H0 - 8, 26, 0, TAU); g.fill();
  g.fillStyle = PAL.r3; g.beginPath(); g.arc(W0, H0 - 8, 12, 0, TAU); g.fill();
  g.fillStyle = PAL.w; g.beginPath(); g.arc(W0, H0 - 8, 6, 0, TAU); g.fill();
  if (g.getImageData) {
    const img = g.getImageData(0, 0, PW, PH);

    g.putImageData(img, 0, 0);
  }
  // recorta el parabrisas
  g.globalCompositeOperation = 'destination-out';
  g.beginPath(); g.moveTo(48, 214); g.lineTo(56, 70); g.quadraticCurveTo(64, 34, 100, 30); g.lineTo(540, 30); g.quadraticCurveTo(580, 34, 588, 70); g.lineTo(606, 214); g.lineTo(606, 232); g.quadraticCurveTo(300, 126, 40, 232); g.closePath();
  g.fill();
  // la ventanita del costado izquierdo también deja ver afuera
  g.beginPath(); g.moveTo(20, 90); g.lineTo(28, 214); g.lineTo(18, 214); g.lineTo(18, 90); g.fill();
  g.globalCompositeOperation = 'source-over';
  // espejo: se vuelve a pintar arriba del recorte
  g.fillStyle = PAL.g5; g.fillRect(440, 30, 156, 44); g.fillStyle = PAL.w; g.fillRect(440, 30, 156, 2);
  g.fillStyle = PAL.g2; g.fillRect(444, 34, 148, 36);
  g.fillStyle = PAL.g4; g.fillRect(512, 18, 6, 14);
  PXCACHE.set(key, c);
  return c;
}

// Agujas, cambio y espejo (lo que se mueve en la cabina)
function pxCockpitDynamic(g, race) {
  const C = COCKPIT, me = race.me, v = me.veh, s = me.s;
  const needle = (cx, frac, col) => {
    const a = Math.PI * 0.8 + Math.PI * 1.4 * clamp(frac, 0, 1.03);
    g.strokeStyle = col; g.lineWidth = 3; g.lineCap = 'round';
    g.beginPath(); g.moveTo(cx, C.gaugeY); g.lineTo(cx + Math.cos(a) * (C.gaugeR - 8), C.gaugeY + Math.sin(a) * (C.gaugeR - 8)); g.stroke();
    g.fillStyle = PAL.g6; g.fillRect(cx - 3, C.gaugeY - 3, 6, 6);
  };
  needle(C.speedX, v.v * 2.237 / 140, PAL.r4);
  needle(C.tachX, v.rpm / 8000, PAL.r4);
  // caja de cambios: patrón en H o P R N D L
  const gx = C.gearX, gy = C.gearY;
  if (s.auto) {
    'PRNDL'.split('').forEach((ch, i) => ptext(g, ch, gx + 14, gy - 24 + i * 10, (v.gear === 0 ? 'N' : 'D') === ch ? PAL.y3 : PAL.g4, 1));
    g.fillStyle = PAL.g5; g.fillRect(gx - 12, gy - 24 + (v.gear === 0 ? 2 : 3) * 10, 18, 6);
  } else {
    g.fillStyle = PAL.g4;
    const cols = Math.ceil(v.nGears / 2), cw = 34 / Math.max(1, cols - 1 || 1);
    g.fillRect(gx - 18, gy - 1, 36, 3);
    for (let i = 0; i < cols; i++) g.fillRect(gx - 18 + i * (cols > 1 ? 36 / (cols - 1) : 0) - 1, gy - 18, 3, 36);
    const gr = v.gear, col = gr ? Math.ceil(gr / 2) - 1 : (cols - 1) / 2, up = gr % 2 === 1;
    const kx = gx - 18 + col * (cols > 1 ? 36 / (cols - 1) : 0), ky = gr ? (up ? gy - 18 : gy + 18) : gy;
    g.fillStyle = PAL.w; g.beginPath(); g.arc(kx, ky, 6, 0, TAU); g.fill();
    g.fillStyle = PAL.k; ptext(g, gr ? String(gr) : 'N', kx, ky - 6, PAL.k, 1, { align: 'center' });
    void cw;
  }
  // espejo: lo que viene detrás
  g.save(); g.beginPath(); g.rect(444, 34, 148, 36); g.clip();
  g.fillStyle = PAL.k; g.fillRect(444, 34, 148, 18);
  g.fillStyle = PAL.e2; g.fillRect(444, 52, 148, 18);
  g.fillStyle = PAL.g1; g.beginPath(); g.moveTo(510, 52); g.lineTo(526, 52); g.lineTo(590, 70); g.lineTo(446, 70); g.fill();
  const behind = [];
  if (race.rv.z < me.z) behind.push([race.rv.z, race.rv.x, race.rv.car.color]);
  if (race.cop && race.cop.z < me.z) behind.push([race.cop.z, race.cop.x, '#000000', 1]);
  for (const [z, x, col, cop] of behind) {
    const d = Math.max(4, me.z - z), k = 26 / d;
    const mx = 518 + (x - me.x) * 10 * k, w = Math.max(3, 40 * k), my = 52 + Math.min(14, 120 / d);
    g.fillStyle = col; g.fillRect(mx - w / 2, my - w * 0.6, w, w * 0.5);
    g.fillStyle = PAL.y3; g.fillRect(mx - w / 2, my - w * 0.25, Math.max(1, w * 0.2), Math.max(1, w * 0.12)); g.fillRect(mx + w * 0.3, my - w * 0.25, Math.max(1, w * 0.2), Math.max(1, w * 0.12));
    if (cop && Math.sin(race.t * 14) > 0) { g.fillStyle = PAL.r4; g.fillRect(mx - 2, my - w * 0.8, 4, 3); }
  }
  g.restore();
}

// Un cuadro completo de la carrera: camino → paleta → cabina → agujas → barra de estado
function pxDrawRace(g, race, lo) {
  const me = race.me, T = race.T;
  const objs = [];
  objs.push({ z: T.start + 34, x: 0, draw: (gg, sx, sy, sc) => pxTrafficLight(gg, sx, sy, sc, race.flag === 2 ? 'green' : 'red') });
  if (race.rv.z > me.z + 1) objs.push({ z: race.rv.z, x: race.rv.x, draw: (gg, sx, sy, sc) => {
    const w = Math.max(8, Math.round(2.1 * sc / 4) * 4), spr = pxCarRear(race.rv.car, Math.min(220, w), race.rv.veh.brake > 0.1);
    gg.drawImage(spr, Math.round(sx - spr.width / 2), Math.round(sy - spr.height + 2));
  } });
  for (const o of race.traffic) if (o.z > me.z + 1 && !o.oncoming) objs.push({ z: o.z, x: o.x, draw: (gg, sx, sy, sc) => {
    const w = Math.max(8, Math.round(2 * sc / 4) * 4), spr = pxCarRear(o.car, Math.min(220, w), false);
    gg.drawImage(spr, Math.round(sx - spr.width / 2), Math.round(sy - spr.height + 2));
  } });
  for (const o of race.traffic) if (o.z > me.z + 1 && o.oncoming) objs.push({ z: o.z, x: o.x, draw: (gg, sx, sy, sc) => drawCarFront(gg, sx, sy, 2 * sc, { color: o.color, light: 0.8, headlights: 0.6 }) });
  const shake = (me.veh.offroad ? 2 : 0) + (race.flash > 0 ? 4 : 0);
  g.save(); g.translate(Math.round((Math.random() - 0.5) * shake), Math.round((Math.random() - 0.5) * shake));
  pxRenderRoad(g, T, { z: me.z, x: me.x, scroll: race.scroll }, objs, race.t);
  g.restore();
  if (g.getImageData) { const img = g.getImageData(0, 0, PW, PH); pixelize(img, 24); g.putImageData(img, 0, 0); }
  g.drawImage(pxCockpit(me.car.color), 0, 0);
  pxCockpitDynamic(g, race);
  void lo;
}

// ===== Interfaz dentro del juego, como la del original: botones biselados, cuadros verdes, menús y globos =====
// Es "inmediata": cada cuadro, la pantalla dibuja sus botones y pregunta si les hicieron clic.
const UI = {
  mx: -1, my: -1, clicks: [], click: null, keys: [], enabled: true,
  hover: '', cursor: 'arrow', held: false, mouse: false,

  // ----- entrada -----
  pointer(x, y) { this.mx = x; this.my = y; },
  press(x, y) { this.mx = x; this.my = y; this.held = true; this.clicks.push([x, y]); },
  release() { this.held = false; },
  key(code) { this.keys.push(code); },
  beginFrame() {
    this.click = this.clicks.shift() || null;
    this.hover = ''; this.cursor = 'arrow';
  },
  endFrame() { this.keys.length = 0; },
  takeKey(...codes) { const i = this.keys.findIndex(k => codes.includes(k)); if (i < 0) return false; this.keys.splice(i, 1); return true; },

  // ¿El mouse está sobre este rectángulo?
  over(x, y, w, h) { return this.enabled && this.mx >= x && this.mx < x + w && this.my >= y && this.my < y + h; },
  // Un clic en este rectángulo (y lo consume)
  clicked(x, y, w, h) {
    const c = this.click;
    if (!this.enabled || !c || c[0] < x || c[0] >= x + w || c[1] < y || c[1] >= y + h) return false;
    this.click = null;
    Sound.sfx.click();
    return true;
  },
  // Zona invisible de una escena (el diario, el capó, el reloj...): nombre en la barra de estado y cursor de mano
  hot(x, y, w, h, label, cursor = 'hand') {
    if (this.over(x, y, w, h)) { this.hover = label; this.cursor = cursor; }
    return this.clicked(x, y, w, h);
  },

  // ----- botones -----
  // style: 'grey' (los de diálogo), 'red' (TUNE / PARTS / DONE), 'green'
  button(g, x, y, w, h, label, o = {}) {
    const style = o.style || 'grey', dis = o.disabled;
    const hov = !dis && this.over(x, y, w, h), down = hov && this.held;
    const C = style === 'red' ? [PAL.r3, PAL.r4, PAL.r1, PAL.w] : style === 'green' ? [PAL.e2, PAL.e4, PAL.e1, PAL.e4] : [PAL.g5, PAL.w, PAL.g2, PAL.k];
    g.fillStyle = PAL.k; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    if (style === 'red') { g.fillStyle = PAL.g6; g.fillRect(x, y, w, h); g.fillStyle = PAL.g3; g.fillRect(x + 2, y + 2, w - 2, h - 2); bevel(g, x + 3, y + 3, w - 6, h - 6, C[0], C[1], C[2], down); }
    else bevel(g, x, y, w, h, hov ? (style === 'grey' ? PAL.g6 : PAL.e3) : C[0], C[1], C[2], down);
    const sc = o.scale || 2, ty = y + Math.round(h / 2) - FONT_H * sc / 2 - (sc > 1 ? 1 : 0) + (down ? 1 : 0);
    ptext(g, label, x + w / 2 + (down ? 1 : 0), ty, dis ? PAL.g4 : C[3], sc, { align: 'center' });
    if (hov) { this.cursor = 'hand'; if (o.hint) this.hover = o.hint; }
    if (dis) return false;
    return this.clicked(x, y, w, h);
  },
  // Menú vertical de botones grises (como "Just for kicks / $10 / $50 / Forget it"). Devuelve el índice elegido o -1.
  menu(g, x, y, w, items, o = {}) {
    const h = o.h || 26;
    let chosen = -1;
    g.fillStyle = PAL.k; g.fillRect(x - 4, y - 4, w + 8, items.length * (h + 4) + 4);
    items.forEach((it, i) => {
      const label = typeof it === 'string' ? it : it.label;
      if (this.button(g, x, y + i * (h + 4), w, h, label, { disabled: it.disabled })) chosen = i;
    });
    return chosen;
  },

  // ----- cuadros -----
  // Cuadro verde con borde doble (como "Spare parts" del original)
  greenBox(g, x, y, w, h, title) {
    g.fillStyle = PAL.k; g.fillRect(x - 3, y - 3, w + 6, h + 6);
    g.fillStyle = PAL.e3; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    g.fillStyle = PAL.e2; g.fillRect(x, y, w, h);
    g.fillStyle = PAL.e4; g.fillRect(x + 3, y + 3, w - 6, 1); g.fillRect(x + 3, y + h - 4, w - 6, 1); g.fillRect(x + 3, y + 3, 1, h - 6); g.fillRect(x + w - 4, y + 3, 1, h - 6);
    if (title) { ptext(g, title, x + w / 2, y + 6, PAL.e4, 2, { align: 'center' }); g.fillStyle = PAL.e4; g.fillRect(x + 3, y + 26, w - 6, 1); }
  },
  // Cuadro gris claro (diálogos de compra, el diario)
  greyBox(g, x, y, w, h) {
    g.fillStyle = PAL.k; g.fillRect(x - 2, y - 2, w + 4, h + 4);
    bevel(g, x, y, w, h, PAL.g6, PAL.w, PAL.g4);
  },
  // Lista con flechas para subir y bajar. st = { sel, top }. Devuelve el índice si se eligió uno con doble clic.
  list(g, x, y, w, h, items, st, o = {}) {
    const rowH = 18, rows = Math.floor((h - 8) / rowH);
    st.top = clamp(st.top || 0, 0, Math.max(0, items.length - rows));
    items.slice(st.top, st.top + rows).forEach((it, k) => {
      const i = st.top + k, ry = y + 4 + k * rowH;
      const label = typeof it === 'string' ? it : it.label;
      if (st.sel === i) { g.fillStyle = PAL.e4; g.fillRect(x + 2, ry - 1, w - 34, rowH); }
      ptext(g, label.slice(0, Math.floor((w - 40) / 12)), x + 6, ry, st.sel === i ? PAL.e1 : PAL.e4, 2);
      if (it.right) ptext(g, it.right, x + w - 38, ry, st.sel === i ? PAL.e1 : PAL.e4, 2, { align: 'right' });
      if (this.over(x, ry - 1, w - 34, rowH)) this.cursor = 'hand';
      if (this.clicked(x, ry - 1, w - 34, rowH)) st.sel = i;
    });
    if (!items.length && o.empty) ptext(g, o.empty, x + (w - 34) / 2, y + 30, PAL.e4, 2, { align: 'center' });
    // flechas
    const ax = x + w - 28;
    const arrow = (ay, dir, dbl) => {
      if (this.button(g, ax, ay, 24, 22, dbl ? (dir < 0 ? '«' : '»') : (dir < 0 ? '<' : '>'), { style: 'green', scale: 1 })) st.top += dir * (dbl ? rows : 1);
    };
    arrow(y + 2, -1, false); arrow(y + 28, -1, true); arrow(y + h - 50, 1, true); arrow(y + h - 24, 1, false);
    if (this.takeKey('ArrowDown')) st.sel = Math.min(items.length - 1, (st.sel ?? -1) + 1);
    if (this.takeKey('ArrowUp')) st.sel = Math.max(0, (st.sel ?? 1) - 1);
    if (st.sel !== undefined && st.sel >= 0) { if (st.sel < st.top) st.top = st.sel; if (st.sel >= st.top + rows) st.top = st.sel - rows + 1; }
  },

  // ----- textos -----
  // Pantalla de texto amarillo con esquinas (como el final del original)
  textScreen(g, lines) {
    g.fillStyle = PAL.g3; g.fillRect(0, 0, PW, PH);
    g.fillStyle = PAL.y2;
    for (const [x, y, dx, dy] of [[30, 30, 1, 1], [PW - 30, 30, -1, 1], [30, PH - 30, 1, -1], [PW - 30, PH - 30, -1, -1]]) {
      g.fillRect(Math.min(x, x + dx * 40), y, 40, 3); g.fillRect(x, Math.min(y, y + dy * 40), 3, 40);
    }
    lines.forEach((l, i) => ptext(g, l, 60, 60 + i * 26, PAL.y3, 2, { shadow: PAL.y1 }));
  },

  // ----- campo de texto (el nombre en la licencia) -----
  field(g, x, y, w, st, max = 14) {
    for (const k of this.keys.splice(0)) {
      if (k === 'Backspace') st.text = st.text.slice(0, -1);
      else if (k === 'Enter') st.done = true;
      else if (k.length === 1 && st.text.length < max && FONT[k.toUpperCase()]) st.text += k.toUpperCase();
    }
    ptext(g, st.text, x, y, PAL.u1, 2);
    if (Math.floor(performance.now() / 400) % 2) { g.fillStyle = PAL.u1; g.fillRect(x + textWidth(st.text, 2) + 3, y + 2, 2, 18); }
    g.fillStyle = PAL.k; g.fillRect(x, y + 20, w, 2);
  },

  // ----- cursor (mano, llave o flecha) -----
  drawCursor(g) {
    if (this.mx < 0) return;
    const x = Math.round(this.mx), y = Math.round(this.my);
    const pts = CURSORS[this.cursor] || CURSORS.arrow;
    for (const [c, rows] of pts) { g.fillStyle = c; rows.forEach((row, ry) => { for (let rx = 0; rx < row.length; rx++) if (row[rx] === '#') g.fillRect(x + rx * 2 - (this.cursor === 'hand' ? 6 : 0), y + ry * 2, 2, 2); }); }
  }
};

function newGame(name, seed = Math.floor(Math.random() * 1e9)) {

// ----- El diario de cada mañana -----
function randomUsedCar(R, model) {
  const M = MODELS[model];
  const car = makeCar(model, {
    color: rpick(R, M.colors), body: clamp(0.45 + R() * 0.6, 0.4, 1), ec: clamp(0.4 + R() * 0.65, 0.35, 1),
    tc: clamp(0.5 + R() * 0.55, 0.4, 1), tread: 0.35 + R() * 0.6, fuel: Math.round(2 + R() * 6), tune: Math.round((R() - 0.5) * 8)
  });
  const kind = ENGINES[car.p.engine.k].kind;
  car.extras = [];
  // a veces el dueño anterior le hizo cosas
  if (R() < 0.28) {
    const ik = kind === '8' ? '2x4' : '3x2';
    setSpec(car, { intake: ik, carbs: Array(INTAKES[ik].n).fill(INTAKES[ik].carb) });
    car.extras.push(ik);
  }
  if (R() < 0.2 && !TRANS[car.p.trans.k].auto) { setSpec(car, { trans: 'man4' }); car.extras.push('man4'); }
  if (R() < 0.12) { car.mods.stickers.hotrod = 1; car.extras.push('custom'); }
  if (R() < 0.08) car.mods.stickers.flames = 1;
  return car;
}
function makePaper() {
  const R = rng(S.seed * 7 + S.day * 131 + 5);
  // siempre hay un cacharro barato, para no quedarse sin auto
  const cheap = rpick(R, ['chevy49', 'chevy40c', 'ford32s', 'valiant61', 'chevy38']);
  const junker = randomUsedCar(R, cheap);
  junker.body = 0.45 + R() * 0.1; junker.p.engine.c = 0.4 + R() * 0.15;
  const cars = [junker];
  const pool = MODEL_KEYS.filter(k => k !== cheap);
  for (let i = 0; i < 7; i++) {
    let model = rpick(R, pool);
    if (MODELS[model].price > 1500 && R() < 0.5) model = rpick(R, pool);
    cars.push(randomUsedCar(R, model));
  }
  const ads = cars.map((car, i) => {
    const price = i ? Math.max(150, Math.round(carValue(car) * (0.9 + R() * 0.3) / 5) * 5) : Math.round((250 + R() * 200) / 5) * 5;
    return { car, price, min: Math.round(price * (0.78 + R() * 0.16)), haggled: false, sold: false, words: Math.floor(R() * 6) };
  });
  // repuestos usados mezclados en los avisos
  const used = [];
  for (let i = 0; i < 4; i++) {
    const p = randomPart(R);
    p.c = Math.round((0.5 + R() * 0.4) * 100) / 100;
    used.push({ part: p, price: Math.max(5, Math.round(partPrice(p) * p.c * 0.65 / 5) * 5), sold: false });
  }
  S.paper = { day: S.day, ads, used, news: Math.floor(R() * 1000) };
}
function randomPart(R) {
  const t = rpick(R, ['engine', 'engine', 'intake', 'carb', 'carb', 'trans', 'tires']);
  const fam = rpick(R, FAMS);
  switch (t) {
    case 'engine': return makePart('engine', rpick(R, Object.keys(ENGINES)));
    case 'intake': {
      const ks = Object.keys(INTAKES);
      return makePart('intake', rpick(R, ks), { f: fam });
    }
    case 'carb': return makePart('carb', rpick(R, ['2', '4', '4', '4R']));
    case 'trans': return makePart('trans', rpick(R, ['auto', 'man3', 'man4', 'race4']), { f: fam });
    default: return makePart('tires', rpick(R, ['std', 'ww', 'slick']));
  }
}
// El catálogo de AUTO PARTS: piezas nuevas, siempre las mismas (como en el original)
function catalog() {
  const out = [];
  for (const f of FAMS) for (const k in ENGINES) if (ENGINES[k].fam === f) out.push(makePart('engine', k));
  for (const f of FAMS) for (const k of ['1x2', '3x2', '1x4', '2x4', 'race']) out.push(makePart('intake', k, { f }));
  for (const k in CARBS) out.push(makePart('carb', k));
  for (const k of ['auto', 'man3', 'man4']) for (const f of FAMS) out.push(makePart('trans', k, { f }));
  out.push(makePart('trans', 'man4u', { f: 'all' }));
  for (const f of FAMS) out.push(makePart('trans', 'race4', { f }));
  for (const k in TIRES) out.push(makePart('tires', k));
  return out;
}

// Nombre de una pieza como en los avisos del original ("GM V-8 engine, 283 cu.in.")
function partName(p) {
  const P = L().parts, fam = partFam(p), F = fam === 'all' ? '' : FAM_NAME[fam] + ' ';
  switch (p.t) {
    case 'engine': { const E = ENGINES[p.k]; return P.engine(F, E.kind === '8' ? 'V-8' : P.six, E.ci); }
    case 'intake': return P.intake(F, p.k);
    case 'carb': return P.carb[p.k];
    case 'trans': return P.trans[p.k](F.trim());
    case 'tires': return P.tires[p.k];
  }
  return '?';
}
const carName = car => carTitle(car.model);

// ----- Comprar, regatear y vender -----
function buyCar(i, price) {
  const ad = S.paper.ads[i];
  if (!ad || ad.sold) return 'gone';
  if (S.cars.length >= MAX_CARS) return 'noRoom';
  if (S.money < price) return 'noMoney';
  S.money -= price; ad.sold = true;
  const car = ad.car;
  delete car.extras;
  S.cars.push(car);
  if (!activeCar()) S.active = car.id;
  saveGame();
  return '';
}
// Ofrecer menos plata: el dueño acepta si la oferta llega a su mínimo (se puede regatear una sola vez por aviso)
function haggle(i, offer) {
  const ad = S.paper.ads[i];
  if (!ad || ad.haggled) return false;
  ad.haggled = true;
  if (offer >= ad.min) { ad.price = offer; return true; }
  return false;
}
function buyPart(part, price) {
  if (S.money < price) return 'noMoney';
  S.money -= price;
  S.spares.push(Object.assign({}, part, { id: newId('p') }));
  saveGame();
  return '';
}
// Un comprador ofrece por tu auto o tu repuesto; si no aceptas, viene otro con otra oferta (hasta tres)
const buyerOffer = (value, round) => Math.max(1, Math.round(value * (0.55 + Math.random() * 0.25 + round * 0.04) / 5) * 5);
const partWorth = p => Math.max(2, Math.round(partValue(p) * 0.7));
function sellCar(id, money) {
  const i = S.cars.findIndex(c => c.id === id);
  if (i < 0) return;
  S.money += money; S.cars.splice(i, 1);
  if (S.active === id) S.active = S.cars.length ? S.cars[0].id : null;
  checkBroke(); saveGame();
}
function sellPart(id, money) {
  const i = S.spares.findIndex(p => p.id === id);
  if (i < 0) return;
  S.money += money; S.spares.splice(i, 1); saveGame();
}
function junkCar(id) {
  const car = S.cars.find(c => c.id === id);
  if (!car) return 0;
  const m = junkValue(car);
  sellCar(id, m);
  return m;
}

// ----- El taller: pernos, sacar y poner piezas -----
function loosenBolt(car, sl, i) {
  if (!car.p[sl] || !boltOn(car, sl, i) || blockers(car, sl).length) return false;
  car.tight[sl] &= ~(1 << i); return true;
}
function tightenBolt(car, sl, i) {
  if (!car.p[sl] || boltOn(car, sl, i)) return false;
  car.tight[sl] |= 1 << i; return true;
}
// Saca una pieza con todos sus pernos sueltos y la deja con los repuestos
function removePart(car, sl) {
  const p = car.p[sl];
  if (!p || car.tight[sl] > 0 || blockers(car, sl).length) return false;
  car.p[sl] = null; car.tight[sl] = 0;
  S.spares.push(p);
  _etCache.clear();
  return true;
}
// Pone un repuesto en su lugar (queda con los pernos sueltos)
function installPart(car, partId) {
  const i = S.spares.findIndex(p => p.id === partId);
  if (i < 0) return { why: 'gone' };
  const r = slotFor(car, S.spares[i]);
  if (!r.sl) return r;
  car.p[r.sl] = S.spares[i]; car.tight[r.sl] = 0;
  S.spares.splice(i, 1);
  return r;
}

// ----- Pintura, calcomanías y carrocería -----
function pay(m) { if (S.money < m) return false; S.money -= m; saveGame(); return true; }
function paintCar(car, color) { if (car.color === color || !pay(PAINT_PRICE)) return false; car.color = color; S.pop += 1; saveGame(); return true; }
function addSticker(car, k) { if (car.mods.stickers[k] || !pay(STICKERS[k])) return false; car.mods.stickers[k] = 1; S.pop += 1; saveGame(); return true; }
function removeStickers(car) { car.mods.stickers = {}; saveGame(); }
function bodywork(car, k) {
  if (car.mods[k] || car.mods.roofDays || !pay(BODYWORK[k].price)) return false;
  if (BODYWORK[k].days) car.mods.roofDays = BODYWORK[k].days; else car.mods[k] = 1;
  S.pop += 2;
  _etCache.clear(); saveGame(); return true;
}
// Bencina: tú mismo, o Gus por el doble
function buyGas(car, gal, full) {
  const price = GAS_PRICE * (full ? 2 : 1);
  gal = Math.min(gal, TANK - car.fuel, S.money / price);
  if (gal <= 0.001) return 0;
  S.money -= gal * price; car.fuel += gal;
  return gal;
}
function fixCrash(car) { if (!canRepair(car) || !pay(repairCost(car))) return false; car.body = 1; car.repairs++; saveGame(); return true; }

// ----- Los rivales -----
const rivalById = id => (id === 'king' ? KING : RIVALS.find(r => r.id === id));
const rivalName = r => (typeof r.name === 'object' ? r.name[LANG] : r.name);

// Pasos para preparar el auto de un rival, de lo más barato a lo más caro
function upgradeSteps(car) {
  const fam = MODELS[car.model].fam;
  const big = Object.keys(ENGINES).filter(k => ENGINES[k].fam === fam && ENGINES[k].kind === '8').sort((a, b) => ENGINES[a].hp - ENGINES[b].hp);
  const steps = [
    c => { c.tune = 0; },
    c => { setSpec(c, { intake: ENGINES[c.p.engine.k].kind === '8' ? '2x4' : '3x2' }); },
    c => { setSpec(c, { trans: 'man4' }); },
    c => { setSpec(c, { tires: 'slick' }); }
  ];
  for (const e of big) steps.push(c => { if (ENGINES[e].hp > ENGINES[c.p.engine.k].hp || ENGINES[c.p.engine.k].kind !== '8') setSpec(c, { engine: e, intake: '2x4' }); });
  steps.push(c => { setSpec(c, { intake: 'race', carbs: ['4R', '4R'], trans: 'race4' }); });
  return steps;
}
// Arma el auto de un rival (su modelo de siempre) para que haga más o menos el tiempo pedido.
// Si su auto de fábrica es más rápido que eso, lo "gasta": motor cansado, mal afinado y neumáticos lisos.
function makeRivalCar(r, target, R = Math.random) {
  let car = makeCar(r.model, { color: rpick(R, MODELS[r.model].colors), fuel: TANK, tune: 0 });
  let best = JSON.stringify(car), bestErr = Math.abs(carET(car).et - target);
  if (carET(car).et < target) {
    const base = best;
    for (let w = 0.1; w <= 1.001; w += 0.1) {
      const c = JSON.parse(base);
      c.p.engine.c = 1 - 0.6 * w; c.p.trans.c = 1 - 0.4 * w; c.p.tires.c = 1 - 0.7 * w; c.tune = Math.round(8 * w) * (R() < 0.5 ? -1 : 1);
      const err = Math.abs(carET(c).et - target);
      if (err < bestErr) { bestErr = err; best = JSON.stringify(c); }
    }
  } else {
    for (const step of upgradeSteps(car)) {
      if (carET(car).et <= target) break;
      step(car);
      const err = Math.abs(carET(car).et - target);
      if (err < bestErr) { bestErr = err; best = JSON.stringify(car); }
    }
  }
  car = JSON.parse(best);
  if (R() < 0.3) car.mods.stickers[rpick(R, ['hotrod', 'flames', 'star', 'checker', 'lightning'])] = 1;
  return car;
}
const playerET = () => { const c = activeCar(); return c && carRuns(c) ? carET(c).et : 20; };
function rivalCar(id) {
  if (id === 'king') return buildCar(KING.car);
  const r = rivalById(id), st = S.rivals[id];
  const target = clamp(playerET() + r.edge + (Math.random() - 0.5) * 0.5, 12.6, 24);
  if (!st.car || !carRuns(st.car) || Math.abs(carET(st.car).et - target) > 1.1) st.car = makeRivalCar(r, target);
  return st.car;
}
const totalWins = () => S.wins.drag + S.wins.road + S.wins.kicks;
const kingReady = () => S.wins.drag >= KING_DRAGS && S.wins.road >= KING_ROADS && !S.kingBeaten;

// ----- La noche en Bob's Drive-In -----
function nightQueue() {
  const R = rng(S.seed * 3 + S.day * 977 + 1);
  const avail = RIVALS.filter(r => (r.tier || 0) <= totalWins() && S.rivals[r.id].away <= S.day);
  const q = [];
  const pool = avail.slice();
  while (q.length < 7 && pool.length) q.push(pool.splice(Math.floor(R() * pool.length), 1)[0].id);
  if (kingReady()) q.unshift('king');
  return q;
}
function goDiner() {
  const car = activeCar();
  if (!car || !carRuns(car)) return 'noCar';
  if (car.fuel < 0.6) return 'fuel';
  car.fuel = Math.max(0, car.fuel - 0.4 * ENGINES[car.p.engine.k].ci / 300);
  S.night = { min: OPEN_MIN, queue: nightQueue(), cur: null, raced: [] };
  saveGame();
  return '';
}
// Llega el siguiente rival (o el que llamaste con el tipo del poste)
function nextRival(callId) {
  const N = S.night;
  if (!N) return null;
  N.min += N.cur ? 15 : 5;
  N.cur = null;
  if (callId) N.queue = [callId, ...N.queue.filter(q => q !== callId)];
  while (N.queue.length && N.min < CLOSE_MIN) {
    const id = N.queue.shift();
    if (N.raced.includes(id)) continue;
    N.cur = { id, car: rivalCar(id) };
    return N.cur;
  }
  return null;
}
// Los que se pueden llamar con el tipo del poste
const callable = () => (S.night ? RIVALS.filter(r => (r.tier || 0) <= totalWins() && S.rivals[r.id].away <= S.day && !S.night.raced.includes(r.id)).map(r => r.id).concat(kingReady() ? ['king'] : []) : []);
// ¿El rival acepta? '' si sí; si no, el tipo de excusa
function rivalAnswer(id, type, bet) {
  if (id === 'king') return '';
  const r = rivalById(id), car = activeCar(), rc = S.rivals[id].car;
  if (bet !== 'pinks' && bet > S.money) return 'broke';
  const edge = playerET() - carET(rc).et;                 // positivo: el rival es más rápido
  const conf = edge + r.skill * 0.6 - 0.45 + Math.min(1, S.pop / 40) * 0.3 + (Math.random() - 0.5) * 0.5;
  if (bet === 'pinks') return carValue(car) >= carValue(rc) * 0.45 && conf > 0.35 ? '' : 'noPinks';
  const need = { 0: -9, 10: -1.6, 25: -1.3, 50: -0.8, 100: -0.3 }[bet] ?? -1;
  return conf > need ? '' : bet >= 50 ? 'noMoney' : 'scared';
}
function raceOptions(id, type, bet) {
  const r = rivalById(id);
  return {
    type, bet, car: activeCar(), seed: type === 'road' ? S.roadSeed : S.seed % 997 + S.day,
    rival: { id, name: rivalName(r), look: r.look, car: S.night.cur.car, skill: r.skill, king: id === 'king' },
    police: id === 'king' ? 0 : 0.3
  };
}

// Aplica lo que pasó en la carrera. Devuelve un resumen para la pantalla de resultados.
function applyResult(o, res) {
  const car = o.car, out = { res, money: 0, carWon: null, carLost: null, crash: false, lines: [] };
  const rec = S.rivals[o.rival.id];
  const betMoney = o.bet === 'pinks' ? 0 : o.bet;
  // desgaste: motor, caja y neumáticos; el encendido se corre un poco en cada carrera
  if (car.p.engine) car.p.engine.c = res.blown ? 0 : clamp(car.p.engine.c - res.engineDmg * 0.55 - 0.01, 0, 1);
  if (car.p.trans) car.p.trans.c = res.broken ? 0 : clamp(car.p.trans.c - res.transDmg * 0.6 - 0.005, 0, 1);
  if (car.p.tires) car.p.tires.c = clamp(car.p.tires.c - res.tread, 0, 1);
  if (Math.random() < 0.7) car.tune = clamp((car.tune || 0) + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.3 ? 2 : 1), -10, 10);
  car.fuel = Math.max(0, car.fuel - res.fuel);
  if (res.body) { car.body = clamp(car.body - res.body * (car.mods.nobump ? 1.4 : 1), 0, 1); out.crash = true; }
  if (res.blown) out.lines.push('blown'); else if (res.engineDmg > 0.25) out.lines.push('engineHurt');
  if (res.broken) out.lines.push('broken'); else if (res.transDmg > 0.2) out.lines.push('transHurt');
  _etCache.clear();
  if (res.outcome === 'win') {
    if (o.bet === 0) S.wins.kicks++; else S.wins[o.type]++;
    S.pop += o.bet === 0 ? 1 : 3;
    if (rec) rec.l++;
    S.money += betMoney; out.money = betMoney;
    if (o.bet === 'pinks') {
      const won = o.rival.car;
      won.id = newId('c'); won.fuel = Math.max(won.fuel, 3);
      if (S.cars.length < MAX_CARS) { S.cars.push(won); out.carWon = won; }
      else { const m = Math.round(carValue(won) * 0.7); S.money += m; out.carWon = won; out.autoSold = m; }
      if (rec) { rec.car = null; rec.away = S.day + 6; }
      if (o.rival.id === 'king') { S.kingBeaten = true; S.over = 'king'; addFame(S.name, hoursPlayed()); }
    }
  } else if (res.outcome === 'lose') {
    S.losses++; S.pop = Math.max(0, S.pop - 1);
    if (rec) rec.w++;
    S.money -= betMoney; out.money = -betMoney;
    if (o.bet === 'pinks') {
      out.carLost = car;
      S.cars = S.cars.filter(c => c.id !== car.id);
      S.active = S.cars.length ? S.cars[0].id : null;
    }
  } else if (res.fine) {
    out.fine = res.fine;
    if (S.money >= res.fine) S.money -= res.fine;
    else { S.money = 0; out.jail = true; S.over = 'jail'; }
  }
  if (S.night) { S.night.min += 40; S.night.raced.push(o.rival.id); S.night.cur = null; }
  S.history.push({ d: S.day, r: o.rival.id, t: o.type, b: o.bet, o: res.outcome });
  if (S.history.length > 60) S.history.shift();
  checkBroke();
  saveGame();
  return out;
}

// ----- Pasar los días -----
function endNight() {
  S.night = null;
  S.day++;
  for (const c of S.cars) if (c.mods.roofDays > 0 && --c.mods.roofDays === 0) c.mods.noroof = 1;
  if (S.day >= SUMMER_DAYS && !S.over) S.over = 'summer';
  makePaper();
  saveGame();
}
// Sin auto y sin plata para el auto más barato del diario (contando lo que darían por los repuestos): se acabó
function checkBroke() {
  if (S.over || S.cars.length) return;
  const cheapest = S.paper ? Math.min(...S.paper.ads.filter(a => !a.sold).map(a => a.price), 500) : 300;
  const parts = S.spares.reduce((a, p) => a + partWorth(p), 0);
  if (S.money + parts < cheapest) S.over = 'broke';
}

// ===== Pantallas: cuál se ve, los diálogos que se abren encima y la barra de estado de abajo =====
// Cada pantalla (SCENES.algo) tiene: enter(arg), onExit(), update(dt), draw(g), status(), key(code) y sounds().
const SCENES = {};
const Game = {
  t: 0, name: '', scene: null, sceneT: 0, dialogs: [], note: null, fade: 0,

  go(name, arg) {
    const sc = SCENES[name];
    if (this.scene && this.scene.onExit) this.scene.onExit();
    this.name = name; this.scene = sc; this.sceneT = 0; this.dialogs = []; this.note = null;
    Bubbles.clear(); UI.clicks.length = 0; UI.keys.length = 0;
    this.fade = COVER ? 0 : 0.3;
    if (sc.music !== undefined) Sound.setMusic(sc.music);
    if (sc.enter) sc.enter(arg);
  },
  open(d) { this.dialogs.push(d); UI.clicks.length = 0; return d; },
  close(d) { const i = d ? this.dialogs.indexOf(d) : this.dialogs.length - 1; if (i >= 0) this.dialogs.splice(i, 1); },
  // Aviso corto en la barra de estado (lo que pasó al hacer clic)
  tell(text, t = 3) { this.note = { text, t }; },

  key(code) {
    const d = this.dialogs[this.dialogs.length - 1];
    if (code === 'Escape' || code === 'blur') {
      if (d) { if (code === 'Escape' && d.cancel !== false) { this.close(d); if (d.onCancel) d.onCancel(); } return; }
    }
    if (this.scene && this.scene.key) this.scene.key(code);
  },

  update(dt) {
    this.t += dt; this.sceneT += dt;
    this.fade = Math.max(0, this.fade - dt);
    if (this.note && (this.note.t -= dt) <= 0) this.note = null;
    Bubbles.update(dt);
    if (this.scene.update) this.scene.update(dt);
  },

  draw(g) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = false;
    UI.beginFrame();
    const top = this.dialogs.length;
    UI.enabled = !top;
    this.scene.draw(g);
    this.dialogs.slice().forEach((d, i) => { UI.enabled = i === top - 1; d.draw(g); });
    UI.enabled = true;
    Bubbles.draw(g);
    if (this.scene.status !== false) {
      const st = this.scene.status ? this.scene.status() : defaultStatus();
      statusBar(g, st[0] || '', st[2] || '', this.note ? this.note.text : UI.hover || st[1] || '');
    }
    if (touchControls() && !top) drawTouchControls(g);
    if (this.fade > 0) { g.fillStyle = PAL.k; g.globalAlpha = clamp(this.fade / 0.3, 0, 1); g.fillRect(0, 0, PW, PH); g.globalAlpha = 1; }
    if (UI.mouse) UI.drawCursor(g);
    UI.endFrame();
  },

  // Sonido de motores: solo la carrera y el drive-in los usan
  sounds() {
    if (this.scene && this.scene.sounds) this.scene.sounds(); else Sound.stopEngines();
  }
};
const defaultStatus = () => [S ? L().bankroll(money(S.money)) : '', '', S ? L().shortDate(dateOf(S.day)) : ''];

// ----- Diálogos -----
// Cuadro gris con texto y una fila de botones (como "It's yours!" o "Will you take $345?")
function msgBox(lines, buttons, onPick, o = {}) {
  lines = [].concat(lines);
  const d = {
    cancel: o.cancel, onCancel: () => onPick && onPick(-1),
    draw(g) {
      const wrapped = lines.flatMap(l => (l === '' ? [''] : wrapText(l, (o.w || 420) - 40, 2)));
      const bw = Math.max(90, ...buttons.map(b => textWidth(b, 2) + 24));
      const w = Math.max(o.w || 300, buttons.length * (bw + 12) + 28, ...wrapped.map(l => textWidth(l, 2) + 40));
      const h = wrapped.length * 22 + 74 + (o.extraH || 0);
      const x = Math.round(o.x ?? (PW - w) / 2), y = Math.round(o.y ?? (PH - STATUS_H - h) / 2);
      UI.greyBox(g, x, y, w, h);
      wrapped.forEach((l, i) => ptext(g, l, x + w / 2, y + 14 + i * 22, i === 0 && o.title ? PAL.r2 : PAL.k, 2, { align: 'center' }));
      if (o.extra) o.extra(g, x, y + 14 + wrapped.length * 22, w);
      const total = buttons.length * bw + (buttons.length - 1) * 12;
      buttons.forEach((b, i) => {
        if (UI.button(g, x + (w - total) / 2 + i * (bw + 12), y + h - 44, bw, 30, b)) { Game.close(d); if (onPick) onPick(i); }
      });
      if (UI.enabled && UI.takeKey('Enter')) { Game.close(d); if (onPick) onPick(0); }
    }
  };
  return Game.open(d);
}
const say = (text, cb) => msgBox(text, [L().ok], cb);
// Menú de botones grises en un lugar de la pantalla. El último suele ser "Olvídalo".
function menuBox(x, y, w, items, onPick, o = {}) {
  const d = {
    onCancel: () => onPick(-1),
    draw(g) {
      if (o.title) { const tw = Math.max(w, textWidth(o.title, 2) + 16); g.fillStyle = PAL.k; g.fillRect(x - 4, y - 28, tw + 8, 26); ptext(g, o.title, x + 4, y - 24, PAL.y3, 2); }
      const i = UI.menu(g, x, y, w, items, { h: o.h || 26 });
      if (i >= 0) { Game.close(d); onPick(i); }
    }
  };
  return Game.open(d);
}
// Lista verde con botones abajo (repuestos, autos, llamadas...). items(): lista viva; buttons: [{label, fn(i), need}]
function listBox(title, items, buttons, o = {}) {
  const st = { sel: o.sel ?? 0, top: 0 };
  const w = o.w || 520, h = o.h || 300, x = (PW - w) / 2, y = o.y ?? (PH - STATUS_H - h) / 2;
  const d = {
    draw(g) {
      const list = items();
      if (st.sel >= list.length) st.sel = list.length - 1;
      UI.greenBox(g, x, y, w, h, title);
      UI.list(g, x + 8, y + 34, w - 16, h - 84, list, st, { empty: o.empty });
      if (o.info && list[st.sel]) o.info(g, list[st.sel], x + 12, y + h - 66, st.sel);
      const bw = Math.min(150, (w - 24) / buttons.length - 8);
      buttons.forEach((b, i) => {
        const bx = x + w - 12 - (buttons.length - i) * (bw + 8) + 8;
        const dis = b.need !== false && !list[st.sel];
        if (UI.button(g, bx, y + h - 40, bw, 28, typeof b.label === 'function' ? b.label(list[st.sel]) : b.label, { disabled: dis || (b.disabled && b.disabled(list[st.sel])) })) {
          if (b.close !== false) Game.close(d);

}

const confirmBox = (text, yes, no, cb) => msgBox(text, [yes, no], i => { if (i === 0) cb(); });

// Ofertas de compradores: hasta tres, cada una un poco mejor. onSold(monto)
function offerLoop(value, onSold, round = 0) {
  if (round >= 3) { say(L().noMoreBuyers); return; }
  const offer = buyerOffer(value, round);
  msgBox([L().buyerOffer(money(offer))], [L().ok, L().noThanks], i => {
    if (i === 0) { Sound.sfx.buy(); onSold(offer); } else if (i === 1) offerLoop(value, onSold, round + 1);
  });
}

// Una línea por pieza: "Caja: 4 cambios (bueno)"
function slotLine(car, sl) {
  const T = L(), p = car.p[sl];
  if (!p) return `${T.slot[sl]}: ${T.none}`;
  const name = sl === 'engine' ? partName(p) : sl === 'intake' ? T.parts.intakeShort[p.k] : sl === 'trans' ? T.parts.transShort[p.k] : T.parts.tiresShort[p.k];
  return `${T.slot[sl]}: ${name} (${T.cond(p.c)})`;
}
// Lo que dice el auto cuando le haces clic en la cabina
function carInfo(car) {
  const T = L(), st = carStats(car), p = car.p, probs = carProblems(car);
  const lines = [carName(car), ''];
  for (const sl of ['engine', 'intake', 'trans', 'tires']) lines.push(slotLine(car, sl));
  const n = carbCount(car);
  if (n) lines.push(`${T.slot.carb}: ${[0, 1, 2].slice(0, n).map(i => (p['carb' + i] ? T.parts.carbShort[p['carb' + i].k] : '—')).join(' + ')}`);
  lines.push(T.g.bodyFuel(T.cond(car.body), car.fuel.toFixed(1), TANK));
  lines.push(T.g.weight(Math.round(st.lb)));
  if (probs.length) lines.push('', T.g.problems + ' ' + probs.map(pr => T.problem(pr, car)).join(', '));
  msgBox(lines, [T.ok], null, { w: 560, title: true });
}

function clockMenu() {
  const T = L();
  const items = [T.g.save, T.g.load, T.g.sleep, T.musicLabel(Sound.musicOn), T.langSwitch, T.g.quit, T.forget];
  menuBox(300, 60, 300, items, i => {
    if (i === 0) chpBook('save');
    else if (i === 1) chpBook('load');
    else if (i === 2) confirmBox(T.g.sleepAsk, T.yes, T.forget, () => { endNight(); Game.go('garage'); Game.tell(T.g.newDay); afterLoss(); });
    else if (i === 3) { Sound.toggleMusic(); clockMenu(); }
    else if (i === 4) { setLang(LANG === 'es' ? 'en' : 'es'); clockMenu(); }

// El libro de la Policía de Caminos: una partida guardada por conductor
function chpBook(mode) {
  const T = L();
  if (mode === 'save') { saveSlot(); msgBox([T.chp.title, '', T.chp.saved(S.name)], [T.ok], null, { title: true }); return; }
  listBox(T.chp.title, () => savedDrivers().map(n => ({ label: n })), [

    { label: T.forget, need: false, fn: () => {} }
  ], { empty: T.chp.empty });

// La puerta: salir a Bob's Drive-In o a la bencinera de Gus
function goOut() {
  const T = L(), car = activeCar();
  if (!car) return say(T.g.noCar);
  const probs = carProblems(car).filter(p => p !== 'fuel');
  if (probs.length) return say([T.g.wontStart, probs.map(p => T.problem(p, car)).join(', ')]);
  menuBox(380, 70, 230, [T.g.toBobs, T.g.toGus, T.forget], i => {
    if (i === 0) {
      const r = goDiner();
      if (r === 'fuel') return say(T.g.needGas);
      if (r) return;
      Game.go('cruise', { car, night: true, text: T.cruising, then: () => Game.go('diner') });
    } else if (i === 1) Game.go('cruise', { car, night: false, text: car.fuel < 0.1 ? T.g.pushing : T.cruising, then: () => Game.go('gas') });
  }, { title: T.g.whereTo });
}

// Renglones grises que hacen de texto chico
function fakeText(g, x, y, w, rows, seed) {
  const R = rng(seed);
  g.fillStyle = PAL.g4;
  for (let i = 0; i < rows; i++) g.fillRect(x, y + i * 5, i === rows - 1 ? w * (0.3 + R() * 0.5) : w - Math.floor(R() * 8), 2);

// Foto en gris (como impresa en el diario)
function newsPhoto(car, w) {
  const key = 'photo:' + car.model + car.color + w;
  let c = PXCACHE.get(key);
  if (c) return c;
  const spr = pxCarSide(car, w - 20);
  c = makeCanvas(w, Math.round(w * 0.55));
  const g = c.getContext('2d');
  g.fillStyle = PAL.g5; g.fillRect(0, 0, c.width, c.height);
  g.fillStyle = PAL.g6; g.fillRect(0, 0, c.width, c.height * 0.55);
  g.drawImage(spr, 10, c.height - spr.height - 4);
  if (g.getImageData) {
    const img = g.getImageData(0, 0, c.width, c.height), d = img.data;
    for (let i = 0; i < d.length; i += 4) { const l = d[i] * 0.3 + d[i + 1] * 0.59 + d[i + 2] * 0.11; d[i] = d[i + 1] = d[i + 2] = l * 0.9 + 20; }
    pixelize(img, 60); g.putImageData(img, 0, 0);
  }
  PXCACHE.set(key, c);
  return c;
}

// ===== El taller: el motor visto desde arriba, la caja desde abajo, las ruedas y la lámpara de tiempo =====
// Como en el original: con la llave se sacan los pernos uno por uno; sin pernos, la pieza sale.
const FAM_COLOR = { gm: PAL.o2, ford: PAL.u2, mopar: PAL.r3 };
const BAY = { cx: 320, top: 70, bot: 330 };

// Dónde va cada cosa del motor según sea V-8 o de 6 cilindros
function engineLayout(kind) {
  const v8 = kind !== '6';
  const ix = v8 ? 320 : 286;                       // eje del múltiple (el 6 lo tiene a un lado)
  return {
    v8, ix,
    mounts: [[196, 140], [444, 140], [196, 280], [444, 280]],
    intake: { x: ix - (v8 ? 52 : 36), y: 104, w: v8 ? 104 : 72, h: 196 },
    intakeBolts: v8 ? [[272, 116], [368, 116], [272, 202], [368, 202], [272, 288], [368, 288]] : [[254, 116], [318, 116], [254, 202], [318, 202], [254, 288], [318, 288]],
    carbs: n => (n === 1 ? [[ix, 202]] : n === 2 ? [[ix, 158], [ix, 246]] : [[ix, 136], [ix, 202], [ix, 268]])
  };
}
const carbBolts = (cx, cy, r) => [[cx - r, cy - r], [cx + r, cy - r], [cx - r, cy + r], [cx + r, cy + r]];

function bayBackground(color) {
  return pxBackground('bay:' + color, g => {
    const ramp = paintRamp(color);
    g.fillStyle = PAL.g1; g.fillRect(0, 0, PW, PH);
    g.fillStyle = PAL.k; for (let y = 0; y < 380; y += 3) for (let x = (y % 6) ? 0 : 1; x < PW; x += 3) g.fillRect(x, y, 1, 1);
    // guardabarros a los lados (color del auto)
    for (const [x, w] of [[0, 92], [548, 92]]) {
      g.fillStyle = ramp.md; g.fillRect(x, 0, w, 380);
      g.fillStyle = ramp.lt; g.fillRect(x + (x ? 10 : w - 30), 0, 14, 380);
      g.fillStyle = ramp.hi; g.fillRect(x + (x ? 14 : w - 26), 0, 3, 380);
      g.fillStyle = ramp.dk; g.fillRect(x ? x : w - 6, 0, 6, 380);
    }
    // pasos de rueda dentro del motor
    for (const x of [92, 470]) { g.fillStyle = PAL.k; g.beginPath(); g.ellipse(x + 39, 88, 40, 58, 0, 0, TAU); g.fill(); g.fillStyle = PAL.g2; g.beginPath(); g.ellipse(x + 39, 90, 30, 46, 0, 0, TAU); g.fill(); }
    // radiador y parrilla arriba
    g.fillStyle = PAL.g6; g.fillRect(92, 0, 456, 10);
    g.fillStyle = PAL.g2; g.fillRect(120, 10, 400, 34);
    g.fillStyle = PAL.g3; for (let x = 124; x < 516; x += 4) g.fillRect(x, 12, 1, 30);
    g.fillStyle = PAL.g5; g.fillRect(120, 10, 400, 3); g.fillRect(304, 2, 32, 10); g.fillStyle = PAL.g6; g.fillRect(310, 2, 20, 4);
    // batería y cilindro de freno
    g.fillStyle = PAL.k; g.fillRect(470, 180, 54, 40); g.fillStyle = PAL.g2; g.fillRect(472, 182, 50, 8);
    g.fillStyle = PAL.r3; g.fillRect(478, 176, 8, 6); g.fillStyle = PAL.g4; g.fillRect(508, 176, 8, 6);
    g.fillStyle = PAL.g4; g.fillRect(110, 300, 34, 22); g.fillStyle = PAL.g6; g.fillRect(114, 296, 26, 6);
    // muro de fuego abajo
    g.fillStyle = PAL.k; g.fillRect(92, 336, 456, 44);
    g.fillStyle = PAL.g2; g.fillRect(92, 336, 456, 4);
    g.fillStyle = PAL.g3; for (let x = 110; x < 540; x += 30) g.fillRect(x, 350, 12, 3);
  });
}

// El motor completo (sirve también para mirar bajo el capó del rival). Devuelve los pernos con su posición.
function drawEngineBay(g, car) {
  g.drawImage(bayBackground(car.color), 0, 0);
  const p = car.p, bolts = [];
  const kind = p.engine ? ENGINES[p.engine.k].kind : (ENGINES[MODELS[car.model].stock.engine].kind);
  const Lo = engineLayout(kind);
  // soportes del motor (se ven siempre)
  for (const [x, y] of Lo.mounts) { g.fillStyle = PAL.g3; g.fillRect(x - 14, y - 10, 28, 20); g.fillStyle = PAL.g2; g.fillRect(x - 14, y + 6, 28, 4); }
  if (p.engine) {
    const fam = ENGINES[p.engine.k].fam, col = FAM_COLOR[fam], ramp = paintRamp(col);
    // bloque, ventilador y poleas
    g.fillStyle = PAL.g2; g.fillRect(212, 84, 216, 236);
    g.fillStyle = PAL.g3; g.fillRect(212, 84, 216, 4);
    g.fillStyle = PAL.g4; g.beginPath(); g.arc(320, 64, 18, 0, TAU); g.fill();
    g.fillStyle = PAL.k; for (let a = 0; a < 4; a++) { g.save(); g.translate(320, 64); g.rotate(a * Math.PI / 2 + 0.4); g.fillRect(-4, -34, 8, 30); g.restore(); }
    g.fillStyle = PAL.g6; g.beginPath(); g.arc(320, 64, 6, 0, TAU); g.fill();
    g.strokeStyle = PAL.k; g.lineWidth = 4; g.beginPath(); g.moveTo(300, 70); g.lineTo(262, 92); g.moveTo(340, 70); g.lineTo(378, 92); g.stroke();
    // múltiples de escape a los costados
    g.fillStyle = PAL.b2;
    for (const x of Lo.v8 ? [196, 428] : [404]) { g.fillRect(x, 110, 16, 190); for (let i = 0; i < (Lo.v8 ? 4 : 6); i++) g.fillRect(x + (x < 300 ? 10 : -6), 120 + i * (Lo.v8 ? 48 : 30), 12, 14); }
    // tapas de válvulas del color de la marca
    const cover = (x, w) => {
      g.fillStyle = ramp.dk; g.fillRect(x, 98, w, 212);
      g.fillStyle = ramp.md; g.fillRect(x + 2, 98, w - 6, 208);
      g.fillStyle = ramp.lt; g.fillRect(x + 6, 102, 4, 200);
      for (let y = 112; y < 300; y += 46) { g.fillStyle = PAL.g6; g.fillRect(x + w / 2 - 3, y, 6, 6); g.fillStyle = PAL.g3; g.fillRect(x + w / 2 - 1, y + 2, 2, 2); }
      ptext(g, FAM_NAME[fam], x + w / 2, 196, PAL.w, 1, { align: 'center' });
    };
    if (Lo.v8) { cover(214, 46); cover(380, 46); } else cover(334, 64);
    // pernos del motor (en los soportes)
    Lo.mounts.forEach(([x, y], i) => bolts.push({ sl: 'engine', i, x, y }));
    if (p.intake) {
      const I = Lo.intake, alu = p.intake.k === 'race';
      g.fillStyle = alu ? PAL.g5 : PAL.g3; g.fillRect(I.x, I.y, I.w, I.h);
      g.fillStyle = alu ? PAL.w : PAL.g4; g.fillRect(I.x, I.y, I.w, 3); g.fillRect(I.x, I.y, 3, I.h);
      g.fillStyle = alu ? PAL.g4 : PAL.g2; g.fillRect(I.x + I.w - 3, I.y, 3, I.h); g.fillRect(I.x, I.y + I.h - 3, I.w, 3);
      // runners hacia las culatas
      g.fillStyle = alu ? PAL.g6 : PAL.g4;
      for (let k = 0; k < 4; k++) { const y = I.y + 24 + k * 44; g.fillRect(I.x - (Lo.v8 ? 10 : 0), y, 10, 14); if (Lo.v8) g.fillRect(I.x + I.w, y, 10, 14); else g.fillRect(I.x + I.w, y, 14, 14); }
      Lo.intakeBolts.forEach(([x, y], i) => bolts.push({ sl: 'intake', i, x, y }));
      const n = INTAKES[p.intake.k].n;
      Lo.carbs(n).forEach(([cx, cy], k) => {
        const sl = 'carb' + k, c = p[sl], r = n === 3 ? 13 : 15;
        // base del carburador (siempre se ve si el múltiple está puesto)
        g.fillStyle = PAL.g2; g.fillRect(cx - r - 3, cy - r - 3, 2 * r + 6, 2 * r + 6);
        if (c) {
          const race = c.k === '4R', big = c.k !== '2';
          g.fillStyle = PAL.g4; g.fillRect(cx - r, cy - r, 2 * r, 2 * r);
          if (race) {
            // carburador de carrera: cornetas cromadas abiertas
            for (const [dx, dy] of [[-7, -7], [7, -7], [-7, 7], [7, 7]]) { g.fillStyle = PAL.w; g.beginPath(); g.arc(cx + dx, cy + dy, 6, 0, TAU); g.fill(); g.fillStyle = PAL.k; g.beginPath(); g.arc(cx + dx, cy + dy, 3, 0, TAU); g.fill(); }
          } else {
            // filtro de aire redondo y cromado con su mariposa
            const ar = big ? r + 11 : r + 6;
            g.fillStyle = PAL.g2; g.beginPath(); g.arc(cx, cy, ar + 1, 0, TAU); g.fill();
            g.fillStyle = PAL.g5; g.beginPath(); g.arc(cx, cy, ar, 0, TAU); g.fill();
            g.fillStyle = PAL.w; g.beginPath(); g.arc(cx - ar * 0.3, cy - ar * 0.3, ar * 0.45, 0, TAU); g.fill();
            g.fillStyle = PAL.g6; g.beginPath(); g.arc(cx, cy, ar * 0.7, 0, TAU); g.fill();
            g.fillStyle = PAL.g3; g.fillRect(cx - 7, cy - 2, 14, 4); g.fillStyle = PAL.g4; g.fillRect(cx - 2, cy - 2, 4, 4);
          }
        }
        carbBolts(cx, cy, r + 1).forEach(([x, y], i) => bolts.push({ sl, i, x, y, hidden: !c }));
      });
    } else {
      // sin múltiple: se ven las lumbreras del bloque
      const I = Lo.intake;
      g.fillStyle = PAL.k; g.fillRect(I.x + 6, I.y + 6, I.w - 12, I.h - 12);
      g.fillStyle = PAL.g3; for (let k = 0; k < 4; k++) { g.fillRect(I.x + 10, I.y + 24 + k * 44, 12, 12); g.fillRect(I.x + I.w - 22, I.y + 24 + k * 44, 12, 12); }
      Lo.intakeBolts.forEach(([x, y], i) => bolts.push({ sl: 'intake', i, x, y, hidden: true }));
    }
  } else {
    // sin motor: el hueco y la caja al fondo
    g.fillStyle = PAL.k; g.fillRect(230, 100, 180, 220);
    g.fillStyle = PAL.g2; g.beginPath(); g.moveTo(270, 330); g.lineTo(370, 330); g.lineTo(350, 300); g.lineTo(290, 300); g.fill();
    Lo.mounts.forEach(([x, y], i) => bolts.push({ sl: 'engine', i, x, y, hidden: true }));
  }
  // los pernos: tuerca hexagonal si está puesto, agujero si no
  for (const b of bolts) {
    if (b.hidden) continue;
    b.on = boltOn(car, b.sl, b.i);
    if (b.on) { g.fillStyle = PAL.k; g.fillRect(b.x - 5, b.y - 5, 10, 10); g.fillStyle = PAL.g5; g.fillRect(b.x - 4, b.y - 4, 8, 8); g.fillStyle = PAL.w; g.fillRect(b.x - 4, b.y - 4, 8, 2); g.fillStyle = PAL.g3; g.fillRect(b.x - 1, b.y - 1, 3, 3); }
    else { g.fillStyle = PAL.g4; g.fillRect(b.x - 3, b.y - 3, 6, 6); g.fillStyle = PAL.k; g.fillRect(b.x - 2, b.y - 2, 4, 4); }
  }
  return bolts.filter(b => !b.hidden);
}

// Lo común de las tres vistas del taller: pernos, botones rojos y lista de repuestos
function boltClicks(g, car, bolts) {
  const T = L();
  for (const b of bolts) {
    if (!UI.over(b.x - 8, b.y - 8, 16, 16)) continue;
    g.strokeStyle = PAL.y3; g.lineWidth = 1; g.strokeRect(b.x - 7.5, b.y - 7.5, 15, 15);
    if (UI.hot(b.x - 8, b.y - 8, 16, 16, T.slot[SLOT_INFO[b.sl].t] + (b.on ? ' · ' + T.mech.loosen : ' · ' + T.mech.tighten), 'wrench')) {
      if (b.on) {
        const bl = blockers(car, b.sl);
        if (bl.length) { Sound.sfx.nope(); Game.tell(T.mech.blocked(T.slot[SLOT_INFO[bl[0]].t])); return; }
        loosenBolt(car, b.sl, b.i); Sound.sfx.ratchet();
        if (!car.tight[b.sl]) {
          const part = car.p[b.sl];
          removePart(car, b.sl); Sound.sfx.clunk();
          Game.tell(T.mech.removed(partName(part)));
        }
      } else { tightenBolt(car, b.sl, b.i); Sound.sfx.ratchet(); if (car.tight[b.sl] === allBolts(b.sl)) Game.tell(T.mech.tight); }
      saveGame();
      return;
    }
  }
}
// Lista de repuestos que se pueden poner en esta vista
function installBox(car, types, title) {

// ----- Bob's Drive-In -----
function drawDinerClock(g, min) {
  const cx = 534, cy = 132;
  g.fillStyle = PAL.k; g.beginPath(); g.arc(cx, cy, 15, 0, TAU); g.fill();
  g.fillStyle = PAL.w; g.beginPath(); g.arc(cx, cy, 13, 0, TAU); g.fill();
  g.fillStyle = PAL.k; for (let i = 0; i < 12; i++) { const a = i / 12 * TAU; g.fillRect(Math.round(cx + Math.cos(a) * 11), Math.round(cy + Math.sin(a) * 11), 1, 1); }
  const h = (20 + min / 60) % 12, m = min % 60;
  g.strokeStyle = PAL.k; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(h / 12 * TAU - Math.PI / 2) * 6, cy + Math.sin(h / 12 * TAU - Math.PI / 2) * 6); g.stroke();
  g.strokeStyle = PAL.r3; g.lineWidth = 1;
  g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + Math.cos(m / 60 * TAU - Math.PI / 2) * 10, cy + Math.sin(m / 60 * TAU - Math.PI / 2) * 10); g.stroke();
}

SCENES.race = {
  music: null,
  enter(o) { this.o = o; this.race = new Race(o); this.shown = false; this.paused = false; },
  onExit() { Sound.siren(false, 0); Sound.stopEngines(); },
  update(dt) {
    if (this.paused || Game.dialogs.length) return;
    this.race.update(dt);
    if (this.race.over && !this.shown) { this.shown = true; this.result(); }
  },
  key(code) {
    if ((code === 'Escape' || code === 'KeyP' || code === 'blur') && !this.race.result && !Game.dialogs.length) this.pause();
  },
  pause() {
    const T = L();
    Sound.stopEngines(); Sound.siren(false, 0);
    msgBox([T.race.paused, '', T.race.keys1, T.race.keys2], [T.race.resume, T.race.giveUp], i => {
      if (i === 1) { this.race.finish('lose', 'giveUp'); this.race.endT = 9; }
    }, { w: 560, title: true });
  },
  draw(g) {
    const r = this.race;
    pxDrawRace(g, r);
    // mensajes grandes sobre el parabrisas (¡YA!, la policía...)
    if (r.msg && !r.result) {
      const big = r.msg.text.length < 12;
      wrapText(r.msg.text, 520, big ? 4 : 2).forEach((l, i) => ptext(g, l, PW / 2, 60 + i * (big ? 40 : 22), r.msg.color === '#fff' ? PAL.w : PAL.y2, big ? 4 : 2, { align: 'center', shadow: PAL.k }));
    }
    if (r.phase === 'intro' || r.phase === 'stage') {
      const help = this.o.car.p.trans && TRANS[this.o.car.p.trans.k].auto ? L().race.helpAuto : L().race.help;
      const lines = wrapText(help, 480, 1);
      g.fillStyle = PAL.k; g.fillRect(PW / 2 - 250, 128, 500, lines.length * 11 + 6);
      lines.forEach((l, i) => ptext(g, l, PW / 2, 130 + i * 11, PAL.y3, 1, { align: 'center' }));
    }
  },
  status() {
    const T = L(), r = this.race, v = r.me.veh;
    const gear = v.gear === 0 ? 'N' : r.me.s.auto ? 'D' : String(v.gear);
    let mid = '';
    if (r.phase === 'intro' || r.phase === 'stage') mid = T.race.ready;
    else if (r.phase === 'run') mid = `${Math.round(v.v * 2.237)} mph`;
    return [T.race.gear(gear), mid, r.type === 'drag' ? T.race.dragName : T.race.roadName];
  },
  sounds() {
    const r = this.race;
    if (this.paused || Game.dialogs.length && !r.result) return Sound.stopEngines();
    const me = r.me.veh, rv = r.rv.veh;
    Sound.engine('me', { rpm: me.dead() && me.blown ? 0 : me.rpm, throttle: me.throttle, cyl: r.me.s.cyl, vol: 1, pan: 0 });
    const gap = r.rv.z - r.me.z;
    Sound.engine('rival', { rpm: rv.rpm, throttle: rv.throttle, cyl: r.rv.s.cyl, vol: clamp(1 - Math.abs(gap) / 160, 0, 0.8), pan: clamp(r.rv.x / 4, -0.8, 0.8) });
    Sound.skid(clamp(Math.max(me.spin, r.me.slide || 0) * 0.8, 0, 1));
    Sound.wind(clamp(me.v / 60, 0, 1));
  },
  // El cuadro del resultado: tiempo, velocidad promedio y lo que se ganó o perdió
  result() {
    const T = L(), r = this.race, res = r.result, o = this.o, name = o.rival.name;
    const dist = r.T.finish - r.T.start;
    const lines = [];
    const betText = o.bet === 'pinks' ? null : o.bet ? money(o.bet) : null;
    if (res.outcome === 'win') {
      if (res.reason === 'finish' && res.time) lines.push(T.race.winTime(res.time.toFixed(1), Math.round(dist / res.time * 2.237)));
      else lines.push(T.race.reasons[res.reason] ? T.race.reasons[res.reason](name) : T.race.won);
      lines.push(o.bet === 'pinks' ? T.race.wonPinks(carTitle(o.rival.car.model)) : betText ? T.race.wonMoney(betText) : T.race.congrats);
    } else if (res.outcome === 'lose') {
      if (res.reason === 'finish' && res.rivalTime) lines.push(T.race.loseTime(name, res.rivalTime.toFixed(1), res.time ? res.time.toFixed(1) : '—'));
      else lines.push(T.race.reasons[res.reason] ? T.race.reasons[res.reason](name) : T.race.lost);
      lines.push(o.bet === 'pinks' ? T.race.lostPinks : betText ? T.race.lostMoney(betText) : T.race.better);
    } else {
      lines.push(T.race.reasons[res.reason](name), T.race.fine(money(res.fine)));
    }
    if (res.outcome !== 'void') {
      const line = res.outcome === 'win' ? T.race.rivalLoses : T.race.rivalWins;
      Bubbles.say(o.rival.king ? (res.outcome === 'win' ? T.race.kingLoses : T.race.kingWins) : line[Math.floor(Math.random() * line.length)], PW / 2, 26, PW / 2 + 40, 110, 99);
    }
    msgBox(lines, [T.ok], () => this.done(), { w: 560, y: 150, cancel: false });
  },
  done() {
    Bubbles.clear();
    const res = this.race.result;
    const sum = applyResult(this.o, res);
    if (res.fine) Game.go('ticket', { fine: res.fine, jail: sum.jail, car: this.o.car });
    else if (S.over) Game.go('ending');
    else Game.go('diner', { after: sum });
  }
};

function chromeTitle(g, s, x, y, scale) {
  const w = textWidth(s, scale), x0 = Math.round(x - w / 2);
  // sombra, borde y relleno en bandas de cromo
  ptext(g, s, x0 + scale, y + scale, PAL.k, scale);
  const bands = [PAL.w, PAL.g6, PAL.u4, PAL.u3, PAL.b4, PAL.y3, PAL.w];
  const c = makeCanvas(w + 2, FONT_H * scale + 2), cg = c.getContext('2d');
  ptext(cg, s, 0, 0, PAL.w, scale);
  cg.globalCompositeOperation = 'source-atop';
  const top = 2 * scale, h = 7 * scale;
  bands.forEach((col, i) => { cg.fillStyle = col; cg.fillRect(0, top + Math.floor(i * h / bands.length), w + 2, Math.ceil(h / bands.length)); });
  for (const dx of [-1, 1]) for (const dy of [-1, 1]) ptext(g, s, x0 + dx, y + dy, PAL.u1, scale);
  g.drawImage(c, x0, y);
}

  onExit() { nameEl.blur(); },

  draw(g) {
    const T = L();
    g.fillStyle = PAL.u1; g.fillRect(0, 0, PW, PH);
    g.fillStyle = PAL.p1; for (let y = 0; y < PH; y += 4) g.fillRect(0, y, PW, 1);
    const x = 70, y = 50, w = 500, h = 290;
    g.fillStyle = PAL.k; g.fillRect(x + 6, y + 6, w, h);
    g.fillStyle = PAL.c1; g.fillRect(x, y, w, h);
    g.fillStyle = PAL.e2; g.fillRect(x, y, w, 50);
    ptext(g, T.license.state, x + w / 2, y + 6, PAL.y3, 2, { align: 'center' });
    ptext(g, T.license.dmv, x + w / 2, y + 30, PAL.w, 1, { align: 'center' });
    ptext(g, T.license.title, x + w / 2, y + 60, PAL.r2, 3, { align: 'center' });
    // la foto
    g.fillStyle = PAL.u4; g.fillRect(x + 20, y + 100, 110, 130);
    g.drawImage(pxPortrait(this.look), x + 19, y + 99);
    g.fillStyle = PAL.k; g.strokeStyle = PAL.k; g.lineWidth = 2; g.strokeRect(x + 20, y + 100, 110, 130);
    // el nombre (con el teclado; en el teléfono, tocar el campo abre el teclado)
    ptext(g, T.license.name, x + 150, y + 104, PAL.u1, 1);
    this.st.text = nameEl.value.toUpperCase().replace(/[^A-ZÁÉÍÓÚÑÜ .'-]/g, '').slice(0, 14);
    g.fillStyle = PAL.w; g.fillRect(x + 150, y + 116, 320, 28);
    ptext(g, this.st.text, x + 156, y + 120, PAL.k, 2);
    if (document.activeElement === nameEl && Math.floor(Game.t * 2.5) % 2) { g.fillStyle = PAL.k; g.fillRect(x + 158 + textWidth(this.st.text, 2), y + 122, 2, 18); }
    if (UI.hot(x + 150, y + 116, 320, 28, T.license.typeName, 'arrow')) nameEl.focus();
    const rows = [[T.license.born, '06-16-1946'], [T.license.city, 'Los Angeles, Calif.'], [T.license.cls, T.license.clsValue], [T.license.expires, '1967']];
    rows.forEach(([k, v], i) => { ptext(g, k, x + 150, y + 156 + i * 18, PAL.u1, 1); ptext(g, v, x + 260, y + 156 + i * 18, PAL.k, 1); });
    // el pelo y la polera se eligen con clics en la foto
    if (UI.hot(x + 20, y + 100, 110, 130, T.license.photo)) { const R = Math.random; this.look = { skin: rpick(R, [PAL.b5, PAL.b4, PAL.b3, PAL.b2]), hc: rpick(R, [PAL.k, PAL.b1, PAL.b3, PAL.y2, PAL.o2]), top: rpick(R, [PAL.w, PAL.r3, PAL.u3, PAL.k, PAL.e3]), shades: R() < 0.3 ? 1 : 0 }; }
    const ok = this.st.text.trim().length > 0;
    if (UI.button(g, x + w - 270, y + h - 44, 120, 30, T.ok, { disabled: !ok }) || (ok && UI.takeKey('Enter'))) this.start();
    if (UI.button(g, x + w - 140, y + h - 44, 120, 30, T.cancel)) Game.go('title');
  },
  start() {
    newGame(this.st.text.trim(), undefined);
    S.look = this.look;
    saveGame();
    nameEl.blur();
    Game.go('intro');
  }
};

// Textos de varias páginas sobre fondo gris con esquinas amarillas (como en el original)
function pagesScene(getPages, onEnd, music = 'title') {
  return {
    music, status: false,
    enter() { this.page = 0; },
    key(code) { if (code === 'Escape') onEnd(); else if (code === 'Enter' || code === 'Space') this.next(); },
    next() { if (++this.page >= getPages().length) onEnd(); },
    draw(g) {
      const T = L(), pages = getPages(), lines = pages[Math.min(this.page, pages.length - 1)];
      UI.textScreen(g, lines.flatMap(l => (l ? wrapText(l, 520, 2) : [''])));
      ptext(g, `${this.page + 1}/${pages.length}`, PW - 182, PH - 32, PAL.y2, 1, { align: 'right' });
      if (UI.button(g, PW - 170, PH - 40, 110, 26, this.page < pages.length - 1 ? T.next : T.ok) || UI.clicked(0, 0, PW, PH - 50)) this.next();
    }
  };
}
SCENES.intro = pagesScene(() => L().intro, () => { Game.go('garage'); Game.tell(L().g.startTip, 6); });
SCENES.how = pagesScene(() => L().how, () => Game.go('title'));

// ===== Entrada (mouse, teclado, control y pantalla táctil), pantalla y bucle principal =====
const KEYS = {
  gas: ['ArrowUp', 'KeyW'], brake: ['ArrowDown', 'KeyS'], left: ['ArrowLeft', 'KeyA'], right: ['ArrowRight', 'KeyD'],
  up: ['Space', 'KeyX', 'ShiftRight'], down: ['KeyZ', 'KeyC', 'ShiftLeft'], horn: ['KeyH']
};
const BLOCK_KEYS = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace']);
const IS_TOUCH = typeof matchMedia === 'function' && matchMedia('(pointer: coarse)').matches;

// Botones táctiles de la carrera (se dibujan en la pantalla del juego)
const TOUCH_BTNS = {
  left: [8, 300, 64, 64, '◄'], right: [80, 300, 64, 64, '►'],
  down: [470, 230, 52, 52, '-'], up: [530, 230, 52, 52, '+'],
  brake: [500, 300, 64, 64, 'B'], gas: [570, 300, 64, 64, 'A']
};

const Input = {
  down: new Set(), edges: new Set(), touch: {}, pointers: new Map(), padPrev: {},
  has(name) { return KEYS[name].some(c => this.down.has(c)); },
  pad() {
    const pads = navigator.getGamepads ? [...navigator.getGamepads()].filter(Boolean) : [];
    const p = pads[0];
    if (!p) return null;
    const b = i => !!p.buttons[i] && (p.buttons[i].pressed || p.buttons[i].value > 0.3);
    const ax = p.axes[0] || 0;
    const s = { gas: b(7) || b(12), brake: b(6) || b(13), steer: Math.abs(ax) > 0.2 ? ax : (b(15) ? 1 : 0) - (b(14) ? 1 : 0), up: b(0) || b(5), down: b(2) || b(4), horn: b(3), pause: b(9) };
    const prev = this.padPrev; this.padPrev = s;
    return Object.assign({}, s, { upEdge: s.up && !prev.up, downEdge: s.down && !prev.down, hornEdge: s.horn && !prev.horn, pauseEdge: s.pause && !prev.pause });
  },
  // Lo que pide el jugador este instante en la carrera
  read() {
    const p = this.pad(), t = this.touch;
    const r = {
      gas: this.has('gas') || !!t.gas, brake: this.has('brake') || !!t.brake,
      steer: (this.has('right') || t.right ? 1 : 0) - (this.has('left') || t.left ? 1 : 0),
      up: KEYS.up.some(c => this.edges.has(c)) || this.edges.has('touchUp'), down: KEYS.down.some(c => this.edges.has(c)) || this.edges.has('touchDown'),
      horn: this.edges.has('KeyH')
    };
    if (p) {
      r.gas = r.gas || p.gas; r.brake = r.brake || p.brake; if (p.steer) r.steer = p.steer;
      r.up = r.up || p.upEdge; r.down = r.down || p.downEdge; r.horn = r.horn || p.hornEdge;
      if (p.pauseEdge) Game.key('Escape');
    }
    r.steer = clamp(r.steer, -1, 1);
    this.edges.clear();
    return r;
  },
  // Qué botones táctiles están apretados según los dedos en la pantalla
  syncTouch() {
    const t = {};
    for (const [x, y] of this.pointers.values()) {
      for (const k in TOUCH_BTNS) {
        const [bx, by, bw, bh] = TOUCH_BTNS[k];
        if (x >= bx - 6 && x < bx + bw + 6 && y >= by - 6 && y < by + bh + 6) t[k] = 1;
      }
    }
    if (t.up && !this.touch.up) this.edges.add('touchUp');
    if (t.down && !this.touch.down) this.edges.add('touchDown');
    this.touch = t;
  }
};
const touchControls = () => IS_TOUCH && Game.name === 'race';
function drawTouchControls(g) {
  for (const k in TOUCH_BTNS) {
    const [x, y, w, h, label] = TOUCH_BTNS[k], on = Input.touch[k];
    g.fillStyle = PAL.k; g.fillRect(x - 1, y - 1, w + 2, h + 2);
    bevel(g, x, y, w, h, on ? PAL.y2 : PAL.g4, PAL.g6, PAL.g2, on);
    ptext(g, label, x + w / 2, y + h / 2 - 10, on ? PAL.k : PAL.w, 2, { align: 'center' });
  }
}

// ----- Pantalla: 640×400 agrandado lo más posible, sin suavizar -----
const canvas = document.getElementById('game'), ctx = canvas.getContext('2d');
const nameEl = document.getElementById('name');
ctx.imageSmoothingEnabled = false;
function resize() {
  const s = Math.min(innerWidth / PW, innerHeight / PH);
  // si cabe una escala entera sin perder mucho, se usa (los píxeles quedan todos iguales)
  const si = Math.floor(s), k = si >= 1 && si / s > 0.9 ? si : s;
  const w = Math.floor(PW * k), h = Math.floor(PH * k);
  Object.assign(canvas.style, { width: w + 'px', height: h + 'px', left: Math.floor((innerWidth - w) / 2) + 'px', top: Math.floor((innerHeight - h) / 2) + 'px' });
}
addEventListener('resize', resize);

function toggleFullscreen() {
  const d = document, el = d.documentElement;
  try {
    if (!(d.fullscreenElement || d.webkitFullscreenElement)) (el.requestFullscreen || el.webkitRequestFullscreen).call(el);
    else (d.exitFullscreen || d.webkitExitFullscreen).call(d);
  } catch (e) { /* el navegador no lo permite */ }
}

addEventListener('keydown', e => {
  Sound.init();
  const typing = e.target === nameEl;
  if (BLOCK_KEYS.has(e.code) && !typing) e.preventDefault();
  Input.down.add(e.code);
  if (e.repeat || e.metaKey || e.ctrlKey) return;
  Input.edges.add(e.code);
  if (typing) { if (e.code === 'Enter' || e.code === 'NumpadEnter') UI.key('Enter'); return; }
  if (e.code === 'KeyM' && Game.name !== 'race') { Game.tell(L().musicToggled(Sound.toggleMusic())); return; }
  if (e.code === 'KeyF' && Game.name !== 'license') { toggleFullscreen(); return; }
  UI.key(e.code === 'NumpadEnter' ? 'Enter' : e.code);
  Game.key(e.code);
});
addEventListener('keyup', e => Input.down.delete(e.code));
addEventListener('blur', () => { Input.down.clear(); Game.key('blur'); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { Input.down.clear(); Game.key('blur'); } });

// ----- Mouse y dedos: se pasan a coordenadas de la pantalla de 640×400 -----
const toGame = e => { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * PW, (e.clientY - r.top) / r.height * PH]; };
canvas.addEventListener('pointermove', e => {
  const [x, y] = toGame(e);
  UI.mouse = e.pointerType === 'mouse';
  UI.pointer(x, y);
  if (Input.pointers.has(e.pointerId)) { Input.pointers.set(e.pointerId, [x, y]); Input.syncTouch(); }
});
canvas.addEventListener('pointerdown', e => {
  Sound.init();
  const [x, y] = toGame(e);
  UI.mouse = e.pointerType === 'mouse';
  if (e.pointerType !== 'mouse') { try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* nada */ } }
  if (touchControls() && !Game.dialogs.length) {
    Input.pointers.set(e.pointerId, [x, y]); Input.syncTouch();
    if (Object.keys(Input.touch).length) return;
  }
  UI.press(x, y);
});
const lift = e => {
  if (Input.pointers.delete(e.pointerId)) Input.syncTouch();
  UI.release();
  if (e.pointerType !== 'mouse') UI.pointer(-1, -1);
};
canvas.addEventListener('pointerup', lift);
canvas.addEventListener('pointercancel', lift);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') UI.pointer(-1, -1); });
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ----- Bucle principal: la lógica a 60 pasos por segundo, el dibujo en cada cuadro -----
const STEP = 1 / 60;
let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  acc += dt;
  let n = 0;
  while (acc >= STEP && n < 6) { Game.update(STEP); acc -= STEP; n++; }
  if (n >= 6) acc = 0;
  Game.sounds();
  Game.draw(ctx);
  requestAnimationFrame(frame);
}

resize();
setLang(LANG, false);
Game.go(COVER ? 'cover' : 'title');
requestAnimationFrame(frame);

</script>
