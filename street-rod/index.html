<script>
'use strict';
// ===== Utilidades: números, azar con semilla, colores y dibujo =====
// ?cover = solo la portada, quieta y sin botones (para sacar la imagen del catálogo)
const COVER = typeof location !== 'undefined' && /[?&]cover/.test(location.search || '');
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const approach = (v, target, step) => (v < target ? Math.min(target, v + step) : Math.max(target, v - step));

// Azar con semilla: la ruta y los avisos del diario salen siempre iguales para la misma partida
function rng(seed) {
  let s = (seed >>> 0) || 1;
  return () => {
    s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rpick = (r, arr) => arr[Math.floor(r() * arr.length)];
function hash1(x, s = 0) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(s | 0, 1442695041);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Colores como [r, g, b]; css() los convierte en texto para el canvas
const _rgbCache = new Map();
function rgbOf(c) {
  if (typeof c !== 'string') return c;
  let v = _rgbCache.get(c);
  if (!v) { const n = parseInt(c.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; _rgbCache.set(c, v); }
  return v;
}
function mix(a, b, t) {
  a = rgbOf(a); b = rgbOf(b);
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}
// k > 0 aclara, k < 0 oscurece
const shade = (c, k) => (k >= 0 ? mix(c, [255, 255, 255], k) : mix(c, [0, 0, 0], -k));
function css(c, a = 1) {
  c = rgbOf(c);
  const r = Math.round(c[0]), g = Math.round(c[1]), b = Math.round(c[2]);
  return a >= 1 ? `rgb(${r},${g},${b})` : `rgba(${r},${g},${b},${a.toFixed(3)})`;
}
// Brillo aproximado (0 = negro, 1 = blanco), para elegir texto claro u oscuro
const luma = c => { c = rgbOf(c); return (c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11) / 255; };

const money = n => (n < 0 ? '-$' : '$') + Math.abs(Math.round(n)).toLocaleString('en-US');

// ----- Dibujo -----
function roundRect(g, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  g.beginPath();
  g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
// Traza una curva suave que pasa por los puntos (Catmull-Rom). Un punto [x, y, 1] es una esquina.
function splinePath(g, pts, closed = true, tension = 0.5) {
  const n = pts.length;
  if (n < 2) return;
  const P = i => (closed ? pts[(i + n) % n] : pts[clamp(i, 0, n - 1)]);
  g.moveTo(pts[0][0], pts[0][1]);
  const last = closed ? n : n - 1;
  for (let i = 0; i < last; i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    if (p1[2] && p2[2]) { g.lineTo(p2[0], p2[1]); continue; }
    const t1 = p1[2] ? 0 : tension / 3, t2 = p2[2] ? 0 : tension / 3;
    g.bezierCurveTo(
      p1[0] + (p2[0] - p0[0]) * t1, p1[1] + (p2[1] - p0[1]) * t1,
      p2[0] - (p3[0] - p1[0]) * t2, p2[1] - (p3[1] - p1[1]) * t2,
      p2[0], p2[1]);
  }
  if (closed) g.closePath();
}
// Un resplandor redondo (luces, neón, faros), se suma a lo que ya está dibujado
function glow(g, x, y, r, color, a = 1) {
  if (r <= 0.5 || a <= 0.01) return;
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, css(color, a)); gr.addColorStop(0.25, css(color, a * 0.45)); gr.addColorStop(1, css(color, 0));
  g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
}
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));

}

// Las escenas se dibujan con el canvas normal y luego se pasan a la paleta con tramado (como los juegos VGA de 16 colores).

const PAL_LIST = Object.values(PAL).map(h => rgbOf(h));

// Tabla para pasar cualquier color al más parecido de la paleta (5 bits por canal)
const QLUT = (() => {
  const t = new Uint8Array(32768);
  for (let r = 0; r < 32; r++) for (let g = 0; g < 32; g++) for (let b = 0; b < 32; b++) {
    const R = r * 8 + 4, G = g * 8 + 4, B = b * 8 + 4;
    let best = 0, bd = Infinity;
    PAL_LIST.forEach((p, i) => {
      const dr = R - p[0], dg = G - p[1], db = B - p[2], rm = (R + p[0]) / 2;
      const d = (2 + rm / 256) * dr * dr + 4 * dg * dg + (2 + (255 - rm) / 256) * db * db;
      if (d < bd) { bd = d; best = i; }
    });
    t[(r << 10) | (g << 5) | b] = best;
  }
  return t;
})();
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => v / 16 - 0.47);

// Pasa una imagen a la paleta, con tramado ordenado. Lo que ya es un color de la paleta queda igual.
function pixelize(img, strength = 34, keepAlpha = false) {
  const d = img.data, w = img.width;
  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const a = d[i + 3];
    if (a < 110) { d[i + 3] = 0; continue; }
    let r = d[i], g = d[i + 1], b = d[i + 2];
    const exact = PAL_LIST[QLUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]];
    if (!(exact[0] === r && exact[1] === g && exact[2] === b)) {
      const x = p % w, y = (p / w) | 0, o = BAYER[((y & 3) << 2) | (x & 3)] * strength;
      r = clamp(r + o, 0, 255); g = clamp(g + o, 0, 255); b = clamp(b + o, 0, 255);
      const c = PAL_LIST[QLUT[((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3)]];
      d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
    }
    if (!keepAlpha) d[i + 3] = 255;
  }
  return img;
}
// Contorno de un píxel alrededor de lo que no es transparente (como los sprites dibujados a mano)
function outlineImage(img, color = PAL.k) {
  const d = img.data, w = img.width, h = img.height, c = rgbOf(color);
  const solid = new Uint8Array(w * h);
  for (let p = 0; p < w * h; p++) solid[p] = d[p * 4 + 3] > 0 ? 1 : 0;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const p = y * w + x;
    if (solid[p]) continue;
    if ((x > 0 && solid[p - 1]) || (x < w - 1 && solid[p + 1]) || (y > 0 && solid[p - w]) || (y < h - 1 && solid[p + w])) {
      d[p * 4] = c[0]; d[p * 4 + 1] = c[1]; d[p * 4 + 2] = c[2]; d[p * 4 + 3] = 255;
    }
  }
  return img;
}
// Dibuja con el canvas normal en un lienzo chico y lo deja en pixel art (sprite con contorno)
function pixelSprite(w, h, draw, o = {}) {
  const c = makeCanvas(w + 2, h + 2), g = c.getContext('2d');
  g.translate(1, 1);
  draw(g);
  if (!g.getImageData) return c;
  const img = g.getImageData(0, 0, c.width, c.height);
  pixelize(img, o.dither ?? 34, true);
  if (o.outline !== false) outlineImage(img, o.outline || PAL.k);
  g.putImageData(img, 0, 0);
  return c;
}

// Tildes y eñes se arman sobre la letra base
const ACCENTS = { '´': ['...#.', '..#..'], '~': ['.##.#', '#.##.'], '¨': ['.#.#.', '.....'] };
const COMPOSED = { 'á': 'a´', 'é': 'e´', 'í': 'ı´', 'ó': 'o´', 'ú': 'u´', 'ñ': 'n~', 'ü': 'u¨', 'Á': 'A´', 'É': 'E´', 'Í': 'I´', 'Ó': 'O´', 'Ú': 'U´', 'Ñ': 'N~', 'Ü': 'U¨' };
const FONT_W = 5, FONT_H = 10;
// Cada letra queda como una lista de píxeles [x, y] en una celda de 5×10
const FONT = (() => {
  const out = {};
  const rows = s => s.split('|');
  for (const ch in GLYPHS) {
    const pts = [];
    rows(GLYPHS[ch]).forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '#') pts.push([x, y + 2]); });
    out[ch] = pts;
  }
  for (const ch in COMPOSED) {
    const [base, acc] = COMPOSED[ch];
    const pts = out[base].slice();
    if (base === base.toUpperCase() && base !== 'ı') {
      // las mayúsculas con tilde se achatan un poco para que la tilde quepa arriba
      ACCENTS[acc].forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '#') pts.push([x, y]); });
    } else {
      // las minúsculas tienen libres las dos filas de arriba de la altura de la x
      ACCENTS[acc].forEach((row, y) => { for (let x = 0; x < 5; x++) if (row[x] === '#') pts.push([x, y + 1]); });
    }
    out[ch] = pts;
  }
  return out;
})();
const textWidth = (s, scale = 1) => String(s).length * (FONT_W + 1) * scale - scale;
// Escribe texto con letras de píxeles. align: 'left' | 'center' | 'right'. shadow: color de la sombra.
function ptext(g, s, x, y, color = PAL.w, scale = 1, o = {}) {

  const draw = (dx, dy, col) => {
    g.fillStyle = col;
    let cx = x0 + dx;
    for (const ch of s) {
      const pts = FONT[ch] || FONT['?'];
      for (const [px, py] of pts) g.fillRect(cx + px * scale, y0 + dy + py * scale, scale, scale);
      cx += (FONT_W + 1) * scale;
    }
  };
  if (o.shadow) draw(scale, scale, o.shadow);
  draw(0, 0, color);
  return w;
}
// Corta un texto en líneas que quepan en un ancho
function wrapText(s, maxW, scale = 1) {
  const words = String(s).split(' '), lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (textWidth(t, scale) > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// ----- Herramientas para dibujar a mano -----
// Rectángulo con borde biselado (botones y cuadros como los del juego original)
function bevel(g, x, y, w, h, face, light, dark, inset = false) {
  g.fillStyle = face; g.fillRect(x, y, w, h);
  g.fillStyle = inset ? dark : light; g.fillRect(x, y, w, 2); g.fillRect(x, y, 2, h);
  g.fillStyle = inset ? light : dark; g.fillRect(x, y + h - 2, w, 2); g.fillRect(x + w - 2, y, 2, h);
}
// Tramado de dos colores en un rectángulo (para cielos, sombras y degradados a la antigua)
function ditherRect(g, x, y, w, h, c1, c2, level = 0.5) {
  g.fillStyle = c1; g.fillRect(x, y, w, h);
  g.fillStyle = c2;
  for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
    if (BAYER[((yy + y) & 3) * 4 + ((xx + x) & 3)] + 0.47 < level) g.fillRect(x + xx, y + yy, 1, 1);
  }
}
// Degradado vertical hecho con bandas tramadas entre colores de la paleta
function ditherBands(g, x, y, w, h, colors) {
  const n = colors.length - 1;
  for (let yy = 0; yy < h; yy++) {
    const t = yy / Math.max(1, h - 1) * n, i = Math.min(n - 1, Math.floor(t)), f = t - i;
    for (let xx = 0; xx < w; xx++) {
      const on = BAYER[((y + yy) & 3) * 4 + ((x + xx) & 3)] + 0.47 < f;
      g.fillStyle = on ? colors[i + 1] : colors[i];
      g.fillRect(x + xx, y + yy, 1, 1);
    }
  }
}

// ===== Autos y piezas: qué calza dónde, si el auto anda, cuánta potencia tiene y cuánto vale =====
let _uid = 0;
const newId = p => p + Date.now().toString(36).slice(-5) + (++_uid).toString(36);

// Una pieza suelta o instalada. c = estado (1 = nueva). f = marca (en múltiples y cajas; 'all' si calza en todos).
function makePart(t, k, o = {}) {
  const p = { id: newId('p'), t, k, c: o.c ?? 1 };
  if (t === 'intake' || t === 'trans') p.f = o.f;
  return p;
}
const partFam = p => (p.t === 'engine' ? ENGINES[p.k].fam : p.f || 'all');
function partPrice(p) {
  switch (p.t) {
    case 'engine': return ENGINES[p.k].price;
    case 'intake': return INTAKES[p.k].price;
    case 'carb': return CARBS[p.k].price;
    case 'trans': { const pr = TRANS[p.k].price; return pr[p.f] ?? pr.all; }
    case 'tires': return TIRES[p.k].price;
  }
  return 0;
}
// Lo que vale una pieza usada
const partValue = p => partPrice(p) * (0.35 + 0.65 * (p.c ?? 1));

// ----- Espacios del auto y sus pernos -----
// Para sacar una pieza primero hay que sacar las que están encima (above).
const SLOTS = ['engine', 'intake', 'carb0', 'carb1', 'carb2', 'trans', 'tires'];
const SLOT_INFO = {
  engine: { t: 'engine', bolts: 4, above: ['intake'] },
  intake: { t: 'intake', bolts: 6, above: ['carb0', 'carb1', 'carb2'] },
  carb0:  { t: 'carb', bolts: 4, above: [] },
  carb1:  { t: 'carb', bolts: 4, above: [] },
  carb2:  { t: 'carb', bolts: 4, above: [] },
  trans:  { t: 'trans', bolts: 4, above: [] },
  tires:  { t: 'tires', bolts: 5, above: [] }
};
const ENGINE_SLOTS = ['engine', 'intake', 'carb0', 'carb1', 'carb2'];
// Los pernos de cada pieza se guardan como bits (1 = puesto): así se sabe cuál falta
const allBolts = sl => (1 << SLOT_INFO[sl].bolts) - 1;
const boltOn = (car, sl, i) => !!((car.tight[sl] || 0) & (1 << i));
const carbCount = car => (car.p.intake ? INTAKES[car.p.intake.k].n : 0);

// Un auto de un modelo, con sus piezas de fábrica y todos los pernos apretados
function makeCar(model, o = {}) {
  const M = MODELS[model], s = M.stock;
  const car = {
    id: newId('c'), model, color: o.color || M.colors[0], body: o.body ?? 1, repairs: 0,
    fuel: o.fuel ?? 8, tune: o.tune ?? 0, mods: { stickers: {} }, p: {}, tight: {}
  };
  car.p.engine = makePart('engine', s.engine, { c: o.ec ?? 1 });
  car.p.intake = makePart('intake', s.intake, { f: M.fam });
  for (let i = 0; i < 3; i++) car.p['carb' + i] = i < INTAKES[s.intake].n ? makePart('carb', s.carb) : null;
  car.p.trans = makePart('trans', s.trans, { f: M.fam, c: o.tc ?? 1 });
  car.p.tires = makePart('tires', s.tires, { c: o.tread ?? 1 });
  for (const sl of SLOTS) car.tight[sl] = car.p[sl] ? allBolts(sl) : 0;
  return car;
}

// Arma un auto completo a partir de una ficha (la del Rey, la de un rival o una de prueba)
function buildCar(spec) {
  const car = makeCar(spec.model, { color: spec.color, fuel: 16 });
  setSpec(car, spec);
  if (spec.stickers) Object.assign(car.mods.stickers, spec.stickers);
  if (spec.mods) Object.assign(car.mods, spec.mods);
  return car;
}
// Cambia piezas de un auto ya armado (sin pernos ni banco: para rivales y pruebas)
function setSpec(car, sp) {
  const fam = MODELS[car.model].fam;
  const set = (sl, part) => { car.p[sl] = part; car.tight[sl] = part ? allBolts(sl) : 0; };
  if (sp.engine) set('engine', makePart('engine', sp.engine));
  const kind = ENGINES[car.p.engine.k].kind;
  if (sp.intake || sp.engine) {
    let ik = sp.intake || (kind === '8' ? '1x4' : '1x2');
    if (!intakeFits(ik, kind)) ik = kind === '8' ? '2x4' : '3x2';
    set('intake', makePart('intake', ik, { f: fam }));
    const n = INTAKES[ik].n;
    for (let i = 0; i < 3; i++) set('carb' + i, i < n ? makePart('carb', (sp.carbs && sp.carbs[i]) || INTAKES[ik].carb) : null);
  }
  if (sp.trans) set('trans', makePart('trans', sp.trans, { f: TRANS[sp.trans].all ? 'all' : fam }));
  if (sp.tires) set('tires', makePart('tires', sp.tires));
  if (sp.tune !== undefined) car.tune = sp.tune;
}

// ¿Esta pieza calza en este espacio del auto? Devuelve '' si sí, o el motivo si no.
function fitProblem(car, sl, part) {
  const M = MODELS[car.model], info = SLOT_INFO[sl];
  if (!part || part.t !== info.t) return 'type';
  const eng = car.p.engine;
  switch (sl) {
    case 'engine': return ENGINES[part.k].fam === M.fam ? '' : 'family';
    case 'trans': return part.f === 'all' || part.f === M.fam ? '' : 'family';
    case 'intake':
      if (!eng) return 'noEngine';
      if (part.f !== ENGINES[eng.k].fam) return 'family';
      return intakeFits(part.k, ENGINES[eng.k].kind) ? '' : 'kind';
    case 'tires': return '';
    default: {
      if (!car.p.intake) return 'noIntake';
      const idx = +sl.slice(4), ik = INTAKES[car.p.intake.k];
      if (idx >= ik.n) return 'noRoom';
      return CARBS[part.k].slot === ik.carb ? '' : 'carbType';
    }
  }
}
// El primer espacio libre donde calza la pieza (o null), y si no hay, el motivo
function slotFor(car, part) {
  const cands = SLOTS.filter(sl => SLOT_INFO[sl].t === part.t);
  let why = 'type';
  for (const sl of cands) {
    if (car.p[sl]) { if (why === 'type') why = 'occupied'; continue; }
    const pr = fitProblem(car, sl, part);
    if (!pr) return { sl };
    why = pr;
  }
  return { sl: null, why };
}
// Piezas que impiden sacar la de este espacio
const blockers = (car, sl) => SLOT_INFO[sl].above.filter(a => car.p[a]);

// ¿Anda el auto? Devuelve la lista de problemas (vacía = listo para salir)
function carProblems(car) {
  const out = [], p = car.p;
  for (const sl of ['engine', 'intake', 'trans', 'tires']) if (!p[sl]) out.push('missing:' + sl);
  const n = carbCount(car);
  for (let i = 0; i < n; i++) if (!p['carb' + i]) { out.push('missing:carb'); break; }
  for (const sl of SLOTS) if (p[sl] && (car.tight[sl] || 0) !== allBolts(sl)) { out.push('loose'); break; }
  if (p.engine && p.engine.c <= 0.02) out.push('blown');
  if (p.trans && p.trans.c <= 0.02) out.push('broken');
  if (car.body <= 0.12) out.push('wrecked');
  if (car.mods.roofDays > 0) out.push('roof');
  if (car.fuel <= 0.05) out.push('fuel');
  return out;
}
const carRuns = car => carProblems(car).filter(p => p !== 'fuel').length === 0;

// ----- Números del auto -----
const LB = 0.4536, DRIVER_LB = 165;
// Afinación: tune = grados que el encendido está corrido de la marca (0 = perfecto)
const tuneFactor = t => 1 - Math.min(0.14, Math.abs(t) * 0.014);

function carStats(car) {
  const M = MODELS[car.model], p = car.p;
  const s = { ok: !!(p.engine && p.intake && p.trans && p.tires) };
  const E = ENGINES[(p.engine || { k: M.stock.engine }).k];
  const kind = E.kind, ik = p.intake ? INTAKES[p.intake.k] : INTAKES[kind === '8' ? '1x4' : '1x2'];
  const carbs = [0, 1, 2].slice(0, ik.n).map(i => p['carb' + i]).filter(Boolean);
  const raceCarbs = carbs.length === ik.n && carbs.every(c => c.k === '4R') ? CARBS['4R'].k : 1;
  const ec = p.engine ? p.engine.c : 1;
  s.engine = E; s.cyl = kind === '6' ? 6 : 8;
  s.hp = E.hp * (ik.k[kind] || 1) * raceCarbs * tuneFactor(car.tune) * (0.62 + 0.38 * ec);
  s.peak = E.rpm; s.red = E.red; s.low = 1;
  const tr = TRANS[p.trans ? p.trans.k : M.stock.trans];
  s.auto = !!tr.auto; s.ratios = tr.ratios;
  s.axle = M.axle;
  const tire = TIRES[p.tires ? p.tires.k : 'std'], tread = p.tires ? p.tires.c : 1;
  s.grip = tire.grip * (0.72 + 0.28 * tread);
  s.lat = tire.lat * (0.78 + 0.22 * tread);
  let lb = M.lb - ENGINES[M.stock.engine].lb + E.lb + DRIVER_LB;
  if (car.mods.nobump) lb -= BODYWORK.nobump.lb;
  if (car.mods.noroof) lb -= BODYWORK.noroof.lb;
  s.lb = lb; s.mass = lb * LB;
  s.cda = M.cda * (car.mods.noroof ? 1.05 : 1);
  s.handling = clamp(1.06 - (lb - 2700) / 9000 + (M.cda < 0.8 ? 0.06 : 0), 0.82, 1.15);
  s.tc = p.trans ? p.trans.c : 1;
  s.ec = ec;
  return s;
}

// Lo que vale el auto completo, con sus piezas, su carrocería y sus adornos
function stockPartsValue(model) {
  const M = MODELS[model], s = M.stock, n = INTAKES[s.intake].n;
  return ENGINES[s.engine].price + INTAKES[s.intake].price + CARBS[s.carb].price * n + TRANS[s.trans].price[M.fam] + TIRES[s.tires].price;
}
function carValue(car) {
  const M = MODELS[car.model];
  let parts = 0;
  for (const sl of SLOTS) if (car.p[sl]) parts += partValue(car.p[sl]);
  let extras = 0;
  for (const k in car.mods.stickers || {}) if (car.mods.stickers[k]) extras += STICKERS[k];
  if (car.color !== M.colors[0]) extras += PAINT_PRICE * 0.4;
  const chassis = Math.max(40, M.price - 0.8 * stockPartsValue(car.model)) * (0.3 + 0.7 * car.body) * Math.pow(0.9, car.repairs);
  return Math.round(chassis + parts * 0.8 + extras * 0.5);
}
const junkValue = car => {
  let parts = 0;
  for (const sl of SLOTS) if (car.p[sl]) parts += partValue(car.p[sl]);
  return Math.round(MODELS[car.model].price * 0.1 + parts * 0.3);
};
// Arreglar el choque: cuesta más mientras peor quedó. Muy destrozado o arreglado muchas veces = solo chatarra.
const repairCost = car => Math.round(30 + (1 - car.body) * MODELS[car.model].price * 0.55);
const canRepair = car => car.body > 0.15 && car.repairs < 3;
const TANK = 16, GAS_PRICE = 0.31;

// ===== Física: motor, caja de cambios, embrague, patinazos y zona roja =====
// Todo en metros, segundos y kilos. La velocidad v va en m/s.
const TIRE_R = 0.33, IDLE = 800, G = 9.81, QUARTER = 402.3;
const DRAG_DIST = 920;      // la picada de Street Rod es más larga que un cuarto de milla (unos 30 segundos)
const NET = 0.8;            // los caballos "brutos" de los catálogos de 1963 eran optimistas
const LAUNCH = 0.68;        // a qué fracción de las rpm de potencia máxima se larga mejor
const ENGINE_I = 0.16;      // inercia del motor y volante (kg·m²)

// Potencia relativa a una fracción x de las rpm de máxima potencia (1 en x = 1, cae al pasarse)
const powerCurve = x => Math.max(0, x + x * x - x * x * x);

class Vehicle {
  constructor(stats) {
    this.s = stats;
    this.v = 0; this.dist = 0; this.acc = 0;
    this.rpm = IDLE; this.gear = 0; this.shiftT = 0; this.clutch = 0; this.spin = 0;
    this.throttle = 0; this.brake = 0; this.offroad = 0;
    this.engineDmg = 0; this.transDmg = 0; this.blown = false; this.broken = false; this.dry = false;
    this.grinds = 0; this.redT = 0; this.events = [];
    this.fuelUse = 0;
  }
  get nGears() { return this.s.ratios.length; }
  ratio(g = this.gear) { return g > 0 ? this.s.ratios[g - 1] * this.s.axle : 0; }
  wheelRpm(g = this.gear) { return this.v / TIRE_R * this.ratio(g) * 60 / TAU; }
  dead() { return this.blown || this.broken || this.dry; }

  // Torque del motor (N·m) a unas rpm, sin contar el acelerador
  torque(rpm) {
    const s = this.s, x = Math.max(rpm, IDLE) / s.peak;
    let p = s.hp * 745.7 * NET * powerCurve(x);
    if (x < 0.6) p *= lerp(s.low, 1, x / 0.6);
    return p / (Math.max(rpm, IDLE) * TAU / 60);
  }

  // Suelta el embrague (o el freno, en los automáticos) en la partida
  launch() {
    if (this.gear !== 0) return;
    this.gear = 1;
    this.clutch = this.s.auto ? 0 : this.rpm;
  }

  shiftUp() {
    if (this.gear === 0 || this.gear >= this.nGears || this.s.auto || this.shiftT > 0 || this.dead()) return;
    // Pasar el cambio con el acelerador a fondo raspa la caja y la puede romper
    if (this.throttle > 0.35) {
      this.grinds++;
      this.transDmg += (0.2 + Math.random() * 0.12) * (1.5 - 0.5 * this.s.tc);
      this.events.push('grind');
      if (this.transDmg >= 1) { this.broken = true; this.events.push('broken'); return; }
      this.shiftT = 0.55;
      if (Math.random() < 0.35) return;    // no entró el cambio
    } else {
      this.shiftT = 0.2;
      this.events.push('shift');
    }
    this.gear++;
  }
  shiftDown() {
    if (this.gear <= 1 || this.s.auto || this.shiftT > 0 || this.dead()) return;
    this.gear--;
    this.shiftT = 0.25;
    this.events.push('shift');
  }

  // Cambios automáticos: suben cerca de la potencia máxima y bajan si se pisa a fondo
  autoShift() {
    const s = this.s;
    if (this.gear < 1 || this.shiftT > 0) return;
    const up = this.throttle > 0.6 ? s.peak * 1.06 : s.peak * 0.6;
    if (this.gear < this.nGears && this.wheelRpm() > Math.min(up, s.red - 150)) { this.gear++; this.shiftT = 0.32; this.events.push('autoshift'); }
    else if (this.gear > 1 && this.throttle > 0.9 && this.wheelRpm(this.gear - 1) < s.peak * 0.85) { this.gear--; this.shiftT = 0.3; }
  }

  step(dt, inp) {
    const s = this.s;
    this.throttle = this.dead() ? 0 : clamp(inp.throttle, 0, 1);
    this.brake = clamp(inp.brake, 0, 1);
    if (s.auto) this.autoShift();
    const m = s.mass, ratio = this.ratio(), wr = this.wheelRpm();
    let force = 0, spinTarget = 0;

    if (this.gear === 0) {
      // Detenido en la partida: el motor acelera libre (embrague apretado) hasta las vueltas justas para largar
      const target = IDLE + this.throttle * (s.peak * LAUNCH - IDLE);
      this.rpm = approach(this.rpm, target, (target > this.rpm ? 7000 : 3500) * dt);
    } else if (this.shiftT > 0) {
      // Pasando el cambio: no hay tracción; el motor baja de vueltas (o sube si se acelera)
      this.shiftT -= dt;
      const free = IDLE + this.throttle * (s.red - 200 - IDLE);
      this.rpm = approach(this.rpm, Math.max(free, s.auto ? wr : IDLE), 4500 * dt);
      if (s.auto) force = this.torque(this.rpm) * this.throttle * ratio * 0.35 / TIRE_R;
      if (this.shiftT <= 0 && !s.auto) this.rpm = Math.max(IDLE, wr);
    } else {
      let rpm = wr * (1 + this.spin), mult = 1;
      if (s.auto) {
        // Convertidor de torque: deja subir las vueltas a baja velocidad y multiplica la fuerza
        const stall = 1500 + s.peak * 0.12 * this.throttle;
        if (rpm < stall) { mult = 1 + 0.9 * (1 - rpm / stall); rpm = lerp(rpm, stall, 0.85); }
      } else if (this.clutch > 0) {
        // Embrague patinando en la largada: las vueltas bajan de a poco hasta enganchar
        this.clutch -= 3200 * dt * (0.6 + this.throttle);
        if (this.clutch > rpm) rpm = this.clutch; else this.clutch = 0;
      }
      if (rpm < IDLE) rpm = IDLE;
      this.rpm = Math.min(rpm, s.red + 1400);
      const eff = s.auto ? 0.82 : 0.88;
      force = this.torque(this.rpm) * this.throttle * mult * ratio * eff / TIRE_R;
      // Agarre de las ruedas traseras (al acelerar el peso se va atrás)
      const rear = m * G * (0.5 + 0.1 * clamp(this.acc / G, 0, 1.2));
      const fmax = s.grip * rear * (this.offroad ? 0.65 : 1);
      if (force > fmax) {
        spinTarget = clamp((force / fmax - 1) * 0.9, 0, 1.3);
        force = fmax * 0.9;
      }
    }
    this.spin = approach(this.spin, spinTarget, (spinTarget > this.spin ? 4 : 2.5) * dt);

    // Zona roja: el motor aguanta un rato y después revienta
    if (this.rpm > s.red && !this.blown) {
      const over = (this.rpm - s.red) / 700;
      this.redT += dt;
      this.engineDmg += dt * (0.12 + over * 0.55) * (1.7 - 0.7 * (this.s.ec ?? 1));
      if (this.engineDmg >= 1) { this.blown = true; this.events.push('blown'); }
    } else this.redT = 0;

    const drag = 0.5 * 1.2 * s.cda * this.v * this.v;
    const roll = (0.015 + this.offroad * 0.12) * m * G * (this.v > 0.1 ? 1 : 0);
    const brake = this.brake * 0.8 * G * m * (this.v > 0.05 ? 1 : 0);
    const meff = m + ENGINE_I * (ratio / TIRE_R) * (ratio / TIRE_R) * 0.9;
    const a = (force - drag - roll - brake) / meff;
    this.acc = a;
    this.v = Math.max(0, this.v + a * dt);
    this.dist += this.v * dt;
    this.fuelUse += dt * (0.0004 + 0.0022 * this.throttle * this.rpm / s.red) * s.engine.ci / 300;
  }
}

// ----- Pilotos de la computadora -----
// Devuelve qué hacer este instante: acelerar, frenar, pasar cambios. skill = 0..1.
function makeDriver(skill, rnd = Math.random) {
  return {
    skill,
    react: lerp(0.62, 0.17, skill) + rnd() * 0.12,       // segundos que tarda en largar
    launchAt: lerp(0.45, 0.72, skill) + (rnd() - 0.5) * 0.12,
    shiftAt: lerp(0.9, 1.02, skill) + (rnd() - 0.5) * 0.06,
    lift: 0
  };
}
// Un paso del piloto automático en línea recta. target = velocidad que quiere llevar (m/s), o Infinity.
function driveStraight(veh, drv, dt, goT, target = Infinity) {
  const s = veh.s;
  const inp = { throttle: 0, brake: 0 };
  if (veh.gear === 0) {
    inp.throttle = veh.rpm < s.peak * drv.launchAt ? 1 : 0.4;
    if (goT !== null && goT >= drv.react) { veh.launch(); }
    return inp;
  }
  if (veh.v > target + 1) { inp.brake = clamp((veh.v - target) / 8, 0.15, 1); return inp; }
  inp.throttle = veh.v < target - 2 ? 1 : 0.55;
  if (veh.shiftT > 0 && !s.auto) inp.throttle = 0;
  if (!s.auto) {
    if (drv.lift > 0) { drv.lift -= dt; inp.throttle = 0; if (drv.lift <= 0) { veh.throttle = 0; veh.shiftUp(); } }
    else if (veh.gear < veh.nGears && veh.rpm > Math.min(s.peak * 1.08 * drv.shiftAt, s.red - 60) && veh.shiftT <= 0 && veh.clutch <= 0) {
      drv.lift = 0.06; inp.throttle = 0;
    }
  }
  return inp;
}

// Tiempo del cuarto de milla y velocidad final con un piloto perfecto (para el diario y para elegir rivales)
function quarterMile(stats) {
  const veh = new Vehicle(stats), drv = makeDriver(1, () => 0.5);
  drv.react = 0; drv.launchAt = 0.62; drv.shiftAt = 1;
  const dt = 1 / 120;
  let t = 0;
  for (let i = 0; i < 60 * 120 && veh.dist < QUARTER; i++) {
    veh.step(dt, driveStraight(veh, drv, dt, 1));
    if (veh.gear > 0) t += dt;
  }
  return { et: veh.dist >= QUARTER ? t : 60, trap: veh.v };
}
const _etCache = new Map();
function carET(car) {
  const key = JSON.stringify([car.model, Math.round((car.tune || 0) * 2), car.mods.noroof, car.mods.nobump, SLOTS.map(sl => car.p[sl] ? car.p[sl].k + (car.p[sl].c ?? 1).toFixed(2) : '')]);
  let r = _etCache.get(key);
  if (!r) {
    r = carRuns(car) ? quarterMile(carStats(car)) : { et: 60, trap: 0 };
    if (_etCache.size > 400) _etCache.clear();
    _etCache.set(key, r);
  }
  return r;
}
// Velocidad máxima: la menor entre lo que da el motor contra el viento y la zona roja en el último cambio
function topSpeed(stats) {
  const veh = new Vehicle(stats);
  let best = 0;
  for (let v = 10; v < 90; v += 0.5) {
    veh.v = v;
    const g = veh.nGears, rpm = veh.wheelRpm(g);
    if (rpm > stats.red) break;
    const f = veh.torque(rpm) * veh.ratio(g) * 0.86 / TIRE_R;
    if (f < 0.5 * 1.2 * stats.cda * v * v + 0.015 * stats.mass * G) break;
    best = v;
  }
  return best;
}

// ----- Materiales -----
function chromeGrad(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fbfdff'); gr.addColorStop(0.35, '#c4ccd4'); gr.addColorStop(0.5, '#59626b');
  gr.addColorStop(0.62, '#e9eef3'); gr.addColorStop(1, '#7d8790');
  return gr;
}
function goldGrad(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#fff3c4'); gr.addColorStop(0.45, '#c9962e'); gr.addColorStop(0.55, '#7a5514'); gr.addColorStop(1, '#e8c060');
  return gr;
}
function polyPath(g, pts, smoothIt = false, tension = 0.5) {
  g.beginPath();
  if (smoothIt) { splinePath(g, pts, true, tension); return; }
  g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]);
  g.closePath();
}
// Pintura: color base, luz de arriba, reflejo del horizonte y sombra abajo (en coordenadas del modelo, y hacia arriba)
// Llamas: lenguas de fuego que nacen en la trompa y se curvan hacia atrás
const FLAME_TONGUES = [[4.6, 0.42, 1.8, -1], [3, 0.7, 2.6, 1], [-3.4, 0.6, 2.4, -1], [1, 1, 3.2, -1], [-1.2, 0.82, 3, 1]];
function drawFlames(g, A, color) {
  const x0 = 101.5, len = A.highboy ? 34 : 44, yMid = A.highboy ? 18 : A.belt - 6.2;
  const fg = g.createLinearGradient(x0, 0, x0 - len, 0);
  fg.addColorStop(0, '#fff6b0'); fg.addColorStop(0.25, '#ffd23a'); fg.addColorStop(0.6, '#ff7a14'); fg.addColorStop(1, '#d4210f');
  const edge = luma(color) > 0.6 ? '#7a1a10' : '#57b4ff';
  for (const [dy, fl, th, curl] of FLAME_TONGUES) {
    const y = yMid + dy, L = len * fl, xt = x0 - L, ty = y + curl * th * 1.1;
    g.beginPath();
    g.moveTo(x0, y + th / 2);
    g.bezierCurveTo(x0 - L * 0.45, y + th * 0.75, xt + L * 0.18, ty + th * 0.55, xt, ty);
    g.bezierCurveTo(xt + L * 0.22, ty - curl * th * 0.15 - th * 0.15, x0 - L * 0.5, y - th * 0.55, x0, y - th / 2);
    g.closePath();
    g.fillStyle = fg; g.fill();
    g.strokeStyle = edge; g.lineWidth = 0.3; g.stroke();
  }
}

// ----- De atrás: el rival en la carrera. w = ancho en píxeles; light = cuánto lo alumbran tus faros (0..1) -----
function drawCarRear(g, car, x, y, w, o = {}) {
  const A = ART[car.model], R = A.rear, light = clamp(o.light ?? 0.5, 0, 1);
  const h = w * 0.74, lit = c => css(mix('#05060a', c, 0.1 + light * 0.8));
  const paint = car.color, wide = car.p && car.p.tires && /slick|wide/.test(car.p.tires.k);
  const bodyB = -h * 0.13, belt = -h * (R.deck + (R.open ? 0 : 0.11)), roofT = -h * (R.open ? 0.66 : 0.98) + (car.mods.chop ? h * 0.06 : 0) + (car.mods.lowered ? h * 0.03 : 0);
  const low = car.mods.lowered ? h * 0.03 : 0;
  g.save(); g.translate(x, y);
  // sombra (no en los sprites de pixel art: ahí la pone el que dibuja)
  if (o.flat) { g.save(); g.globalAlpha = 0; }
  const sg = g.createRadialGradient(0, 0, 0, 0, 0, w * 0.62);
  sg.addColorStop(0, 'rgba(0,0,0,0.7)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
  g.save(); g.scale(1, 0.12); g.fillStyle = sg; g.beginPath(); g.arc(0, 0, w * 0.62, 0, TAU); g.fill(); g.restore();
  if (o.flat) g.restore();
  g.translate(0, low);
  // neumáticos
  const tw = w * (wide ? 0.19 : 0.15);
  for (const d of [-1, 1]) {
    g.fillStyle = '#070707'; roundRect(g, d * w * 0.44 - tw / 2, -h * 0.24, tw, h * 0.24 - low, tw * 0.25); g.fill();
    g.fillStyle = `rgba(255,255,255,${0.04 + light * 0.06})`; g.fillRect(d * w * 0.44 - tw / 2 + tw * 0.15, -h * 0.22, tw * 0.12, h * 0.18);
  }
  // carrocería: maleta abombada en los autos antiguos, aletas en los de fines de los 50
  const rr = R.roundness, fin = R.fin * h * 0.13;
  g.beginPath();
  g.moveTo(-w * 0.47, bodyB);
  g.lineTo(-w * 0.5, belt + h * 0.12 * rr);
  if (fin > 1) { g.lineTo(-w * 0.5, belt - fin); g.lineTo(-w * 0.43, belt - fin * 0.3); g.lineTo(-w * 0.4, belt); }
  else g.quadraticCurveTo(-w * 0.5, belt, -w * (0.5 - 0.12 * rr), belt - h * 0.02 * rr);
  g.quadraticCurveTo(0, belt - h * (0.03 + 0.1 * rr), w * (fin > 1 ? 0.4 : 0.5 - 0.12 * rr), fin > 1 ? belt : belt - h * 0.02 * rr);
  if (fin > 1) { g.lineTo(w * 0.43, belt - fin * 0.3); g.lineTo(w * 0.5, belt - fin); g.lineTo(w * 0.5, belt + h * 0.12 * rr); }
  else g.quadraticCurveTo(w * 0.5, belt, w * 0.5, belt + h * 0.12 * rr);
  g.lineTo(w * 0.47, bodyB);
  g.closePath();
  g.fillStyle = lit(paint); g.fill();
  const bg = g.createLinearGradient(0, belt - fin, 0, bodyB);
  bg.addColorStop(0, `rgba(255,255,255,${0.1 + light * 0.28})`); bg.addColorStop(0.3, 'rgba(255,255,255,0.03)');
  bg.addColorStop(0.55, 'rgba(0,0,0,0.05)'); bg.addColorStop(1, 'rgba(0,0,0,0.55)');
  g.fillStyle = bg; g.fill();
  // brillo a lo ancho de la maleta y línea de la tapa
  g.save(); g.clip();
  const sp = g.createRadialGradient(0, belt + h * 0.05, 0, 0, belt + h * 0.05, w * 0.5);
  sp.addColorStop(0, `rgba(255,255,255,${light * 0.22})`); sp.addColorStop(1, 'rgba(255,255,255,0)');
  g.save(); g.scale(1, 0.25); g.fillStyle = sp; g.fillRect(-w, (belt - h * 0.2) / 0.25, w * 2, h * 0.6 / 0.25); g.restore();
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,0.45)'; g.lineWidth = Math.max(1, w * 0.006);
  g.beginPath(); g.moveTo(-w * 0.3, belt + h * 0.02); g.lineTo(-w * 0.3, bodyB - h * 0.12); g.lineTo(w * 0.3, bodyB - h * 0.12); g.lineTo(w * 0.3, belt + h * 0.02); g.stroke();
  // salpicaderas sueltas de los autos antiguos
  if (R.fenders) for (const d of [-1, 1]) {
    g.fillStyle = lit(shade(paint, -0.08));
    g.beginPath(); g.ellipse(d * w * 0.45, -h * 0.27, w * 0.11, h * 0.16, 0, Math.PI, 0); g.lineTo(d * w * 0.56, -h * 0.17); g.lineTo(d * w * 0.34, -h * 0.17); g.fill();
  }
  // cabina y vidrio trasero
  if (!R.open) {
    const rw = w * R.roofW * 0.88, bw = w * (0.36 + 0.03 * rr);
    const slope = R.fast ? h * 0.08 : 0;
    g.beginPath();
    g.moveTo(-bw, belt + 1);
    g.bezierCurveTo(-bw, belt - h * 0.1, -rw / 2 - w * 0.03, roofT + h * 0.06, -rw / 2, roofT + h * 0.02);
    g.quadraticCurveTo(0, roofT - h * 0.025 * (1 + rr), rw / 2, roofT + h * 0.02);
    g.bezierCurveTo(rw / 2 + w * 0.03, roofT + h * 0.06, bw, belt - h * 0.1, bw, belt + 1);
    g.closePath();
    g.fillStyle = lit(car.mods.roof || paint); g.fill();
    const cg = g.createLinearGradient(0, roofT, 0, belt);
    cg.addColorStop(0, `rgba(255,255,255,${0.12 + light * 0.2})`); cg.addColorStop(1, 'rgba(0,0,0,0.25)');
    g.fillStyle = cg; g.fill();
    // vidrio
    const gw = rw * 0.86, gb = bw * 0.82;
    g.beginPath();
    g.moveTo(-gb, belt - h * 0.06);
    g.bezierCurveTo(-gb, belt - h * 0.12, -gw / 2 - w * 0.02, roofT + h * 0.1 + slope, -gw / 2, roofT + h * 0.07 + slope);
    g.quadraticCurveTo(0, roofT + h * 0.045 + slope, gw / 2, roofT + h * 0.07 + slope);
    g.bezierCurveTo(gw / 2 + w * 0.02, roofT + h * 0.1 + slope, gb, belt - h * 0.12, gb, belt - h * 0.06);
    g.closePath();
    const gg = g.createLinearGradient(0, roofT, 0, belt);
    gg.addColorStop(0, '#2a3450'); gg.addColorStop(0.5, '#0c1220'); gg.addColorStop(1, '#03050a');
    g.fillStyle = gg; g.fill();
    g.strokeStyle = css(mix('#111', '#d9dfe5', light * 0.8)); g.lineWidth = Math.max(1, w * 0.008); g.stroke();
    // el conductor en silueta y un reflejo en el vidrio
    g.save(); g.clip();
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(-w * 0.15, belt - h * 0.1, w * 0.065, h * 0.11, 0, 0, TAU); g.fill();
    g.fillRect(-w * 0.26, belt - h * 0.04, w * 0.22, h * 0.06);
    g.fillStyle = `rgba(255,255,255,${0.05 + light * 0.1})`;
    g.beginPath(); g.moveTo(w * 0.05, roofT); g.lineTo(w * 0.13, roofT); g.lineTo(-w * 0.02, belt); g.lineTo(-w * 0.1, belt); g.fill();
    g.restore();
  } else {
    // descapotable: el parabrisas visto desde atrás y el conductor
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(-w * 0.15, belt - h * 0.12, w * 0.07, h * 0.11, 0, 0, TAU); g.fill();
    g.fillRect(-w * 0.27, belt - h * 0.05, w * 0.24, h * 0.06);
    g.strokeStyle = css(mix('#000', '#c9d1d8', light)); g.lineWidth = Math.max(1, w * 0.012);
    g.beginPath(); g.moveTo(-w * 0.34, belt); g.lineTo(-w * 0.31, belt - h * 0.26); g.lineTo(w * 0.31, belt - h * 0.26); g.lineTo(w * 0.34, belt); g.stroke();
  }
  // moldura cromada sobre la maleta
  g.strokeStyle = css(mix('#111', '#e8edf2', light * 0.9)); g.lineWidth = Math.max(1, w * 0.007);
  g.beginPath(); g.moveTo(-w * 0.46, belt + h * 0.08); g.lineTo(w * 0.46, belt + h * 0.08); g.stroke();
  // parachoques con sus guardas
  const bz = bodyB - h * 0.02;
  if (!car.mods.nobump) {
    const cb = g.createLinearGradient(0, bz - h * 0.08, 0, bz + h * 0.04);
    cb.addColorStop(0, css(mix('#111', '#ffffff', light))); cb.addColorStop(0.45, css(mix('#111', '#9aa3ab', light))); cb.addColorStop(0.55, css(mix('#050505', '#3c434a', light))); cb.addColorStop(1, css(mix('#111', '#c9d0d6', light)));
    g.fillStyle = cb; roundRect(g, -w * 0.53, bz - h * 0.08, w * 1.06, h * 0.11, h * 0.05); g.fill();
    for (const d of [-1, 1]) { roundRect(g, d * w * 0.24 - w * 0.025, bz - h * 0.15, w * 0.05, h * 0.18, w * 0.02); g.fill(); }
  }
  // patente de California (negra con letras amarillas) y su luz
  const pw = w * 0.2, ph = pw * 0.5, py = bz - h * 0.2;
  g.fillStyle = '#0c0c0c'; g.fillRect(-pw / 2, py, pw, ph);
  g.fillStyle = `rgba(240,200,60,${0.45 + light * 0.55})`; g.font = font(Math.max(5, ph * 0.62), 'bold', FONT_SANS);
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(o.plate || 'KRL 163', 0, py + ph / 2 + 0.5);
  // escapes
  const dual = car.p && car.p.exhaust && car.p.exhaust.k === 'hdr';
  g.fillStyle = css(mix('#111', '#c9d0d6', light * 0.7));
  for (const d of dual ? [-1, 1] : [1]) { g.beginPath(); g.ellipse(d * w * 0.3, bz + h * 0.05, w * 0.03, w * 0.022, 0, 0, TAU); g.fill(); }
  // focos traseros (brillan más al frenar)

  const lamps = [];
  switch (R.lights) {

    case 'round1': lamps.push([-0.39, ly, 0.06], [0.39, ly, 0.06]); break;
    case 'tri': lamps.push([-0.44, ly, 0.038], [-0.345, ly, 0.038], [-0.25, ly, 0.038], [0.25, ly, 0.038], [0.345, ly, 0.038], [0.44, ly, 0.038]); break;
    case 'fin': lamps.push([-0.47, belt - fin * 0.55, 0.032, 2.4], [0.47, belt - fin * 0.55, 0.032, 2.4]); break;
    case 'vert': lamps.push([-0.455, ly, 0.03, 2.4], [0.455, ly, 0.03, 2.4]); break;
    case 'cat': lamps.push([-0.43, belt + h * 0.05, 0.04, 2.4], [0.43, belt + h * 0.05, 0.04, 2.4]); break;
    case 'bar': lamps.push([-0.34, ly, 0.11, 0.32], [0.34, ly, 0.11, 0.32]); break;
  }
  for (const [lx, lyy, lr, stretch = 1] of lamps) {
    g.fillStyle = css(mix('#111', '#d9dfe5', light * 0.8));
    g.beginPath(); g.ellipse(lx * w, lyy, lr * w * 1.25, lr * w * stretch * 1.15, 0, 0, TAU); g.fill();
    g.fillStyle = css(mix('#3a0505', '#ff2d1c', tl));
    g.beginPath(); g.ellipse(lx * w, lyy, lr * w, lr * w * stretch, 0, 0, TAU); g.fill();
    g.fillStyle = `rgba(255,220,200,${0.35 * tl})`; g.beginPath(); g.ellipse(lx * w - lr * w * 0.3, lyy - lr * w * stretch * 0.3, lr * w * 0.3, lr * w * stretch * 0.25, 0, 0, TAU); g.fill();
  }
  if (!o.flat) {
    g.globalCompositeOperation = 'lighter';
    for (const [lx, lyy, lr] of lamps) glow(g, lx * w, lyy, lr * w * (o.brake ? 7.5 : 4.5), '#ff3020', o.brake ? 0.75 : 0.42);
    glow(g, 0, py + ph / 2, pw * 0.8, '#fff2c0', 0.22);
  }
  g.restore();
}

// ----- De frente: autos que vienen en contra y la policía en el espejo -----
function drawCarFront(g, x, y, w, o = {}) {
  const h = w * 0.68;
  g.save(); g.translate(x, y);
  g.fillStyle = 'rgba(0,0,0,0.55)'; g.beginPath(); g.ellipse(0, 0, w * 0.56, w * 0.06, 0, 0, TAU); g.fill();
  const base = mix('#000', o.color || '#555', 0.12 + (o.light || 0) * 0.6);
  g.fillStyle = '#050505'; g.fillRect(-w * 0.46, -h * 0.18, w * 0.13, h * 0.18); g.fillRect(w * 0.33, -h * 0.18, w * 0.13, h * 0.18);
  roundRect(g, -w * 0.5, -h * 0.5, w, h * 0.42, w * 0.06); g.fillStyle = css(base); g.fill();
  g.beginPath(); g.moveTo(-w * 0.42, -h * 0.5); g.lineTo(-w * 0.32, -h * 0.92); g.lineTo(w * 0.32, -h * 0.92); g.lineTo(w * 0.42, -h * 0.5); g.closePath();
  g.fillStyle = css(mix('#000', o.roof || o.color || '#555', 0.1 + (o.light || 0) * 0.5)); g.fill();
  g.beginPath(); g.moveTo(-w * 0.36, -h * 0.52); g.lineTo(-w * 0.28, -h * 0.86); g.lineTo(w * 0.28, -h * 0.86); g.lineTo(w * 0.36, -h * 0.52); g.closePath();
  g.fillStyle = '#0b0f18'; g.fill();
  g.fillStyle = css(mix('#111', '#c8cfd6', (o.light || 0) * 0.8)); g.fillRect(-w * 0.3, -h * 0.34, w * 0.6, h * 0.12);
  // sirena de la policía
  if (o.cop) {
    const on = Math.sin(o.t * 14) > 0;
    g.fillStyle = on ? '#ff2020' : '#5a0a0a'; g.beginPath(); g.ellipse(0, -h * 0.97, w * 0.06, h * 0.07, 0, 0, TAU); g.fill();
    g.globalCompositeOperation = 'lighter';
    if (on) glow(g, 0, -h * 0.97, w * 0.9, '#ff2a2a', 0.8);
    g.globalCompositeOperation = 'source-over';
  }
  const hl = o.headlights ?? 1;
  g.fillStyle = css(mix('#444', '#fffbe8', hl));
  for (const d of [-1, 1]) { g.beginPath(); g.arc(d * w * 0.38, -h * 0.32, w * 0.06, 0, TAU); g.fill(); }
  g.globalCompositeOperation = 'lighter';
  for (const d of [-1, 1]) glow(g, d * w * 0.38, -h * 0.32, w * 0.9 * hl, '#fff4d6', 0.55 * hl);
  g.restore();
}

const SPRITES = {};
function spriteCanvas(wm, hm, ppm = 40) { const c = makeCanvas(wm * ppm, hm * ppm); return { c, g: c.getContext('2d'), ppm }; }
function defSprite(key, wm, hm, draw, o = {}) {
  const lit = spriteCanvas(wm, hm), emit = spriteCanvas(wm, hm), dark = spriteCanvas(wm, hm);
  const P = lit.ppm;
  for (const L of [lit, emit, dark]) { L.g.translate(L.c.width / 2, L.c.height); L.g.scale(P, P); }
  draw(lit.g, emit.g);
  // silueta: la misma forma, casi negra, con un borde de luz de luna
  dark.g.setTransform(1, 0, 0, 1, 0, 0);
  dark.g.drawImage(lit.c, 0, 0);
  dark.g.globalCompositeOperation = 'source-atop';
  const dg = dark.g.createLinearGradient(0, 0, 0, dark.c.height);
  dg.addColorStop(0, 'rgba(32,38,58,0.94)'); dg.addColorStop(1, 'rgba(6,7,12,0.98)');
  dark.g.fillStyle = dg; dark.g.fillRect(0, 0, dark.c.width, dark.c.height);
  SPRITES[key] = { w: wm, h: hm, lit: lit.c, emit: o.emit ? emit.c : null, dark: dark.c, hit: o.hit ?? 0, refl: o.refl || 0, lamp: o.lamp || 0, pole: o.pole || 0, flip: o.flip || 0 };
}

// ----- Pistas -----
function addSeg(T, curve, y, zone) {
  T.segs.push({ i: T.segs.length, curve, y, zone, sprites: [], light: 0, mark: 0 });
}
// Tramos con entrada y salida suaves para curvas y lomas
function addRun(T, n, curve, dy, zone) {
  const y0 = T.segs.length ? T.segs[T.segs.length - 1].y : 0;
  const ein = Math.max(1, Math.floor(n * 0.25)), eout = ein;
  for (let k = 0; k < n; k++) {
    const t = k / n, c = k < ein ? curve * smooth(k / ein) : k > n - eout ? curve * smooth((n - k) / eout) : curve;
    addSeg(T, c, y0 + dy * (1 - Math.cos(Math.PI * t)) / 2, zone);
  }
}
function placeSprite(T, i, key, side, off) {
  if (i < 0 || i >= T.segs.length) return;
  T.segs[i].sprites.push({ key, x: side * (ROAD_W + off), side });
}
// Luz de los faroles en el asfalto (se suma a la de los focos del auto)
function bakeLights(T) {
  T.segs.forEach((s, i) => {
    for (const sp of s.sprites) if (SPRITES[sp.key] && SPRITES[sp.key].lamp) {
      for (let k = -4; k <= 4; k++) {
        const j = i + k; if (j < 0 || j >= T.segs.length) continue;
        T.segs[j].light = Math.min(1, T.segs[j].light + Math.max(0, 1 - Math.abs(k) / 4.2) * 0.9);
      }
    }
  });
}

// La recta de picadas: un camino derecho a las afueras del pueblo, con el semáforo en la partida
function buildDragStrip(seed) {
  buildSprites();
  const R = rng(seed), T = { kind: 'drag', segs: [], start: 60, finish: 60 + DRAG_DIST };
  const n = Math.ceil((60 + DRAG_DIST + 420) / SEG) + DRAW_SEGS;
  for (let i = 0; i < n; i++) addSeg(T, 0, Math.sin(i / 37) * 0.6, 'strip');
  const si = Math.floor(T.start / SEG), fi = Math.floor(T.finish / SEG);
  T.segs[si].mark = 1; T.segs[fi].mark = 2;
  for (let i = 0; i < n; i += 8) {
    placeSprite(T, i, 'pole', -1, 6 + R() * 2);
    if (i % 24 === 0) placeSprite(T, i + 3, 'lamp', 1, 1.2);
  }
  // como en el original: postes blancos, árboles, palmeras y algún letrero; sin público
  for (let i = si; i < n; i += 6) placeSprite(T, i, 'post', i % 12 ? 1 : -1, 0.8);
  placeSprite(T, si + 30, 'board0', 1, 9); placeSprite(T, si + 90, 'board1', -1, 10); placeSprite(T, fi + 8, 'tower', 1, 26);
  for (let i = si + 4; i < n; i += 3 + Math.floor(R() * 5)) placeSprite(T, i, rpick(R, ['tree', 'tree', 'palm', 'orange', 'rock0']), R() < 0.5 ? -1 : 1, 5 + R() * 18);
  bakeLights(T);
  T.length = T.segs.length * SEG;
  return T;
}

// La ruta del cerro: sale del pueblo, cruza los naranjos, sube por el cañón, pasa los pozos de petróleo y vuelve
const ZONES = [['town', 0], ['grove', 0.14], ['canyon', 0.38], ['oil', 0.68], ['desert', 0.82], ['town', 0.93]];
function buildRoadCourse(seed) {
  buildSprites();
  const R = rng(seed), T = { kind: 'road', segs: [], start: 60 };
  const zoneAt = f => { let z = 'town'; for (const [k, a] of ZONES) if (f >= a) z = k; return z; };
  const target = 3400;
  addRun(T, Math.round(260 / SEG), 0, 0, 'town');
  let side = R() < 0.5 ? -1 : 1;
  while (T.segs.length * SEG < target) {
    const f = T.segs.length * SEG / target, zone = zoneAt(f);
    const hilly = zone === 'canyon' ? 1.6 : zone === 'grove' ? 0.6 : 1;
    const kind = R();
    if (kind < 0.3) addRun(T, 14 + Math.floor(R() * 26), 0, (R() - 0.5) * 18 * hilly, zone);
    else {
      side = R() < 0.7 ? -side : side;
      const radius = zone === 'canyon' ? 70 + R() * 110 : 110 + R() * 250;
      addRun(T, 10 + Math.floor(R() * 22), side / radius, (R() - 0.5) * 14 * hilly, zone);
    }
  }
  T.finish = T.segs.length * SEG - 40;
  addRun(T, 70, 0, 0, 'town');
  for (let i = 0; i < DRAW_SEGS; i++) addSeg(T, 0, T.segs[T.segs.length - 1].y, 'town');
  // adornos según la zona
  const fi = Math.floor(T.finish / SEG), si = Math.floor(T.start / SEG);
  T.segs[si].mark = 1; T.segs[fi].mark = 2;
  T.segs.forEach((s, i) => {
    const r = R();
    if (Math.abs(s.curve) > 1 / 160 && i % 4 === 0) placeSprite(T, i, s.curve > 0 ? 'chevR' : 'chevL', s.curve > 0 ? -1 : 1, 0.9);
    if (i % 6 === 0) placeSprite(T, i, 'post', i % 12 ? 1 : -1, 0.5);
    switch (s.zone) {
      case 'town':
        if (i % 9 === 0) placeSprite(T, i, 'lamp', i % 18 ? 1 : -1, 1.2);
        if (i % 7 === 3) placeSprite(T, i, r < 0.3 ? 'store' + Math.floor(R() * 5) : 'house', R() < 0.5 ? -1 : 1, 7 + R() * 4);
        if (i % 5 === 1 && r > 0.5) placeSprite(T, i, 'palm', R() < 0.5 ? -1 : 1, 3 + R() * 2);
        if (i % 40 === 20) placeSprite(T, i, 'board' + Math.floor(R() * 4), R() < 0.5 ? -1 : 1, 8);
        break;
      case 'grove':
        if (i % 2 === 0) placeSprite(T, i, 'orange', 1, 4 + (i % 4) * 1.5);
        if (i % 2 === 1) placeSprite(T, i, 'orange', -1, 4 + (i % 4) * 1.5);
        if (i % 8 === 0) placeSprite(T, i, 'pole', 1, 2.2);
        if (i % 30 === 5) placeSprite(T, i, 'house', -1, 16);
        break;
      case 'canyon':
        if (i % 3 === 0) placeSprite(T, i, 'rock' + Math.floor(R() * 3), s.curve >= 0 ? -1 : 1, 3 + R() * 3);
        if (i % 5 === 0) placeSprite(T, i, 'rock' + Math.floor(R() * 3), s.curve >= 0 ? 1 : -1, 10 + R() * 10);
        if (i % 11 === 0) placeSprite(T, i, 'tree', R() < 0.5 ? -1 : 1, 6 + R() * 6);
        break;
      case 'oil':
        if (i % 6 === 0) placeSprite(T, i, R() < 0.5 ? 'pump' : 'derrick', R() < 0.5 ? -1 : 1, 7 + R() * 14);
        if (i % 8 === 0) placeSprite(T, i, 'pole', -1, 2.4);
        if (i % 4 === 2) placeSprite(T, i, 'fence', 1, 2.5);
        break;
      case 'desert':
        if (i % 3 === 0) placeSprite(T, i, 'joshua', R() < 0.5 ? -1 : 1, 3 + R() * 12);
        if (i % 8 === 0) placeSprite(T, i, 'pole', 1, 2.4);
        break;
    }
  });
  placeSprite(T, fi + 14, 'tower', 1, 18);
  bakeLights(T);
  T.length = T.segs.length * SEG;
  // mapa del recorrido (para el mapita de la carrera)
  let a = 0, x = 0, z = 0;
  T.map = [];
  for (const s of T.segs) { a += s.curve * SEG; x += Math.sin(a) * SEG; z += Math.cos(a) * SEG; T.map.push([x, z]); }
  return T;
}
const segAt = (T, z) => T.segs[clamp(Math.floor(z / SEG), 0, T.segs.length - 1)];
function heightAt(T, z) {
  const i = clamp(Math.floor(z / SEG), 0, T.segs.length - 2), f = z / SEG - i;
  return lerp(T.segs[i].y, T.segs[i + 1].y, f);
}

// ===== Carreras: picadas de cuarto de milla y carreras de ruta, vistas desde el asiento =====
const POLICE_GIVEUP = 380, FINE_STOP = 20, FINE_CAUGHT = 75;

// Cuánto puede doblar un auto en una curva sin salirse (m/s²)
const latGrip = (stats, skill = 1) => stats.lat * G * stats.handling * (0.78 + 0.22 * skill);
// Velocidad segura mirando la pista que viene (para los pilotos de la computadora y la policía)
function safeSpeed(T, z, v, grip, brake = 6) {
  let best = 90;
  for (let d = 0; d < 170; d += SEG) {
    const s = segAt(T, z + d), k = Math.abs(s.curve);
    if (k < 1e-5) continue;
    const vc = Math.sqrt(grip / k);
    best = Math.min(best, Math.sqrt(vc * vc + 2 * brake * d));
  }
  return best;
}

class Race {
  // o = { type: 'drag'|'road', car, rival: { name, look, car, skill, king }, bet, seed, police (0..1), units, auto (piloto automático para pruebas) }
  constructor(o) {
    this.o = o; this.type = o.type; this.t = 0;
    this.T = o.type === 'drag' ? buildDragStrip(o.seed) : buildRoadCourse(o.seed);
    const z0 = this.T.start - 3;
    const meStats = carStats(o.car), rvStats = carStats(o.rival.car);
    this.me = { car: o.car, s: meStats, veh: new Vehicle(meStats), z: z0, x: LANE, vx: 0, steer: 0, shake: 0, startZ: z0 };
    this.rv = { car: o.rival.car, s: rvStats, veh: new Vehicle(rvStats), z: z0, x: -LANE, vx: 0, drv: makeDriver(o.rival.skill), lane: -LANE, startZ: z0, crashed: false };
    if (o.auto) this.me.drv = makeDriver(1, () => 0.5);
    this.phase = 'intro'; this.phaseT = 0;
    this.flag = 0;           // 0 abajo, 1 arriba, 2 bajó (¡ya!)
    this.goAt = 0; this.goT = null;
    this.dropAfter = 1.3 + Math.random() * 1.9;
    this.rivalJump = o.rival.skill < 0.66 && !o.rival.king && Math.random() < 0.12;
    this.msg = null; this.hint = null; this.flash = 0; this.crack = 0;
    this.cross = { me: null, rv: null };
    this.reaction = null;
    this.scroll = 0;
    this.result = null; this.endT = 0;
    this.fuel0 = o.car.fuel;
    this.trap = 0;
    this.traffic = [];
    this.cop = null;
    this.copZ = o.type === 'road' && Math.random() < (o.police || 0) ? this.T.finish * (0.2 + Math.random() * 0.4) : null;
    if (o.type === 'road') this.spawnTraffic(rng(o.seed * 31 + 7));
    this.smoke = [];
  }

  spawnTraffic(R) {
    const len = this.T.finish;
    for (let i = 0; i < 11; i++) this.traffic.push({ z: 450 + R() * len * 1.9, x: -LANE, v: -(17 + R() * 6), color: rpick(R, ['#b9bec4', '#2f4f3a', '#6a1f2b', '#ece8dc', '#1d2a4d', '#8ab8de']), oncoming: true });
    for (let i = 0; i < 5; i++) {
      const model = rpick(R, ['chevy49', 'valiant63', 'olds52', 'chevy55', 'valiant61', 'ford40']);
      this.traffic.push({ z: 500 + R() * (len - 700), x: LANE, v: 15 + R() * 5, car: makeCar(model, { color: rpick(R, MODELS[model].colors) }), oncoming: false });
    }
  }

  say(text, t = 2.2, color = '#fff') { this.msg = { text, t, color, max: t }; }

  update(dt) {
    this.t += dt; this.phaseT += dt;
    const me = this.me, rv = this.rv;
    if (this.msg && (this.msg.t -= dt) <= 0) this.msg = null;
    this.flash = Math.max(0, this.flash - dt * 2);
    const inp = this.playerInput(dt);
    // ----- partida -----
    if (this.phase === 'intro' && this.phaseT > 2.2) { this.phase = 'stage'; this.phaseT = 0; }
    if (this.phase === 'stage') {
      if (this.flag === 0 && this.phaseT > 0.7) { this.flag = 1; Sound.sfx.flag(); }
      if (this.flag === 1 && this.phaseT > 0.7 + this.dropAfter) {
        this.flag = 2; this.goAt = this.t; this.phase = 'run'; this.phaseT = 0;
        Sound.sfx.go(); this.say(L().race.go, 1, '#ffd23a');
      } else if (this.rivalJump && this.flag === 1 && this.phaseT > 0.7 + this.dropAfter - 0.35) {
        rv.veh.launch(); return this.finish('win', 'rivalFoul');
      }
    }
    if (inp.launch && me.veh.gear === 0 && this.phase !== 'done') {
      if (this.phase !== 'run') { me.veh.launch(); return this.finish('lose', 'foul'); }
      me.veh.launch(); this.reaction = this.t - this.goAt;
    }
    this.goT = this.phase === 'run' || this.phase === 'done' ? this.t - this.goAt : null;
    // ----- autos -----
    this.stepCar(me, dt, inp);
    const rinp = this.phase === 'stage' || this.phase === 'intro'
      ? driveStraight(rv.veh, rv.drv, dt, null)
      : this.rivalInput(dt);
    this.stepCar(rv, dt, rinp);
    if (this.phase === 'run' || this.phase === 'done') this.stepTraffic(dt);
    // ----- llegada -----
    for (const [k, c] of [['me', me], ['rv', rv]]) {
      if (this.cross[k] === null && c.z >= this.T.finish) {
        const over = (c.z - this.T.finish) / Math.max(1, c.veh.v);
        this.cross[k] = this.t - this.goAt - over;
        if (k === 'me') this.trap = c.veh.v;
      }
    }
    if (this.phase === 'run') this.checkEnd(dt);
    if (this.phase === 'done') { this.endT += dt; }
    // sonido y efectos
    for (const ev of me.veh.events) {
      if (ev === 'shift') Sound.sfx.clunk();
      if (ev === 'grind') { Sound.sfx.grind(); this.say(L().race.grind, 2.4, '#ff8a6a'); }
      if (ev === 'blown') { Sound.sfx.boom(); this.flash = 0.6; }
      if (ev === 'broken') Sound.sfx.grind();
    }
    me.veh.events.length = 0; rv.veh.events.length = 0;
    if (me.veh.spin > 0.25 && me.veh.v < 40) this.puff(me, me.veh.spin);
    if (rv.veh.spin > 0.25 && rv.veh.v < 40) this.puff(rv, rv.veh.spin);
    for (const p of this.smoke) { p.age += dt; p.x += p.vx * dt; p.y -= dt * 0.6; p.r += dt * 1.6; }
    this.smoke = this.smoke.filter(p => p.age < 2.2);
    this.scroll += segAt(this.T, me.z).curve * me.veh.v * dt * 900;
  }

  puff(c, k) {
    if (Math.random() > k * 0.9) return;
    for (const side of [-0.75, 0.75]) this.smoke.push({ who: c, z: c.z - 2.2, x: c.x + side, y: 0.3, vx: side * 0.6, r: 0.6, age: 0 });
  }

  playerInput(dt) {
    const me = this.me;
    if (this.o.auto) {
      if (this.phase === 'intro') return { throttle: 0, brake: 0, steer: 0 };
      const drv = me.drv;
      if (me.veh.gear === 0) {
        const r = driveStraight(me.veh, drv, dt, this.phase === 'run' ? this.t - this.goAt : null);
        const launch = me.veh.gear > 0; if (launch) { me.veh.gear = 0; }
        return { throttle: r.throttle, brake: 0, steer: 0, launch };
      }
      const target = this.type === 'road' ? Math.min(safeSpeed(this.T, me.z, me.veh.v, latGrip(me.s) * 0.95), this.trafficLimit(me, this.rv)) : Infinity;
      const r = driveStraight(me.veh, drv, dt, 1, target);
      if (this.type === 'road') me.lane = this.aiLane(me, this.rv, LANE);
      const tx = this.type === 'road' ? me.lane : LANE;
      return { throttle: r.throttle, brake: r.brake, steer: clamp((tx - me.x) * 1.6 - me.vx * 0.5, -1, 1), auto: true };
    }
    const k = Input.read();
    const out = { throttle: k.gas ? 1 : 0, brake: k.brake ? 1 : 0, steer: k.steer, launch: false };
    if (k.up) { if (me.veh.gear === 0) out.launch = true; else me.veh.shiftUp(); }
    if (k.down) me.veh.shiftDown();
    if (k.horn) Sound.sfx.horn();
    if (this.phase === 'done') { out.throttle = 0; out.brake = 0.4; }
    return out;
  }

  // Elige carril con tres estados: va por su pista, adelanta por la izquierda, o aborta y vuelve detrás del lento
  aiLane(c, other, pref) {
    const v = c.veh.v, T = this.traffic;
    const oncoming = win => T.some(o => o.oncoming && o.z > c.z - 6 && o.z - c.z < win);
    const slowAhead = (x, far) => T.find(o => !o.oncoming && Math.abs(o.x - x) < 1.2 && o.z > c.z - 6 && o.z - c.z < far && o.v < v + 1) ||
      (Math.abs(other.x - x) < 1.9 && other.z > c.z - 6 && other.z - c.z < Math.min(far, 18) && other.veh.v < v + 1 ? other : null);
    const beside = x => T.some(o => !o.oncoming && Math.abs(o.x - x) < 1.4 && o.z - c.z > -6 && o.z - c.z < 7.5) || (Math.abs(other.x - x) < 1.9 && other.z - c.z > -6 && other.z - c.z < 7);
    c.ai = c.ai || 'cruise';
    if (c.ai === 'cruise') {
      if (slowAhead(LANE, 22 + v) && !oncoming(260 + v * 5) && !beside(-LANE)) c.ai = 'pass';
    } else if (c.ai === 'pass') {
      if (oncoming(170 + v * 3.5)) c.ai = 'abort';
      else if (!slowAhead(LANE, 10 + v * 0.6) && !beside(LANE)) c.ai = 'cruise';
    } else if (c.ai === 'abort') {
      if (!beside(LANE) && !slowAhead(LANE, 6)) c.ai = 'cruise';
      else if (!oncoming(240 + v * 5)) c.ai = 'pass';
    }
    if (pref < 0 && c.ai === 'cruise' && !oncoming(240 + v * 5)) return -LANE;
    return c.ai === 'pass' ? -LANE : c.ai === 'abort' ? (beside(LANE) ? -LANE : LANE) : LANE;
  }
  // Velocidad máxima para no chocar al de adelante (o al que viene de frente por tu pista), mirando también el carril al que va
  trafficLimit(c, other) {
    let lim = 90;
    const b = 6.5, lane = c.lane ?? c.x;
    const ahead = (oz, ox, ov, oncoming) => {
      if (oz < c.z || (Math.abs(c.x - ox) > 2.1 && Math.abs(lane - ox) > 1)) return;
      const d = oz - c.z - 9;
      lim = Math.min(lim, d < 0 ? Math.max(0, ov - 2) : Math.sqrt(Math.max(0, ov) ** 2 + 2 * b * d));
    };
    // frenar no sirve contra el que viene de frente: lo que salva es volver a la derecha
    for (const o of this.traffic) if (!o.oncoming) ahead(o.z, o.x, o.v, false);
    if (other) ahead(other.z, other.x, other.veh.v, false);
    // abortando un adelantamiento: frena para quedar detrás del lento
    if (c.ai === 'abort') for (const o of this.traffic) if (!o.oncoming && o.x > 0 && o.z - c.z > -9 && o.z - c.z < 12) lim = Math.min(lim, Math.max(8, o.v - 7));
    return lim;
  }

  rivalInput(dt) {
    const rv = this.rv;
    if (this.type === 'drag') return driveStraight(rv.veh, rv.drv, dt, this.t - this.goAt);
    rv.lane = this.aiLane(rv, this.me, LANE);
    const target = Math.min(safeSpeed(this.T, rv.z, rv.veh.v, latGrip(rv.s, rv.drv.skill) * 0.93, 4 + 3 * rv.drv.skill), this.trafficLimit(rv, this.me));
    return driveStraight(rv.veh, rv.drv, dt, this.t - this.goAt, target);
  }

  stepCar(c, dt, inp) {
    const v = c.veh, T = this.T;
    v.offroad = Math.abs(c.x) > ROAD_W + 0.4 ? 1 : 0;
    v.step(dt, inp);
    c.z += v.v * dt;
    const seg = segAt(T, c.z);
    if (c === this.me) {
      // volante: el teclado gira de a poco; las curvas empujan hacia afuera
      c.steer = approach(c.steer, inp.steer || 0, dt * (inp.auto ? 6 : 3.2));
      const grip = latGrip(c.s);
      const aReq = v.v * v.v * seg.curve;
      const aSteer = c.steer * grip * clamp(v.v / 8, 0, 1);
      let slide = 0;
      if (Math.abs(aReq) > grip) slide = (Math.abs(aReq) - grip) * Math.sign(aReq);
      const target = (aSteer - aReq) * 0.36;
      c.vx = lerp(c.vx, target, clamp(dt * 5, 0, 1));
      c.x = clamp(c.x + c.vx * dt, -ROAD_W - 7, ROAD_W + 7);
      c.slide = Math.abs(slide) + (Math.abs(aSteer) > grip * 0.92 && v.v > 15 ? 0.3 : 0);
      if (v.offroad) { c.shake = 1; }
      if (this.type === 'drag' && this.phase === 'run' && v.spin > 0.3) c.vx += (Math.random() - 0.5) * v.spin * 3 * dt;
    } else {
      c.x = approach(c.x, c.lane ?? c.x, dt * 2.6);
    }
  }

  stepTraffic(dt) {
    const me = this.me, rv = this.rv;
    for (const o of this.traffic) {
      if (!o.oncoming) {
        // los autos lentos frenan si tienen a alguien pegado adelante
        o.z += o.v * dt;
      } else o.z += o.v * dt;
    }
    // choques con el tráfico
    for (const o of this.traffic) {
      for (const c of [me, rv]) {
        if (Math.abs(o.z - c.z) < 4.4 && Math.abs(o.x - c.x) < 1.8) {
          const closing = Math.abs(c.veh.v - o.v);
          if (c === me) {
            if (closing > 6) return this.crash(closing, o);
            // toque suave: si es por detrás frena; si van lado a lado se empujan
            if (Math.abs(o.z - c.z) > 3) { c.veh.v = Math.min(c.veh.v, Math.max(0, o.v - 1)); c.z = o.z - Math.sign(o.z - c.z) * 4.5; }
            else c.x += c.x > o.x ? 0.25 : -0.25;
            Sound.sfx.bump(); this.flash = 0.12;
          } else if (closing > 10 && this.phase === 'run') {
            c.crashed = true; c.veh.v = 0; c.veh.dry = true;
            Sound.sfx.crash();
            return this.finish('win', 'rivalCrash');
          } else c.veh.v = Math.max(0, o.v - 1);
        }
      }
    }
    // roces con el rival
    if (Math.abs(me.z - rv.z) < 4.4 && Math.abs(me.x - rv.x) < 1.85) {
      const closing = Math.abs(me.veh.v - rv.veh.v);
      if (closing > 15) return this.crash(closing, rv);
      const push = me.x > rv.x ? 1 : -1;
      me.x += push * 0.35; me.vx = push * 1.5; Sound.sfx.bump(); this.flash = 0.15;
      if (me.z < rv.z) me.veh.v *= 0.97; else rv.veh.v *= 0.97;
    }
    // postes, árboles y rocas al salirse del camino
    if (Math.abs(me.x) > ROAD_W + 0.8) {
      const s = segAt(this.T, me.z + 2);
      for (const sp of s.sprites) {
        const S = SPRITES[sp.key];
        if (S && S.hit && Math.abs(sp.x - me.x) < S.w * S.hit * 0.5 + 0.9) {
          if (me.veh.v > 9) return this.crash(me.veh.v, null);
          me.veh.v = 0;
        }
      }
    }
    // la policía
    if (this.copZ !== null && !this.cop && me.z > this.copZ) {
      this.cop = { z: me.z - 130, x: LANE, v: me.veh.v, catchT: 0, s: { lat: 0.9, handling: 0.95 } };
      this.say(L().race.police, 3.2, '#ff6a6a');
    }
    if (this.cop) this.stepCop(dt);
  }

  stepCop(dt) {
    const cop = this.cop, me = this.me;
    const gap = me.z - cop.z;
    const target = Math.min(64, me.veh.v + 14, safeSpeed(this.T, cop.z, cop.v, 0.92 * G * 0.95, 7));
    cop.v = approach(cop.v, target, dt * (cop.v < target ? 7.5 : 9));
    cop.z += cop.v * dt;
    cop.x = approach(cop.x, gap < 60 ? me.x : LANE, dt * 3);
    Sound.siren(true, clamp(1 - gap / 400, 0.15, 1));
    if (gap < 9) cop.catchT += dt; else cop.catchT = Math.max(0, cop.catchT - dt * 0.5);
    if (me.veh.v < 2.5 && gap < 160) return this.finish('void', 'stopped');
    if (cop.catchT > 1.4) return this.finish('void', 'caught');
    if (gap > POLICE_GIVEUP) { this.cop = null; this.copZ = null; Sound.siren(false, 0); this.say(L().race.lostCops, 2.6, '#9dffa0'); }
  }

  crash(speed, other) {
    Sound.sfx.crash(); this.flash = 1; this.crack = 1;
    this.me.veh.v = 0; this.me.veh.throttle = 0;
    this.damage = clamp(speed / 38, 0.2, 1);
    return this.finish('lose', 'crash');
  }

  checkEnd(dt) {
    const me = this.me, v = me.veh;
    // bencina
    if (!v.dry) {
      const left = this.fuel0 - v.fuelUse * 3;
      if (left <= 0) { v.dry = true; this.say(L().race.dry, 3, '#ffb36a'); }
    }
    if (v.dead() && !this.deadT) this.deadT = this.t;
    if (this.cross.me !== null || this.cross.rv !== null) {
      if (this.cop && this.cross.me !== null) return this.finish('void', 'caught');
      const winMe = this.cross.me !== null && (this.cross.rv === null || this.cross.me <= this.cross.rv);
      return this.finish(winMe ? 'win' : 'lose', 'finish');
    }
    if (this.deadT && this.t - this.deadT > 1.6) return this.finish('lose', v.blown ? 'blown' : v.broken ? 'broken' : 'dry');
    // si te quedaste muy atrás (más de 30 segundos), la carrera termina
    if (this.t - this.goAt > (this.type === 'drag' ? 75 : 260)) return this.finish('lose', 'finish');
  }

  finish(outcome, reason) {
    if (this.phase === 'done') return;
    this.phase = 'done'; this.endT = 0;
    Sound.siren(false, 0);
    const me = this.me, v = me.veh;
    const fine = reason === 'stopped' ? FINE_STOP : reason === 'caught' ? FINE_CAUGHT : 0;
    // el que perdió la picada no alcanzó a llegar: se calcula cuánto le faltaba
    if (reason === 'finish' && this.type === 'drag') {
      for (const [k, c] of [['me', this.me], ['rv', this.rv]]) {
        if (this.cross[k] !== null) continue;
        this.cross[k] = this.t - this.goAt + Math.max(0, this.T.finish - c.z) / Math.max(8, c.veh.v);
        if (k === 'me') this.trap = c.veh.v;
      }
    }
    this.result = {
      outcome, reason, fine,
      time: this.cross.me, rivalTime: this.cross.rv, trap: this.trap, reaction: this.reaction,
      engineDmg: v.engineDmg, transDmg: v.transDmg, blown: v.blown, broken: v.broken,
      body: reason === 'crash' ? this.damage : 0, fuel: Math.min(this.fuel0, v.fuelUse * 3),
      grinds: v.grinds, tread: (this.type === 'drag' ? 0.03 : 0.06) + (v.grinds ? 0 : 0) + this.smoke.length * 0.0004
    };
    const T = L().race;
    this.say(outcome === 'win' ? T.won : outcome === 'void' ? T.voided : T.lost, 99, outcome === 'win' ? '#ffd23a' : '#fff');
    if (outcome === 'win') Sound.sfx.win(); else if (outcome === 'lose') Sound.sfx.lose();

        const bar = i >> 4, k = i & 15, root = SURF_ROOT[bar], D = out();
        if (k % 2 === 0) {

        if (bar === 7 && k >= 8 && k % 2 === 0) note('sine', 220 - (k - 8) * 18, t, 0.18, 0.3, { slide: 90, dest: D });   // redoble de tambores
        if (k === 0) [12, 19, 24].forEach(n => note('sawtooth', midi(root + n), t, 1.2, 0.025, { lp: 1800, dest: D, send: 0.6 }));

      dur: 60 / 68 / 3, len: 96,

        if (k === 0) chord.forEach(n => [-7, 7].forEach(c => note('sawtooth', midi(n), t, d * 12, 0.022,

        for (const [m, s, len] of DOO_MEL[bar]) if (s === k) note('triangle', midi(m), t, len * d, 0.07, { a: 0.06, rel: 0.25, vib: [5, 3], dest: D, send: 0.3 });

      dur: 0.075, len: 56, once: true,

  function releaseCur(after) {

    if (!ac || !song) return;

      if (song.once && step >= song.len) { song = null; songName = null; releaseCur(5); return; }

    name = name || null;
    if (name === songName) return;
    songName = name;
    if (!ac) { if (name === 'win') songName = null; return; }     // la fanfarria no se guarda para después
    startSong();
  }

    musicOn = !musicOn;
    try { localStorage.setItem(MUSIC_KEY, musicOn ? '1' : '0'); } catch (e) { /* sin almacenamiento */ }
    if (ac) musicBus.gain.setTargetAtTime(musicOn ? MUSIC_VOL : 0, ac.currentTime, 0.1);
    return musicOn;
  }

  return {
    init, setMusic, toggleMusic, engine, stopEngine, stopEngines, skid, siren, wind, sfx,
    get musicOn() { return musicOn; }

// ===== Autos en pixel art: de lado (garaje, drive-in, diario) y de atrás (carreras) =====
// Usa las siluetas de ART (carart.js) pero las pinta como sprite de los 80: bandas de color, brillos duros,
// cromados de tres tonos, vidrio con reflejos, contorno negro y tramado.

// Rampa de 4 tonos para la pintura de un auto: los tonos de su misma familia en la paleta (así no queda tramada entera)
const PAL_FAMILIES = [
  ['k', 'g1', 'g2', 'g3', 'g4', 'g5', 'g6', 'w'], ['r1', 'r2', 'r3', 'r4', 'm4'], ['m1', 'm2', 'm3', 'm4', 'w'], ['r1', 'o1', 'o2', 'o3', 'y3'],
  ['b2', 'y1', 'y2', 'y3', 'w'], ['b1', 'b2', 'b3', 'b4', 'b5', 'c1'], ['e1', 'e2', 'e3', 'e4', 'c1'], ['t1', 't2', 't3', 't4', 'w'],
  ['u1', 'u2', 'u3', 'u4', 'w'], ['u1', 'p1', 'p2', 'p3', 'm4'], ['g4', 'g5', 'c2', 'c1', 'w']
];
function paintRamp(color) {
  const c = rgbOf(color);
  const idx = QLUT[((c[0] >> 3) << 10) | ((c[1] >> 3) << 5) | (c[2] >> 3)];
  const key = Object.keys(PAL)[idx];
  // la familia donde ese tono está en el medio de la rampa (no como extremo prestado)
  const fam = PAL_FAMILIES.find(f => f.indexOf(key) > 0 && f.indexOf(key) < f.length - 1) || PAL_FAMILIES.find(f => f.includes(key));
  const i = fam.indexOf(key), at = j => PAL[fam[clamp(j, 0, fam.length - 1)]];
  return { dk: at(i - 1), md: at(i), lt: at(i + 1), hi: at(i + 2) };
}
const CHROME = ['#ffffff', '#d8d8dc', '#8a8a96', '#3a3a46'];

function chromeBand(g, y0, y1) {
  const gr = g.createLinearGradient(0, y0, 0, y1);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.35, '#d8d8dc'); gr.addColorStop(0.5, '#5c5c6a'); gr.addColorStop(0.62, '#b4b4bc'); gr.addColorStop(1, '#8a8a96');
  return gr;
}

// Llanta en pixel art: neumático, banda blanca, tapa cromada con detalles
function pxWheel(g, cx, cy, r, style, ww, body) {
  g.fillStyle = PAL.g1; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  g.strokeStyle = PAL.g2; g.lineWidth = Math.max(1, r * 0.08); g.beginPath(); g.arc(cx, cy, r * 0.9, Math.PI * 1.1, Math.PI * 1.6); g.stroke();
  if (ww) {
    g.fillStyle = PAL.w; g.beginPath(); g.arc(cx, cy, r * 0.8, 0, TAU); g.fill();
    g.fillStyle = PAL.g6; g.beginPath(); g.arc(cx, cy, r * 0.8, 0.2, Math.PI - 0.2); g.fill();
    g.fillStyle = PAL.g1; g.beginPath(); g.arc(cx, cy, r * 0.62, 0, TAU); g.fill();
  }
  const rr = r * (ww ? 0.6 : 0.66);
  if (style === 'mags') {
    g.fillStyle = PAL.g6; g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    g.fillStyle = PAL.g2; g.beginPath(); g.arc(cx, cy, rr * 0.82, 0, TAU); g.fill();
    g.fillStyle = PAL.g5;
    for (let i = 0; i < 5; i++) {
      g.save(); g.translate(cx, cy); g.rotate(i * TAU / 5 + 0.3);
      g.beginPath(); g.moveTo(-rr * 0.14, 0); g.lineTo(-rr * 0.22, rr * 0.8); g.lineTo(rr * 0.22, rr * 0.8); g.lineTo(rr * 0.14, 0); g.fill();
      g.restore();
    }
    g.fillStyle = PAL.w; g.beginPath(); g.arc(cx, cy, rr * 0.22, 0, TAU); g.fill();
  } else if (style === 'moons') {
    g.fillStyle = PAL.g5; g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    g.fillStyle = PAL.g6; g.beginPath(); g.arc(cx - rr * 0.1, cy - rr * 0.1, rr * 0.78, 0, TAU); g.fill();
    g.fillStyle = PAL.w; g.beginPath(); g.arc(cx - rr * 0.3, cy - rr * 0.32, rr * 0.28, 0, TAU); g.fill();
  } else {
    // llanta pintada con tapa cromada de radios
    g.fillStyle = body.dk; g.beginPath(); g.arc(cx, cy, rr, 0, TAU); g.fill();
    g.fillStyle = PAL.g5; g.beginPath(); g.arc(cx, cy, rr * 0.8, 0, TAU); g.fill();
    g.fillStyle = PAL.g6; g.beginPath(); g.arc(cx - rr * 0.08, cy - rr * 0.08, rr * 0.62, 0, TAU); g.fill();
    g.strokeStyle = PAL.g4; g.lineWidth = Math.max(1, rr * 0.07);
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; g.beginPath(); g.moveTo(cx + Math.cos(a) * rr * 0.25, cy + Math.sin(a) * rr * 0.25); g.lineTo(cx + Math.cos(a) * rr * 0.7, cy + Math.sin(a) * rr * 0.7); g.stroke(); }
    g.fillStyle = PAL.w; g.beginPath(); g.arc(cx - rr * 0.18, cy - rr * 0.2, rr * 0.2, 0, TAU); g.fill();
    g.fillStyle = PAL.r3; g.beginPath(); g.arc(cx, cy, rr * 0.1, 0, TAU); g.fill();
  }
}

// El conductor visto de lado a través de la ventana
function pxDriver(g, x, y, s, look, flip) {
  const L = look || { skin: '#f4c8a0', hc: '#3a2010', top: '#1c3ca8' };
  g.save(); g.translate(x, y); g.scale(flip ? -s : s, s);
  g.fillStyle = L.top; g.beginPath(); g.ellipse(0, 7, 6, 5, 0, Math.PI, 0); g.fill();
  g.fillStyle = L.skin; g.fillRect(-1.5, 0, 3, 4);
  g.beginPath(); g.ellipse(0.5, -3, 3.4, 4, 0, 0, TAU); g.fill();
  g.fillStyle = L.hc; g.beginPath(); g.ellipse(-0.5, -5.2, 4, 2.6, 0, 0, TAU); g.fill();
  g.fillRect(-3.6, -5, 2, 4);
  if (L.shades) { g.fillStyle = PAL.k; g.fillRect(1.2, -3.8, 2.6, 1.4); }
  else { g.fillStyle = PAL.k; g.fillRect(2.2, -3.6, 1, 1); }
  // manos al volante
  g.strokeStyle = PAL.k; g.lineWidth = 1.2; g.beginPath(); g.ellipse(7, 2, 1.2, 4.2, 0.35, 0, TAU); g.stroke();
  g.fillStyle = L.skin; g.fillRect(5.5, 1, 2.4, 2);
  g.restore();
}

// Auto de lado en pixel art. size = largo en píxeles. o: { flip, driver: look }
function pxCarSide(car, size, o = {}) {
  const key = JSON.stringify(['side', car.model, car.color, car.mods, car.p && car.p.tires && car.p.tires.k, size, o.flip, o.driver || 0]);
  const hit = PXCACHE.get(key);
  if (hit) return hit;
  const A = ART[car.model], M = MODELS[car.model], mods = car.mods || {}, stickers = mods.stickers || {};
  const s = size / 100;
  const h = Math.ceil(42 * s), w = Math.ceil(104 * s);
  const ramp = paintRamp(car.color), roofRamp = M.roof && !mods.noroof ? paintRamp(M.roof) : ramp;
  const tiresK = car.p && car.p.tires ? car.p.tires.k : M.stock.tires;
  const ww = tiresK === 'ww', slick = tiresK === 'slick';
  const crisp = M.year >= 1957 ? 0.28 : 0.5, belt = A.belt;
  // sin techo: se corta todo lo que está sobre la cintura y quedan el parabrisas y los asientos
  const open = A.open || mods.noroof;
  const sprite = pixelSprite(w, h, g => {
    g.save();
    g.translate(o.flip ? w : 0, h);
    g.scale(o.flip ? -s : s, -s);
    g.translate(2, 1.5);
    const wr = A.wr * 1.08, wrR = (A.wrRear || A.wr) * 1.08 * (slick ? 1.06 : 1);
    const [fx, rx] = A.wheels;
    const cut = () => { if (mods.noroof && !A.open) { g.beginPath(); g.rect(-10, -10, 120, belt + 10.6); g.clip(); } };
    // techo y ventanas: interior oscuro, conductor y vidrio con reflejos
    if (!open && A.cabin) { polyPath(g, A.cabin, true, crisp); g.fillStyle = roofRamp.md; g.fill(); g.save(); g.clip(); g.fillStyle = roofRamp.hi; g.fillRect(0, belt + 9.6, 100, 0.8); g.restore(); }
    const drawGlass = () => {
      g.fillStyle = PAL.u1;
      for (const gl of A.glass) { polyPath(g, gl, true, crisp); g.fill(); }
      g.save(); g.beginPath(); for (const gl of A.glass) splinePath(g, gl, true, crisp); g.clip();
      g.fillStyle = PAL.g1; g.fillRect(30, belt - 1, 40, 6);
      if (o.driver) { g.save(); g.scale(1, -1); pxDriver(g, 55, -(belt + 5.5), 0.62, o.driver, false); g.restore(); }
      g.fillStyle = 'rgba(140,180,255,0.55)'; g.fillRect(0, belt + 6, 100, 6);
      g.fillStyle = 'rgba(168,255,244,0.9)';
      for (const gx of [A.glass[0][0][0] - 4, A.glass[0][0][0] - 13]) { g.beginPath(); g.moveTo(gx, belt); g.lineTo(gx + 3, belt); g.lineTo(gx - 4, belt + 12); g.lineTo(gx - 7, belt + 12); g.fill(); }
      g.restore();
      g.strokeStyle = PAL.g5; g.lineWidth = 0.55;
      for (const gl of A.glass) { polyPath(g, gl, true, crisp); g.stroke(); }
    };
    if (!open && A.glass && A.cabin) drawGlass();
    if (open) {
      // asientos, capota plegada, conductor y parabrisas
      const seat = A.seat || [[38, belt, 1], [38.8, belt + 4.6], [42, belt + 5.6], [48, belt + 5], [49, belt, 1]];
      if (A.top) { polyPath(g, A.top, true); g.fillStyle = PAL.b4; g.fill(); }
      polyPath(g, seat, true); g.fillStyle = PAL.b2; g.fill();
      if (o.driver) { g.save(); g.scale(1, -1); pxDriver(g, 52, -(belt + 4.4), 0.62, o.driver, false); g.restore(); }
      let sh = A.shield;
      if (!sh && A.cabin) { const [b, t] = [A.cabin[0], A.cabin[1]]; sh = [[b[0], b[1]], [b[0] - (b[0] - t[0]) * 0.6, belt + 6], [b[0] - (b[0] - t[0]) * 0.6 - 1.8, belt + 6], [b[0] - 1.8, b[1]]]; }
      if (!sh) sh = [[63, belt + 0.4], [60, belt + 7], [58.2, belt + 7], [61.2, belt + 0.4]];
      polyPath(g, sh); g.fillStyle = PAL.g6; g.fill();
    }
    // carrocería: tono medio, mitad de abajo oscura (refleja el suelo), banda clara y brillo arriba
    g.save(); cut();
    if (A.frame) { g.strokeStyle = PAL.g1; g.lineWidth = 1.6; g.beginPath(); g.moveTo(...A.frame[0]); g.lineTo(...A.frame[1]); g.stroke(); }
    polyPath(g, A.body, true);
    g.fillStyle = ramp.md; g.fill();
    g.save(); g.clip();
    g.fillStyle = ramp.dk; g.fillRect(-5, -5, 110, belt - 8.5 + 5);
    const sg = g.createLinearGradient(0, belt - 6.5, 0, belt - 9);
    sg.addColorStop(0, ramp.md); sg.addColorStop(1, ramp.dk);
    g.fillStyle = sg; g.fillRect(-5, belt - 9, 110, 2.5);
    g.fillStyle = ramp.lt; g.fillRect(-5, belt - 3.2, 110, 2.6);
    g.fillStyle = ramp.hi; g.fillRect(-5, belt - 0.8, 110, 1.2);
    if (!A.cabin && !open) { g.fillStyle = roofRamp.hi; g.fillRect(-5, belt + 8, 110, 1); }
    g.restore();
    // en los autos con el techo en la misma pieza, el vidrio va encima de la carrocería
    if (!open && A.glass && !A.cabin) drawGlass();
    g.save(); polyPath(g, A.body, true); g.clip();
    if (stickers.flames) drawFlames(g, A, car.color);
    if (stickers.checker) { for (let x = -4; x < 104; x += 2) for (let r = 0; r < 2; r++) { g.fillStyle = ((x / 2) + r) % 2 ? PAL.k : PAL.w; g.fillRect(x, 6.4 + r * 1.2, 2, 1.2); } }
    if (stickers.lightning) { g.fillStyle = PAL.y2; g.beginPath(); g.moveTo(92, belt - 6); g.lineTo(60, belt - 5); g.lineTo(64, belt - 8.5); g.lineTo(20, belt - 8); g.lineTo(58, belt - 10.4); g.lineTo(54, belt - 7.6); g.closePath(); g.fill(); }
    g.restore();
    // paneles especiales del modelo
    if (A.cove) { polyPath(g, A.cove, true); g.fillStyle = luma(car.color) > 0.7 ? PAL.r3 : PAL.c1; g.fill(); }
    if (A.wedge) { polyPath(g, A.wedge); g.fillStyle = PAL.g6; g.fill(); g.strokeStyle = PAL.g4; g.lineWidth = 0.3; for (let xx = 5; xx < 52; xx += 2) { g.beginPath(); g.moveTo(xx, 10); g.lineTo(xx, 19); g.stroke(); } }
    if (A.gold) { polyPath(g, A.gold); g.fillStyle = PAL.y2; g.fill(); }
    if (A.hood) { g.fillStyle = PAL.k; for (let row = 0; row < 3; row++) for (let lx = A.hood[0] + 3; lx < A.hood[1] - 2; lx += 1.8) g.fillRect(lx, 15.5 + row * 2.6, 0.7, 1.8); }
    if (A.scoop) { polyPath(g, A.scoop, true); g.fillStyle = ramp.lt; g.fill(); }
    // salpicaderas sueltas de los autos antiguos
    if (A.fenders) {
      for (const f of A.fenders) { polyPath(g, f, true); g.fillStyle = ramp.md; g.fill(); g.save(); g.clip(); g.fillStyle = ramp.dk; g.fillRect(0, 0, 100, 12.5); g.fillStyle = ramp.hi; g.fillRect(0, 19, 100, 1); g.restore(); }
      g.fillStyle = PAL.g1; polyPath(g, A.board); g.fill();
      g.fillStyle = PAL.g5; g.fillRect(A.board[0][0], 9.4, A.board[1][0] - A.board[0][0], 0.7);
    }
    if (A.grille) { polyPath(g, A.grille); g.fillStyle = PAL.g6; g.fill(); }
    if (A.pipes) { g.fillStyle = PAL.g6; g.fillRect(30, 9.6, 46, 1.8); g.fillStyle = PAL.w; g.fillRect(30, 10.8, 46, 0.6); }
    g.strokeStyle = 'rgba(0,0,0,0.85)'; g.lineWidth = 0.45;
    for (const d of A.doors) { g.beginPath(); g.moveTo(...d[0]); g.lineTo(...d[1]); g.stroke(); }
    if (A.handle) { g.fillStyle = PAL.w; g.fillRect(A.handle[0], A.handle[1] - 0.4, 2.6, 0.8); }
    for (const t of A.trims) {
      g.strokeStyle = PAL.g4; g.lineWidth = 0.9; g.beginPath(); g.moveTo(t[0][0], t[0][1] - 0.35); for (let i = 1; i < t.length; i++) g.lineTo(t[i][0], t[i][1] - 0.35); g.stroke();
      g.strokeStyle = PAL.w; g.lineWidth = 0.55; g.beginPath(); g.moveTo(...t[0]); for (let i = 1; i < t.length; i++) g.lineTo(...t[i]); g.stroke();
    }
    if (A.vents) for (const [vx, vy] of A.vents) { g.strokeStyle = PAL.g6; g.lineWidth = 0.7; g.beginPath(); g.moveTo(vx, vy); g.lineTo(vx + 1.6, vy + 3.2); g.stroke(); }
    if (A.ornaments) for (const [ox, oy] of A.ornaments) { g.fillStyle = PAL.w; g.fillRect(ox - 1.4, oy, 2.8, 0.8); }
    if (A.badge) { g.fillStyle = PAL.r3; g.fillRect(A.badge[0], A.badge[1], 2, 0.9); }
    // huecos de las ruedas
    if (!A.highboy) {
      g.save(); polyPath(g, A.body, true); if (A.fenders) for (const f of A.fenders) splinePath(g, f, true); g.clip();
      g.fillStyle = PAL.k;
      for (const [wx, wrr] of [[fx, wr], [rx, wrR]]) { g.beginPath(); g.arc(wx, wrr, wrr * 1.14, 0, TAU); g.fill(); }
      g.restore();
    }
    g.restore();
    // ruedas (con slicks, llantas de carrera)
    pxWheel(g, fx, wr, wr, slick ? 'mags' : 'caps', ww, ramp);
    pxWheel(g, rx, wrR, wrR, slick ? 'mags' : 'caps', ww, ramp);
    if (A.skirts) {
      g.save(); polyPath(g, A.body, true); g.clip();
      g.fillStyle = ramp.md; g.fillRect(rx - wr * 1.2, 4, wr * 2.4, 24);
      g.fillStyle = ramp.dk; g.fillRect(rx - wr * 1.2, 4, wr * 2.4, belt - 14.5);
      g.restore();
      g.fillStyle = PAL.g6; g.fillRect(rx - wr * 1.15, 6, wr * 2.3, 0.8);
    }
