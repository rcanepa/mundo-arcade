    // faro del aeródromo que gira
    const bx = ((W * 0.25 - scroll * 0.3) % (W + 400) + W + 400) % (W + 400) - 200;
    const a = t * 2.2;
    g.save(); g.globalCompositeOperation = 'lighter';
    const bg = g.createLinearGradient(bx, horizon - 30, bx + Math.cos(a) * 500, horizon - 30 - Math.abs(Math.sin(a)) * 200);
    bg.addColorStop(0, 'rgba(180,255,190,0.18)'); bg.addColorStop(1, 'rgba(180,255,190,0)');
    g.fillStyle = bg; g.beginPath(); g.moveTo(bx, horizon - 30); g.lineTo(bx + Math.cos(a) * 520, horizon - 30 - Math.abs(Math.sin(a)) * 220 - 30); g.lineTo(bx + Math.cos(a) * 520, horizon - 30 - Math.abs(Math.sin(a)) * 220 + 30); g.fill();
    g.restore();
  }
}

// ----- Colores del suelo según la zona -----
const GROUND = {
  strip: ['#2c2c2a', '#232321'], town: ['#3c3d3a', '#2f302d'], grove: ['#2b3a22', '#25331d'],
  canyon: ['#5a4634', '#4e3c2c'], oil: ['#463a2c', '#3c3226'], desert: ['#6a5a40', '#5d4f38']
};
// Cuánto alumbran los focos a una distancia (m) y a un costado (m)
function headlight(d, lat = 0, high = 1) {
  if (d < 0) return 0;
  const reach = 38 + high * 30;
  const f = clamp(1.1 - d / reach, 0, 1);
  const side = clamp(1 - Math.max(0, Math.abs(lat) - 3 - d * 0.18) / (6 + d * 0.15), 0, 1);
  return f * f * side;
}
function litColor(base, light, warm, dist) {
  const b = rgbOf(base);
  const k = 0.16 + light * 1.1;
  let r = b[0] * k + warm * 95, gg = b[1] * k + warm * 58, bb = b[2] * k + warm * 14;
  const fog = clamp(dist / 1100, 0, 1) * 0.85;
  r = lerp(r, 22, fog); gg = lerp(gg, 20, fog); bb = lerp(bb, 40, fog);
  return `rgb(${Math.min(255, r | 0)},${Math.min(255, gg | 0)},${Math.min(255, bb | 0)})`;
}

// ----- Dibujo de la calle en perspectiva -----
// cam = { z, x, shake }. objs = autos y otras cosas sobre la pista: { z, x, draw(g, sx, sy, scale, light) }
function renderRoad(g, T, cam, objs, t) {
  const baseI = Math.floor(cam.z / SEG), baseF = cam.z / SEG - baseI;
  const camY = heightAt(T, cam.z) + CAM_H;
  const base = T.segs[clamp(baseI, 0, T.segs.length - 1)];
  // el horizonte se mueve un poco con las curvas para que se sienta el giro
  const scroll = (cam.scroll || 0);
  drawNightSky(g, HORIZON + (cam.pitch || 0), scroll, t, { beacon: T.kind === 'drag' });
  const P = [];   // puntos proyectados de cada tramo
  let x = 0, dx = -base.curve * SEG * SEG * baseF;
  let maxy = H;
  const scaleK = W / 2 * CAM_D;
  for (let n = 0; n < DRAW_SEGS; n++) {
    const s = T.segs[baseI + n];
    if (!s) break;
    const z1 = (baseI + n) * SEG - cam.z, z2 = z1 + SEG;
    const pr = (zz, xx, yy) => {
      const zc = Math.max(0.1, zz);
      const sc = scaleK / zc;
      return [W / 2 + (xx - cam.x) * sc, HORIZON - (yy - camY) * sc, sc];
    };
    const p1 = pr(z1, -x, s.y), p2 = pr(z2, -x - dx, (T.segs[baseI + n + 1] || s).y);
    P[n] = { s, p1, p2, x, z: z1, clip: maxy };
    x += dx; dx += s.curve * SEG * SEG;
    if (z1 < 0.6 || p2[1] >= p1[1] || p2[1] >= maxy) { P[n].hidden = true; continue; }
    drawSegment(g, s, p1, p2, z1, cam, T);
    maxy = p2[1];
  }
  // adornos y autos: de lejos hacia cerca
  const pool = [];
  for (const o of objs) {
    const n = Math.floor((o.z - baseI * SEG) / SEG);
    if (n < 0 || n >= DRAW_SEGS || !P[n]) continue;
    pool.push({ n, o });
  }
  const poles = { '-1': [], '1': [] };
  for (let n = DRAW_SEGS - 1; n >= 1; n--) {
    const q = P[n];
    if (!q) continue;
    for (const sp of q.s.sprites) drawRoadSprite(g, q, sp, cam, t, poles);
    for (const it of pool) if (it.n === n) {
      const o = it.o, f = (o.z - (baseI + n) * SEG) / SEG;
      const sx = lerp(q.p1[0], q.p2[0], f) + o.x * lerp(q.p1[2], q.p2[2], f);
      const sy = lerp(q.p1[1], q.p2[1], f), sc = lerp(q.p1[2], q.p2[2], f);
      if (sy > q.clip + 40) continue;
      const d = o.z - cam.z;
      o.draw(g, sx, sy, sc, headlight(d, o.x - cam.x), d);
    }
  }
  // cables de teléfono entre postes
  g.strokeStyle = 'rgba(10,12,20,0.85)'; g.lineWidth = 1;
  for (const k of ['-1', '1']) {
    const a = poles[k];
    for (let i = 0; i + 1 < a.length; i++) {
      const [x1, y1, s1] = a[i], [x2, y2] = a[i + 1];
      if (Math.abs(x2 - x1) > W) continue;
      for (const off of [-1.1, 1.1]) {
        g.beginPath(); g.moveTo(x1 + off * s1, y1); g.quadraticCurveTo((x1 + x2) / 2, Math.max(y1, y2) + 6, x2 + off * a[i + 1][2], y2); g.stroke();
      }
    }
  }
  return P;
}

function drawSegment(g, s, p1, p2, z, cam, T) {
  const [x1, y1, k1] = p1, [x2, y2, k2] = p2;
  const alt = Math.floor(s.i / 2) % 2;
  const hl = headlight(z, 0, 1), warm = s.light * 0.75;
  const gr = GROUND[s.zone] || GROUND.town;
  // terreno de los costados
  g.fillStyle = litColor(gr[alt], hl * 0.55 + warm * 0.4, warm * 0.5, z);
  g.fillRect(0, y2, W, y1 - y2 + 1);
  const quad = (xa, wa, xb, wb, col) => {
    g.fillStyle = col; g.beginPath();
    g.moveTo(xa - wa, y1); g.lineTo(xa + wa, y1); g.lineTo(xb + wb, y2); g.lineTo(xb - wb, y2); g.closePath(); g.fill();
  };
  // berma y vereda
  const shoulder = s.zone === 'town' ? '#6a6862' : s.zone === 'strip' ? '#3a3a36' : '#4a4236';
  quad(x1, (ROAD_W + 1.4) * k1, x2, (ROAD_W + 1.4) * k2, litColor(shoulder, hl * 0.8 + warm, warm, z));
  // asfalto
  const asphalt = alt ? '#323236' : '#2e2e32';
  quad(x1, ROAD_W * k1, x2, ROAD_W * k2, litColor(asphalt, hl + warm, warm, z));
  // líneas: bordes blancos y centro segmentado (más brillantes, reflejan los faros)
  const lineL = hl * 1.8 + warm * 0.9;
  const white = litColor('#bfbfb8', lineL, warm * 0.6, z);
  const lw1 = 0.12 * k1, lw2 = 0.12 * k2;
  quad(x1 - (ROAD_W - 0.25) * k1, lw1, x2 - (ROAD_W - 0.25) * k2, lw2, white);
  quad(x1 + (ROAD_W - 0.25) * k1, lw1, x2 + (ROAD_W - 0.25) * k2, lw2, white);
  if (T.kind === 'drag') quad(x1, lw1, x2, lw2, white);
  else if (alt) quad(x1, lw1 * 0.9, x2, lw2 * 0.9, litColor('#c9a032', lineL, warm * 0.6, z));
  // líneas de partida y meta
  if (s.mark) {
    if (s.mark === 1) {
      // línea de partida pintada con tiza: delgada
      const yb = lerp(y1, y2, 0.1), kb = lerp(k1, k2, 0.1), xb = lerp(x1, x2, 0.1);
      g.fillStyle = litColor('#e8e8e0', lineL * 0.6, warm, z);
      g.beginPath(); g.moveTo(x1 - ROAD_W * k1, y1); g.lineTo(x1 + ROAD_W * k1, y1); g.lineTo(xb + ROAD_W * kb, yb); g.lineTo(xb - ROAD_W * kb, yb); g.fill();
    } else {
      const n = 12;
      for (let c = 0; c < n; c++) {
        const fa = -1 + 2 * c / n, fb = -1 + 2 * (c + 1) / n;
        for (let r = 0; r < 2; r++) {
          if ((c + r) % 2) continue;
          const ya = lerp(y1, y2, r / 2), yb = lerp(y1, y2, (r + 1) / 2), ka = lerp(k1, k2, r / 2), kb = lerp(k1, k2, (r + 1) / 2);
          const xa = lerp(x1, x2, r / 2), xb = lerp(x1, x2, (r + 1) / 2);
          g.fillStyle = litColor('#f0f0e8', lineL * 0.7, warm, z);
          g.beginPath(); g.moveTo(xa + fa * ROAD_W * ka, ya); g.lineTo(xa + fb * ROAD_W * ka, ya); g.lineTo(xb + fb * ROAD_W * kb, yb); g.lineTo(xb + fa * ROAD_W * kb, yb); g.fill();
        }
      }
    }
  }
}

function drawRoadSprite(g, q, sp, cam, t, poles) {
  const S = SPRITES[sp.key];
  if (!S) return;
  const sc = q.p1[2], sx = q.p1[0] + sp.x * sc, sy = q.p1[1];
  const w = S.w * sc, h = S.h * sc;
  if (sx + w < -50 || sx - w > W + 50 || h < 1.2) return;
  const d = q.z;
  const left = sx - w / 2, top = sy - h;
  const clipH = Math.min(h, q.clip - top);
  if (clipH <= 0) return;
  const srcH = S.dark.height * clipH / h;
  // los adornos asimétricos (faroles) se dan vuelta en el lado izquierdo para mirar a la calle
  const mirror = S.flip && sp.x < 0;
  if (mirror) { g.save(); g.translate(sx * 2, 0); g.scale(-1, 1); }
  g.drawImage(S.dark, 0, 0, S.dark.width, srcH, left, top, w, clipH);
  let light = headlight(d, sp.x - cam.x, 1) + q.s.light * 0.6;
  if (S.refl) light = Math.min(1, light * 2.6);
  if (light > 0.02) { g.globalAlpha = Math.min(1, light); g.drawImage(S.lit, 0, 0, S.lit.width, srcH, left, top, w, clipH); g.globalAlpha = 1; }
  const fog = 1 - clamp(d / 1400, 0, 0.7);
  if (S.emit) { g.globalAlpha = fog; g.drawImage(S.emit, 0, 0, S.emit.width, srcH, left, top, w, clipH); g.globalAlpha = 1; }
  if (mirror) g.restore();
  if (S.lamp) {
    g.save(); g.globalCompositeOperation = 'lighter';
    glow(g, sx + 1.4 * sc * (sp.x > 0 ? -1 : 1), sy - 9.4 * sc, 3.4 * sc, '#ffb860', 0.55 * fog);
    g.restore();
  }
  if (S.pole && poles) poles[sp.x < 0 ? '-1' : '1'].push([sx, sy - 9 * sc, sc]);
}

// ===== Carreras: picadas de cuarto de milla y carreras de ruta, vistas desde el asiento =====
const POLICE_GIVEUP = 380, FINE_STOP = 20, FINE_CAUGHT = 75;

// Cuánto puede doblar un auto en una curva sin salirse (m/s²)
const latGrip = (stats, skill = 1) => stats.lat * G * stats.handling * (0.78 + 0.22 * skill);
// Velocidad segura mirando la pista que viene (para los pilotos de la computadora y la policía)
function safeSpeed(T, z, v, grip, brake = 6) {
  let best = 90;
  for (let d = 0; d < 170; d += SEG) {
    const s = segAt(T, z + d), k = Math.abs(s.curve);
    if (k < 1e-5) continue;
    const vc = Math.sqrt(grip / k);
    best = Math.min(best, Math.sqrt(vc * vc + 2 * brake * d));
  }
  return best;
}

class Race {
  // o = { type: 'drag'|'road', car, rival: { name, look, car, skill, king }, bet, seed, police (0..1), units, auto (piloto automático para pruebas) }
  constructor(o) {
    this.o = o; this.type = o.type; this.t = 0;
    this.T = o.type === 'drag' ? buildDragStrip(o.seed) : buildRoadCourse(o.seed);
    const z0 = this.T.start - 3;
    const meStats = carStats(o.car), rvStats = carStats(o.rival.car);
    this.me = { car: o.car, s: meStats, veh: new Vehicle(meStats), z: z0, x: LANE, vx: 0, steer: 0, shake: 0, startZ: z0 };
    this.rv = { car: o.rival.car, s: rvStats, veh: new Vehicle(rvStats), z: z0, x: -LANE, vx: 0, drv: makeDriver(o.rival.skill), lane: -LANE, startZ: z0, crashed: false };
    if (o.auto) this.me.drv = makeDriver(1, () => 0.5);
    this.phase = 'intro'; this.phaseT = 0;
    this.flag = 0;           // 0 abajo, 1 arriba, 2 bajó (¡ya!)
    this.goAt = 0; this.goT = null;
    this.dropAfter = 1.3 + Math.random() * 1.9;
    this.rivalJump = o.rival.skill < 0.66 && !o.rival.king && Math.random() < 0.12;
    this.msg = null; this.hint = null; this.flash = 0; this.crack = 0;
    this.cross = { me: null, rv: null };
    this.reaction = null;
    this.scroll = 0;
    this.result = null; this.endT = 0;
    this.fuel0 = o.car.fuel;
    this.trap = 0;
    this.traffic = [];
    this.cop = null;
    this.copZ = o.type === 'road' && Math.random() < (o.police || 0) ? this.T.finish * (0.2 + Math.random() * 0.4) : null;
    if (o.type === 'road') this.spawnTraffic(rng(o.seed * 31 + 7));
    this.smoke = [];
  }

  spawnTraffic(R) {
    const len = this.T.finish;
    for (let i = 0; i < 11; i++) this.traffic.push({ z: 450 + R() * len * 1.9, x: -LANE, v: -(17 + R() * 6), color: rpick(R, ['#b9bec4', '#2f4f3a', '#6a1f2b', '#ece8dc', '#1d2a4d', '#8ab8de']), oncoming: true });
    for (let i = 0; i < 5; i++) {
      const model = rpick(R, ['chevy49', 'falcon60', 'olds50', 'chevy55', 'valiant61']);
      this.traffic.push({ z: 500 + R() * (len - 700), x: LANE, v: 15 + R() * 5, car: makeCar(model, { color: rpick(R, MODELS[model].colors) }), oncoming: false });
    }
  }

  say(text, t = 2.2, color = '#fff') { this.msg = { text, t, color, max: t }; }

  update(dt) {
    this.t += dt; this.phaseT += dt;
    const me = this.me, rv = this.rv;
    if (this.msg && (this.msg.t -= dt) <= 0) this.msg = null;
    this.flash = Math.max(0, this.flash - dt * 2);
    const inp = this.playerInput(dt);
    // ----- partida -----
    if (this.phase === 'intro' && this.phaseT > 2.2) { this.phase = 'stage'; this.phaseT = 0; }
    if (this.phase === 'stage') {
      if (this.flag === 0 && this.phaseT > 0.7) { this.flag = 1; Sound.sfx.flag(); }
      if (this.flag === 1 && this.phaseT > 0.7 + this.dropAfter) {
        this.flag = 2; this.goAt = this.t; this.phase = 'run'; this.phaseT = 0;
        Sound.sfx.go(); this.say(L().race.go, 1, '#ffd23a');
      } else if (this.rivalJump && this.flag === 1 && this.phaseT > 0.7 + this.dropAfter - 0.35) {
        rv.veh.launch(); return this.finish('win', 'rivalFoul');
      }
    }
    if (inp.launch && me.veh.gear === 0 && this.phase !== 'done') {
      if (this.phase !== 'run') { me.veh.launch(); return this.finish('lose', 'foul'); }
      me.veh.launch(); this.reaction = this.t - this.goAt;
    }
    this.goT = this.phase === 'run' || this.phase === 'done' ? this.t - this.goAt : null;
    // ----- autos -----
    this.stepCar(me, dt, inp);
    const rinp = this.phase === 'stage' || this.phase === 'intro'
      ? driveStraight(rv.veh, rv.drv, dt, null)
      : this.rivalInput(dt);
    this.stepCar(rv, dt, rinp);
    if (this.phase === 'run' || this.phase === 'done') this.stepTraffic(dt);
    // ----- llegada -----
    for (const [k, c] of [['me', me], ['rv', rv]]) {
      if (this.cross[k] === null && c.z >= this.T.finish) {
        const over = (c.z - this.T.finish) / Math.max(1, c.veh.v);
        this.cross[k] = this.t - this.goAt - over;
        if (k === 'me') this.trap = c.veh.v;
      }
    }
    if (this.phase === 'run') this.checkEnd(dt);
    if (this.phase === 'done') { this.endT += dt; }
    // sonido y efectos
    for (const ev of me.veh.events) {
      if (ev === 'shift') Sound.sfx.clunk();
      if (ev === 'grind') { Sound.sfx.grind(); this.say(L().race.grind, 2.4, '#ff8a6a'); }
      if (ev === 'blown') { Sound.sfx.boom(); this.flash = 0.6; }
      if (ev === 'broken') Sound.sfx.grind();
    }
    me.veh.events.length = 0; rv.veh.events.length = 0;
    if (me.veh.spin > 0.25 && me.veh.v < 40) this.puff(me, me.veh.spin);
    if (rv.veh.spin > 0.25 && rv.veh.v < 40) this.puff(rv, rv.veh.spin);
    for (const p of this.smoke) { p.age += dt; p.x += p.vx * dt; p.y -= dt * 0.6; p.r += dt * 1.6; }
    this.smoke = this.smoke.filter(p => p.age < 2.2);
    this.scroll += segAt(this.T, me.z).curve * me.veh.v * dt * 900;
  }

  puff(c, k) {
    if (Math.random() > k * 0.9) return;
    for (const side of [-0.75, 0.75]) this.smoke.push({ who: c, z: c.z - 2.2, x: c.x + side, y: 0.3, vx: side * 0.6, r: 0.6, age: 0 });
  }

  playerInput(dt) {
    const me = this.me;
    if (this.o.auto) {
      if (this.phase === 'intro') return { throttle: 0, brake: 0, steer: 0 };
      const drv = me.drv;
      if (me.veh.gear === 0) {
        const r = driveStraight(me.veh, drv, dt, this.phase === 'run' ? this.t - this.goAt : null);
        const launch = me.veh.gear > 0; if (launch) { me.veh.gear = 0; }
        return { throttle: r.throttle, brake: 0, steer: 0, launch };
      }
      const target = this.type === 'road' ? Math.min(safeSpeed(this.T, me.z, me.veh.v, latGrip(me.s) * 0.95), this.trafficLimit(me, this.rv)) : Infinity;
      const r = driveStraight(me.veh, drv, dt, 1, target);
      if (this.type === 'road') me.lane = this.aiLane(me, this.rv, LANE);
      const tx = this.type === 'road' ? me.lane : LANE;
      return { throttle: r.throttle, brake: r.brake, steer: clamp((tx - me.x) * 1.6 - me.vx * 0.5, -1, 1), auto: true };
    }
    const k = Input.read();
    const out = { throttle: k.gas ? 1 : 0, brake: k.brake ? 1 : 0, steer: k.steer, launch: false };
    if (k.up) { if (me.veh.gear === 0) out.launch = true; else me.veh.shiftUp(); }
    if (k.down) me.veh.shiftDown();
    if (k.horn) Sound.sfx.horn();
    if (this.phase === 'done') { out.throttle = 0; out.brake = 0.4; }
    return out;
  }

  // Elige carril con tres estados: va por su pista, adelanta por la izquierda, o aborta y vuelve detrás del lento
  aiLane(c, other, pref) {
    const v = c.veh.v, T = this.traffic;
    const oncoming = win => T.some(o => o.oncoming && o.z > c.z - 6 && o.z - c.z < win);
    const slowAhead = (x, far) => T.find(o => !o.oncoming && Math.abs(o.x - x) < 1.2 && o.z > c.z - 6 && o.z - c.z < far && o.v < v + 1) ||
      (Math.abs(other.x - x) < 1.9 && other.z > c.z - 6 && other.z - c.z < Math.min(far, 18) && other.veh.v < v + 1 ? other : null);
    const beside = x => T.some(o => !o.oncoming && Math.abs(o.x - x) < 1.4 && o.z - c.z > -6 && o.z - c.z < 7.5) || (Math.abs(other.x - x) < 1.9 && other.z - c.z > -6 && other.z - c.z < 7);
    c.ai = c.ai || 'cruise';
    if (c.ai === 'cruise') {
      if (slowAhead(LANE, 22 + v) && !oncoming(260 + v * 5) && !beside(-LANE)) c.ai = 'pass';
    } else if (c.ai === 'pass') {
      if (oncoming(170 + v * 3.5)) c.ai = 'abort';
      else if (!slowAhead(LANE, 10 + v * 0.6) && !beside(LANE)) c.ai = 'cruise';
    } else if (c.ai === 'abort') {
      if (!beside(LANE) && !slowAhead(LANE, 6)) c.ai = 'cruise';
      else if (!oncoming(240 + v * 5)) c.ai = 'pass';
    }
    if (pref < 0 && c.ai === 'cruise' && !oncoming(240 + v * 5)) return -LANE;
    return c.ai === 'pass' ? -LANE : c.ai === 'abort' ? (beside(LANE) ? -LANE : LANE) : LANE;
  }
  // Velocidad máxima para no chocar al de adelante (o al que viene de frente por tu pista), mirando también el carril al que va
  trafficLimit(c, other) {
    let lim = 90;
    const b = 6.5, lane = c.lane ?? c.x;
    const ahead = (oz, ox, ov, oncoming) => {
      if (oz < c.z || (Math.abs(c.x - ox) > 2.1 && Math.abs(lane - ox) > 1)) return;
      const d = oz - c.z - 9;
      lim = Math.min(lim, d < 0 ? Math.max(0, ov - 2) : Math.sqrt(Math.max(0, ov) ** 2 + 2 * b * d));
    };
    // frenar no sirve contra el que viene de frente: lo que salva es volver a la derecha
    for (const o of this.traffic) if (!o.oncoming) ahead(o.z, o.x, o.v, false);
    if (other) ahead(other.z, other.x, other.veh.v, false);
    // abortando un adelantamiento: frena para quedar detrás del lento
    if (c.ai === 'abort') for (const o of this.traffic) if (!o.oncoming && o.x > 0 && o.z - c.z > -9 && o.z - c.z < 12) lim = Math.min(lim, Math.max(8, o.v - 7));
    return lim;
  }

  rivalInput(dt) {
    const rv = this.rv;
    if (this.type === 'drag') return driveStraight(rv.veh, rv.drv, dt, this.t - this.goAt);
    rv.lane = this.aiLane(rv, this.me, LANE);
    const target = Math.min(safeSpeed(this.T, rv.z, rv.veh.v, latGrip(rv.s, rv.drv.skill) * 0.93, 4 + 3 * rv.drv.skill), this.trafficLimit(rv, this.me));
    return driveStraight(rv.veh, rv.drv, dt, this.t - this.goAt, target);
  }

  stepCar(c, dt, inp) {
    const v = c.veh, T = this.T;
    v.offroad = Math.abs(c.x) > ROAD_W + 0.4 ? 1 : 0;
    v.step(dt, inp);
    c.z += v.v * dt;
    const seg = segAt(T, c.z);
    if (c === this.me) {
      // volante: el teclado gira de a poco; las curvas empujan hacia afuera
      c.steer = approach(c.steer, inp.steer || 0, dt * (inp.auto ? 6 : 3.2));
      const grip = latGrip(c.s);
      const aReq = v.v * v.v * seg.curve;
      const aSteer = c.steer * grip * clamp(v.v / 8, 0, 1);
      let slide = 0;
      if (Math.abs(aReq) > grip) slide = (Math.abs(aReq) - grip) * Math.sign(aReq);
      const target = (aSteer - aReq) * 0.36;
      c.vx = lerp(c.vx, target, clamp(dt * 5, 0, 1));
      c.x = clamp(c.x + c.vx * dt, -ROAD_W - 7, ROAD_W + 7);
      c.slide = Math.abs(slide) + (Math.abs(aSteer) > grip * 0.92 && v.v > 15 ? 0.3 : 0);
      if (v.offroad) { c.shake = 1; }
      if (this.type === 'drag' && this.phase === 'run' && v.spin > 0.3) c.vx += (Math.random() - 0.5) * v.spin * 3 * dt;
    } else {
      c.x = approach(c.x, c.lane ?? c.x, dt * 2.6);
    }
  }

  stepTraffic(dt) {
    const me = this.me, rv = this.rv;
    for (const o of this.traffic) {
      if (!o.oncoming) {
        // los autos lentos frenan si tienen a alguien pegado adelante
        o.z += o.v * dt;
      } else o.z += o.v * dt;
    }
    // choques con el tráfico
    for (const o of this.traffic) {
      for (const c of [me, rv]) {
        if (Math.abs(o.z - c.z) < 4.4 && Math.abs(o.x - c.x) < 1.8) {
          const closing = Math.abs(c.veh.v - o.v);
          if (c === me) {
            if (closing > 6) return this.crash(closing, o);
            // toque suave: si es por detrás frena; si van lado a lado se empujan
            if (Math.abs(o.z - c.z) > 3) { c.veh.v = Math.min(c.veh.v, Math.max(0, o.v - 1)); c.z = o.z - Math.sign(o.z - c.z) * 4.5; }
            else c.x += c.x > o.x ? 0.25 : -0.25;
            Sound.sfx.bump(); this.flash = 0.12;
          } else if (closing > 10 && this.phase === 'run') {
            c.crashed = true; c.veh.v = 0; c.veh.dry = true;
            Sound.sfx.crash();
            return this.finish('win', 'rivalCrash');
          } else c.veh.v = Math.max(0, o.v - 1);
        }
      }
    }
    // roces con el rival
    if (Math.abs(me.z - rv.z) < 4.4 && Math.abs(me.x - rv.x) < 1.85) {
      const closing = Math.abs(me.veh.v - rv.veh.v);
      if (closing > 15) return this.crash(closing, rv);
      const push = me.x > rv.x ? 1 : -1;
      me.x += push * 0.35; me.vx = push * 1.5; Sound.sfx.bump(); this.flash = 0.15;
      if (me.z < rv.z) me.veh.v *= 0.97; else rv.veh.v *= 0.97;
    }
    // postes, árboles y rocas al salirse del camino
    if (Math.abs(me.x) > ROAD_W + 0.8) {
      const s = segAt(this.T, me.z + 2);
      for (const sp of s.sprites) {
        const S = SPRITES[sp.key];
        if (S && S.hit && Math.abs(sp.x - me.x) < S.w * S.hit * 0.5 + 0.9) {
          if (me.veh.v > 9) return this.crash(me.veh.v, null);
          me.veh.v = 0;
        }
      }
    }
    // la policía
    if (this.copZ !== null && !this.cop && me.z > this.copZ) {
      this.cop = { z: me.z - 130, x: LANE, v: me.veh.v, catchT: 0, s: { lat: 0.9, handling: 0.95 } };
      this.say(L().race.police, 3.2, '#ff6a6a');
    }
    if (this.cop) this.stepCop(dt);
  }

  stepCop(dt) {
    const cop = this.cop, me = this.me;
    const gap = me.z - cop.z;
    const target = Math.min(64, me.veh.v + 14, safeSpeed(this.T, cop.z, cop.v, 0.92 * G * 0.95, 7));
    cop.v = approach(cop.v, target, dt * (cop.v < target ? 7.5 : 9));
    cop.z += cop.v * dt;
    cop.x = approach(cop.x, gap < 60 ? me.x : LANE, dt * 3);
    Sound.siren(true, clamp(1 - gap / 400, 0.15, 1));
    if (gap < 9) cop.catchT += dt; else cop.catchT = Math.max(0, cop.catchT - dt * 0.5);
    if (me.veh.v < 2.5 && gap < 160) return this.finish('void', 'stopped');
    if (cop.catchT > 1.4) return this.finish('void', 'caught');
    if (gap > POLICE_GIVEUP) { this.cop = null; this.copZ = null; Sound.siren(false, 0); this.say(L().race.lostCops, 2.6, '#9dffa0'); }
  }

  crash(speed, other) {
    Sound.sfx.crash(); this.flash = 1; this.crack = 1;
    this.me.veh.v = 0; this.me.veh.throttle = 0;
    this.damage = clamp(speed / 38, 0.2, 1);
    return this.finish('lose', 'crash');
  }

  checkEnd(dt) {
    const me = this.me, v = me.veh;
    // bencina
    if (!v.dry) {
      const left = this.fuel0 - v.fuelUse * 3;
      if (left <= 0) { v.dry = true; this.say(L().race.dry, 3, '#ffb36a'); }
    }
    if (v.dead() && !this.deadT) this.deadT = this.t;
    if (this.cross.me !== null || this.cross.rv !== null) {
      if (this.cop && this.cross.me !== null) return this.finish('void', 'caught');
      const winMe = this.cross.me !== null && (this.cross.rv === null || this.cross.me <= this.cross.rv);
      return this.finish(winMe ? 'win' : 'lose', 'finish');
    }
    if (this.deadT && this.t - this.deadT > 1.6) return this.finish('lose', v.blown ? 'blown' : v.broken ? 'broken' : 'dry');
    // si te quedaste muy atrás (más de 30 segundos), la carrera termina
    if (this.t - this.goAt > (this.type === 'drag' ? 45 : 260)) return this.finish('lose', 'finish');
  }

  finish(outcome, reason) {
    if (this.phase === 'done') return;
    this.phase = 'done'; this.endT = 0;
    Sound.siren(false, 0);
    const me = this.me, v = me.veh;
    const fine = reason === 'stopped' ? FINE_STOP : reason === 'caught' ? FINE_CAUGHT : 0;
    // el que perdió la picada no alcanzó a llegar: se calcula cuánto le faltaba
    if (reason === 'finish' && this.type === 'drag') {
      for (const [k, c] of [['me', this.me], ['rv', this.rv]]) {
        if (this.cross[k] !== null) continue;
        this.cross[k] = this.t - this.goAt + Math.max(0, this.T.finish - c.z) / Math.max(8, c.veh.v);
        if (k === 'me') this.trap = c.veh.v;
      }
    }
    this.result = {
      outcome, reason, fine,
      time: this.cross.me, rivalTime: this.cross.rv, trap: this.trap, reaction: this.reaction,
      engineDmg: v.engineDmg, transDmg: v.transDmg, blown: v.blown, broken: v.broken,
      body: reason === 'crash' ? this.damage : 0, fuel: Math.min(this.fuel0, v.fuelUse * 3),
      grinds: v.grinds, tread: (this.type === 'drag' ? 0.03 : 0.06) + (v.grinds ? 0 : 0) + this.smoke.length * 0.0004
    };
    const S = L().race;
    const big = outcome === 'win' ? S.won : outcome === 'void' ? S.voided : S.lost;
    this.say(big, 99, outcome === 'win' ? '#ffd23a' : outcome === 'void' ? '#9ec8ff' : '#ff6a5a');
    this.sub = S.reasons[reason] || '';
    if (outcome === 'win') Sound.sfx.win(); else if (outcome === 'lose') Sound.sfx.lose();
  }

  // ¿Ya se puede salir de la pantalla de la carrera?
  get over() { return this.phase === 'done' && this.endT > 1.2; }

  // ----- Dibujo -----
  draw(g) {
    const me = this.me, rv = this.rv, T = this.T;
    const sh = (me.veh.v / 60) * 1.2 + (me.veh.offroad ? 3 : 0) + this.flash * 8;
    const ox = (Math.random() - 0.5) * sh, oy = (Math.random() - 0.5) * sh;
    g.save(); g.translate(ox, oy);
    const objs = [];
    // la persona con la bandera
    objs.push({ z: T.start + 10, x: 0, draw: (gg, sx, sy, sc, light) => drawFlagger(gg, sx, sy, sc, light, this.flag, this.t) });
    if (T.kind === 'road') objs.push({ z: T.finish, x: 0, draw: (gg, sx, sy, sc, light) => drawFinishBanner(gg, sx, sy, sc, light, this.t) });
    if (rv.z > me.z + 1) objs.push({ z: rv.z, x: rv.x, draw: (gg, sx, sy, sc, light) => {
      drawCarRear(gg, rv.car, sx, sy, 2.0 * sc, { light: clamp(light * 1.3 + 0.08, 0, 1), brake: rv.veh.brake > 0.1 || this.phase === 'done', plate: this.o.rival.king ? 'KING 1' : 'HOT 63' });
    } });
    for (const o of this.traffic) {
      if (o.z < me.z + 1) continue;
      objs.push({ z: o.z, x: o.x, draw: (gg, sx, sy, sc, light) => {
        if (o.oncoming) drawCarFront(gg, sx, sy, 1.9 * sc, { color: o.color, light });
        else drawCarRear(gg, o.car, sx, sy, 1.9 * sc, { light: clamp(light + 0.05, 0, 1) });
      } });
    }
    if (this.cop && this.cop.z > me.z) objs.push({ z: this.cop.z, x: this.cop.x, draw: (gg, sx, sy, sc, light) => drawCarFront(gg, sx, sy, 2 * sc, { color: '#111', roof: '#eee', light, cop: 1, t: this.t, headlights: 0.3 }) });
    for (const p of this.smoke) if (p.z > me.z + 2) {
      objs.push({ z: p.z, x: p.x, draw: (gg, sx, sy, sc, light) => {
        gg.fillStyle = `rgba(200,200,210,${(0.35 * (1 - p.age / 2.2) * (0.3 + light)).toFixed(3)})`;
        gg.beginPath(); gg.arc(sx, sy - p.y * sc, p.r * sc, 0, TAU); gg.fill();
      } });
    }
    const cam = { z: me.z, x: me.x, scroll: this.scroll, pitch: clamp(-me.veh.acc * 1.2, -8, 8) };
    const P = renderRoad(g, T, cam, objs, this.t);
    // la luz de los focos del rival (y de la policía) sobre el asfalto
    const beam = (c, ahead) => {
      const n = Math.floor((c.z + ahead) / SEG) - Math.floor(me.z / SEG);
      const q = P[n];
      if (!q || q.hidden) return;
      const sx = q.p1[0] + c.x * q.p1[2], sy = q.p1[1], k = q.p1[2];
      g.save(); g.globalCompositeOperation = 'lighter'; g.translate(sx, sy); g.scale(1, 0.18);
      const bg = g.createRadialGradient(0, 0, 0, 0, 0, 7 * k);
      bg.addColorStop(0, 'rgba(255,236,190,0.32)'); bg.addColorStop(1, 'rgba(255,236,190,0)');
      g.fillStyle = bg; g.beginPath(); g.arc(0, 0, 7 * k, 0, TAU); g.fill(); g.restore();
    };
    if (rv.z > me.z - 30 && rv.z < me.z + 60) { beam(rv, 14); beam(rv, 26); }
    // el auto del rival por la ventana del costado cuando van a la par
    const side = rv.z - me.z;
    if (side > -5 && side < 3 && Math.abs(rv.x - me.x) < 5) {
      const dir = rv.x < me.x ? -1 : 1, px = dir < 0 ? 40 : W - 40;
      g.save(); g.globalCompositeOperation = 'lighter';
      glow(g, px + dir * 0 + (side + 2) * 60 * -dir * -1, 360, 90, '#fff2cc', 0.35);
      g.restore();
    }
    // la luz de tus propios focos sobre el camino
    g.save(); g.globalCompositeOperation = 'lighter';
    const lg = g.createRadialGradient(W / 2, H * 0.62, 30, W / 2, H * 0.6, 520);
    lg.addColorStop(0, 'rgba(255,240,200,0.10)'); lg.addColorStop(1, 'rgba(255,240,200,0)');
    g.fillStyle = lg; g.fillRect(0, HORIZON, W, H - HORIZON);
    g.restore();
    // humo de mis ruedas por los costados
    if (me.veh.spin > 0.3) {
      g.fillStyle = `rgba(210,210,220,${(me.veh.spin * 0.22).toFixed(3)})`;
      for (const sx of [80, W - 80]) { g.beginPath(); g.arc(sx + Math.sin(this.t * 9) * 20, 420, 120 + me.veh.spin * 60, 0, TAU); g.fill(); }
    }
    drawCockpit(g, this);
    g.restore();
    this.drawHud(g);
  }

  drawHud(g) {
    const S = L().race, o = this.o, me = this.me;
    // etiqueta de la carrera
    g.save();
    g.font = font(15, 'bold', FONT_SANS); g.textBaseline = 'middle';
    const tag = `${o.type === 'drag' ? S.drag : S.road}  ·  ${o.bet === 'pinks' ? S.pinks : o.bet ? money(o.bet) : S.kicks}`;
    const tw = g.measureText(tag).width + 28;
    g.fillStyle = 'rgba(8,10,18,0.72)'; roundRect(g, 150, 76, tw, 30, 15); g.fill();
    g.fillStyle = '#ffd23a'; g.textAlign = 'left'; g.fillText(tag, 164, 92);
    // rival y distancia
    const rtag = (o.rival.king ? '👑 ' : '') + o.rival.name;
    g.font = font(14, 'bold', FONT_SANS);
    const rw = g.measureText(rtag).width + 28;
    g.fillStyle = 'rgba(8,10,18,0.72)'; roundRect(g, W - 150 - Math.max(rw, 220), 76, Math.max(rw, 220), 30, 15); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'right'; g.fillText(rtag, W - 164, 92);
    // barra de avance (los dos autos)
    const bx = W - 150 - 220, by = 114, bw = 220;
    g.fillStyle = 'rgba(8,10,18,0.6)'; roundRect(g, bx, by, bw, 14, 7); g.fill();
    const len = this.T.finish - this.T.start;
    const pos = c => clamp((c.z - this.T.start) / len, 0, 1);
    g.fillStyle = '#ff5a4a'; g.beginPath(); g.arc(bx + 7 + pos(this.rv) * (bw - 14), by + 7, 5, 0, TAU); g.fill();
    g.fillStyle = '#ffd23a'; g.beginPath(); g.arc(bx + 7 + pos(me) * (bw - 14), by + 7, 6, 0, TAU); g.fill();
    if (this.cop) { g.fillStyle = Math.sin(this.t * 14) > 0 ? '#ff2020' : '#2060ff'; g.beginPath(); g.arc(bx + 7 + clamp((this.cop.z - this.T.start) / len, 0, 1) * (bw - 14), by + 7, 4, 0, TAU); g.fill(); }
    // mapita de la ruta
    if (this.T.map) drawMiniMap(g, this, W - 150 - 110, 140, 104);
    // mensajes grandes
    if (this.phase === 'intro') {
      const a = clamp(this.phaseT < 0.4 ? this.phaseT / 0.4 : 1, 0, 1);
      g.globalAlpha = a;
      g.textAlign = 'center';
      g.font = font(44, 'bold', FONT_DISPLAY); g.fillStyle = '#fff';
      g.shadowColor = 'rgba(0,0,0,0.8)'; g.shadowBlur = 12;
      g.fillText(o.type === 'drag' ? S.dragTitle : S.roadTitle, W / 2, 190);
      g.font = font(20, 'normal', FONT_SANS); g.fillText(o.type === 'drag' ? S.dragPlace : S.roadPlace, W / 2, 232);
      g.shadowBlur = 0; g.globalAlpha = 1;
    }
    if (this.phase === 'stage' || this.phase === 'intro') {
      this.hintText(g, me.s.auto ? S.hintAuto : S.hintStage);
    } else if (this.phase === 'run' && this.t - this.goAt < 6 && me.veh.gear > 0 && !me.s.auto && me.veh.gear < me.veh.nGears) {
      this.hintText(g, S.hintShift);
    } else if (this.phase === 'run' && this.cop) {
      this.hintText(g, S.hintCops);
    }
    if (this.msg) {
      const m = this.msg, a = clamp(m.t / 0.3, 0, 1) * clamp((m.max - m.t) / 0.15, 0, 1);
      g.globalAlpha = a; g.textAlign = 'center';
      g.font = font(this.phase === 'done' ? 64 : 34, 'bold', FONT_DISPLAY);
      g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,0.75)'; g.lineJoin = 'round';
      g.strokeText(m.text, W / 2, 250); g.fillStyle = m.color; g.fillText(m.text, W / 2, 250);
      if (this.phase === 'done' && this.sub) {
        g.font = font(22, 'bold', FONT_SANS); g.lineWidth = 6; g.strokeText(this.sub, W / 2, 298); g.fillStyle = '#fff'; g.fillText(this.sub, W / 2, 298);
      }
      g.globalAlpha = 1;
    }
    if (this.phase === 'done' && this.endT > 1.2) this.hintText(g, S.continue);
    // destellos de choque
    if (this.flash > 0) { g.fillStyle = `rgba(255,255,255,${(this.flash * 0.6).toFixed(3)})`; g.fillRect(0, 0, W, H); }
    g.restore();
  }
  hintText(g, text) {
    g.save(); g.font = font(16, 'bold', FONT_SANS); g.textAlign = 'center'; g.textBaseline = 'middle';
    const w = g.measureText(text).width + 36;
    g.fillStyle = 'rgba(8,10,18,0.7)'; roundRect(g, W / 2 - w / 2, 330, w, 34, 17); g.fill();
    g.fillStyle = '#f2ecd8'; g.fillText(text, W / 2, 347); g.restore();
  }
}

function drawMiniMap(g, race, x, y, size) {
  const m = race.T.map;
  if (!race._mapBox) {
    let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity;
    for (const [px, pz] of m) { a = Math.min(a, px); b = Math.max(b, px); c = Math.min(c, pz); d = Math.max(d, pz); }
    race._mapBox = [a, b, c, d];
  }
  const [a, b, c, d] = race._mapBox, k = (size - 16) / Math.max(b - a, d - c);
  const P = i => { const p = m[clamp(i, 0, m.length - 1)]; return [x + 8 + (p[0] - a) * k, y + size - 8 - (p[1] - c) * k]; };
  g.fillStyle = 'rgba(8,10,18,0.6)'; roundRect(g, x, y, size, size, 12); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.55)'; g.lineWidth = 2; g.beginPath();
  const fi = Math.floor(race.T.finish / SEG);
  for (let i = 0; i <= fi; i += 3) { const [px, py] = P(i); i ? g.lineTo(px, py) : g.moveTo(px, py); }
  g.stroke();
  const dot = (z, col, r) => { const [px, py] = P(Math.floor(z / SEG)); g.fillStyle = col; g.beginPath(); g.arc(px, py, r, 0, TAU); g.fill(); };
  dot(race.T.finish, '#fff', 3);
  dot(race.rv.z, '#ff5a4a', 4); dot(race.me.z, '#ffd23a', 5);
  if (race.cop) dot(race.cop.z, '#5aa0ff', 4);
}

// La persona que da la partida: brazos arriba con la bandera, y la baja de golpe
function drawFlagger(g, sx, sy, sc, light, flag, t) {
  const h = 1.75 * sc;
  if (h < 2) return;
  const lit = clamp(light * 1.2 + 0.12, 0, 1);
  const skin = css(mix('#000', '#e0b090', lit)), shirt = css(mix('#000', '#f2f0ea', lit)), pants = css(mix('#000', '#2a3a6a', lit));
  g.save(); g.translate(sx, sy);
  g.fillStyle = 'rgba(0,0,0,0.4)'; g.beginPath(); g.ellipse(0, 0, 0.5 * sc, 0.08 * sc, 0, 0, TAU); g.fill();
  g.fillStyle = pants; g.fillRect(-0.2 * sc, -0.9 * sc, 0.17 * sc, 0.9 * sc); g.fillRect(0.03 * sc, -0.9 * sc, 0.17 * sc, 0.9 * sc);
  g.fillStyle = shirt; roundRect(g, -0.25 * sc, -1.5 * sc, 0.5 * sc, 0.65 * sc, 0.1 * sc); g.fill();
  g.fillStyle = skin; g.beginPath(); g.arc(0, -1.62 * sc, 0.13 * sc, 0, TAU); g.fill();
  g.fillStyle = css(mix('#000', '#2a1f18', lit)); g.beginPath(); g.arc(0, -1.66 * sc, 0.13 * sc, Math.PI, 0); g.fill();
  // brazos y bandera
  const up = flag === 1, drop = flag === 2;
  const ang = up ? -2.6 + Math.sin(t * 6) * 0.05 : drop ? 0.5 : 0.25;
  g.strokeStyle = shirt; g.lineWidth = 0.12 * sc; g.lineCap = 'round';
  for (const d of [-1, 1]) {
    const a = d < 0 ? Math.PI - ang : ang;
    g.beginPath(); g.moveTo(d * 0.22 * sc, -1.42 * sc); g.lineTo(d * 0.22 * sc + Math.cos(a) * 0.65 * sc, -1.42 * sc + Math.sin(a) * 0.65 * sc); g.stroke();
  }
  const hx = 0.22 * sc + Math.cos(ang) * 0.65 * sc, hy = -1.42 * sc + Math.sin(ang) * 0.65 * sc;
  g.fillStyle = css(mix('#000', '#ffffff', lit));
  g.beginPath(); g.moveTo(hx, hy);
  const wave = Math.sin(t * 9) * 0.08 * sc;
  if (up) { g.lineTo(hx + 0.55 * sc, hy - 0.1 * sc + wave); g.lineTo(hx + 0.5 * sc, hy + 0.32 * sc + wave); g.lineTo(hx, hy + 0.3 * sc); }
  else { g.lineTo(hx + 0.3 * sc, hy + 0.5 * sc); g.lineTo(hx + 0.05 * sc, hy + 0.6 * sc); }
  g.closePath(); g.fill();
  g.restore();
}
function drawFinishBanner(g, sx, sy, sc, light, t) {
  const w = (ROAD_W + 1.2) * sc, top = sy - 5.2 * sc, bh = 0.9 * sc;
  if (sc < 0.3) return;
  g.fillStyle = '#222'; g.fillRect(sx - w - 0.1 * sc, top, 0.2 * sc, 5.2 * sc); g.fillRect(sx + w - 0.1 * sc, top, 0.2 * sc, 5.2 * sc);
  const n = 16, cw = (2 * w) / n, lit = clamp(light + 0.25, 0, 1);
  for (let i = 0; i < n; i++) for (let r = 0; r < 2; r++) {

function gauge(g, cx, cy, r, value, max, labels, o = {}) {
  g.save();
  const a0 = o.a0 ?? Math.PI * 0.75, a1 = o.a1 ?? Math.PI * 2.25;
  const face = g.createRadialGradient(cx, cy - r * 0.3, r * 0.1, cx, cy, r);
  face.addColorStop(0, o.face || '#1c1f24'); face.addColorStop(1, '#07080a');
  g.fillStyle = face; g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.fill();
  g.strokeStyle = chromeGrad(g, cy - r, cy + r); g.lineWidth = Math.max(3, r * 0.08); g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke();
  if (o.red) {
    g.strokeStyle = '#d42a1e'; g.lineWidth = r * 0.12; g.beginPath(); g.arc(cx, cy, r * 0.82, a0 + (a1 - a0) * o.red / max, a1); g.stroke();
  }
  // zona verde: las vueltas para largar
  if (o.green) {
    g.strokeStyle = '#3ad16a'; g.lineWidth = r * 0.12; g.beginPath(); g.arc(cx, cy, r * 0.82, a0 + (a1 - a0) * (o.green - 500) / max, a0 + (a1 - a0) * (o.green + 150) / max); g.stroke();
  }
  g.strokeStyle = 'rgba(240,236,220,0.85)'; g.fillStyle = 'rgba(240,236,220,0.92)';
  g.textAlign = 'center'; g.textBaseline = 'middle'; g.font = font(Math.max(8, r * 0.17), 'bold', FONT_SANS);
  labels.forEach((lab, i) => {
    const a = a0 + (a1 - a0) * i / (labels.length - 1);
    g.lineWidth = 2; g.beginPath(); g.moveTo(cx + Math.cos(a) * r * 0.86, cy + Math.sin(a) * r * 0.86); g.lineTo(cx + Math.cos(a) * r * 0.72, cy + Math.sin(a) * r * 0.72); g.stroke();
    if (lab !== '') g.fillText(lab, cx + Math.cos(a) * r * 0.56, cy + Math.sin(a) * r * 0.56);
  });
  if (o.title) { g.font = font(Math.max(7, r * 0.12), 'bold', FONT_SANS); g.fillStyle = 'rgba(240,236,220,0.6)'; g.fillText(o.title, cx, cy + r * 0.38); }
  const a = a0 + (a1 - a0) * clamp(value / max, 0, 1.05);
  g.strokeStyle = o.needle || '#ff6a2a'; g.lineWidth = Math.max(2, r * 0.05); g.lineCap = 'round';
  g.beginPath(); g.moveTo(cx - Math.cos(a) * r * 0.12, cy - Math.sin(a) * r * 0.12); g.lineTo(cx + Math.cos(a) * r * 0.8, cy + Math.sin(a) * r * 0.8); g.stroke();
  g.fillStyle = '#2a2a2e'; g.beginPath(); g.arc(cx, cy, r * 0.1, 0, TAU); g.fill();
  // luz de los instrumentos
  g.globalCompositeOperation = 'lighter';
  glow(g, cx, cy, r * 1.1, '#6aff9a', 0.05);
  g.restore();
}

function drawCockpit(g, race) {
  const me = race.me, v = me.veh, s = me.s, car = me.car;
  const st = cockpitStatic(race);
  // espejo: lo que viene detrás
  drawMirror(g, race);
  g.drawImage(st.c, 0, 0, W, H);
  // si viene la policía, la cabina se tiñe de rojo y azul
  if (race.cop && race.cop.z > me.z - 200) {
    const on = Math.sin(race.t * 14) > 0;
    g.fillStyle = on ? 'rgba(255,30,30,0.10)' : 'rgba(40,80,255,0.07)'; g.fillRect(0, 0, W, H);
  }
  // instrumentos
  const metric = LANG === 'es';
  const spd = metric ? v.v * 3.6 : v.v * 2.237, smax = metric ? 240 : 150;
  const sl = metric ? ['0', '40', '80', '120', '160', '200', '240'] : ['0', '25', '50', '75', '100', '125', '150'];
  gauge(g, 410, 608, 62, spd, smax, sl, { title: metric ? 'km/h' : 'MPH' });
  const fuelLeft = clamp((race.fuel0 - v.fuelUse * 3) / TANK, 0, 1);
  gauge(g, 520, 580, 26, fuelLeft, 1, ['E', '', 'F'], { a0: Math.PI * 1.1, a1: Math.PI * 1.9, needle: '#f2f0e0', title: '' });
  const temp = clamp(0.35 + v.engineDmg * 0.7 + (v.rpm > s.red ? 0.15 : 0), 0, 1);
  gauge(g, 520, 640, 26, temp, 1, ['C', '', 'H'], { a0: Math.PI * 1.1, a1: Math.PI * 1.9, needle: temp > 0.8 ? '#ff3a2a' : '#f2f0e0' });
  // luces de aviso
  g.font = font(10, 'bold', FONT_SANS); g.textAlign = 'center';
  const warn = (x, label, on, col) => {
    g.fillStyle = on ? col : '#2a2420'; roundRect(g, x - 16, 664, 32, 14, 4); g.fill();
    if (on) { g.save(); g.globalCompositeOperation = 'lighter'; glow(g, x, 671, 26, col, 0.4); g.restore(); }
    g.fillStyle = on ? '#fff' : '#5a524a'; g.fillText(label, x, 674);
  };
  warn(360, 'OIL', v.blown, '#ff3a2a'); warn(400, 'GEN', v.dead(), '#ff3a2a'); warn(440, 'HOT', temp > 0.8, '#ff7a2a'); warn(480, 'GAS', fuelLeft < 0.1, '#ffb02a');
  // marcha de los automáticos
  if (s.auto) {
    g.fillStyle = 'rgba(240,236,220,0.85)'; g.font = font(14, 'bold', FONT_SANS);
    const sel = v.gear === 0 ? 'N' : 'D';
    'PRNDL'.split('').forEach((ch, i) => { g.fillStyle = ch === sel ? '#ff8a3a' : 'rgba(240,236,220,0.5)'; g.fillText(ch, 340 + i * 26, 560); });
  }
  // tacómetro Sun sobre la columna (con su luz para pasar el cambio)
  const tx = 600, ty = 452, tr = 66;
  g.fillStyle = '#0c0c0e'; g.fillRect(tx - 8, ty + tr - 6, 16, 40);
  g.fillStyle = chromeGrad(g, ty - tr - 8, ty + tr + 8); g.beginPath(); g.arc(tx, ty, tr + 8, 0, TAU); g.fill();
  const rmax = Math.ceil((s.red + 1000) / 1000) * 1000;
  const labs = []; for (let r = 0; r <= rmax; r += 1000) labs.push(String(r / 1000));
  gauge(g, tx, ty, tr, v.rpm, rmax, labs, { red: s.red, green: v.gear === 0 ? s.peak * LAUNCH : 0, title: 'RPM x1000', face: '#15161a' });
  const shiftOn = !s.auto && v.gear > 0 && v.gear < v.nGears && v.rpm > s.peak * 1.02;
  g.fillStyle = shiftOn ? '#ff2a1a' : '#4a1010'; g.beginPath(); g.arc(tx + tr * 0.8, ty - tr * 0.85, 9, 0, TAU); g.fill();
  if (shiftOn) { g.save(); g.globalCompositeOperation = 'lighter'; glow(g, tx + tr * 0.8, ty - tr * 0.85, 46, '#ff3020', 0.8); g.restore(); }
  // palanca de cambios
  drawShifter(g, race);
  // volante
  drawSteeringWheel(g, 420, 822, 330, me.steer * 1.6, st.old ? '#e9e1c8' : '#16161a');
  // vidrio trizado tras un choque
  if (race.crack) {
    g.save(); g.strokeStyle = 'rgba(230,240,255,0.7)'; g.lineWidth = 1.5;
    const cx = 760, cy = 230, R = rng(9);
    for (let i = 0; i < 14; i++) {
      const a = R() * TAU; let x = cx, y = cy; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 5; k++) { x += Math.cos(a + (R() - 0.5) * 0.8) * 40; y += Math.sin(a + (R() - 0.5) * 0.8) * 40; g.lineTo(x, y); }
      g.stroke();
    }
    for (const r of [18, 42, 70]) { g.beginPath(); g.arc(cx, cy, r, 0, TAU); g.stroke(); }
    g.restore();
  }
}

function drawShifter(g, race) {
  const v = race.me.veh, s = race.me.s;
  if (s.auto) {
    // palanca en la columna del volante
    g.strokeStyle = chromeGrad(g, 600, 640); g.lineWidth = 8; g.lineCap = 'round';
    g.beginPath(); g.moveTo(470, 660); g.lineTo(560, v.gear === 0 ? 610 : 630); g.stroke();
    g.fillStyle = '#efe8d8'; g.beginPath(); g.arc(564, v.gear === 0 ? 608 : 632, 9, 0, TAU); g.fill();
    return;
  }
  // palanca al piso con patrón en H
  const n = v.nGears, g0 = v.gear;
  const col = g0 === 0 ? 0 : Math.ceil(g0 / 2) - 1, up = g0 % 2 === 1;
  const cols = Math.ceil(n / 2);
  const kx = 880 + (g0 === 0 ? 0 : (col - (cols - 1) / 2) * 30) + (v.shiftT > 0 ? Math.sin(race.t * 60) * 3 : 0);
  const ky = g0 === 0 ? 600 : up ? 572 : 628;
  g.fillStyle = '#121214'; g.beginPath(); g.ellipse(900, 712, 60, 20, 0, 0, TAU); g.fill();
  g.strokeStyle = chromeGrad(g, ky, 712); g.lineWidth = 10; g.lineCap = 'round';
  g.beginPath(); g.moveTo(900, 712); g.quadraticCurveTo(905, 660, kx, ky); g.stroke();
  const kg = g.createRadialGradient(kx - 6, ky - 6, 2, kx, ky, 18);
  kg.addColorStop(0, '#ffffff'); kg.addColorStop(1, '#b8b0a0');
  g.fillStyle = kg; g.beginPath(); g.arc(kx, ky, 17, 0, TAU); g.fill();
  g.fillStyle = '#333'; g.font = font(14, 'bold', FONT_SANS); g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(g0 === 0 ? 'N' : String(g0), kx, ky + 1);
  // patrón del cambio
  g.fillStyle = 'rgba(8,10,18,0.55)'; roundRect(g, 1010, 650, 150, 54, 10); g.fill();
  for (let i = 1; i <= n; i++) {
    const cx = 1040 + (Math.ceil(i / 2) - 1) * 36, cy = i % 2 ? 666 : 690;
    g.fillStyle = i === g0 ? '#ffd23a' : 'rgba(240,236,220,0.5)'; g.font = font(14, 'bold', FONT_SANS);
    g.fillText(String(i), cx, cy);
  }
}

function drawSteeringWheel(g, cx, cy, r, ang, color) {
  g.save(); g.translate(cx, cy); g.rotate(ang);
  // aro
  g.strokeStyle = color; g.lineWidth = 22;
  g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
  g.strokeStyle = 'rgba(255,255,255,0.18)'; g.lineWidth = 4; g.beginPath(); g.arc(0, 0, r + 5, Math.PI * 1.1, Math.PI * 1.6); g.stroke();
  // rayos y aro de la bocina
  g.strokeStyle = color; g.lineWidth = 16;
  for (const a of [0.12, Math.PI - 0.12, Math.PI / 2]) { g.beginPath(); g.moveTo(Math.cos(a) * 60, Math.sin(a) * 60); g.lineTo(Math.cos(a) * r, Math.sin(a) * r); g.stroke(); }
  g.strokeStyle = chromeGrad(g, -150, 150); g.lineWidth = 7; g.beginPath(); g.arc(0, 0, 130, Math.PI * 1.15, Math.PI * 1.85); g.stroke();
  g.fillStyle = chromeGrad(g, -60, 60); g.beginPath(); g.arc(0, 0, 58, 0, TAU); g.fill();
  g.restore();
}

function drawMirror(g, race) {
  const me = race.me, x = 520, y = 44, w = 240, h = 56;
  g.save();
  roundRect(g, x, y, w, h, 14);
  g.save(); g.clip();
  const bg = g.createLinearGradient(0, y, 0, y + h); bg.addColorStop(0, '#0b1022'); bg.addColorStop(0.55, '#181a2a'); bg.addColorStop(1, '#101012');
  g.fillStyle = bg; g.fillRect(x, y, w, h);
  g.strokeStyle = 'rgba(200,200,190,0.15)'; g.lineWidth = 1;
  g.beginPath(); g.moveTo(x + w / 2 - 6, y + h * 0.5); g.lineTo(x + 20, y + h); g.moveTo(x + w / 2 + 6, y + h * 0.5); g.lineTo(x + w - 20, y + h); g.stroke();
  const things = [];
  if (race.rv.z < me.z) things.push({ d: me.z - race.rv.z, x: race.rv.x, kind: 'car' });
  if (race.cop && race.cop.z < me.z) things.push({ d: me.z - race.cop.z, x: race.cop.x, kind: 'cop' });
  for (const o of race.traffic) if (o.z < me.z && me.z - o.z < 300) things.push({ d: me.z - o.z, x: o.x, kind: o.oncoming ? 'tail' : 'car' });
  g.globalCompositeOperation = 'lighter';
  for (const t of things) {
    const k = 30 / Math.max(6, t.d);
    const mx = x + w / 2 + (t.x - me.x) * k * 9, my = y + h * 0.52 + 9 * k;
    if (t.kind === 'tail') { glow(g, mx - 6 * k, my, 10 * k + 3, '#ff2a1a', 0.6); glow(g, mx + 6 * k, my, 10 * k + 3, '#ff2a1a', 0.6); continue; }
    glow(g, mx - 10 * k, my, 18 * k + 4, '#fff4d6', 0.7); glow(g, mx + 10 * k, my, 18 * k + 4, '#fff4d6', 0.7);
    if (t.kind === 'cop') { const on = Math.sin(race.t * 14) > 0; glow(g, mx, my - 8 * k, 30 * k + 10, on ? '#ff2020' : '#3060ff', 0.9); }
  }
  for (const p of race.smoke) if (p.who === me) { g.fillStyle = `rgba(160,160,170,${(0.25 * (1 - p.age / 2.2)).toFixed(3)})`; g.beginPath(); g.arc(x + w / 2 + (p.x - me.x) * 12, y + h * 0.75 - p.age * 8, 10 + p.age * 20, 0, TAU); g.fill(); }
  g.restore();
  g.lineWidth = 5; g.strokeStyle = chromeGrad(g, y, y + h); roundRect(g, x, y, w, h, 14); g.stroke();
  g.restore();
}

// ===== Sonido: todo sintetizado con WebAudio (no necesita archivos ni internet) =====
// Sin AudioContext (por ejemplo en las pruebas con Node) todo es silencioso: nada se crea hasta que init() funciona.
const Sound = (() => {
  const MUSIC_KEY = 'streetrod63.music', MUSIC_VOL = 0.13;
  let ac = null, master, sfxBus, musicBus, fxIn, noiseBuf, lumpWave, shapeCurve;
  let musicOn = (() => { try { return localStorage.getItem(MUSIC_KEY) !== '0'; } catch (e) { return true; } })();
  let songName = null, song = null, cur = null, step = 0, nextT = 0;
  const engines = {};
  let skidV = null, sirenV = null, windV = null;

  const clamp01 = v => (v > 0 ? (v < 1 ? v : 1) : 0);
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = typeof window !== 'undefined' ? (window.AudioContext || window.webkitAudioContext) : null;
    if (!AC) return;
    try { ac = new AC(); } catch (e) { ac = null; return; }
    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master = ac.createGain(); master.gain.value = 0.6;
    master.connect(comp); comp.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // Eco de resorte (como el reverb de las guitarras surf): dos retardos cortos que se realimentan
    fxIn = ac.createGain();
    const d1 = ac.createDelay(1), d2 = ac.createDelay(1), fb1 = ac.createGain(), fb2 = ac.createGain();

  // --- motores: una voz por auto, que se ajusta suave en cada cuadro ---
  function makeEngine() {
    const e = { saw: ac.createOscillator(), sub: ac.createOscillator(), lfo: ac.createOscillator(), noise: src() };

    e.saw.connect(e.mixSaw); e.sub.connect(e.mixSub); e.mixSaw.connect(e.shaper); e.mixSub.connect(e.shaper);
    e.shaper.connect(e.lp); e.lp.connect(e.am); e.am.connect(e.out);
    e.lfo.connect(e.lfoGain); e.lfoGain.connect(e.am.gain);
    e.noise.connect(e.nbp); e.nbp.connect(e.ngain); e.ngain.connect(e.am);
    if (e.pan) { e.out.connect(e.pan); e.pan.connect(sfxBus); } else e.out.connect(sfxBus);

  const DOO_MEL = [
    [[64, 0, 6], [67, 6, 3], [69, 9, 3]], [[67, 0, 9], [64, 9, 3]], [[65, 0, 6], [69, 6, 6]], [[67, 0, 12]],
    [[72, 0, 6], [71, 6, 3], [69, 9, 3]], [[67, 0, 6], [64, 6, 6]], [[65, 0, 3], [64, 3, 3], [62, 6, 6]], [[62, 0, 6], [59, 6, 6]]
  ];

  const SONGS = {
    title: {
      dur: 60 / 150 / 3, len: 144,

        const bass = { 0: 0, 3: third, 6: 7, 9: 12 }[k];
        if (bass !== undefined) { const f = midi(root + bass); note('triangle', f, t, d * 3, 0.24, { dest: D }); note('sawtooth', f, t, d * 2.5, 0.05, { lp: 500, dest: D }); }
        if (k === 0 || k === 6) kick(t, 0.3);
        if (k === 3 || k === 9) burst(t, 0.18, 0.05, 2500, { ft: 'bandpass', dest: D });     // escobillas
        for (const [m, s, len] of DOO_MEL[bar]) if (s === k) note('triangle', midi(m), t, len * d, 0.07, { a: 0.06, rel: 0.25, vib: [5, 3], dest: D, send: 0.3 });
      }
    },
    win: {
      dur: 0.075, len: 56, once: true,
      at(i, t, d) {
        const D = out(), brass = (m, len) => note('sawtooth', midi(m), t, len * d, 0.08, { lp: 2200, a: 0.02, rel: 0.15, vib: [5, 4], dest: D, send: 0.3 });
        const notes = { 0: [67, 2], 2: [72, 2], 4: [76, 2], 6: [79, 6], 12: [76, 2], 14: [79, 2], 16: [84, 38] };
        if (notes[i]) brass(...notes[i]);
        if (i >= 8 && i < 16) snare(t, 0.06 + (i - 8) * 0.02);
        if (i === 16) {
          [60, 64, 67, 72].forEach(m => note('sawtooth', midi(m), t, 38 * d, 0.04, { lp: 1600, a: 0.03, rel: 0.6, dest: D, send: 0.3 }));
          kick(t, 0.6); burst(t, 2.5, 0.05, 6000, { ft: 'highpass', dest: D });
        }
      }
    }
  };

  function releaseCur(after) {
    if (!cur) return;
    const c = cur, t = ac.currentTime;
    cur = null;
    if (after < 3) { c.out.gain.setTargetAtTime(0, t, 0.25); c.fx.gain.setTargetAtTime(0, t, 0.25); }
    setTimeout(() => { c.out.disconnect(); c.fx.disconnect(); }, after * 1000);
  }
  function startSong() {
    releaseCur(2.5);
    song = SONGS[songName] || null; step = 0; nextT = ac.currentTime + 0.1;
    if (!song) return;
    cur = { out: ac.createGain(), fx: ac.createGain() };
    cur.out.connect(musicBus); cur.fx.connect(fxIn);
  }
  function schedule() {
    if (!ac || !song) return;
    const now = ac.currentTime;
    if (nextT < now) nextT = now + 0.02;
    while (nextT < now + 0.2) {
      if (song.once && step >= song.len) { song = null; songName = null; releaseCur(5); return; }
      if (musicOn) song.at(step % song.len, nextT, song.dur);
      nextT += song.dur; step++;
    }
  }
  function setMusic(name) {
    name = name || null;
    if (name === songName) return;
    songName = name;
    if (!ac) { if (name === 'win') songName = null; return; }     // la fanfarria no se guarda para después
    startSong();
  }
  function toggleMusic() {
    musicOn = !musicOn;
    try { localStorage.setItem(MUSIC_KEY, musicOn ? '1' : '0'); } catch (e) { /* sin almacenamiento */ }
    if (ac) musicBus.gain.setTargetAtTime(musicOn ? MUSIC_VOL : 0, ac.currentTime, 0.1);
    return musicOn;
  }

  return {
    init, setMusic, toggleMusic, engine, stopEngine, stopEngines, skid, siren, wind, sfx,
    get musicOn() { return musicOn; }
  };
})();

// ===== La partida: dinero, días, autos, diario, rivales, El Rey y guardado =====
const SAVE_KEY = 'streetrod63', START_MONEY = 750, MAX_CARS = 3;
const SUMMER_DAYS = 81;              // del viernes 14 de junio al lunes 2 de septiembre de 1963
const OPEN_MIN = 0, CLOSE_MIN = 270; // el drive-in abre a las 20:00 y cierra a las 00:30
let S = null;                        // el estado de la partida

const dateOf = day => new Date(1963, 5, 14 + day);
const isSaturday = day => dateOf(day).getDay() === 6;
const activeCar = () => (S && S.cars.find(c => c.id === S.active)) || null;
const clockText = min => { const h = 20 + Math.floor(min / 60), m = min % 60; return `${h % 24}:${String(m).padStart(2, '0')}`; };

function newGame(name, seed = Math.floor(Math.random() * 1e9)) {
  S = {
    v: 1, name: name || L().defaultName, seed, roadSeed: seed % 100000 + 11, day: 0, money: START_MONEY,
    cars: [], active: null, bench: [], wins: 0, losses: 0, rep: 0, rivals: {}, news: [], night: null,

  };

// ----- Guardado -----
function saveGame() {
  if (!S) return;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* sin almacenamiento */ }
}
function loadGame() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.v === 1 && Array.isArray(s.cars)) { S = s; return true; }
  } catch (e) { /* guardado roto */ }

}
const hasSave = () => { try { return !!localStorage.getItem(SAVE_KEY); } catch (e) { return false; } };

// ----- El diario de cada mañana -----
function randomUsedCar(R, model) {
  const M = MODELS[model];
  const body = clamp(0.45 + R() * 0.6, 0.4, 1), ec = clamp(0.4 + R() * 0.65, 0.35, 1);
  const car = makeCar(model, { color: rpick(R, M.colors), body, ec, tc: clamp(0.5 + R() * 0.55, 0.4, 1), tread: 0.35 + R() * 0.6, fuel: Math.round(2 + R() * 6) });
  // a veces el dueño anterior le hizo cosas
  const mount = engineMount(car.p.engine.k);
  if (R() < 0.3 && ENGINES[car.p.engine.k].kind !== '8') {
    car.p.intake = makePart('intake', ENGINES[car.p.engine.k].kind === 'F' ? '2x2' : '3x2', { m: mount });
    const n = INTAKES[car.p.intake.k].n;
    for (let i = 0; i < 3; i++) { car.p['carb' + i] = i < n ? makePart('carb', '2') : null; car.tight['carb' + i] = i < n ? 4 : 0; }
  } else if (R() < 0.25 && ENGINES[car.p.engine.k].kind === '8' && car.p.intake.k !== '2x4') {
    car.p.intake = makePart('intake', '2x4', { m: mount });
    for (let i = 0; i < 3; i++) { car.p['carb' + i] = i < 2 ? makePart('carb', '4') : null; car.tight['carb' + i] = i < 2 ? 4 : 0; }
  }
  if (R() < 0.2) car.p.exhaust = makePart('exhaust', 'hdr', { m: mount });
  if (R() < 0.15) { car.mods.wheels = rpick(R, ['moons', 'mags']); }
  if (R() < 0.1) car.mods.flames = 1;
  if (R() < 0.12) car.mods.lowered = 1;
  return car;
}
function makePaper() {
  const R = rng(S.seed * 7 + S.day * 131 + 5);
  const listings = [];
  // siempre hay un cacharro barato, para no quedarse sin auto
  const cheap = rpick(R, ['chevy49', 'ford40', 'falcon60', 'valiant61', 'olds50']);
  const junker = randomUsedCar(R, cheap);
  junker.body = 0.42 + R() * 0.12; junker.p.engine.c = 0.4 + R() * 0.15;
  listings.push(junker);
  const pool = SALE_MODELS.filter(k => k !== cheap);
  for (let i = 0; i < 5; i++) {
    // los autos caros aparecen menos
    let model = rpick(R, pool);
    if (MODELS[model].price > 2000 && R() < 0.4) model = rpick(R, pool);
    listings.push(randomUsedCar(R, model));
  }
  const ads = listings.map((car, i) => ({
    // el primero es el cacharro: barato aunque sea un buen modelo
    car, price: i ? Math.max(120, Math.round(carValue(car) * (0.88 + R() * 0.3) / 5) * 5) : Math.round((180 + R() * 220) / 5) * 5,
    phone: `${rpick(R, EXCHANGES)} ${2 + Math.floor(R() * 7)}-${1000 + Math.floor(R() * 9000)}`, sold: false
  }));
  // repuestos usados
  const parts = [];
  for (let i = 0; i < 5; i++) {
    const p = randomPart(R);
    p.c = Math.round((0.5 + R() * 0.4) * 100) / 100;
    parts.push({ part: p, price: Math.max(5, Math.round(partPrice(p) * p.c * 0.65)), sold: false });
  }
  S.paper = { day: S.day, ads, parts, headlines: makeHeadlines(R) };
}
function randomPart(R) {
  const t = rpick(R, ['engine', 'engine', 'intake', 'intake', 'carb', 'carb', 'cam', 'exhaust', 'trans', 'axle', 'tires']);
  const fam = rpick(R, FAMS);
  switch (t) {
    case 'engine': return makePart('engine', rpick(R, Object.keys(ENGINES)));
    case 'intake': { const m = rpick(R, MOUNTS); const ks = Object.keys(INTAKES).filter(k => intakeFits(k, m)); return makePart('intake', rpick(R, ks), { m }); }
    case 'carb': return makePart('carb', rpick(R, ['2', '2', '4', '4', '4R']));
    case 'cam': return makePart('cam', rpick(R, ['r34', 'full']));
    case 'exhaust': return makePart('exhaust', 'hdr', { m: rpick(R, MOUNTS) });
    case 'trans': return makePart('trans', rpick(R, Object.keys(TRANS)), { f: fam });
    case 'axle': return makePart('axle', rpick(R, Object.keys(AXLES)));
    default: return makePart('tires', rpick(R, ['std', 'ww', 'wide', 'slick']));
  }
}
function makeHeadlines(R) {
  const H = L().paper.headlines, out = [...S.news];
  S.news = [];
  if (S.wins >= KING_WINS && !S.kingBeaten && !out.length) out.push({ k: 'king' });
  if (out.length < 2 && R() < 0.4) out.push({ k: 'rumor' });
  if (R() < 0.25) out.push({ k: 'police' });
  out.push({ k: 'weather', i: Math.floor(R() * H.weather.length) });
  out.push({ k: 'local', i: Math.floor(R() * H.local.length) });

}
function headlineText(h) {
  const H = L().paper.headlines;
  switch (h.k) {

    case 'king': return H.king(S.name);
    case 'rumor': return H.rumor;
    case 'police': return H.police;

// Todas las piezas nuevas del speed shop (si only, solo las que calzan en tu auto)
function shopCatalog(car, only) {

// ----- Comprar y vender -----
function buyAd(i) {

  if (!ad || ad.sold) return 'gone';
  if (S.cars.length >= MAX_CARS) return 'noRoom';
  if (S.money < ad.price) return 'noMoney';

}
function buyPart(part, price) {

  S.money -= price;
  const p = Object.assign({}, part, { id: newId('p') });
  S.bench.push(p);
  saveGame();

}
const carOffer = car => Math.round(carValue(car) * 0.8);
const partOffer = p => Math.max(1, Math.round(partValue(p) * 0.5));
function sellCar(id) {
  const i = S.cars.findIndex(c => c.id === id);

  S.money += m; S.cars.splice(i, 1);

function junkCar(id) {

function sellPart(id) {

  if (i < 0) return 0;

// ----- El taller: pernos, sacar y poner piezas -----
function loosenBolt(car, sl) {
  if (!car.p[sl] || (car.tight[sl] || 0) <= 0) return false;
  if (blockers(car, sl).length) return false;
  car.tight[sl]--; return true;
}
function tightenBolt(car, sl) {
  if (!car.p[sl] || (car.tight[sl] || 0) >= SLOT_INFO[sl].bolts) return false;
  car.tight[sl]++; return true;
}
// Saca una pieza con todos sus pernos sueltos y la deja en el banco
function removePart(car, sl) {
  const p = car.p[sl];
  if (!p || car.tight[sl] > 0 || blockers(car, sl).length) return false;
  car.p[sl] = null; car.tight[sl] = 0;
  S.bench.push(p);
  _etCache.clear();
  return true;
}
// Pone una pieza del banco en su lugar (queda con los pernos sueltos)
function installPart(car, partId) {
  const i = S.bench.findIndex(p => p.id === partId);
  if (i < 0) return { why: 'gone' };
  const r = slotFor(car, S.bench[i]);
  if (!r.sl) return r;
  car.p[r.sl] = S.bench[i]; car.tight[r.sl] = 0;
  S.bench.splice(i, 1);

// ----- Servicios -----
const engineRebuildCost = car => (car.p.engine ? Math.round(15 + ENGINES[car.p.engine.k].price * (1 - car.p.engine.c) * 0.55) : 0);
const transRebuildCost = car => (car.p.trans ? Math.round(10 + TRANS[car.p.trans.k].price * (1 - car.p.trans.c) * 0.6) : 0);
function pay(m) { if (S.money < m) return false; S.money -= m; saveGame(); return true; }
function rebuildEngine(car) { const c = engineRebuildCost(car); if (!pay(c)) return false; car.p.engine.c = 1; _etCache.clear(); saveGame(); return true; }
function rebuildTrans(car) { const c = transRebuildCost(car); if (!pay(c)) return false; car.p.trans.c = 1; saveGame(); return true; }

  if (!canRepair(car)) return false;
  const c = repairCost(car); if (!pay(c)) return false;
  car.body = 1; car.repairs++; saveGame(); return true;
}
const paintCost = color => ((paintOf(color) || {}).candy ? 90 : 45);

function toggleMod(car, k) {

  if (!pay(MODS[k].price)) return false;

}

// ----- Los rivales -----
const rivalById = id => (id === 'king' ? KING : RIVALS.find(r => r.id === id));
// Nombre con apodo: Eddie "Pecas", o "Gato" Morales cuando el apodo va primero
const rivalName = r => (typeof r.name === 'object' ? r.name[LANG] : !r.nick ? r.name : r.nf ? `"${r.nick[LANG]}" ${r.name}` : `${r.name} "${r.nick[LANG]}"`);

// Pasos para preparar un auto, de lo más barato a lo más caro
function upgradeSteps(car) {
  const M = MODELS[car.model], fam = M.fam;
  const big = Object.keys(ENGINES).filter(k => ENGINES[k].fam === fam && ENGINES[k].kind === '8').sort((a, b) => ENGINES[a].hp - ENGINES[b].hp);
  const steps = [];
  steps.push(c => { c.timing = 10; });
  steps.push(c => { setSpec(c, { exhaust: 'hdr' }); });
  steps.push(c => { const k = ENGINES[c.p.engine.k].kind; setSpec(c, { intake: k === '8' ? '2x4' : k === 'F' ? '3x2' : '3x2' }); });
  steps.push(c => { setSpec(c, { cam: 'r34' }); });
  steps.push(c => { setSpec(c, { tires: 'wide', axle: '3.90' }); });
  steps.push(c => { setSpec(c, { trans: 'man4' }); });
  for (const e of big) steps.push(c => { if (ENGINES[e].hp > ENGINES[c.p.engine.k].hp || ENGINES[c.p.engine.k].kind !== '8') setSpec(c, { engine: e, intake: '2x4', exhaust: 'hdr', cam: 'r34' }); });
  steps.push(c => { setSpec(c, { cam: 'full', axle: '4.11', trans: 'man4cr' }); });
  steps.push(c => { setSpec(c, { intake: 'race', carbs: ['4R', '4R'], tires: 'slick' }); });
  return steps;
}
// Cambia piezas de un auto ya armado (para los rivales: sin pernos ni banco)
function setSpec(car, sp) {
  const fam = MODELS[car.model].fam;
  if (sp.engine) { car.p.engine = makePart('engine', sp.engine); }
  const mount = engineMount(car.p.engine.k), kind = ENGINES[car.p.engine.k].kind;
  if (sp.intake || sp.engine) {
    let ik = sp.intake || (kind === '8' ? '1x4' : '1x2');
    if (!intakeFits(ik, mount)) ik = kind === '8' ? '2x4' : '3x2';
    if (!intakeFits(ik, mount)) ik = '1x2';
    car.p.intake = makePart('intake', ik, { m: mount });
    const n = INTAKES[ik].n;
    for (let i = 0; i < 3; i++) car.p['carb' + i] = i < n ? makePart('carb', (sp.carbs && sp.carbs[i]) || INTAKES[ik].carb) : null;
  }
  if (sp.exhaust || sp.engine) car.p.exhaust = makePart('exhaust', sp.exhaust || 'iron', { m: mount });
  if (sp.cam) car.p.cam = makePart('cam', sp.cam);
  if (sp.trans) car.p.trans = makePart('trans', sp.trans, { f: fam });
  if (sp.axle) car.p.axle = makePart('axle', sp.axle);
  if (sp.tires) car.p.tires = makePart('tires', sp.tires);
  for (const sl of SLOTS) car.tight[sl] = car.p[sl] ? SLOT_INFO[sl].bolts : 0;
}
// Arma el auto de un rival para que haga más o menos el tiempo pedido en el cuarto de milla
function makeRivalCar(r, target, R = Math.random) {
  const models = SALE_MODELS.filter(k => MODELS[k].fam === r.fam);
  models.sort((a, b) => carET(makeCar(b)).et - carET(makeCar(a)).et);   // del más lento al más rápido
  // el modelo más rápido que todavía sea más lento que el objetivo (o el más lento de todos)
  let pickModel = models[0];
  for (const k of models) if (carET(makeCar(k)).et >= target - 0.2) pickModel = k;
  if (R() < 0.3) { const alt = models.filter(k => carET(makeCar(k)).et >= target - 0.2); if (alt.length) pickModel = alt[Math.floor(R() * alt.length)]; }
  // va preparando el auto paso a paso y se queda con la versión que más se acerca al tiempo pedido
  let car = makeCar(pickModel, { color: rpick(R, MODELS[pickModel].colors), fuel: TANK });
  let best = JSON.stringify(car), bestErr = Math.abs(carET(car).et - target);
  for (const step of upgradeSteps(car)) {
    if (carET(car).et <= target) break;
    step(car);
    const err = Math.abs(carET(car).et - target);
    if (err < bestErr) { bestErr = err; best = JSON.stringify(car); }
  }
  car = JSON.parse(best);
  if (R() < 0.35) car.mods.wheels = rpick(R, ['moons', 'mags']);
  if (R() < 0.25) car.mods.flames = 1;
  if (R() < 0.3) car.mods.lowered = 1;
  if (R() < 0.2) car.mods.pinstripe = 1;
  return car;
}
function playerET() { const c = activeCar(); return c ? carET(c).et : 20; }

// Rivales disponibles esta noche (los más bravos aparecen cuando ya ganaste varias)
function nightQueue() {
  const R = rng(S.seed * 3 + S.day * 977 + 1);
  const avail = RIVALS.filter(r => (r.tier || 0) <= S.wins && S.rivals[r.id].away <= S.day);
  const q = [];
  const pool = avail.slice();
  while (q.length < 6 && pool.length) q.push(pool.splice(Math.floor(R() * pool.length), 1)[0].id);
  if (isSaturday(S.day) && S.wins >= KING_WINS && !S.kingBeaten) q.splice(1 + Math.floor(R() * 2), 0, 'king');
  return q;
}
function rivalCar(id) {
  if (id === 'king') return buildCar(KING.car);
  const r = rivalById(id), st = S.rivals[id];
  const target = clamp(playerET() + r.edge + (Math.random() - 0.5) * 0.5, 12.6, 23);
  // si tu auto cambió mucho, el rival también se prepara (o se busca otro auto)
  if (!st.car || !carRuns(st.car) || Math.abs(carET(st.car).et - target) > 1.1) st.car = makeRivalCar(r, target);
  return st.car;
}

// ----- La noche en el drive-in -----
function goDiner() {
  const car = activeCar();
  if (!car || !carRuns(car)) return 'noCar';
  if (car.fuel < 0.6) return 'fuel';
  car.fuel = Math.max(0, car.fuel - 0.5 * ENGINES[car.p.engine.k].ci / 300);
  S.night = { min: OPEN_MIN, queue: nightQueue(), cur: null, raced: [] };
  saveGame();
  return '';
}
function nextRival() {
  const N = S.night;
  if (!N) return null;
  N.min += N.cur ? 15 : 5;
  N.cur = null;
  while (N.queue.length && N.min < CLOSE_MIN) {
    const id = N.queue.shift();
    if (N.raced.includes(id)) continue;
    N.cur = { id, car: rivalCar(id), line: Math.floor(Math.random() * 6) };
    return N.cur;
  }
  return null;
}
// ¿El rival acepta? Devuelve '' si sí, o el tipo de excusa
function rivalAnswer(id, type, bet) {
  if (id === 'king') return '';
  const r = rivalById(id), car = activeCar(), rc = S.rivals[id].car;
  if (bet !== 'pinks' && bet > S.money) return 'broke';
  const edge = playerET() - carET(rc).et;            // positivo: el rival es más rápido
  const conf = edge + r.skill * 0.6 - 0.45 + (Math.random() - 0.5) * 0.5;
  if (bet === 'pinks') {
    if (type !== 'road') return 'noPinks';
    if (carValue(car) < carValue(rc) * 0.45) return 'noPinks';
    return conf > 0.35 ? '' : 'noPinks';
  }
  const need = { 0: -9, 10: -1.6, 25: -1.3, 50: -0.8, 100: -0.3 }[bet] ?? -1;
  return conf > need ? '' : bet >= 50 ? 'noMoney' : 'scared';
}
function raceOptions(id, type, bet) {
  const r = rivalById(id);
  return {
    type, bet, car: activeCar(), seed: type === 'road' ? S.roadSeed : S.seed % 997 + S.day,
    rival: { id, name: rivalName(r), look: r.look, car: S.night.cur.car, skill: r.skill, king: id === 'king' },
    police: id === 'king' ? 0 : 0.28
  };
}

// Aplica lo que pasó en la carrera. Devuelve un resumen para la pantalla de resultados.
function applyResult(o, res) {
  const car = o.car, out = { res, lines: [], money: 0, carWon: null, carLost: null, crash: false };
  const r = rivalById(o.rival.id), rec = S.rivals[o.rival.id];
  const betMoney = o.bet === 'pinks' ? 0 : o.bet;
  // desgaste del auto
  if (car.p.engine) car.p.engine.c = res.blown ? 0 : clamp(car.p.engine.c - res.engineDmg * 0.55 - 0.008 - (car.timing > 10 ? (car.timing - 10) * 0.006 : 0), 0, 1);
  if (car.p.trans) car.p.trans.c = res.broken ? 0 : clamp(car.p.trans.c - res.transDmg * 0.6 - 0.004, 0, 1);
  if (car.p.tires) car.p.tires.c = clamp(car.p.tires.c - res.tread, 0, 1);
  car.fuel = Math.max(0, car.fuel - res.fuel);
  if (res.body) { car.body = clamp(car.body - res.body, 0, 1); out.crash = true; }
  if (res.blown) out.lines.push(L().result.blown); else if (res.engineDmg > 0.25) out.lines.push(L().result.engineHurt);
  if (res.broken) out.lines.push(L().result.broken); else if (res.transDmg > 0.2) out.lines.push(L().result.transHurt);
  _etCache.clear();
  if (res.outcome === 'win') {
    S.wins++; S.rep += { 0: 1, 10: 2, 25: 2, 50: 3, 100: 4 }[o.bet] || 6;
    if (rec) rec.l++;
    S.money += betMoney; out.money = betMoney;
    if (o.bet === 'pinks') {
      const won = o.rival.car;
      won.id = newId('c'); won.fuel = Math.max(won.fuel, 3);
      if (S.cars.length < MAX_CARS) { S.cars.push(won); out.carWon = won; }
      else { const m = carOffer(won); S.money += m; out.carWon = won; out.autoSold = m; }
      if (rec) { rec.car = null; rec.away = S.day + 6; }
      if (o.rival.id === 'king') { S.kingBeaten = true; S.over = 'king'; }
    }
    if (o.rival.id !== 'king' && (o.bet === 'pinks' || o.bet >= 50 || (r.tier || 0) >= 3)) S.news.push({ k: 'win', r: rivalName(r) });
  } else if (res.outcome === 'lose') {
    S.losses++;
    if (rec) rec.w++;
    if (o.rival.id === 'king') S.kingRaces++;
    S.money -= betMoney; out.money = -betMoney;
    if (o.bet === 'pinks') {
      out.carLost = car;
      S.cars = S.cars.filter(c => c.id !== car.id);
      S.active = S.cars.length ? S.cars[0].id : null;
    }
  } else if (res.fine) {
    out.fine = res.fine;
    if (S.money >= res.fine) S.money -= res.fine;
    else { S.money = 0; out.jail = true; S.day += 4; }   // endNight suma el quinto día
  }
  if (S.night) { S.night.min += 40; S.night.raced.push(o.rival.id); S.night.cur = null; }
  S.history.push({ d: S.day, r: o.rival.id, t: o.type, b: o.bet, o: res.outcome });
  if (S.history.length > 60) S.history.shift();
  checkBroke();
  saveGame();
  return out;
}

// ----- Pasar los días -----
function endNight() {
  S.night = null;
  S.day++;
  if (S.day >= SUMMER_DAYS && !S.over) S.over = S.kingBeaten ? 'king' : 'summer';
  if (!S.over || S.keepPlaying) makePaper();
  saveGame();
}
// Sin auto y sin plata para el auto más barato del diario (contando lo que darían por las piezas sueltas): se acabó
function checkBroke() {
  if (S.over || S.cars.length) return;
  const cheapest = S.paper ? Math.min(...S.paper.ads.filter(a => !a.sold).map(a => a.price), 400) : 200;
  const parts = S.bench.reduce((a, p) => a + partOffer(p), 0);
  if (S.money + parts < cheapest) S.over = 'broke';
}
const kingNeeds = () => Math.max(0, KING_WINS - S.wins);

function palmSilhouette(g, x, y, h, color, lean = 0.1) {

// Contador de rodillos de un surtidor: los números ruedan
function rollCounter(g, x, y, value, decimals, digits) {
  const n = value * Math.pow(10, decimals), cw = 30, ch = 40;
  g.save();
  for (let i = 0; i < digits; i++) {
    const place = Math.pow(10, digits - 1 - i);
    const dv = (n / place) % 10;
    const frac = i === digits - 1 ? dv % 1 : Math.max(0, (n % place) / place * 10 - 9);
    const d0 = Math.floor(dv) % 10;
    const cx = x + i * (cw + 2);
    g.fillStyle = '#111'; g.fillRect(cx, y, cw, ch);
    g.save(); g.beginPath(); g.rect(cx, y, cw, ch); g.clip();
    g.fillStyle = '#f2f0e0'; g.font = font(28, 'bold', FONT_SANS); g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(String(d0), cx + cw / 2, y + ch / 2 - frac * ch);
    g.fillText(String((d0 + 1) % 10), cx + cw / 2, y + ch / 2 + ch - frac * ch);
    g.restore();
    if (decimals && i === digits - decimals - 1) { g.fillStyle = '#c22a2a'; g.fillRect(cx + cw - 1, y + ch - 6, 4, 4); }
  }
  const sh = g.createLinearGradient(0, y, 0, y + ch); sh.addColorStop(0, 'rgba(0,0,0,0.6)'); sh.addColorStop(0.3, 'rgba(0,0,0,0)'); sh.addColorStop(0.7, 'rgba(0,0,0,0)'); sh.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = sh; g.fillRect(x, y, digits * (cw + 2), ch);
  g.restore();
}

// ----- Interacción -----
function mechHit(x, y) { for (let i = Mech.rects.length - 1; i >= 0; i--) { const r = Mech.rects[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.sl; } return null; }
// Clic en una pieza: si está apretada se desarma y sale; si está suelta se aprieta.
function mechClick(car, sl) {
  if (!sl || Mech.queue.length) return null;
  const p = car.p[sl];
  if (!p) return null;
  const n = SLOT_INFO[sl].bolts, tight = car.tight[sl] || 0;
  if (tight >= n) {
    const b = blockers(car, sl);
    if (b.length) return { blocked: b };
    for (let i = n - 1; i >= 0; i--) Mech.queue.push({ sl, op: 'loosen', i });
    Mech.queue.push({ sl, op: 'remove' });
  } else {
    for (let i = tight; i < n; i++) Mech.queue.push({ sl, op: 'tighten', i });
  }
  Mech.busy = 0;
  return { ok: true };
}
// Avanza la animación de los pernos. Devuelve true si algo cambió (para refrescar la pantalla).
function mechUpdate(car, dt) {
  if (!Mech.queue.length) { Mech.turning = null; return false; }
  Mech.busy += dt;
  const job = Mech.queue[0];
  Mech.turning = job.op === 'remove' ? null : job;
  if (Mech.busy < (job.op === 'remove' ? 0.2 : BOLT_TIME)) return false;
  Mech.busy = 0;
  Mech.queue.shift();
  if (job.op === 'loosen') { loosenBolt(car, job.sl); Sound.sfx.ratchet(); }
  else if (job.op === 'tighten') { tightenBolt(car, job.sl); Sound.sfx.ratchet(); if (car.tight[job.sl] >= SLOT_INFO[job.sl].bolts) _etCache.clear(); }
  else if (job.op === 'remove') {
    const r = mechLayout(car)[job.sl] || { x: 430, y: 400, w: 0, h: 0 };
    if (removePart(car, job.sl)) { Mech.lift = { x: r.x + r.w / 2, y: r.y + r.h / 2, t: Mech.t }; Sound.sfx.clunk(); }
  }
  return !Mech.queue.length || job.op === 'remove';
}

// Gráfico del dinamómetro: potencia y torque según las rpm
function drawDyno(g, car, w, h) {
  g.clearRect(0, 0, w, h);
  g.fillStyle = '#10141a'; g.fillRect(0, 0, w, h);
  if (!car || !car.p.engine) return;
  const s = carStats(car), veh = new Vehicle(s), top = s.red + 800;
  g.strokeStyle = 'rgba(120,255,170,0.12)'; g.lineWidth = 1;
  for (let r = 1000; r < top; r += 1000) { const x = r / top * w; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, h); g.stroke(); }
  const maxHp = s.hp * 1.05;
  const curve = (fn, col) => {
    g.strokeStyle = col; g.lineWidth = 2.5; g.beginPath();
    for (let x = 0; x <= w; x += 3) { const rpm = Math.max(IDLE, x / w * top), y = h - 8 - fn(rpm) / maxHp * (h - 22); x ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  };
  curve(rpm => veh.torque(rpm) * rpm * TAU / 60 / 745.7 / NET, '#ffd23a');
  curve(rpm => veh.torque(rpm) * 0.7376 * 0.75, '#5fe8ff');
  g.fillStyle = 'rgba(212,42,30,0.25)'; g.fillRect(s.red / top * w, 0, w, h);
  g.fillStyle = '#ffd23a'; g.font = font(12, 'bold', FONT_SANS); g.textAlign = 'left'; g.fillText(`${Math.round(s.hp)} HP`, 8, 16);
  g.fillStyle = '#5fe8ff'; g.fillText(LANG === 'es' ? 'torque' : 'torque', 8, 32);
  g.fillStyle = 'rgba(255,255,255,0.6)'; g.textAlign = 'right'; g.fillText(`${Math.round(s.red)} rpm`, w - 6, 16);
}

const IN_SITE = /\/street-rod\/(index\.html)?$/.test(location.pathname);
const uiEl = document.getElementById('ui'), toastEl = document.getElementById('toast');

const Game = {
  scene: 'title', t: 0, modal: null, race: null, raceOpts: null, out: null, outDone: false,
  paperTab: 'cars', shopOnly: true, chal: null, answer: null, rivalX: 1600, rivalTarget: 950, leaving: false, arriveT: 0,
  pumping: false, pump: { gal: 0, cost: 0, tick: 0 }, toastT: 0,

  go(scene) {
    this.scene = scene; this.modal = null;
    Mech.queue.length = 0; Mech.hover = null;
    Sound.stopEngines();
    const music = { title: 'title', garage: 'garage', paper: 'garage', shop: 'garage', body: 'garage', gas: 'garage', diner: 'diner', race: null, result: null, end: S && S.over === 'king' ? 'win' : 'diner' }[scene];
    Sound.setMusic(music === undefined ? null : music);
    UI.render();
  },
  toast(text, t = 2.6) { this.toastT = t; toastEl.textContent = text; toastEl.hidden = false; },

  // ----- el drive-in -----
  arrive() {
    const cur = nextRival();
    this.chal = null; this.answer = null; this.leaving = false;
    if (cur) { this.rivalX = 1650; this.arriveT = this.t; Sound.sfx.horn(); }
    saveGame(); UI.render();
  },
  startRace() {
    const c = this.chal;
    this.raceOpts = raceOptions(S.night.cur.id, c.type, c.bet);
    this.race = new Race(this.raceOpts);
    this.go('race');
  },
  finishRace() {
    if (!this.race || !this.race.result) return;
    this.out = applyResult(this.raceOpts, this.race.result);
    this.outDone = !this.out.crash;
    this.go('result');
  },
  afterResult() {
    const out = this.out;
    this.race = null;
    if (S.over) return this.go('end');
    if (out && out.jail) { endNight(); this.toast(L().result.jail, 5); return this.go('garage'); }
    const car = activeCar();
    if (!S.night || !car || !carRuns(car) || car.fuel <= 0.3) { if (S.night) endNight(); return this.go(S.over ? 'end' : 'garage'); }
    this.go('diner'); this.arrive();
  }
};
