<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Rod: Verano del 63</title>
<meta name="description" content="Compra un auto en el diario, ármalo en tu garaje y corre picadas en el verano de 1963. / Buy a car from the paper, build it in your garage and drag race in the summer of 1963.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  /* La pantalla se dibuja en alta resolución y ocupa toda la ventana */
  #game { position: absolute; display: block; touch-action: none; }
  /* Campo invisible para escribir el nombre en la licencia (abre el teclado en los teléfonos) */
  #name { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>
</head>
<body>
<canvas id="game" width="640" height="400"></canvas>
<input id="name" maxlength="14" autocomplete="off" autocapitalize="characters" spellcheck="false">
