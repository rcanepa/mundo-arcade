<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Street Rod: Verano del 63</title>
<meta name="description" content="Compra un auto en el diario, ármalo en tu garaje y corre picadas en el verano de 1963. / Buy a car from the paper, build it in your garage and drag race in the summer of 1963.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏁</text></svg>">
<style>
  :root {
    --cream: #fbf4e2; --cream2: #efe2c0; --ink: #2b1d14; --muted: #7a6650; --red: #c8322a; --red-d: #8a1c16; --teal: #2a9d8f; --teal-d: #1d6e64;
    --gold: #e8b030; --night: rgba(16, 12, 24, 0.82); --line: rgba(43, 29, 20, 0.18);
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif; --serif: Georgia, "Times New Roman", serif;
    --display: "Arial Black", "Helvetica Neue", Impact, sans-serif; --script: "Brush Script MT", "Snell Roundhand", "Segoe Script", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; color: var(--ink); font: 15px/1.35 var(--sans); -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
  #stage { position: absolute; left: 0; top: 0; overflow: hidden; box-shadow: 0 0 80px rgba(0, 0, 0, 0.8); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; pointer-events: none; }
  #ui > * { pointer-events: auto; }
  #ui .pass { pointer-events: none; }
  #ui .pass > * { pointer-events: auto; }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 18px; border-radius: 999px; font-weight: 800; letter-spacing: 0.3px;
    background: var(--red); color: #fff; box-shadow: 0 4px 0 var(--red-d), 0 6px 14px rgba(0, 0, 0, 0.3); transition: transform 0.08s, filter 0.15s; text-transform: uppercase; font-size: 14px; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
  .btn:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--red-d); }
  .btn.teal { background: var(--teal); box-shadow: 0 4px 0 var(--teal-d), 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.gold { background: var(--gold); color: #3a2400; box-shadow: 0 4px 0 #a67814, 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.ghost { background: var(--cream); color: var(--ink); box-shadow: 0 4px 0 #b9a47a, 0 6px 14px rgba(0, 0, 0, 0.25); }
  .btn.dark { background: #2a2230; color: #f2ecd8; box-shadow: 0 4px 0 #120e16, 0 6px 14px rgba(0, 0, 0, 0.3); }
  .btn.small { padding: 5px 12px; font-size: 12px; box-shadow: 0 3px 0 var(--red-d); }
  .btn.small.teal { box-shadow: 0 3px 0 var(--teal-d); } .btn.small.ghost { box-shadow: 0 3px 0 #b9a47a; } .btn.small.dark { box-shadow: 0 3px 0 #120e16; }
  .btn.big { padding: 14px 28px; font-size: 18px; }

  .panel { position: relative; background: linear-gradient(var(--cream), var(--cream2)); border: 3px solid var(--ink); border-radius: 18px; box-shadow: 0 10px 0 rgba(0, 0, 0, 0.25), 0 20px 40px rgba(0, 0, 0, 0.35); }
  .dim { position: absolute; inset: 0; background: rgba(6, 4, 10, 0.55); display: flex; align-items: center; justify-content: center; }
  .x { position: absolute; top: 10px; right: 12px; width: 38px; height: 38px; border-radius: 50%; background: var(--ink); color: var(--cream); font-size: 20px; font-weight: 900; }

  /* Barra de arriba */
  .topbar { position: absolute; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; align-items: center; pointer-events: none; }
  .pill { pointer-events: auto; background: var(--night); color: #f6eedb; padding: 7px 14px; border-radius: 999px; font-weight: 800; display: flex; gap: 8px; align-items: center; border: 1px solid rgba(255, 255, 255, 0.12); white-space: nowrap; }
  .pill b { color: var(--gold); }
  .pill.money b { color: #8dffa6; }
  .grow { flex: 1; }
  .kingbar { display: inline-flex; gap: 2px; }
  .kingbar i { width: 9px; height: 14px; border-radius: 3px; background: rgba(255, 255, 255, 0.18); display: inline-block; }
  .kingbar i.on { background: var(--gold); box-shadow: 0 0 6px var(--gold); }

  /* Portada */
  .titlemenu { position: absolute; left: 92px; top: 270px; width: 330px; display: grid; gap: 14px; }
  .titlemenu .row { display: flex; gap: 10px; }
  .titlemenu .row .btn { flex: 1; font-size: 12px; padding: 8px 10px; }
  .credit { position: absolute; left: 92px; bottom: 26px; color: rgba(255, 230, 220, 0.6); font-size: 12px; }

  /* Licencia */
  .license { width: 640px; padding: 22px 26px; }
  .story { font: italic 16px/1.5 var(--serif); margin: 0 0 14px; color: #3b2a1c; }
  .story p { margin: 0 0 6px; }
  .card { position: relative; border-radius: 14px; background: linear-gradient(135deg, #f4f0e2, #dfe8e4); border: 2px solid #5a7a8a; padding: 0 0 14px; overflow: hidden; }
  .card .hd { background: linear-gradient(90deg, #1e4a7a, #2a6aa8); color: #fff; padding: 8px 16px; display: flex; justify-content: space-between; font: 900 15px var(--display); letter-spacing: 1px; }
  .card .bd { display: grid; grid-template-columns: 120px 1fr; gap: 16px; padding: 14px 16px 0; }
  .card img { width: 120px; height: 140px; border-radius: 8px; background: #2b3d5c; object-fit: cover; border: 2px solid #5a7a8a; }
  .card label { font-size: 11px; font-weight: 800; color: #5a7a8a; text-transform: uppercase; letter-spacing: 1px; }
  .card input { display: block; width: 100%; font: 900 26px var(--sans); border: 0; border-bottom: 2px solid #1e4a7a; background: transparent; padding: 4px 0; color: #1a2a3a; outline: none; text-transform: uppercase; user-select: text; -webkit-user-select: text; }
  .card .fields { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; font-size: 13px; font-weight: 700; }
  .card .sig { font: 34px var(--script); color: #1a2a6a; margin-top: 8px; min-height: 40px; }
  .license .go { margin-top: 16px; display: flex; justify-content: flex-end; }

  /* Cómo se juega */
  .how { width: 760px; padding: 24px 28px; }
  .how h2, .modal h2 { font: italic 900 30px var(--display); margin: 0 0 12px; color: var(--red); }
  .how .rows { display: grid; gap: 10px; }
  .how .r { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: start; }
  .how .r span { font-size: 30px; line-height: 1; }
  .how .r b { display: block; font-size: 16px; }
  .how .r p { margin: 2px 0 0; color: #4a3828; font-size: 14px; }

  /* Garaje */
  .side { position: absolute; right: 14px; top: 64px; width: 330px; padding: 14px 16px; }
  .side h3 { margin: 0; font: italic 900 22px/1.1 var(--display); color: var(--red); }
  .side .sub { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin: 8px 0; }
  .stat small { display: block; font-size: 10px; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; }
  .stat b { font-size: 18px; }
  .bars { display: grid; gap: 5px; margin: 10px 0 6px; }
  .bar { display: grid; grid-template-columns: 92px 1fr 40px; gap: 8px; align-items: center; font-size: 12px; font-weight: 800; }
  .bar i { height: 10px; border-radius: 6px; background: rgba(43, 29, 20, 0.15); overflow: hidden; display: block; }
  .bar i em { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, #4ab86a, #8de08a); }
  .bar i em.mid { background: linear-gradient(90deg, #e8a030, #f0c860); }
  .bar i em.low { background: linear-gradient(90deg, #c8322a, #ea6a4a); }
  .probs { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; background: rgba(200, 50, 42, 0.1); color: var(--red-d); font-size: 13px; font-weight: 700; }
  .probs div + div { margin-top: 3px; }
  .fixes { display: grid; gap: 6px; margin-top: 8px; }
  .actions { position: absolute; left: 14px; right: 14px; bottom: 14px; display: flex; gap: 8px; justify-content: center; }
  .act { width: 128px; padding: 10px 6px 9px; border-radius: 16px; background: var(--night); color: #f6eedb; border: 1px solid rgba(255, 255, 255, 0.14); display: flex; flex-direction: column; align-items: center; gap: 2px; transition: transform 0.1s, background 0.15s; }
  .act span { font-size: 26px; line-height: 1.1; }
  .act b { font-size: 13px; text-transform: uppercase; letter-spacing: 0.3px; }
  .act small { font-size: 10.5px; opacity: 0.7; }
  .act:hover:not(:disabled) { background: rgba(40, 30, 50, 0.95); transform: translateY(-2px); }
  .act.hot { background: linear-gradient(180deg, #d9452c, #a3241c); border-color: #ffb08a; box-shadow: 0 0 18px rgba(255, 90, 60, 0.45); }
  .bubble { position: absolute; left: 330px; top: 430px; width: 360px; padding: 14px 18px; font-weight: 800; font-size: 17px; text-align: center; }
  .hint { position: absolute; left: 14px; top: 64px; max-width: 520px; padding: 8px 14px; border-radius: 12px; background: var(--night); color: #ffe6a8; font-weight: 700; font-size: 14px; }

  /* Diario */
  .paper { position: absolute; left: 28px; top: 18px; right: 28px; bottom: 18px; background: #f3ecd9; color: #1d1712; border-radius: 6px; padding: 16px 26px 14px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); background-image: radial-gradient(rgba(120, 100, 70, 0.08) 1px, transparent 1px); background-size: 4px 4px; transform: rotate(-0.3deg); display: flex; flex-direction: column; font-family: var(--serif); }
  .paper .mast { text-align: center; border-bottom: 3px double #1d1712; padding-bottom: 4px; }
  .paper .mast h1 { margin: 0; font: 900 46px/1 "Old English Text MT", "UnifrakturMaguntia", var(--serif); letter-spacing: 0.5px; }
  .paper .meta { display: flex; justify-content: space-between; font: 700 12px var(--sans); text-transform: uppercase; letter-spacing: 1px; border-top: 1px solid #1d1712; margin-top: 6px; padding-top: 3px; }
  .paper .news { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 14px; border-bottom: 2px solid #1d1712; padding: 6px 0 8px; }
  .paper .news h4 { margin: 0; font: 900 17px/1.15 var(--serif); }
  .paper .news .lead h4 { font-size: 22px; }
  .paper .tabs { display: flex; gap: 6px; margin: 8px 0; font-family: var(--sans); }
  .paper .tabs button { padding: 5px 14px; border: 2px solid #1d1712; border-radius: 4px; font-weight: 900; font-size: 13px; letter-spacing: 1px; }
  .paper .tabs button.on { background: #1d1712; color: #f3ecd9; }
  .paper .body { flex: 1; overflow: auto; min-height: 0; padding-right: 4px; }
  .ads { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .ad { border: 1.5px solid #1d1712; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; background: rgba(255, 255, 255, 0.25); }
  .ad.sold { opacity: 0.4; }
  .ad h5 { margin: 0; font: 900 15px var(--sans); text-transform: uppercase; letter-spacing: 0.5px; }
  .ad img { width: 100%; height: 86px; object-fit: contain; filter: sepia(0.25) contrast(1.05); }
  .ad p { margin: 0; font-size: 13px; line-height: 1.3; }
  .ad .price { font: 900 22px var(--sans); }
  .ad .row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
  .ad .tel { font: 700 11px var(--sans); color: #4a3a2a; }
  .cols { display: grid; grid-template-columns: 1fr 1.25fr; gap: 16px; }
  .col h3 { margin: 0 0 6px; font: 900 18px var(--sans); letter-spacing: 1px; border-bottom: 2px solid #1d1712; display: flex; justify-content: space-between; align-items: center; }
  .col h3 small { font: 700 12px var(--sans); letter-spacing: 0; }
  .item { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; align-items: center; padding: 5px 0; border-bottom: 1px dotted rgba(29, 23, 18, 0.4); font-size: 13.5px; }
  .item b { font-family: var(--sans); font-size: 13px; }
  .item small { display: block; color: #5a4a3a; font-size: 11.5px; }
  .item small.ok { color: #1d6e3a; font-weight: 700; } .item small.no { color: #a3241c; font-weight: 700; }
  .item .price { font: 900 15px var(--sans); min-width: 54px; text-align: right; }
  .toggle { display: inline-flex; border: 1.5px solid #1d1712; border-radius: 4px; overflow: hidden; }
  .toggle button { padding: 2px 8px; font: 800 11px var(--sans); }
  .toggle button.on { background: #1d1712; color: #f3ecd9; }

  /* Taller y pintura */
  .work { position: absolute; right: 14px; top: 14px; bottom: 14px; width: 390px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
  .work h3 { margin: 0; font: italic 900 24px var(--display); color: var(--red); }
  .work .help { font-size: 12.5px; color: #4a3828; margin: 0; }
  .work .seg { display: flex; gap: 6px; }
  .work .seg button { flex: 1; padding: 7px; border-radius: 10px; border: 2px solid var(--ink); font-weight: 800; font-size: 13px; }
  .work .seg button.on { background: var(--ink); color: var(--cream); }
  .bench { flex: 1; overflow: auto; min-height: 0; border: 2px solid var(--line); border-radius: 12px; padding: 4px 8px; background: rgba(255, 255, 255, 0.35); }
  .bench .item { font-family: var(--sans); }
  .tune { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-weight: 800; font-size: 13px; }
  .tune input { width: 100%; accent-color: var(--red); }
  .tune .ping { color: var(--red); }
  .dyno { width: 100%; height: 110px; border-radius: 10px; display: block; }
  .status { font-weight: 800; font-size: 14px; padding: 6px 10px; border-radius: 10px; background: rgba(42, 157, 143, 0.15); color: var(--teal-d); }
  .status.bad { background: rgba(200, 50, 42, 0.12); color: var(--red-d); }
  .swatches { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .sw { height: 36px; border-radius: 10px; border: 2px solid rgba(0, 0, 0, 0.35); box-shadow: inset 0 8px 10px rgba(255, 255, 255, 0.35), inset 0 -8px 10px rgba(0, 0, 0, 0.25); }
  .sw.on { outline: 3px solid var(--gold); outline-offset: 2px; }
  .sw.candy { background-image: radial-gradient(rgba(255, 255, 255, 0.5) 1px, transparent 1.5px); background-size: 5px 5px; }
  .mods { display: grid; gap: 4px; overflow: auto; min-height: 0; flex: 1; }
  .mod { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; padding: 5px 8px; border-radius: 10px; background: rgba(255, 255, 255, 0.4); font-size: 13px; }
  .mod small { display: block; color: var(--muted); font-size: 11.5px; }
  .label { font-size: 11px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

  /* Bencinera */
  .pump { position: absolute; left: 24px; top: 70px; display: flex; gap: 12px; align-items: center; }
  .hold { width: 150px; height: 150px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #ff6a5a, #a3241c); color: #fff; font-weight: 900; font-size: 15px; border: 5px solid #f2ede0; box-shadow: 0 8px 0 #6a1410, 0 12px 30px rgba(0, 0, 0, 0.4); line-height: 1.15; padding: 10px; touch-action: none; }
  .hold.on { transform: translateY(6px); box-shadow: 0 2px 0 #6a1410; filter: brightness(1.15); }
  .gasinfo { padding: 12px 16px; min-width: 200px; font-weight: 800; }

  /* Mis autos */
  .modal { padding: 22px 26px; max-width: 1000px; }
  .garagecars { display: grid; grid-template-columns: repeat(3, 280px); gap: 14px; }
  .gc { border: 2px solid var(--line); border-radius: 14px; padding: 10px; background: rgba(255, 255, 255, 0.4); display: grid; gap: 4px; }
  .gc.on { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(42, 157, 143, 0.25); }
  .gc img { width: 100%; height: 100px; object-fit: contain; }
  .gc b { font-size: 15px; }
  .gc small { color: var(--muted); font-weight: 700; }

  /* Drive-in */
  .rival { position: absolute; right: 18px; top: 62px; width: 450px; padding: 14px 16px; }
  .rival .who { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
  .rival img { width: 96px; height: 96px; border-radius: 50%; }
  .rival h3 { margin: 0; font: italic 900 24px/1.05 var(--display); color: var(--red); }
  .rival .car { font-weight: 800; color: #3b2a1c; }
  .rival .rec { font-size: 12px; color: var(--muted); font-weight: 700; }
  .say { margin: 12px 0 10px; padding: 10px 14px; border-radius: 14px; background: #fff; border: 2px solid var(--ink); font: italic 17px var(--serif); position: relative; }
  .say::before { content: ''; position: absolute; left: 34px; top: -12px; border: 10px solid transparent; border-bottom-color: var(--ink); border-top: 0; }
  .rival .btns { display: flex; gap: 10px; flex-wrap: wrap; }
  .choose { display: grid; gap: 8px; margin-top: 10px; }
  .choose .opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .choose .opts button { padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 800; font-size: 13px; background: rgba(255, 255, 255, 0.5); }
  .choose .opts button.on { background: var(--ink); color: var(--cream); }
  .choose .opts button:disabled { opacity: 0.35; }
  .kingbanner { position: absolute; left: 0; right: 0; top: 140px; text-align: center; font: italic 900 56px var(--display); color: var(--gold); text-shadow: 0 0 20px rgba(255, 210, 60, 0.7), 0 4px 0 #6a4a00; pointer-events: none; }
  .clock { font-variant-numeric: tabular-nums; }

  /* Resultado */
  .result { width: 620px; padding: 22px 26px; text-align: center; }
  .result h2 { margin: 0; font: italic 900 46px var(--display); }
  .result h2.win { color: #1d8a4a; } .result h2.lose { color: var(--red); } .result h2.void { color: #2a5aa8; }
  .result .why { font-weight: 800; color: var(--muted); margin-bottom: 8px; }
  .result table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 15px; }
  .result td, .result th { padding: 6px 8px; border-bottom: 1px solid var(--line); }
  .result th { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .result .big { font: 900 24px var(--sans); margin: 8px 0; }
  .result .big.plus { color: #1d8a4a; } .result .big.minus { color: var(--red); }
  .result .lines { display: grid; gap: 4px; margin: 6px 0 12px; font-weight: 700; }
  .result .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  /* Final */
  .endwrap { background: rgba(6, 4, 10, 0.2); align-items: flex-start; padding-top: 70px; }
  .front { width: 720px; padding: 22px 30px; background: #f3ecd9; font-family: var(--serif); text-align: center; border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); }
  .front h1 { margin: 0; font: 900 34px var(--serif); border-bottom: 3px double #1d1712; padding-bottom: 6px; }
  .front h2 { font: 900 30px/1.1 var(--sans); margin: 12px 0; }
  .front p { font-size: 17px; }
  .front .btns { display: flex; gap: 12px; justify-content: center; margin-top: 12px; font-family: var(--sans); }

  /* Pausa y avisos */
  .pause { width: 360px; padding: 22px; text-align: center; display: grid; gap: 12px; }
  .pause h2 { margin: 0; font: italic 900 36px var(--display); color: var(--red); }
  #toast { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--night); color: #fff; padding: 10px 20px; border-radius: 999px; font-weight: 800; pointer-events: none; white-space: nowrap; z-index: 5; border: 1px solid rgba(255, 255, 255, 0.15); }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch button { position: absolute; pointer-events: auto; width: 110px; height: 110px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); border: 2px solid rgba(255, 255, 255, 0.4); color: #fff; font-size: 30px; font-weight: 900; touch-action: none; }
  #touch button.on { background: rgba(255, 210, 60, 0.4); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <div id="touch" hidden></div>
  <div id="toast" hidden></div>
</div>
