<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Street Rod · hoja de autos</title>
<style>body { margin: 0; background: #ddd8cc; } canvas { display: block; }</style>
</head>
<body>
<!-- Hoja para revisar el dibujo de los autos sin jugar.
     ?night=1 de noche · ?mods=1 con llamas y llantas · ?one=chevy57,ford32 uno o varios grandes · ?rear=1 todos de atrás -->
<canvas id="c"></canvas>
<script>let LANG = 'es';</script>
<script>
// sin caché: siempre los archivos recién editados
for (const f of ['util', 'data', 'car', 'carart']) document.write(`<script src="../src/${f}.js?${Date.now()}"><\/script>`);
</script>
<script>
const q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), g = cv.getContext('2d');
const night = !!q.get('night');
const colorOf = k => MODELS[k].colors[q.get('c') | 0] || MODELS[k].colors[0];

// Todos los autos de atrás, grandes, como se ven en la carrera
function rearSheet() {
  cv.width = 1600; cv.height = 900; cv.style.width = '800px';
  g.fillStyle = '#0d1220'; g.fillRect(0, 0, cv.width, cv.height);
  MODEL_KEYS.forEach((k, i) => {
    const x = 110 + (i % 8) * 196, y = 260 + Math.floor(i / 8) * 380;
    drawCarRear(g, makeCar(k), x, y, 170, { light: +(q.get('light') || 0.7), brake: i % 2 });
    g.fillStyle = '#fff'; g.font = '16px sans-serif'; g.textAlign = 'center'; g.fillText(k, x, y + 40);
  });
}
// Uno o varios autos grandes, para ver los detalles
function bigSheet(keys) {
  cv.width = 1600; cv.height = 400 * keys.length; cv.style.width = '800px';
  g.fillStyle = night ? '#101624' : '#e8e2d4'; g.fillRect(0, 0, cv.width, cv.height);
  keys.forEach((k, i) => {
    const car = makeCar(k, { color: colorOf(k) });
    if (q.get('mods')) { car.mods = { flames: 1, wheels: 'mags', pinstripe: 1, lowered: 1 }; car.p.tires.k = 'slick'; }
    drawCarSide(g, car, 800, 370 + i * 400, 1250 * ART[k].len / 5, { night, lights: night });
  });
}
// La hoja completa: todos de lado, y abajo de atrás y los retratos de los rivales
function fullSheet() {
  const cols = 4, cw = 360, ch = 170, rows = Math.ceil(MODEL_KEYS.length / cols) + 1;
  cv.width = cols * cw * 2; cv.height = rows * ch * 2; cv.style.width = cols * cw + 'px';
  g.scale(2, 2);
  g.fillStyle = night ? '#101624' : '#e8e2d4'; g.fillRect(0, 0, cols * cw, rows * ch);
  MODEL_KEYS.forEach((k, i) => {
    const car = makeCar(k, { color: colorOf(k) });
    if (q.get('mods')) { car.mods = { flames: 1, wheels: ['caps', 'moons', 'mags'][i % 3], pinstripe: i % 2, stripes: i % 3 === 1, lowered: 1, chop: i % 2 }; car.p.tires.k = i % 2 ? 'slick' : 'ww'; }
    const x = (i % cols) * cw, y = Math.floor(i / cols) * ch;
    drawCarSide(g, car, x + cw / 2, y + ch - 26, 300 * ART[k].len / 5, { night, lights: night });
    g.fillStyle = night ? '#fff' : '#333'; g.font = '12px sans-serif'; g.fillText(k + ' · ' + MODELS[k].year + ' ' + MODELS[k].name, x + 8, y + 16);
  });
  const y0 = Math.ceil(MODEL_KEYS.length / cols) * ch;
  g.fillStyle = '#0d1220'; g.fillRect(0, y0, cols * cw, ch);
  MODEL_KEYS.forEach((k, i) => drawCarRear(g, makeCar(k), 40 + i * 78, y0 + 80, 64, { light: 0.6, brake: i % 2 }));
  RIVALS.slice(0, 16).forEach((r, i) => drawPortrait(g, Object.assign({ f: r.f }, r.look), 40 + i * 78, y0 + 130, 30));
}

if (q.get('rear')) rearSheet();
else if (q.get('one')) bigSheet(q.get('one').split(','));
else fullSheet();
</script>
</body>
</html>
