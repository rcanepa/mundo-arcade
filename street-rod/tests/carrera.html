<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Street Rod · prueba de carrera</title>
<style>html, body { margin: 0; background: #000; } canvas { display: block; width: 100vw; height: 56.25vw; }</style>
</head>
<body>
<!-- Corre una carrera sin pasar por el juego. ?t=road para la ruta, ?m=chevy57 para elegir auto, ?auto=1 piloto automático -->
<canvas id="c"></canvas>
<script>
// sin caché: siempre los archivos recién editados
for (const f of ['util', 'data', 'i18n', 'car', 'physics', 'carart', 'road', 'race', 'audio']) document.write(`<script src="../src/${f}.js?${Date.now()}"><\/script>`);
</script>
<script>
const q = new URLSearchParams(location.search);
const keys = new Set(), edges = new Set();
addEventListener('keydown', e => { Sound.init(); if (!e.repeat) edges.add(e.code); keys.add(e.code); e.preventDefault(); });
addEventListener('keyup', e => keys.delete(e.code));
const Input = { read() {
  const r = { gas: keys.has('ArrowUp'), brake: keys.has('ArrowDown'), steer: (keys.has('ArrowRight') ? 1 : 0) - (keys.has('ArrowLeft') ? 1 : 0), up: edges.has('Space'), down: edges.has('KeyZ'), horn: edges.has('KeyH') };
  edges.clear(); return r;
} };
const cv = document.getElementById('c'), g = cv.getContext('2d');
cv.width = 1280 * 2; cv.height = 720 * 2;
const car = makeCar(q.get('m') || 'chevy57', { fuel: 12 });
if (q.get('mods')) { car.mods.flames = 1; car.mods.scoop = 1; }
const rival = { name: 'Duke', look: RIVALS[17].look, car: makeCar(q.get('r') || 'tbird57'), skill: 0.8 };
let race = new Race({ type: q.get('t') || 'drag', car, rival, bet: 50, seed: 1234, police: q.get('cop') ? 1 : 0.3, auto: !!q.get('auto') });
let last = performance.now(), acc = 0;
window.R = () => race;
function frame(now) {
  acc += Math.min(0.1, (now - last) / 1000); last = now;
  while (acc >= 1 / 60) { race.update(1 / 60); acc -= 1 / 60; }
  g.setTransform(2, 0, 0, 2, 0, 0);
  race.draw(g);
  const v = race.me.veh;
  Sound.engine('me', { rpm: v.rpm, throttle: v.throttle, cyl: race.me.s.cyl, vol: 1, pan: 0 });
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
