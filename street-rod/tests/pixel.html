<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Street Rod · prueba de pixel art</title>
<style>html, body { margin: 0; background: #111; } canvas { display: block; width: min(100vw, 160vh); height: auto; image-rendering: pixelated; }</style>
</head>
<body>
<!-- Muestra de pixel art: ?s=cars (autos), ?s=diner (Bob's Drive-In), ?s=race (cabina) -->
<canvas id="c" width="640" height="400"></canvas>
<script>
for (const f of ['util', 'pixel', 'data', 'i18n', 'car', 'physics', 'carart', 'road', 'race', 'audio', 'pxcar', 'pxscenes', 'pxrace']) document.write(`<script src="../src/${f}.js?${Date.now()}"><\/script>`);
</script>
<script>
const q = new URLSearchParams(location.search);
const cv = document.getElementById('c'), g = cv.getContext('2d');
g.imageSmoothingEnabled = false;
function carsSheet() {
  // los 25 autos del diario, en una hoja más grande
  cv.width = 1280; cv.height = 800;
  g.fillStyle = PAL.g3; g.fillRect(0, 0, cv.width, cv.height);
  const keys = q.get('m') ? q.get('m').split(',') : MODEL_KEYS;
  keys.forEach((k, i) => {
    const car = makeCar(k, { color: MODELS[k].colors[(q.get('c') | 0) % MODELS[k].colors.length] });
    if (q.get('mods')) { car.mods = { stickers: { hotrod: i % 3 === 0, flames: i % 3 === 1, star: i % 2, checker: i % 4 === 3, lightning: i % 5 === 2 }, nobump: i % 4 === 1, noroof: i % 3 === 2 }; car.p.tires.k = i % 2 ? 'slick' : car.p.tires.k; }
    const spr = pxCarSide(car, 236, { driver: i % 2 ? { skin: '#f4c8a0', hc: '#3a2010', top: '#1c3ca8' } : null });
    const x = 4 + (i % 5) * 255, y = 4 + Math.floor(i / 5) * 158;
    g.drawImage(spr, x, y + 52);
    ptext(g, carTitle(k), x + 4, y + 2, PAL.y3, 1, { shadow: PAL.k });
  });
}
function dinerSample() {
  const rival = makeCar(q.get('m') || 'chevy55', { color: q.get('col') || '#d02c2c' });
  const car = pxCarSide(rival, 440, { driver: { skin: '#f4c8a0', hc: '#000000', top: '#ffffff', shades: 1 }, flip: true });
  const bg1 = pxCarSide(makeCar('chevy49', { color: '#1a8a8a' }), 230), bg2 = pxCarSide(makeCar('chevy58', { color: '#d02c2c' }), 250, { flip: true });
  drawDriveIn(g, 2, { car, carX: 150, bgCars: [bg1, bg2] });
  if (q.get('bubble')) speechBubble(g, '¡Hagámoslo!', 330, 120, 420, 250);
  statusBar(g, 'Dinero: $750', '', 'Vinnie · ' + carTitle(rival.model));
}
const Input = { read: () => ({ gas: false, brake: false, steer: 0, up: false, down: false, horn: false }) };
function raceSample() {
  const me = makeCar(q.get('m') || 'chevy55', { color: q.get('col') || '#b3202a', fuel: 12 });
  const rv = makeCar('dodge62', { color: '#5a2ca0' });
  const race = new Race({ type: q.get('t') || 'drag', car: me, rival: { name: 'Vinnie', look: RIVALS[0].look, car: rv, skill: 0.8 }, bet: 50, seed: 7, police: 0, auto: true });
  const secs = +(q.get('at') || 3);
  for (let i = 0; i < secs * 60; i++) race.update(1 / 60);
  pxDrawRace(g, race);
  statusBar(g, 'Marcha: ' + (race.me.veh.gear || ''), '', race.phase === 'run' ? '' : '¡Prepárate!');
  window.R = race;
}
if (q.get('s') === 'diner') dinerSample(); else if (q.get('s') === 'race') raceSample(); else carsSheet();
</script>
</body>
</html>
