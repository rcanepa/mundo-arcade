<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Estudio</title>
<style>html,body{margin:0;background:#888}canvas{display:block}#out img{max-width:100%;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/20px 20px;margin:4px}</style>
<script src="tint.js"></script>
<script src="cfg.js"></script>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
</head><body><div id="out"></div>
<script type="module">
// Estudio de fotos de autos: carga un modelo glTF, lo deja de lado y de atrás, y saca imágenes con fondo transparente.
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// Lista de materiales con su área aproximada (para saber cuál es la pintura)
function materialReport(root) {
  const rep = new Map();
  root.traverse(o => {
    if (!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const g = o.geometry, pos = g.attributes.position, idx = g.index;
    let area = 0;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const tri = (i0, i1, i2) => { a.fromBufferAttribute(pos, i0); b.fromBufferAttribute(pos, i1); c.fromBufferAttribute(pos, i2); area += b.sub(a).cross(c.sub(a)).length() / 2; };
    const n = idx ? idx.count : pos.count;
    for (let i = 0; i < n; i += 3) idx ? tri(idx.getX(i), idx.getX(i + 1), idx.getX(i + 2)) : tri(i, i + 1, i + 2);
    o.updateWorldMatrix(true, false);
    const s = new THREE.Vector3(); o.matrixWorld.decompose(new THREE.Vector3(), new THREE.Quaternion(), s);
    area *= Math.abs(s.x * s.y);
    for (const m of mats) {
      const r = rep.get(m) || { name: m.name, color: m.color ? '#' + m.color.getHexString() : '', metal: m.metalness, rough: m.roughness, opacity: m.opacity, transparent: m.transparent, map: !!m.map, area: 0, meshes: 0 };
      r.area += area / mats.length; r.meshes++;
      rep.set(m, r);
    }
  });
  return rep;
}

const loader = new GLTFLoader();
window.loadModel = url => new Promise((res, rej) => loader.load(url, g => res(g.scene), undefined, rej));

// cfg: { url, rot: [x,y,z] grados, front: 'x'|'-x'|'z'|'-z', paint: [nombres o índices de material], w (ancho de la imagen de lado) }
window.shoot = async (cfg) => {
  const root = await loadModel(cfg.url);
  const holder = new THREE.Group(); holder.add(root);
  // sacar las piezas marcadas 'hide' (pisos, fondos) antes de medir
  const hideRe = Object.entries(cfg.mats || {}).filter(([, kd]) => kd === 'hide').map(([re]) => new RegExp(re, 'i'));
  const dead = [];
  root.traverse(o => { if (o.isMesh && [].concat(o.material).some(m => hideRe.some(re => re.test(m.name)))) dead.push(o); });
  dead.forEach(o => o.parent.remove(o));
  if (cfg.rot) root.rotation.set(...cfg.rot.map(d => d * Math.PI / 180));
  else {
    // modelos con Z hacia arriba: si lo más largo es Y, se acuesta
    root.updateMatrixWorld(true);
    const s = new THREE.Box3().setFromObject(root).getSize(new THREE.Vector3());
    if (s.y > s.x && s.y > s.z) root.rotation.x = -Math.PI / 2;
  }
  // modelos con dos autos: se queda solo con los que están a un lado (cfg.split = '+' o '-', a lo ancho)
  if (cfg.split) {
    holder.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(holder), sz = b.getSize(new THREE.Vector3()), c = b.getCenter(new THREE.Vector3());
    const ax = sz.x < sz.z ? 'x' : 'z', gone = [];
    holder.traverse(o => { if (!o.isMesh) return; const oc = new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3()); if ((oc[ax] - c[ax]) * (cfg.split === '+' ? 1 : -1) < 0) gone.push(o); });
    gone.forEach(o => o.parent.remove(o));
  }
  // antenas y otras varillas: muy delgadas y altas, agrandan el cuadro; se sacan
  {
    holder.updateMatrixWorld(true);
    const b = new THREE.Box3().setFromObject(holder), sz = b.getSize(new THREE.Vector3()), L = Math.max(sz.x, sz.z), H = sz.y, thin = [];
    holder.traverse(o => { if (!o.isMesh) return; const ob = new THREE.Box3().setFromObject(o).getSize(new THREE.Vector3());
      // pisos: planos enormes (más anchos que el auto) sin altura
      if (ob.y < 0.01 * Math.max(ob.x, ob.z) && ob.x > 0.8 * sz.x && ob.z > 0.8 * sz.z) { thin.push(o); return; }
      if (Math.max(Math.min(ob.x, ob.z), 0) < L * 0.015 && Math.min(ob.x, ob.z) < L * 0.015 && ob.y > H * 0.18 && Math.max(ob.x, ob.z) < L * 0.06) thin.push(o); });
    thin.forEach(o => o.parent.remove(o));
  }
  // dejar el auto a lo largo de X (el lado más largo), mirando a +X si flip no está, con el suelo en y = 0 y centrado
  holder.updateMatrixWorld(true);
  let box = new THREE.Box3().setFromObject(holder);
  const s0 = box.getSize(new THREE.Vector3());
  holder.rotation.y = (s0.z > s0.x ? Math.PI / 2 : 0) + (cfg.flip ? Math.PI : 0);
  holder.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(holder);
  const ctr = box.getCenter(new THREE.Vector3());
  holder.position.set(-ctr.x, -box.min.y, -ctr.z);
  holder.updateMatrixWorld(true);
  box = new THREE.Box3().setFromObject(holder);
  const size = box.getSize(new THREE.Vector3());
  const rep = materialReport(holder);
  // biblioteca de materiales: cada material del modelo se cambia por uno de estos según cfg.mats { regex: tipo }
  const LIB = {
    paint: new THREE.MeshPhysicalMaterial({ color: 0x808080, metalness: 0.0, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05 }),
    chrome: new THREE.MeshStandardMaterial({ color: 0xe8e8ec, metalness: 1.0, roughness: 0.07 }),
    rubber: new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.0, roughness: 0.85 }),
    whitewall: new THREE.MeshStandardMaterial({ color: 0xf2f2ec, metalness: 0.0, roughness: 0.7 }),
    glass: new THREE.MeshStandardMaterial({ color: 0x0e141c, metalness: 0.1, roughness: 0.12, envMapIntensity: 0.32 }),
    dark: new THREE.MeshStandardMaterial({ color: 0x1c1c1e, metalness: 0.2, roughness: 0.6 }),
    interior: new THREE.MeshStandardMaterial({ color: 0x4a3a32, metalness: 0.0, roughness: 0.8 }),
    redlight: new THREE.MeshStandardMaterial({ color: 0xc8101a, emissive: 0x500006, metalness: 0.1, roughness: 0.25 }),
    lens: new THREE.MeshPhysicalMaterial({ color: 0xf4f4ee, metalness: 0.2, roughness: 0.05, clearcoat: 1 }),
    glass2: new THREE.MeshStandardMaterial({ color: 0x1e2a36, metalness: 0.1, roughness: 0.1, envMapIntensity: 0.45 }),
    cream: new THREE.MeshPhysicalMaterial({ color: 0xece6d6, metalness: 0.0, roughness: 0.3, clearcoat: 1, clearcoatRoughness: 0.05 }),
    hide: new THREE.MeshBasicMaterial({ visible: false }),
    keep: null
  };
  const paint = LIB.paint;
  const paintSet = new Set(), remap = new Map(), matKind = new Map();
  let k = 0;
  for (const [m, r] of rep) {
    r.i = k++;
    let kind = null;
    const nm = cfg.prefix ? r.name.replace(new RegExp('^' + cfg.prefix), '') : r.name;
    for (const [re, kd] of Object.entries(cfg.mats || {})) if (new RegExp(re, 'i').test(nm) || re === String(r.i)) { kind = kd; break; }
    if ((cfg.paint || []).some(p => (typeof p === 'number' ? p === r.i : new RegExp(p, 'i').test(r.name)))) kind = 'paint';
    r.kind = kind || 'keep';
    matKind.set(m, r.kind);
    if (kind === 'paint') paintSet.add(m);
    if (kind && kind !== 'keep') remap.set(m, LIB[kind]);
    // modo de prueba: cada material de un color distinto (rojo, verde, azul, amarillo, ...) en orden de índice
    if (cfg.debug) remap.set(m, new THREE.MeshBasicMaterial({ color: new THREE.Color().setHSL((r.i * 0.618) % 1, 0.9, 0.5) }));
  }
  // piezas por nombre de malla (cfg.meshes { regex: tipo }) mandan sobre el material
  const meshRules = Object.entries(cfg.meshes || {}).map(([re, kd]) => [new RegExp(re, 'i'), kd]);
  holder.traverse(o => { if (!o.isMesh) return; const nm = (o.name || '') + ' ' + (o.parent ? o.parent.name : ''); const hit = meshRules.find(([re]) => re.test(nm)); o.userData.kind = hit ? hit[1] : null; });
  const swap = (fn) => holder.traverse(o => { if (!o.isMesh) return; if (!o.userData.orig) o.userData.orig = o.material; o.material = Array.isArray(o.userData.orig) ? o.userData.orig.map(m => fn(m, o)) : fn(o.userData.orig, o); });
  const scene = new THREE.Scene();
  scene.environment = envTex;
  scene.add(holder);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 0.6));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(-3, 8, 6); scene.add(sun);
  const rim = new THREE.DirectionalLight(0xbfd4ff, 0.8); rim.position.set(4, 3, -5); scene.add(rim);
  const pad = 1.04;
  const views = {
    side: { w: cfg.w || 1400, cam: () => { const c = new THREE.OrthographicCamera(-size.x / 2 * pad, size.x / 2 * pad, size.y * pad, -size.y * 0.04, 0.01, size.z * 20 + 100); c.position.set(0, 0, size.z * 4 + 10); c.lookAt(0, 0, 0); c.position.y = 0; return c; }, aspect: size.x * pad / (size.y * (pad + 0.04)) },
    front: { w: cfg.wf || 360, cam: () => { const c = new THREE.OrthographicCamera(-size.z / 2 * pad, size.z / 2 * pad, size.y * pad, -size.y * 0.04, 0.01, size.x * 20 + 100); c.position.set(size.x * 4 + 10, size.y * 0.25, 0); c.lookAt(0, size.y * 0.25, 0); return c; }, aspect: size.z * pad / (size.y * (pad + 0.04)) },
    rear: { w: cfg.wr || 700, cam: () => { const c = new THREE.OrthographicCamera(-size.z / 2 * pad, size.z / 2 * pad, size.y * pad, -size.y * 0.04, 0.01, size.x * 20 + 100); c.position.set(-size.x * 4 - 10, size.y * 0.25, 0); c.lookAt(0, size.y * 0.25, 0); return c; }, aspect: size.z * pad / (size.y * (pad + 0.04)) }
  };
  const out = { size: [size.x, size.y, size.z], materials: [...rep.values()] };
  const kindOf = (o, m) => o.userData.kind || matKind.get(m) || 'keep';
  // puntos (en el mundo) de las mallas de un tipo, muestreados
  const pointsOf = (kind) => {
    const pts = [], v = new THREE.Vector3();
    holder.traverse(o => {
      if (!o.isMesh) return;
      const mats = [].concat(o.userData.orig || o.material);
      if (!mats.some(m => kindOf(o, m) === kind)) return;
      const pos = o.geometry.attributes.position, step = Math.max(1, Math.floor(pos.count / 4000));
      for (let i = 0; i < pos.count; i += step) { v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld); pts.push(v.clone()); }
    });
    return pts;
  };
  const camOf = {}, imgSize = {};
  for (const [name, v] of Object.entries(views)) { camOf[name] = v.cam(); camOf[name].updateMatrixWorld(); imgSize[name] = [v.w, Math.round(v.w / v.aspect)]; }
  const proj = (name, p) => { const q = p.clone().project(camOf[name]); return [(q.x + 1) / 2, (1 - q.y) / 2]; };
  const meta = { ground: proj('side', new THREE.Vector3(0, 0, 0))[1] };
  // ruedas del lado que mira a la cámara (z > 0): atrás (x < 0) y adelante (x > 0)
  const tires = pointsOf('rubber').filter(p => p.z > 0);
  meta.wheels = [-1, 1].map(sg => {
    const ps = tires.filter(p => p.x * sg > 0);
    if (!ps.length) return null;
    const b = new THREE.Box3().setFromPoints(ps), c = b.getCenter(new THREE.Vector3()), r = (b.max.y - b.min.y) / 2;
    const [u, vv] = proj('side', c), [, vt] = proj('side', new THREE.Vector3(c.x, c.y + r, c.z));
    return [+u.toFixed(4), +vv.toFixed(4), +(vv - vt).toFixed(4)];
  });
  // focos traseros: rectángulos en la vista de atrás
  const tl = pointsOf('redlight').filter(p => p.x < 0);
  meta.tail = [-1, 1].map(sg => {
    const ps = tl.filter(p => p.z * sg > 0);
    if (ps.length < 3) return null;
    const pr = ps.map(p => proj('rear', p)), xs = pr.map(q => q[0]), ys = pr.map(q => q[1]);
    return [Math.min(...xs), Math.min(...ys), Math.max(...xs), Math.max(...ys)].map(v => +v.toFixed(4));
  }).filter(Boolean);
  meta.img = imgSize;
  out.meta = meta;
  for (const [name, v] of Object.entries(views)) {
    const W = v.w, H = Math.round(W / v.aspect);
    renderer.setSize(W, H, false);
    const cam = camOf[name];
    // imagen bonita
    swap((m, o) => (o.userData.kind ? (o.userData.kind === 'keep' ? m : LIB[o.userData.kind]) : remap.get(m) || m));
    renderer.setClearColor(0x000000, 0); renderer.render(scene, cam);
    out[name] = renderer.domElement.toDataURL(cfg.webp ? 'image/webp' : 'image/png', 0.9);
    // máscara de la pintura
    const white = new THREE.MeshBasicMaterial({ color: 0xffffff }), black = new THREE.MeshBasicMaterial({ color: 0x000000 });
    swap((m, o) => ((o.userData.kind ? o.userData.kind === 'paint' : paintSet.has(m)) ? white : black));
    renderer.toneMapping = THREE.NoToneMapping; renderer.render(scene, cam); renderer.toneMapping = THREE.ACESFilmicToneMapping;
    out[name + 'Mask'] = renderer.domElement.toDataURL('image/png');
    swap(m => m);
    holder.traverse(o => { if (o.isMesh && o.userData.orig) o.material = o.userData.orig; });
  }
  window.LAST = out;
  if (cfg.save) {
    for (const k of ['side', 'rear', 'front']) {
      await fetch('/save?name=' + cfg.save + '_' + k + (cfg.webp ? '.webp' : '.png'), { method: 'POST', body: out[k] });
      await fetch('/save?name=' + cfg.save + '_' + k + '_mask.png', { method: 'POST', body: out[k + 'Mask'] });
    }
    await fetch('/save?name=' + cfg.save + '.json', { method: 'POST', body: JSON.stringify(meta) });
  }
  const div = document.getElementById('out'); div.innerHTML = '';
  for (const k of ['side', 'sideMask', 'rear', 'rearMask']) { const im = new Image(); im.src = out[k]; div.appendChild(im); }
  return { size: out.size, meta, materials: out.materials.map((r, i) => `${i}:${r.name}=${r.kind}|${r.color}|m${(r.metal ?? 0).toFixed(1)}|r${(r.rough ?? 0).toFixed(1)}|o${r.opacity}|${r.map ? 'tex' : ''}|a${r.area.toFixed(2)}`) };
};
document.title = 'listo';
</script></body></html>
