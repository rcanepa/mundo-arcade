function trackName(ref) {
  const def = trackDef(ref), i = TRACK_DEFS.indexOf(def);
  return i >= 0 ? L().tracks[i] : L().myTrack(def.slot + 1);
}

// Nombre que se muestra: el que eligió el jugador, o uno por defecto en el idioma actual
function racerName(r) {
  if (!r.human) return r.ai !== undefined ? L().ai[r.ai] : r.name;
  const custom = Game.names[r.player];
  if (custom) return custom;
  return Game.players === 1 ? L().you : L().player(r.player + 1);
}

// ===== Sonido: todo sintetizado con WebAudio (no necesita archivos ni internet) =====
const Sound = (() => {
  let ac = null, master, sfxBus, musicBus, noiseBuf;
  let musicOn = true, songName = null, song = null, step = 0, nextT = 0;
  const engines = {};

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    master = ac.createGain(); master.gain.value = 0.55; master.connect(ac.destination);
    sfxBus = ac.createGain(); sfxBus.connect(master);
    musicBus = ac.createGain(); musicBus.gain.value = musicOn ? 0.15 : 0; musicBus.connect(master);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(schedule, 40);
    if (songName) play(songName);
  }

  function voice(freq, at, dur, type, vol, slideTo, bus) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, at + dur);
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
    o.connect(g); g.connect(bus);
    o.start(at); o.stop(at + dur + 0.05);
  }

  function hiss(at, dur, vol, freq, ftype, bus) {
    const s = ac.createBufferSource(); s.buffer = noiseBuf; s.loop = true;
    const f = ac.createBiquadFilter(); f.type = ftype; f.frequency.value = freq;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, at);
    g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
    s.connect(f); f.connect(g); g.connect(bus);
    s.start(at, Math.random() * 0.5); s.stop(at + dur + 0.05);
  }

  const tone = (freq, dur, type = 'square', vol = 0.15, slideTo = 0, delay = 0) => {
    if (ac) voice(freq, ac.currentTime + delay, dur, type, vol, slideTo, sfxBus);
  };
  const noise = (dur, vol, freq, ftype = 'lowpass', delay = 0) => {
    if (ac) hiss(ac.currentTime + delay, dur, vol, freq, ftype, sfxBus);
  };

  const sfx = {
    beep() { tone(520, 0.2, 'square', 0.18); },
    go() { tone(1040, 0.55, 'square', 0.2); },
    select() { tone(700, 0.05, 'square', 0.08); },
    buy() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'square', 0.12, 0, i * 0.06)); },
    nope() { tone(160, 0.25, 'sawtooth', 0.15); },
    coin() { tone(988, 0.08, 'square', 0.15); tone(1319, 0.3, 'square', 0.15, 0, 0.08); },
    nitroPick() { tone(400, 0.25, 'triangle', 0.25, 1200); },
    nitro() { noise(0.8, 0.3, 900, 'bandpass'); tone(150, 0.8, 'sawtooth', 0.08, 600); },
    crash() { noise(0.18, 0.35, 500); },
    bump() { noise(0.08, 0.15, 300); },
    splash() { noise(0.35, 0.2, 1500, 'highpass'); },
    jump() { tone(250, 0.25, 'triangle', 0.15, 500); },
    land() { noise(0.15, 0.3, 250); },
    lap() { tone(784, 0.1, 'square', 0.15); tone(1175, 0.22, 'square', 0.15, 0, 0.1); },
    finish() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.2, 'square', 0.15, 0, i * 0.12)); },
    lose() { [392, 349, 330, 262].forEach((f, i) => tone(f, 0.25, 'triangle', 0.2, 0, i * 0.18)); }
  };

  // Un motor por jugador humano: el tono sube con la velocidad
  function engine(id, speed01, active) {
    if (!ac) return;
    let e = engines[id];
    if (!e) {
      const o = ac.createOscillator(), o2 = ac.createOscillator();
      const f = ac.createBiquadFilter(), g = ac.createGain();
      o.type = 'sawtooth'; o2.type = 'square';
      f.type = 'lowpass'; f.frequency.value = 600;
      g.gain.value = 0;
      o.connect(f); o2.connect(f); f.connect(g); g.connect(sfxBus);
      o.start(); o2.start();
      e = engines[id] = { o, o2, f, g };
    }
    const t = ac.currentTime, fr = 45 + speed01 * 110;
    e.o.frequency.setTargetAtTime(fr, t, 0.05);
    e.o2.frequency.setTargetAtTime(fr * 0.5 + 3, t, 0.05);
    e.f.frequency.setTargetAtTime(300 + speed01 * 900, t, 0.05);
    e.g.gain.setTargetAtTime(active ? 0.045 + speed01 * 0.04 : 0, t, 0.08);
  }
  function stopEngines() {
    if (!ac) return;
    for (const id in engines) engines[id].g.gain.setTargetAtTime(0, ac.currentTime, 0.05);
  }

  // Música chiptune: melodía, bajo y batería en pasos de corchea
  const SONGS = {
    menu: {
      dt: 0.14,
      lead: [76, 0, 79, 0, 84, 0, 79, 0, 81, 0, 79, 0, 76, 0, 74, 0, 76, 0, 79, 0, 84, 0, 86, 0, 88, 0, 86, 0, 84, 0, 0, 0],
      bass: [48, 0, 60, 0, 55, 0, 60, 0, 53, 0, 65, 0, 57, 0, 65, 0, 48, 0, 60, 0, 55, 0, 60, 0, 55, 0, 67, 0, 59, 0, 67, 0],
      drum: [1, 0, 3, 0, 2, 0, 3, 0]
    },
    race: {
      dt: 0.12,
      lead: [69, 0, 72, 0, 76, 0, 74, 72, 0, 0, 72, 0, 74, 0, 76, 0, 79, 0, 76, 0, 74, 0, 72, 74, 0, 0, 71, 0, 68, 0, 0, 0],
      bass: [45, 45, 57, 45, 45, 57, 45, 57, 41, 41, 53, 41, 41, 53, 41, 53, 43, 43, 55, 43, 43, 55, 43, 55, 40, 40, 52, 40, 44, 44, 56, 44],
      drum: [1, 0, 2, 0, 1, 1, 2, 0]
    }
  };
  const midi = n => 440 * Math.pow(2, (n - 69) / 12);

  function play(name) {
    songName = name; song = SONGS[name] || null; step = 0;
    if (ac) nextT = ac.currentTime + 0.08;
  }

  function schedule() {
    if (!ac || !song) return;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.02;
    while (nextT < ac.currentTime + 0.25) {
      const i = step % song.lead.length;
      const L = song.lead[i], B = song.bass[i % song.bass.length], D = song.drum[i % song.drum.length];
      if (L) voice(midi(L), nextT, song.dt * 1.6, 'square', 0.09, 0, musicBus);
      if (B) voice(midi(B), nextT, song.dt * 0.9, 'triangle', 0.35, 0, musicBus);
      if (D === 1) voice(130, nextT, 0.12, 'sine', 0.6, 40, musicBus);
      if (D === 2) hiss(nextT, 0.1, 0.25, 1800, 'highpass', musicBus);
      if (D === 3) hiss(nextT, 0.03, 0.12, 7000, 'highpass', musicBus);
      nextT += song.dt; step++;
    }
  }

  function toggleMusic() {
    musicOn = !musicOn;
    if (musicBus) musicBus.gain.setTargetAtTime(musicOn ? 0.15 : 0, ac.currentTime, 0.05);
    return musicOn;
  }

  // Bocinas: cada estilo es una pequeña secuencia de notas; cada jugador suena un poco distinto
  const HORN_PITCH = [1, 0.84, 1.18, 0.92];
  function horn(style, who = 0) {
    if (!ac) return;
    const p = HORN_PITCH[(who % 4 + 4) % 4], t = ac.currentTime;
    const v = (f, at, dur, type, vol, slide) => voice(f * p, t + at, dur, type, vol, slide ? slide * p : 0, sfxBus);
    switch (style) {
      case 1: v(140, 0, 0.6, 'sawtooth', 0.14); v(176, 0, 0.6, 'sawtooth', 0.12); break;                    // camión
      case 2: v(600, 0, 0.18, 'triangle', 0.3, 1300); v(1300, 0.18, 0.2, 'triangle', 0.3, 700); break;      // payaso
      case 3: [523, 659, 784, 1047].forEach((f, i) => v(f, i * 0.11, 0.13, 'square', 0.12)); break;          // melodía
      case 4: v(330, 0, 0.12, 'sawtooth', 0.2, 220); v(330, 0.16, 0.14, 'sawtooth', 0.2, 200); break;       // pato
      default: v(392, 0, 0.35, 'square', 0.11); v(494, 0, 0.35, 'square', 0.11);                           // clásica
    }
  }

  return { init, sfx, engine, stopEngines, play, toggleMusic, horn };
})();

// ===== Utilidades =====
const W = 1024, H = 640, HUD_H = 46, BRIDGE_H = 26;
let RENDER_K = 1;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const angDiff = (a, b) => {
  let d = (a - b) % (2 * Math.PI);
  if (d > Math.PI) d -= 2 * Math.PI;
  if (d < -Math.PI) d += 2 * Math.PI;
  return d;
};
const font = (size, weight = 900) => `${weight} ${size}px "Arial Black", "Arial Rounded MT Bold", Impact, system-ui, sans-serif`;
function roundRect(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function tri(g, x1, y1, x2, y2, x3, y3) {
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.lineTo(x3, y3); g.closePath();
}
function ellipse(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function bigText(g, text, x, y, size, color, stroke = '#2a1405') {
  g.font = font(size); g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
  g.lineWidth = size * 0.18; g.strokeStyle = stroke; g.strokeText(text, x, y);
  g.fillStyle = color; g.fillText(text, x, y);
}
function mulberry32(a) {
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// Catmull-Rom centrípeta: curva suave que pasa por los puntos sin hacer rulos
function crPoint(p0, p1, p2, p3, t) {
  const d = (a, b) => Math.max(1e-3, Math.sqrt(Math.hypot(b[0] - a[0], b[1] - a[1])));
  const t1 = d(p0, p1), t2 = t1 + d(p1, p2), t3 = t2 + d(p2, p3);
  const u = t1 + (t2 - t1) * t;
  const L = (A, B, ta, tb) => { const w = (u - ta) / (tb - ta); return [A[0] + (B[0] - A[0]) * w, A[1] + (B[1] - A[1]) * w]; };
  const A1 = L(p0, p1, 0, t1), A2 = L(p1, p2, t1, t2), A3 = L(p2, p3, t2, t3);
  const B1 = L(A1, A2, 0, t2), B2 = L(A2, A3, t1, t3);
  return L(B1, B2, t1, t2);
}

function buildTrack(def) {
  const P = def.pts, n = P.length, SUB = 40, dense = [];
  for (let i = 0; i < n; i++) {
    const p0 = P[(i + n - 1) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
    for (let j = 0; j < SUB; j++) dense.push(crPoint(p0, p1, p2, p3, j / SUB));
  }
  const M = dense.length, cum = [0];
  for (let i = 1; i <= M; i++) {
    const a = dense[i - 1], b = dense[i % M];
    cum.push(cum[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1]));
  }
  // Re-muestreo cada ~8 px para que todas las muestras queden a igual distancia
  const len = cum[M], N = Math.round(len / 8), step = len / N;
  const sToD = s => {
    const f = (((s % n) + n) % n) * SUB, i = Math.floor(f);
    return cum[i] + (cum[i + 1] - cum[i]) * (f - i);
  };
  const raw = [];
  for (let i = 0, k = 0; i < N; i++) {
    const d = i * step;
    while (cum[k + 1] < d) k++;
    const a = dense[k], b = dense[(k + 1) % M], f = (d - cum[k]) / ((cum[k + 1] - cum[k]) || 1);
    raw.push({ x: a[0] + (b[0] - a[0]) * f, y: a[1] + (b[1] - a[1]) * f, s: (k + f) / SUB });
  }
  const s0 = Math.round(sToD(def.start) / step) % N;
  const pts = raw.slice(s0).concat(raw.slice(0, s0));
  pts.forEach((p, i) => {
    const a = pts[(i + N - 1) % N], b = pts[(i + 1) % N];
    const l = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    p.tx = (b.x - a.x) / l; p.ty = (b.y - a.y) / l; p.nx = -p.ty; p.ny = p.tx;
  });
  const idxOf = s => (Math.round(sToD(s) / step) - s0 + N * 2) % N;
  const t = { def, name: def.name, theme: THEMES[def.theme], pts, N, hw: def.width / 2, len,
              jumps: [], bumps: [], puddles: [], canvas: null, k: 0, idxOf };
  t.height = new Float32Array(N); t.bridgeAt = new Uint8Array(N); t.tunnelAt = new Uint8Array(N);
  t.bridges = []; t.tunnels = [];
  for (const f of def.feats) {
    if (f[0] === 'jump') t.jumps.push(idxOf(f[1]));
    else if (f[0] === 'bumps') t.bumps.push({ i0: idxOf(f[1]), i1: idxOf(f[2]) });
    else if (f[0] === 'bridge' || f[0] === 'tunnel') {
      const i0 = idxOf(f[1]);
      markRange(t, i0, (idxOf(f[2]) - i0 + N) % N, f[0] === 'bridge');
    } else {
      const p = pts[idxOf(f[1])];
      t.puddles.push({ type: f[0], x: p.x + p.nx * f[2] * t.hw, y: p.y + p.ny * f[2] * t.hw, r: f[3] });
    }
  }
  if (def.slot !== undefined) addAutoBridges(t);
  t.bridgeIdx = [];
  for (let i = 0; i < N; i += 2) if (t.bridgeAt[i]) t.bridgeIdx.push(i);
  return t;
}

// Marca un tramo como puente (sube con una rampa suave, sigue arriba y baja) o como túnel
function markRange(t, i0, len, bridge) {
  const N = t.N, ramp = Math.max(4, Math.min(16, Math.floor(len / 3)));
  (bridge ? t.bridges : t.tunnels).push({ i0, i1: (i0 + len) % N });
  for (let s = 0; s <= len; s++) {
    const i = (i0 + s) % N;
    if (!bridge) { t.tunnelAt[i] = 1; continue; }
    const e = Math.min(1, Math.min(s, len - s) / ramp);
    t.bridgeAt[i] = 1; t.height[i] = Math.max(t.height[i], BRIDGE_H * e * e * (3 - 2 * e));
  }
}

// En las pistas del editor, donde la pista se cruza consigo misma se pone un puente solo.
// El largo depende del ángulo: un cruce en diagonal necesita un puente más largo.
function addAutoBridges(t) {
  const P = t.pts, N = t.N, found = [];
  const side = (p, q, r) => (q.x - p.x) * (r.y - p.y) - (q.y - p.y) * (r.x - p.x);
  const cross = (a, b, c, d) => side(a, b, c) * side(a, b, d) < 0 && side(c, d, a) * side(c, d, b) < 0;
  for (let i = 0; i < N; i++) {
    const a = P[i], b = P[(i + 1) % N];
    for (let j = i + 20; j <= i + N - 20; j++) {
      const c = P[j % N];
      if (Math.abs(c.x - a.x) > 20 || Math.abs(c.y - a.y) > 20) continue;
      if (cross(a, b, c, P[(j + 1) % N]) && !found.some(f => Math.abs(f[0] - i) < 15 && Math.abs(f[1] - j % N) < 15)) found.push([i, j % N]);
    }
  }
  let made = 0;
  for (const [i, j] of found) {
    if (t.bridgeAt[i] || t.bridgeAt[j]) continue; // ya tiene un puente puesto a mano
    const sin = Math.abs(P[i].tx * P[j].ty - P[i].ty * P[j].tx);
    const flat = Math.ceil((t.def.width + 24) / Math.max(0.35, sin) / 8) + 2, half = Math.ceil(flat / 2) + 14;
    // pasa por arriba el segundo paso de la vuelta, salvo que el puente toque la partida, otro puente o un túnel
    for (const c of [j, i]) {
      const i0 = (c - half + N) % N;
      let ok = true;
      for (let s = 0; s <= half * 2 && ok; s++) {
        const k = (i0 + s) % N;
        if (k < 3 || k > N - 10 || t.bridgeAt[k] || t.tunnelAt[k]) ok = false;
      }
      if (ok) { markRange(t, i0, half * 2, true); made++; break; }
    }
  }
  t.autoBridges = made;
}

const wrap = (t, i) => ((i % t.N) + t.N) % t.N;
const inRange = (t, i, a, b) => wrap(t, i - a) <= wrap(t, b - a);

// Busca la muestra de pista más cercana solo cerca de la anterior (así no "salta" a otro tramo)
function nearestIdx(t, x, y, guess, win = 14) {
  let best = guess, bd = Infinity;
  for (let k = -win; k <= win; k++) {
    const i = wrap(t, guess + k), p = t.pts[i];
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = i; }
  }
  return best;
}

// Pistas del juego más las que el jugador creó en el editor
let customTracks = [];
const trackList = () => TRACK_DEFS.concat(customTracks.filter(d => d && d.pts.length >= 4));
const trackCache = new Map();
// ref puede ser una posición en la lista o directamente la definición de una pista
function trackDef(ref) {
  if (typeof ref !== 'number') return ref;
  const list = trackList();
  return list[((ref % list.length) + list.length) % list.length];
}
function getTrack(ref) {
  const def = trackDef(ref);
  let t = trackCache.get(def);
  if (!t) { t = buildTrack(def); trackCache.set(def, t); }
  if (t.k !== RENDER_K) { Object.assign(t, renderTrack(t, RENDER_K)); t.k = RENDER_K; }
  return t;
}

// ===== Dibujo de la pista (se dibuja una vez en un canvas aparte) =====
// keep(i) elige qué muestras van (cada tramo seguido queda como un trazo aparte).
// lift corre cada punto según la altura del puente, para dibujar su sombra en el suelo.
function trackPath(t, off = 0, keep = null, lift = 0) {
  const p2 = new Path2D(), N = t.N;
  const at = i => {
    const p = t.pts[i], h = lift ? t.height[i] * lift : 0;
    return [p.x + p.nx * off + h * 0.35, p.y + p.ny * off + h * 0.55];
  };
  if (!keep) {
    for (let i = 0; i < N; i++) { const [x, y] = at(i); i ? p2.lineTo(x, y) : p2.moveTo(x, y); }
    p2.closePath();
    return p2;
  }
  let s0 = 0;
  while (s0 < N && keep(s0)) s0++;
  if (s0 === N) return trackPath(t, off, null, lift);
  let open = false;
  for (let k = 1; k <= N; k++) {
    const i = (s0 + k) % N;
    if (!keep(i)) { open = false; continue; }
    const [x, y] = at(i);
    if (open) p2.lineTo(x, y); else { p2.moveTo(x, y); open = true; }
  }
  return p2;
}

function makeLayer(k) {
  const c = document.createElement('canvas');
  c.width = Math.ceil(W * k); c.height = Math.ceil(H * k);
  const g = c.getContext('2d'); g.scale(k, k); g.lineJoin = 'round'; g.lineCap = 'round';
  return [c, g];
}

// Devuelve el suelo (canvas) y, si hay, la capa de puentes (over) y la de túneles (cover)
function renderTrack(t, k) {
  const th = t.theme, rnd = mulberry32(t.def.seed), w = t.def.width, hw = t.hw;
  const mk = () => makeLayer(k);
  // los tramos de puente no van en el suelo: se dibujan en su propia capa, encima
  const ground = t.bridges.length ? i => !t.bridgeAt[i] : null;
  const [c, g] = mk();
  g.fillStyle = th.ground; g.fillRect(0, 0, W, H);
  for (let i = 0; i < 1400; i++) {
    g.fillStyle = rnd() < 0.5 ? th.g2 : th.g3;
    const s = 2 + rnd() * 6;
    g.fillRect(rnd() * W, rnd() * H, s, s * 0.6);
  }
  drawDecos(g, t, rnd);
  const path = trackPath(t, 0, ground);
  // muro de neumáticos con su sombra
  g.save(); g.translate(4, 5); g.strokeStyle = 'rgba(0,0,0,0.28)'; g.lineWidth = w + 20; g.stroke(path); g.restore();
  g.strokeStyle = th.wall; g.lineWidth = w + 16; g.stroke(path);
  g.setLineDash([9, 9]); g.strokeStyle = th.wall2; g.stroke(path); g.setLineDash([]);
  // capa de tierra: lo que se dibuja después queda recortado a la pista
  const [dc, dg] = mk();
  dg.strokeStyle = th.dirt; dg.lineWidth = w; dg.stroke(path);
  dg.globalCompositeOperation = 'source-atop';
  for (let i = 0; i < t.N * 5; i++) {
    const p = t.pts[Math.floor(rnd() * t.N)], o = (rnd() * 2 - 1) * hw, s = 1.5 + rnd() * 3;
    dg.fillStyle = rnd() < 0.5 ? th.d2 : th.d3;
    dg.fillRect(p.x + p.nx * o + (rnd() - 0.5) * 8, p.y + p.ny * o + (rnd() - 0.5) * 8, s, s);
  }
  dg.strokeStyle = 'rgba(50,30,10,0.13)'; dg.lineWidth = 4;
  for (const o of [-0.5, -0.2, 0.2, 0.5]) dg.stroke(trackPath(t, o * hw, ground));
  dg.strokeStyle = 'rgba(0,0,0,0.18)'; dg.lineWidth = 8;
  dg.stroke(trackPath(t, hw - 2, ground)); dg.stroke(trackPath(t, -hw + 2, ground));
  for (const pd of t.puddles) drawPuddle(dg, pd, rnd);
  for (const b of t.bumps) {
    const cnt = wrap(t, b.i1 - b.i0);
    for (let s = 0; s <= cnt; s += 3) drawBumpRow(dg, t, wrap(t, b.i0 + s), s / 3);
  }
  for (const j of t.jumps) drawJump(dg, t, j);
  drawStartLine(dg, t);
  // dentro del túnel la pista se ve más oscura (se nota cuando el cerro se vuelve transparente)
  if (t.tunnels.length) {
    dg.lineCap = 'butt'; dg.strokeStyle = 'rgba(0,0,0,0.38)'; dg.lineWidth = w;
    dg.stroke(trackPath(t, 0, i => t.tunnelAt[i]));
  }
  g.drawImage(dc, 0, 0, W, H);
  return {
    canvas: c,
    over: t.bridges.length ? renderBridges(t, k) : null,
    cover: t.tunnels.length ? renderTunnels(t, k) : null
  };
}

// Puentes: sombra en el suelo, pilares, tablones y barandas
function renderBridges(t, k) {
  const [c, g] = makeLayer(k);
  drawBridges(g, t);
  return c;
}

function drawBridges(g, t) {
  const w = t.def.width, hw = t.hw, on = i => t.bridgeAt[i], N = t.N;
  g.save(); g.lineJoin = 'round';
  // la sombra se corre más donde el puente está más alto
  g.lineCap = 'butt';
  g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = w + 14; g.stroke(trackPath(t, 0, on, 1));
  g.strokeStyle = '#5a4a3c'; g.lineWidth = 6;
  for (let i = 0; i < N; i += 6) {
    const h = t.height[i];
    if (!on(i) || h < BRIDGE_H * 0.5) continue;
    const p = t.pts[i];
    for (const side of [-1, 1]) {
      const ex = p.x + p.nx * side * (hw + 4), ey = p.y + p.ny * side * (hw + 4);
      g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex + h * 0.35, ey + h * 0.55); g.stroke();
    }
  }
  // puntas planas: el tablero empieza justo donde termina el camino de tierra
  const deck = trackPath(t, 0, on);
  g.strokeStyle = '#4a2f17'; g.lineWidth = w + 14; g.stroke(deck);
  g.strokeStyle = '#8a5a2b'; g.lineWidth = w + 6; g.stroke(deck);
  g.strokeStyle = '#c08a4c'; g.lineWidth = w - 2; g.stroke(deck);
  for (let i = 0; i < N; i++) {
    if (!on(i)) continue;
    const p = t.pts[i], a = t.pts[(i + 1) % N];
    // juntas de los tablones
    g.strokeStyle = 'rgba(70,40,15,0.4)'; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(p.x - p.nx * (hw - 2), p.y - p.ny * (hw - 2)); g.lineTo(p.x + p.nx * (hw - 2), p.y + p.ny * (hw - 2)); g.stroke();
    // la subida se ve más clara y la bajada más oscura
    const slope = t.height[(i + 1) % N] - t.height[(i - 1 + N) % N];
    if (Math.abs(slope) > 0.2) {
      g.strokeStyle = slope > 0 ? `rgba(255,255,255,${Math.min(0.3, slope * 0.08)})` : `rgba(0,0,0,${Math.min(0.3, -slope * 0.08)})`;
      g.lineWidth = w - 2; g.lineCap = 'butt';
      g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(a.x, a.y); g.stroke();
      g.lineCap = 'round';
    }
  }
  g.fillStyle = '#2e1c0c';
  for (let i = 0; i < N; i += 3) {
    if (!on(i)) continue;
    const p = t.pts[i];
    for (const side of [-1, 1]) ellipse(g, p.x + p.nx * side * (hw + 4), p.y + p.ny * side * (hw + 4), 2.6, 2.6);
  }
  g.restore();
}

// Túneles: un cerro tapa la pista, con bocas de piedra en las puntas
function renderTunnels(t, k) {
  const [c, g] = makeLayer(k);
  drawTunnels(g, t);
  return c;
}

function drawTunnels(g, t) {
  const w = t.def.width, hw = t.hw, cov = t.theme.cover, rnd = mulberry32(t.def.seed + 99);
  g.save(); g.lineJoin = 'round';
  const on = i => t.tunnelAt[i], path = trackPath(t, 0, on);
  // lomos a los costados para que el borde se vea como un cerro y no como una tabla
  const lumps = [];
  for (const tn of t.tunnels) {
    const len = (tn.i1 - tn.i0 + t.N) % t.N;
    for (let s = 3; s <= len - 3; s += 3) {
      if (rnd() < 0.35) continue;
      const p = t.pts[(tn.i0 + s) % t.N], side = rnd() < 0.5 ? -1 : 1, o = side * (hw + 24 + rnd() * 10);
      lumps.push([p.x + p.nx * o, p.y + p.ny * o, 9 + rnd() * 9]);
    }
  }
  g.lineCap = 'butt';
  g.save(); g.translate(6, 8); g.fillStyle = g.strokeStyle = 'rgba(0,0,0,0.3)'; g.lineWidth = w + 72; g.stroke(path);
  for (const [x, y, r] of lumps) ellipse(g, x, y, r + 3, r + 3);
  g.restore();
  g.fillStyle = g.strokeStyle = cov[2]; g.lineWidth = w + 72; g.stroke(path);
  for (const [x, y, r] of lumps) ellipse(g, x, y, r + 3, r + 3);
  g.fillStyle = g.strokeStyle = cov[0]; g.lineWidth = w + 62; g.stroke(path);
  for (const [x, y, r] of lumps) ellipse(g, x, y, r, r);
  g.strokeStyle = cov[1]; g.lineWidth = w + 18; g.stroke(path);
  // piedras o arbustos sobre el cerro
  for (let i = 0; i < t.N; i++) {
    if (!on(i) || rnd() < 0.4) continue;
    const p = t.pts[i], o = (rnd() * 2 - 1) * (hw + 26), r = 2 + rnd() * 4;
    g.fillStyle = cov[2]; ellipse(g, p.x + p.nx * o + 1, p.y + p.ny * o + 1.5, r, r * 0.8);
    g.fillStyle = cov[1]; ellipse(g, p.x + p.nx * o - 0.5, p.y + p.ny * o - 0.5, r * 0.5, r * 0.4);
  }
  // bocas: sombra que entra al túnel y arco de piedra (la salida es la entrada en espejo)
  for (const tn of t.tunnels) {
    for (const [i, dir] of [[tn.i0, 1], [tn.i1, -1]]) {
      const p = t.pts[i];
      g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.ty, p.tx)); g.scale(dir, 1);
      const grd = g.createLinearGradient(-22, 0, 0, 0);
      grd.addColorStop(0, 'rgba(0,0,0,0)'); grd.addColorStop(1, 'rgba(0,0,0,0.55)');
      g.fillStyle = grd; g.fillRect(-22, -hw, 22, hw * 2);
      g.fillStyle = '#7d756c'; roundRect(g, -2, -hw - 9, 9, hw * 2 + 18, 3); g.fill();
      g.fillStyle = '#5d564f';
      for (let y = -hw - 6; y < hw + 6; y += 9) g.fillRect(-1, y, 7, 1.5);
      g.restore();
    }
  }
  g.restore();
}

function drawPuddle(g, pd, rnd) {
  const blobs = [[0, 0, 1]];
  for (let i = 0; i < 4; i++) {
    const a = rnd() * 6.28;
    blobs.push([Math.cos(a) * pd.r * 0.45, Math.sin(a) * pd.r * 0.45, 0.6]);
  }
  const fill = (col, scale, dx = 0, dy = 0) => {
    g.fillStyle = col; g.beginPath();
    for (const [x, y, s] of blobs) {
      g.moveTo(pd.x + x + dx + pd.r * s * scale, pd.y + y + dy);
      g.arc(pd.x + x + dx, pd.y + y + dy, pd.r * s * scale, 0, Math.PI * 2);
    }
    g.fill();
  };
  if (pd.type === 'mud') {
    fill('#4a2f17', 1); fill('#5e3d1f', 0.82); fill('rgba(255,255,255,0.08)', 0.4, -pd.r * 0.2, -pd.r * 0.2);
  } else {
    fill('#6b5233', 1); fill('#2f6fb0', 0.86); fill('#4a90d0', 0.6, -3, -3);
    fill('rgba(255,255,255,0.35)', 0.18, -pd.r * 0.3, -pd.r * 0.3);
  }
}

function drawJump(g, t, i) {
  const p = t.pts[i], hw = t.hw + 2;
  g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.ty, p.tx));
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(2, -hw, 9, hw * 2);
  const grd = g.createLinearGradient(-18, 0, 2, 0);
  grd.addColorStop(0, t.theme.dirt); grd.addColorStop(1, '#f3d8a4');
  g.fillStyle = grd; g.fillRect(-18, -hw, 20, hw * 2);
  g.fillStyle = 'rgba(110,60,20,0.35)';
  for (let y = -hw; y < hw; y += 9) g.fillRect(-16, y, 16, 2);
  g.fillStyle = '#fff6dc'; g.fillRect(0, -hw, 2.5, hw * 2);
  g.restore();
}

function drawBumpRow(g, t, i, row) {
  const p = t.pts[i], ang = Math.atan2(p.ty, p.tx), shift = row % 2 ? 0.2 : 0;
  for (const o0 of [-0.7, -0.3, 0.1, 0.5]) {
    const o = o0 + shift, x = p.x + p.nx * o * t.hw, y = p.y + p.ny * o * t.hw;
    g.save(); g.translate(x, y); g.rotate(ang);
    g.fillStyle = 'rgba(0,0,0,0.22)'; ellipse(g, 2, 0, 5, 8);
    g.fillStyle = t.theme.d3; ellipse(g, -1, 0, 4.5, 7.5);
    g.fillStyle = 'rgba(255,255,255,0.25)'; ellipse(g, -2, -1, 2, 4);
    g.restore();
  }
}

function drawStartLine(g, t) {
  const p = t.pts[0], s = 6, n = Math.ceil(t.hw * 2 / s) + 1;
  g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.ty, p.tx));
  for (let r = 0; r < 2; r++) for (let j = 0; j < n; j++) {
    g.fillStyle = (r + j) % 2 ? '#111' : '#fff';
    g.fillRect(-s + r * s, -t.hw - 2 + j * s, s, s);
  }
  g.restore();
}

// ===== Decoración fuera de la pista =====
function farFromTrack(t, x, y, m) {
  const lim = (t.hw + m) ** 2;
  for (let i = 0; i < t.N; i += 2) {
    const p = t.pts[i];
    if ((p.x - x) ** 2 + (p.y - y) ** 2 < lim) return false;
  }
  return true;
}

function drawDecos(g, t, rnd) {
  const items = [];
  for (let tries = 0; tries < 500 && items.length < 55; tries++) {
    const x = 15 + rnd() * (W - 30), y = HUD_H + 14 + rnd() * (H - HUD_H - 28), s = 0.7 + rnd() * 0.6;
    if (farFromTrack(t, x, y, 18 + 16 * s) && items.every(o => (o.x - x) ** 2 + (o.y - y) ** 2 > 900)) items.push({ x, y, s });
  }
  items.sort((a, b) => a.y - b.y);
  for (const o of items) DECOS[t.theme.deco](g, o.x, o.y, o.s, rnd);
}

const DECOS = {
  tree(g, x, y, s) {
    g.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(g, x + 5 * s, y + 6 * s, 15 * s, 9 * s);
    g.fillStyle = '#2d5a1e'; ellipse(g, x, y, 15 * s, 15 * s);
    g.fillStyle = '#3f7a2a'; ellipse(g, x - 3 * s, y - 3 * s, 11 * s, 11 * s);
    g.fillStyle = '#5a9a3a'; ellipse(g, x - 6 * s, y - 6 * s, 5 * s, 5 * s);
  },
  pine(g, x, y, s) {
    g.fillStyle = 'rgba(0,0,0,0.18)'; ellipse(g, x + 6 * s, y + 8 * s, 13 * s, 7 * s);
    g.fillStyle = '#5b3a1e'; g.fillRect(x - 2 * s, y + 4 * s, 4 * s, 6 * s);
    for (let i = 0; i < 3; i++) {
      const yy = y + 6 * s - i * 8 * s, w = (14 - i * 3.5) * s;
      g.fillStyle = '#1f5a3a'; tri(g, x - w, yy, x + w, yy, x, yy - 13 * s); g.fill();
      g.fillStyle = '#ffffff'; tri(g, x - w * 0.4, yy - 8 * s, x + w * 0.4, yy - 8 * s, x, yy - 13 * s); g.fill();
    }
  },
  cactus(g, x, y, s) {
    g.fillStyle = 'rgba(0,0,0,0.2)'; ellipse(g, x + 6 * s, y + 12 * s, 11 * s, 4 * s);
    g.fillStyle = '#2f7d3a';
    roundRect(g, x - 4 * s, y - 16 * s, 8 * s, 28 * s, 4 * s); g.fill();
    roundRect(g, x - 13 * s, y - 8 * s, 6 * s, 12 * s, 3 * s); g.fill(); g.fillRect(x - 10 * s, y + 1 * s, 8 * s, 4 * s);
    roundRect(g, x + 7 * s, y - 12 * s, 6 * s, 12 * s, 3 * s); g.fill(); g.fillRect(x + 2 * s, y - 3 * s, 8 * s, 4 * s);
    g.fillStyle = '#4aa055'; g.fillRect(x - 2 * s, y - 14 * s, 2 * s, 24 * s);
  },
  rock(g, x, y, s, rnd) {
    g.fillStyle = 'rgba(0,0,0,0.25)'; ellipse(g, x + 5 * s, y + 6 * s, 14 * s, 8 * s);
    const poly = (r, col, dx, dy) => {
      g.fillStyle = col; g.beginPath();
      for (let i = 0; i < 7; i++) {
        const a = i / 7 * Math.PI * 2, rr = r * (0.75 + rnd() * 0.35);
        g.lineTo(x + dx + Math.cos(a) * rr, y + dy + Math.sin(a) * rr * 0.8);
      }
      g.closePath(); g.fill();
    };
    poly(13 * s, '#6e4a3a', 0, 0); poly(8 * s, '#8c6452', -3 * s, -3 * s);
  },
  reed(g, x, y, s, rnd) {
    if (rnd() < 0.4) {
      g.fillStyle = '#2c5f8a'; ellipse(g, x, y, 18 * s, 10 * s);
      g.fillStyle = 'rgba(255,255,255,0.25)'; ellipse(g, x - 5 * s, y - 3 * s, 6 * s, 2 * s);
      return;
    }
    g.strokeStyle = '#7a9a3a'; g.lineWidth = 2 * s; g.lineCap = 'round';
    for (let i = 0; i < 6; i++) {
      const bx = x + (i - 3) * 3 * s, tx = x + (i - 3) * 4.5 * s + (rnd() - 0.5) * 4 * s, ty = y - (12 + rnd() * 8) * s;
      g.beginPath(); g.moveTo(bx, y); g.lineTo(tx, ty); g.stroke();
      if (i % 2) { g.fillStyle = '#5a3a1c'; ellipse(g, tx, ty + 2 * s, 2 * s, 4 * s); }
    }
  }
};

function star(g, x, y, r) {
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  g.closePath(); g.fill();
}

function drawDecal(g, decal, b) {
  const [x, y, w, h] = b, cx = x + w / 2, cy = y + h / 2;
  if (decal === 1) { // rayas
    g.fillStyle = 'rgba(255,255,255,0.85)'; g.fillRect(x, cy - 2.6, w, 1.6); g.fillRect(x, cy + 1, w, 1.6);
  } else if (decal === 2) { // llamas que salen del frente
    const fx = x + w, k = h / 13;
    const flame = (col, s) => {
      g.fillStyle = col; g.beginPath(); g.moveTo(fx, cy - 5 * k * s);
      [[-6, -4], [-4, -2.5], [-11, -1.5], [-7, 0], [-12, 1.5], [-4, 2.5], [-7, 4], [0, 5]]
        .forEach(([dx, dy]) => g.lineTo(fx + dx * s, cy + dy * k * s));
      g.closePath(); g.fill();
    };
    flame('#ff6a00', 1); flame('#ffd23f', 0.6);
  } else if (decal === 3) { // estrellas
    g.fillStyle = '#fff6a8';
    [[-0.3, -0.25], [0.05, 0.25], [0.32, -0.2]].forEach(([fx, fy]) => star(g, cx + fx * w, cy + fy * h, 2.4));
  } else if (decal === 4) { // rayo
    g.fillStyle = '#ffe14a'; g.beginPath();
    [[-0.45, 0.1], [0.02, -0.38], [-0.02, -0.05], [0.45, -0.12], [-0.02, 0.38], [0.02, 0.06]]
      .forEach(([fx, fy], i) => (i ? g.lineTo(cx + fx * w, cy + fy * h) : g.moveTo(cx + fx * w, cy + fy * h)));
    g.closePath(); g.fill();
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 0.6; g.stroke();
  } else if (decal === 5) { // manchas de vaca
    g.fillStyle = 'rgba(20,20,20,0.85)';
    [[-0.32, -0.22, 3, 2.2], [0.05, 0.25, 2.6, 2], [0.28, -0.25, 2, 2.6], [0.4, 0.28, 1.8, 1.4], [-0.1, -0.05, 1.6, 1.4]]
      .forEach(([fx, fy, rx, ry]) => ellipse(g, cx + fx * w, cy + fy * h, rx, ry));
  }
}

function drawTruck(g, look) {

    const l = 10 + Math.random() * 10, rx = b[0] - 1;

    g.fillStyle = '#ffe14a'; tri(g, rx, -2, rx, 2, rx - l * 0.6, 0); g.fill();

  if (look.decal) { g.save(); m.clip(g); g.clip(); drawDecal(g, look.decal, b); g.restore(); }
  m.top(g);
  if (look.dirt > 0.04) { g.save(); m.clip(g); g.clip(); drawDirt(g, look.dirt, b); g.restore(); }
}

// ===== Camionetas: física, IA y dibujo =====
const NO_INPUT = { gas: false, brake: false, steer: 0, nitro: false };

class Truck {
  constructor(r) {
    this.r = r; // datos que duran todo el campeonato (dinero, mejoras...)
    this.name = r.name; this.color = r.color; this.dark = r.dark;
    this.model = r.model || 'pickup'; this.decal = r.decal || 0; this.horn = r.horn || 0; this.dirt = 0;
    this.human = r.human; this.player = r.player;
    this.upg = { ...r.upg }; this.skill = r.skill || 1; this.rb = 1;
    this.nitros = r.nitros; this.nitroT = 0; this.nitroHeld = false;
    this.x = 0; this.y = 0; this.a = 0; this.vx = 0; this.vy = 0; this.z = 0; this.vz = 0;
    this.idx = 0; this.prog = 0; this.lapDone = -1; this.finished = false; this.place = 0; this.pos = 0;
    this.earned = 0; this.stuckT = 0; this.revT = 0; this.revSteer = 1; this.lane = 0; this.laneT = 0;
    this.surface = 'dirt'; this.lastSurf = 'dirt'; this.fxT = 0; this.lastBump = -1;
    this.gh = 0; this.upper = false; // altura del suelo (puentes) y si va por arriba
  }

  spawn(t, off, lat) {
    this.idx = wrap(t, off);
    const p = t.pts[this.idx];
    this.x = p.x + p.nx * lat; this.y = p.y + p.ny * lat;
    this.a = Math.atan2(p.ty, p.tx); this.prog = off;
  }

  get speed() { return Math.hypot(this.vx, this.vy); }
  get elev() { return this.gh + this.z; }

  stats() {
    const u = this.upg, s = this.skill * this.rb, m = MODELS[this.model] || MODELS.pickup;
    return {
      max: (185 + u.motor * 20) * s * m.max,
      accel: (230 + u.acel * 42) * s * m.accel,
      turn: (3.0 + u.llantas * 0.22) * m.turn,
      grip: (5 + u.llantas * 1.4) * m.grip,
      shock: u.amort + m.bump, mud: m.mud, jump: m.jump, mass: m.mass
    };
  }

  update(dt, inp, race) {
    const t = race.track, st = this.stats();
    this.surface = 'dirt';
    if (this.z <= 0 && this.gh < 4) {
      for (const pd of t.puddles) {
        if ((this.x - pd.x) ** 2 + (this.y - pd.y) ** 2 < pd.r * pd.r) { this.surface = pd.type; break; }
      }
    }
    let maxS = st.max, drag = 0;
    if (this.surface === 'mud') { maxS *= Math.min(1, 0.42 + st.shock * 0.04 + this.upg.llantas * 0.03 + st.mud); drag = 1.2 * (1 - st.mud); }
    if (this.surface === 'water') { maxS *= 0.6 + st.shock * 0.05; drag = 0.6; }
    if (this.nitroT > 0) { this.nitroT -= dt; maxS *= 1.45; }
    // el barro ensucia la camioneta y el agua la lava
    if (this.surface === 'mud') this.dirt = Math.min(1, this.dirt + dt * 0.9);
    else if (this.surface === 'water') this.dirt = Math.max(0, this.dirt - dt * 1.4);
    else if (this.z <= 0 && this.speed > 120) this.dirt = Math.min(1, this.dirt + dt * 0.006);

    if (this.z > 0 || this.vz > 0) {
      // en el aire: no se puede doblar ni acelerar
      this.z += this.vz * dt; this.vz -= 950 * dt;
      if (this.z <= 0) {
        this.z = 0;
        if (this.vz < -120) {
          const k = Math.min(1, 0.8 + st.shock * 0.035);
          this.vx *= k; this.vy *= k;
          race.fx('land', this);
        }
        this.vz = 0;
      }
    } else {
      let fx = Math.cos(this.a), fy = Math.sin(this.a);
      const f0 = this.vx * fx + this.vy * fy;
      const sf = 0.35 + 0.65 * Math.min(1, Math.abs(f0) / 70);
      this.a += inp.steer * st.turn * sf * (f0 < -5 ? -1 : 1) * dt;
      fx = Math.cos(this.a); fy = Math.sin(this.a);
      let fwd = this.vx * fx + this.vy * fy, lat = -this.vx * fy + this.vy * fx;
      const boost = this.nitroT > 0 ? 2.2 : 1;
      if (inp.gas) { if (fwd < maxS) fwd = Math.min(maxS, fwd + st.accel * boost * dt * (fwd < 0 ? 2 : 1)); }
      else if (inp.brake) fwd -= (fwd > 0 ? 420 : 170) * dt;
      else fwd *= Math.exp(-1.2 * dt);
      if (fwd > maxS) fwd += (maxS - fwd) * Math.min(1, 2.5 * dt);
      if (fwd < -90) fwd = -90;
      fwd *= Math.exp(-drag * dt);
      lat *= Math.exp(-st.grip * dt); // el agarre de las llantas frena el derrape
      this.vx = fx * fwd - fy * lat; this.vy = fy * fwd + fx * lat;
    }
    this.x += this.vx * dt; this.y += this.vy * dt;

    // avance por la pista
    const oldIdx = this.idx;
    this.idx = nearestIdx(t, this.x, this.y, oldIdx);
    this.gh += (t.height[this.idx] - this.gh) * Math.min(1, dt * 12);
    this.upper = t.bridgeAt[this.idx] === 1;
    let d = this.idx - oldIdx;
    if (d > t.N / 2) d -= t.N;
    if (d < -t.N / 2) d += t.N;
    this.prog += d;

    if (this.z <= 0 && d > 0) {
      for (const j of t.jumps) {
        const w = wrap(t, j - oldIdx);
        if (w > 0 && w <= d) {
          const f = this.vx * Math.cos(this.a) + this.vy * Math.sin(this.a);
          if (f > 70) { this.vz = Math.min(360, f * 1.2) * st.jump; this.z = 0.01; race.fx('jump', this, f); }
        }
      }
      for (const b of t.bumps) {
        if (inRange(t, this.idx, b.i0, b.i1) && wrap(t, this.idx - b.i0) % 3 === 0 && this.lastBump !== this.idx) {
          this.lastBump = this.idx;
          const sp = this.speed;
          if (sp > 80) {
            this.vz = (40 + sp * 0.35) * (1 - st.shock * 0.1); this.z = 0.01;
            const k = Math.min(1, 0.95 + st.shock * 0.008);
            this.vx *= k; this.vy *= k;
            race.fx('bump', this);
          }
        }
      }
    }

    // muros: empuja de vuelta a la pista y rebota
    const p = t.pts[this.idx];
    const off = (this.x - p.x) * p.nx + (this.y - p.y) * p.ny, lim = t.hw - 8;
    if (Math.abs(off) > lim) {
      const s = Math.sign(off), push = Math.abs(off) - lim;
      this.x -= p.nx * push * s; this.y -= p.ny * push * s;
      const vn = this.vx * p.nx + this.vy * p.ny;
      if (vn * s > 0) {
        this.vx -= p.nx * vn * 1.5; this.vy -= p.ny * vn * 1.5;
        this.vx *= 0.92; this.vy *= 0.92;
        // ayuda: endereza un poco la camioneta hacia la pista
        this.a += angDiff(Math.atan2(p.ty, p.tx), this.a) * 0.12;
        if (Math.abs(vn) > 50) race.fx('wall', this, Math.abs(vn));
      }
    }
  }

  drawShadow(g) {
    g.save();
    g.translate(this.x + 2 + this.z * 0.15, this.y + 3 + this.z * 0.2); g.rotate(this.a);
    g.fillStyle = `rgba(0,0,0,${0.35 - Math.min(0.2, this.z / 400)})`;
    roundRect(g, -14, -10, 28, 20, 6); g.fill();
    g.restore();
  }

  draw(g, demo) {
    const sc = 1 + (this.z + this.gh) / 160, y = this.y - this.z * 0.5;
    g.save(); g.translate(this.x, y); g.rotate(this.a); g.scale(sc, sc);
    drawTruck(g, this);
    g.restore();
    if (this.human && !demo) {
      const ay = y - 20 * sc;
      g.fillStyle = this.color; tri(g, this.x - 6, ay - 7, this.x + 6, ay - 7, this.x, ay + 1); g.fill();
      g.strokeStyle = '#fff'; g.lineWidth = 1.5; g.stroke();
      if (Game.players === 2) {
        g.font = font(11); g.textAlign = 'center'; g.textBaseline = 'middle';
        g.lineWidth = 3; g.strokeStyle = '#000'; g.strokeText(this.player + 1, this.x, ay - 15);
        g.fillStyle = '#fff'; g.fillText(this.player + 1, this.x, ay - 15);
      }
    }
  }
}

// ===== Pilotos de la computadora =====
function aiInput(car, race) {
  const t = race.track, dt = race.dt, spd = car.speed;
  if (car.revT > 0) {
    car.revT -= dt;
    return { gas: false, brake: true, steer: car.revSteer, nitro: false };
  }
  car.laneT -= dt;
  if (car.laneT <= 0) { car.lane = (Math.random() * 2 - 1) * 0.45; car.laneT = 1.5 + Math.random() * 2.5; }
  const look = 5 + Math.floor(spd / 35);
  const p = t.pts[wrap(t, car.idx + look)];
  let lane = car.lane;
  for (const pd of t.puddles) {
    if ((p.x - pd.x) ** 2 + (p.y - pd.y) ** 2 < (pd.r + t.hw * 0.6) ** 2) {
      const side = (pd.x - p.x) * p.nx + (pd.y - p.y) * p.ny;
      lane = side > 0 ? -0.62 : 0.62;
    }
  }
  let tx = p.x + p.nx * lane * t.hw, ty = p.y + p.ny * lane * t.hw;
  for (const pk of race.pickups) {
    const dx = pk.x - car.x, dy = pk.y - car.y;
    if (dx * dx + dy * dy < 110 * 110 && Math.abs(angDiff(Math.atan2(dy, dx), car.a)) < 0.5) { tx = pk.x; ty = pk.y; }
  }
  const diff = angDiff(Math.atan2(ty - car.y, tx - car.x), car.a);
  const far = t.pts[wrap(t, car.idx + look + 10)];
  const curve = Math.abs(angDiff(Math.atan2(far.y - p.y, far.x - p.x), car.a));
  const st = car.stats();
  let gas = true, brake = false;
  if (curve > 1.0 && spd > st.max * 0.75) gas = false;
  if (Math.abs(diff) > 1.3 && spd > 80) { gas = false; brake = true; }
  const nitro = !car.finished && car.nitros > 0 && car.nitroT <= 0 && curve < 0.3 && Math.abs(diff) < 0.2 && Math.random() < 0.008;
  if (race.state === 'race' && spd < 20) {
    car.stuckT += dt;
    if (car.stuckT > 1.0) { car.stuckT = 0; car.revT = 0.7; car.revSteer = diff > 0 ? -1 : 1; }
  } else car.stuckT = 0;
  return { gas, brake, steer: clamp(diff * 3, -1, 1), nitro };
}

// ===== Carrera =====
const LAPS = 4;
const PRIZES = [100, 70, 50, 30];
const POINTS = [10, 6, 4, 2];

function drawPickup(g, pk, bob) {
  g.fillStyle = 'rgba(0,0,0,0.3)'; ellipse(g, pk.x + 2, pk.y + 7, 9, 4);
  const y = pk.y - 4 + bob;
  g.textAlign = 'center'; g.textBaseline = 'middle';
  if (pk.type === 'nitro') {
    g.fillStyle = '#0d3a8f'; roundRect(g, pk.x - 7, y - 11, 14, 20, 4); g.fill();
    g.fillStyle = '#2f7bff'; roundRect(g, pk.x - 5.5, y - 9.5, 11, 17, 3); g.fill();
    g.fillStyle = '#ddd'; g.fillRect(pk.x - 2.5, y - 15, 5, 5);
    g.fillStyle = '#fff'; g.font = font(10); g.fillText('N', pk.x, y);
  } else {
    g.fillStyle = '#a87a10'; ellipse(g, pk.x, y, 10, 10);
    g.fillStyle = '#ffd84a'; ellipse(g, pk.x - 1, y - 1, 8.5, 8.5);
    g.fillStyle = '#9a6b00'; g.font = font(11); g.fillText('$', pk.x - 1, y);
  }
}

class Race {
  constructor(trackIndex, racers, demo = false) {
    this.trackIndex = trackIndex;
    this.track = getTrack(trackIndex);
    this.demo = demo;
    this.trucks = racers.map(r => new Truck(r));
    const t = this.track, slots = [[-3, -0.45], [-3, 0.45], [-8, -0.45], [-8, 0.45]];
    this.trucks.forEach((tr, i) => tr.spawn(t, slots[i][0], slots[i][1] * t.hw));
    this.hudOrder = [...this.trucks].sort((a, b) => a.r.id - b.r.id);
    this.state = demo ? 'race' : 'countdown';
    this.count = 3.99; this.time = 0; this.dt = 1 / 60; this.goT = 0;
    this.pickups = []; this.parts = []; this.popups = []; this.spawnT = 2.5;
    this.order = []; this.banner = null; this.endT = 0; this.paused = false; this.shake = 0;
  }

  update(dt) {
    if (this.paused) return;
    this.dt = dt;
    if (this.state === 'countdown') {
      const b = Math.ceil(this.count);
      this.count -= dt;
      const a = Math.ceil(this.count);
      if (a !== b && a >= 1 && a <= 3) Sound.sfx.beep();
      if (this.count <= 0) { this.state = 'race'; this.goT = 1.2; Sound.sfx.go(); Announcer.event('go'); }
    } else this.time += dt;
    if (this.goT > 0) this.goT -= dt;

    // "Liga elástica": los rivales se frenan si van muy adelante y apuran si van atrás
    const humans = this.trucks.filter(tr => tr.human);
    const ref = humans.length ? Math.max(...humans.map(h => h.prog)) : null;
    const D = DIFFS[Game.diff];
    for (const tr of this.trucks) {
      if (!tr.human) {
        if (ref === null || tr.finished) tr.rb = 1;
        else tr.rb = clamp(1 - (tr.prog - ref) / this.track.N * 0.3, D.rbMin, D.rbMax);
      }
      let inp = NO_INPUT;
      if (this.state !== 'countdown') {
        inp = tr.human && !tr.finished ? Input.get(tr.player, Game.autoGas) : aiInput(tr, this);
      }
      if (inp.nitro && !tr.nitroHeld && tr.nitros > 0 && tr.nitroT <= 0) {
        tr.nitros--; tr.nitroT = 1.6;
        if (tr.human && !this.demo) { Sound.sfx.nitro(); Announcer.event('nitro', tr); }
      }
      tr.nitroHeld = inp.nitro;
      if (inp.horn && !tr.hornHeld && tr.human && !this.demo) this.honk(tr);
      tr.hornHeld = inp.horn;
      tr.update(dt, inp, this);
      this.checkLap(tr);
      this.emitDust(tr, dt);
      if (tr.human && !this.demo) {
        const inTunnel = this.track.tunnelAt[tr.idx] === 1;
        if (inTunnel && !tr.wasTunnel) Announcer.event('tunnel', tr);
        if (tr.upper && !tr.wasBridge) Announcer.event('bridge', tr);
        tr.wasTunnel = inTunnel; tr.wasBridge = tr.upper;
      }
    }
    this.collide();
    this.updatePickups(dt);

    for (const p of this.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
    this.parts = this.parts.filter(p => p.life > 0);
    for (const p of this.popups) { p.y -= 30 * dt; p.life -= dt; }
    this.popups = this.popups.filter(p => p.life > 0);
    if (this.banner) { this.banner.t -= dt; if (this.banner.t <= 0) this.banner = null; }
    if (this.shake > 0) this.shake -= dt;

    const rank = this.ranking();
    rank.forEach((tr, i) => { tr.pos = i + 1; });
    if (!this.demo && this.state === 'race' && rank[0] !== this.leader) {
      const prev = this.leader;
      this.leader = rank[0];
      if (prev && this.time > 4 && !rank[0].finished && (rank[0].human || prev.human)) Announcer.event('lead', rank[0]);
    }

    if (!this.demo && this.state === 'race') {
      if (this.endT === 0 && humans.every(h => h.finished)) this.endT = 3;
      if (this.endT > 0) { this.endT -= dt; if (this.endT <= 0) { this.endT = -1; this.finish(); } }
    }
  }

  ranking() {
    return [...this.trucks].sort((a, b) =>
      a.finished && b.finished ? a.place - b.place : a.finished ? -1 : b.finished ? 1 : b.prog - a.prog);
  }

  checkLap(tr) {
    if (tr.finished || this.demo) return;
    const lap = Math.floor(tr.prog / this.track.N);
    if (lap <= tr.lapDone) return;
    tr.lapDone = lap;
    const who = Game.players === 2 ? racerName(tr.r) + ': ' : '';
    if (lap >= LAPS) {
      tr.finished = true; this.order.push(tr); tr.place = this.order.length;
      if (tr.place === 1) Announcer.event('win', tr);
      if (tr.human) {
        this.showBanner(who + (tr.place === 1 ? L().won : L().placed(tr.place)), tr.place === 1 ? '#ffd23f' : '#fff', 3);
        if (tr.place === 1) { Sound.sfx.finish(); this.confetti(tr); } else Sound.sfx.lap();
      }
    } else if (lap >= 1 && tr.human) {
      Sound.sfx.lap();
      if (lap === LAPS - 1) Announcer.event('lastLap', tr);
      this.showBanner(who + (lap === LAPS - 1 ? L().lastLap : L().lapBanner(lap + 1)), '#fff', 1.4);
    }
  }

  finish() {
    const rest = this.trucks.filter(tr => !tr.finished).sort((a, b) => b.prog - a.prog);
    for (const tr of rest) { tr.finished = true; this.order.push(tr); tr.place = this.order.length; }
    Sound.stopEngines();
    Game.raceOver(this);
  }

  collide() {
    const T = this.trucks, R = 20;
    for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++) {
      const a = T[i], b = T[j];
      if (a.upper !== b.upper || Math.abs(a.elev - b.elev) > 14) continue;
      const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
      if (d2 >= R * R || d2 < 0.01) continue;
      // el más pesado (tractor, monster) empuja más y se mueve menos
      const d = Math.sqrt(d2), nx = dx / d, ny = dy / d, o = R - d;
      const ma = a.stats().mass, mb = b.stats().mass, wa = mb / (ma + mb), wb = ma / (ma + mb);
      a.x -= nx * o * wa; a.y -= ny * o * wa; b.x += nx * o * wb; b.y += ny * o * wb;
      const rv = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rv < 0) {
        const J = -1.4 * rv / (1 / ma + 1 / mb);
        a.vx -= nx * J / ma; a.vy -= ny * J / ma; b.vx += nx * J / mb; b.vy += ny * J / mb;
        if (rv < -60 && (a.human || b.human) && !this.demo) {
          Sound.sfx.bump();
          const other = a.human ? b : a;
          if (!other.human && Math.random() < 0.3) Sound.horn(other.horn, 2 + (other.r.id % 2));
        }
      }
    }
  }

  spawnPickup() {
    const t = this.track;
    for (let tries = 0; tries < 12; tries++) {
      const i = Math.floor(Math.random() * t.N);
      if (i < 15 || i > t.N - 15 || t.bridgeAt[i] || t.tunnelAt[i]) continue;
      const p = t.pts[i], off = (Math.random() * 2 - 1) * 0.55 * t.hw;
      const x = p.x + p.nx * off, y = p.y + p.ny * off;
      if (t.puddles.some(pd => (pd.x - x) ** 2 + (pd.y - y) ** 2 < (pd.r + 10) ** 2)) continue;
      const nitro = Math.random() < 0.45;
      this.pickups.push({ x, y, type: nitro ? 'nitro' : 'money', value: Math.random() < 0.5 ? 20 : 30, life: 12, bob: Math.random() * 6 });
      return;
    }
  }

  updatePickups(dt) {
    if (this.state !== 'race') return;
    this.spawnT -= dt;
    if (this.spawnT <= 0) {
      this.spawnT = 2.5 + Math.random() * 2.5;
      if (this.pickups.length < 3) this.spawnPickup();
    }
    for (const pk of this.pickups) {
      pk.life -= dt;
      for (const tr of this.trucks) {
        if (pk.life <= 0 || tr.elev > 18 || (tr.x - pk.x) ** 2 + (tr.y - pk.y) ** 2 > 18 * 18) continue;
        pk.life = 0;
        const loud = tr.human && !this.demo;
        if (pk.type === 'nitro') {
          tr.nitros++;
          if (loud) { Sound.sfx.nitroPick(); this.popup(pk.x, pk.y, '+1 NITRO', '#8ff'); }
        } else {
          tr.earned += pk.value;
          if (loud) { Sound.sfx.coin(); this.popup(pk.x, pk.y, '+$' + pk.value, '#ffe04a'); }
        }
      }
    }
    this.pickups = this.pickups.filter(p => p.life > 0);
  }

  fx(type, tr, v) {
    this.curUp = tr.upper;
    const loud = tr.human && !this.demo;
    if (type === 'jump') { if (loud) { Sound.sfx.jump(); if (v > 190) Announcer.event('jump', tr); } }
    else if (type === 'land') { if (loud) Sound.sfx.land(); this.burst(tr.x, tr.y, 10, this.track.theme.d3, 60); }
    else if (type === 'bump') { if (loud && Math.random() < 0.5) Sound.sfx.bump(); }
    else if (type === 'wall') {
      if (loud) { Sound.sfx.crash(); if (v > 150) Announcer.event('crash', tr); }
      this.burst(tr.x, tr.y, 6, '#fff3a0', 90, 0.3);
      if (loud && v > 120) this.shake = 0.15;
    }
  }

  emitDust(tr, dt) {
    this.curUp = tr.upper;
    if (tr.surface !== tr.lastSurf) {
      if (tr.surface === 'water') { this.burst(tr.x, tr.y, 14, '#bfe0ff', 90); if (tr.human && !this.demo) Sound.sfx.splash(); }
      if (tr.surface === 'mud') { this.burst(tr.x, tr.y, 10, '#4a2f17', 70); if (tr.human && !this.demo) Announcer.event('mud', tr); }
      tr.lastSurf = tr.surface;
    }
    if (tr.z > 0) return;
    tr.fxT -= dt;
    if (tr.fxT > 0 || tr.speed < 40) return;
    tr.fxT = tr.surface === 'dirt' ? 0.05 : 0.03;
    const bx = tr.x - Math.cos(tr.a) * 12, by = tr.y - Math.sin(tr.a) * 12;
    if (tr.surface === 'mud') this.part(bx, by, '#4a2f17', 3, 40, 0.5, false);
    else if (tr.surface === 'water') { this.part(bx, by, '#6fb0ff', 2.5, 70, 0.5, false); this.part(bx, by, '#e6f4ff', 2, 70, 0.4, false); }
    else this.part(bx, by, this.track.theme.d3, 4 + Math.random() * 3, 20, 0.6, true);
  }

  part(x, y, col, size, spd, life, grow) {
    if (this.parts.length > 450) return;
    const a = Math.random() * Math.PI * 2, s = Math.random() * spd;
    this.parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, col, size, life, max: life, grow, up: !!this.curUp });
  }
  burst(x, y, n, col, spd, life = 0.5) {
    for (let i = 0; i < n; i++) this.part(x, y, col, 2 + Math.random() * 3, spd, life, false);
  }
  confetti(tr) {
    const cols = ['#ff4d4d', '#ffd23f', '#4dd2ff', '#7dff7a', '#ff7af5'];
    this.curUp = tr.upper;
    for (let i = 0; i < 60; i++) this.part(tr.x, tr.y, cols[i % 5], 2.5, 220, 1.4, false);
  }
  drawParts(g, up) {
    for (const p of this.parts) {
      if (p.up !== up) continue;
      const f = Math.max(0, p.life / p.max), s = p.grow ? p.size * (2 - f) : p.size;
      g.globalAlpha = f * 0.8; g.fillStyle = p.col; ellipse(g, p.x, p.y, s, s);
    }
    g.globalAlpha = 1;
  }
  nearBridge(tr) {
    const t = this.track, r2 = (t.hw + 34) ** 2;
    return t.bridgeIdx.some(i => (t.pts[i].x - tr.x) ** 2 + (t.pts[i].y - tr.y) ** 2 < r2);
  }
  // Dibuja una capa (puente o túnel) con un agujero suave donde están los jugadores tapados
  drawLayer(g, layer, holes) {
    if (!holes.length) { g.drawImage(layer, 0, 0, W, H); return; }
    const tmp = this.tmp || (this.tmp = document.createElement('canvas'));
    if (tmp.width !== layer.width || tmp.height !== layer.height) { tmp.width = layer.width; tmp.height = layer.height; }
    const tg = tmp.getContext('2d'), k = layer.width / W;
    tg.globalCompositeOperation = 'source-over';
    tg.clearRect(0, 0, tmp.width, tmp.height);
    tg.drawImage(layer, 0, 0);
    tg.globalCompositeOperation = 'destination-out';
    for (const tr of holes) {
      const x = tr.x * k, y = tr.y * k, r = 54 * k, grd = tg.createRadialGradient(x, y, r * 0.35, x, y, r);
      grd.addColorStop(0, 'rgba(0,0,0,0.78)'); grd.addColorStop(1, 'rgba(0,0,0,0)');
      tg.fillStyle = grd; tg.beginPath(); tg.arc(x, y, r, 0, Math.PI * 2); tg.fill();
    }
    g.drawImage(tmp, 0, 0, W, H);
  }
  honk(tr) { Sound.horn(tr.horn, tr.player); this.popup(tr.x, tr.y - 8, '♪♪', tr.color); }
  popup(x, y, text, col) { this.popups.push({ x, y, text, col, life: 1.2 }); }
  showBanner(text, col, t) { this.banner = { text, col, t, max: t }; }

  draw(g) {
    const t = getTrack(this.trackIndex);
    g.save();
    if (this.shake > 0) g.translate((Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6);
    g.drawImage(t.canvas, 0, 0, W, H);
    const now = performance.now() / 1000;
    for (const pk of this.pickups) {
      if (pk.life < 2 && Math.floor(pk.life * 8) % 2) continue;
      drawPickup(g, pk, Math.sin(now * 4 + pk.bob) * 2);
    }
    // Por capas: lo de abajo, el puente, lo de arriba y los túneles.
    // El puente y el cerro se aclaran alrededor del jugador que pasa por debajo o por dentro.
    const byY = (a, b) => (a.z > 0) - (b.z > 0) || a.y - b.y;
    const lower = this.trucks.filter(tr => !tr.upper).sort(byY), upper = this.trucks.filter(tr => tr.upper).sort(byY);
    this.drawParts(g, false);
    for (const tr of lower) tr.drawShadow(g);
    for (const tr of lower) tr.draw(g, this.demo);
    if (t.over) this.drawLayer(g, t.over, lower.filter(tr => tr.human && this.nearBridge(tr)));
    this.drawParts(g, true);
    for (const tr of upper) tr.drawShadow(g);
    for (const tr of upper) tr.draw(g, this.demo);
    if (t.cover) this.drawLayer(g, t.cover, this.trucks.filter(tr => tr.human && t.tunnelAt[tr.idx]));
    for (const p of this.popups) {
      g.globalAlpha = Math.min(1, p.life * 2);
      bigText(g, p.text, p.x, p.y - 14, 16, p.col);
    }
    g.globalAlpha = 1;
    g.restore();
    if (this.demo) return;
    this.drawHUD(g);
    if (this.state === 'countdown') {
      const n = Math.ceil(this.count), f = this.count - Math.floor(this.count);
      bigText(g, trackName(this.trackIndex), W / 2, H / 2 - 110, 44, '#fff');
      if (n <= 3) bigText(g, String(n), W / 2, H / 2, 110 * (0.8 + f * 0.5), '#ffd23f');
      else bigText(g, L().laps(LAPS), W / 2, H / 2, 40, '#ffd23f');
    } else if (this.goT > 0) {
      g.globalAlpha = Math.min(1, this.goT * 2);

const Announcer = (() => {
  const synth = window.speechSynthesis;
  // Las frases importantes interrumpen a las chicas; las chicas no siempre suenan
  const PRIORITY = { win: 3, lastLap: 2, go: 2, lead: 1 };
  let voices = [], lastT = -99, lastKey = '', lastPri = 0;
  const loadVoices = () => { voices = synth.getVoices(); };
  if (synth) { loadVoices(); synth.addEventListener('voiceschanged', loadVoices); }

  function pickVoice() {
    const mine = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(LANG));
    return mine.find(v => v.localService) || mine[0] || null;
  }

  function event(key, tr) {
    if (!synth || !Game.announcer) return;
    const now = performance.now() / 1000, pri = PRIORITY[key] || 0;
    if (key === lastKey && now - lastT < 4) return;
    if (synth.speaking && pri <= lastPri) return;
    if (pri === 0 && (now - lastT < 2.5 || Math.random() < 0.45)) return;
    let list = L().ann[key];
    if (typeof list === 'function') list = list(racerName(tr.r));
    const u = new SpeechSynthesisUtterance(list[Math.floor(Math.random() * list.length)]);
    const v = pickVoice();
    if (v) u.voice = v;
    u.lang = v ? v.lang : (LANG === 'es' ? 'es-ES' : 'en-US');
    u.rate = 1.12; u.pitch = 1.1;
    synth.cancel();
    synth.speak(u);
    lastT = now; lastKey = key; lastPri = pri;
  }

  function stop() { if (synth) synth.cancel(); }
  return { event, stop };
})();

const cycle = (v, d, n) => (v + d + n) % n;

function garageMenu() {
  const C = Game.garageCtx, gp = () => Game.garage[C.player], save = () => Game.savePrefs();
  const setView = d => {
    C.view = cycle(C.view, d, MODEL_KEYS.length);
    const k = MODEL_KEYS[C.view];
    if (gp().owned.includes(k)) { gp().model = k; save(); }
  };
  const setColor = v => { gp().color = v; save(); };
  const setDecal = d => { gp().decal = cycle(gp().decal, d, DECAL_COUNT); save(); };
  const setHorn = d => { gp().horn = cycle(gp().horn, d, HORN_COUNT); save(); Sound.horn(gp().horn, C.player); };
  const items = [
    { left: () => setView(-1), right: () => setView(1), action: buyModel },
    { left: () => setColor(cycle(gp().color, -1, PAINTS.length)), right: () => setColor(cycle(gp().color, 1, PAINTS.length)), set: setColor, action: () => { setColor(cycle(gp().color, 1, PAINTS.length)); Sound.sfx.select(); } },
    { left: () => setDecal(-1), right: () => setDecal(1), action: () => { setDecal(1); Sound.sfx.select(); } },
    { left: () => setHorn(-1), right: () => setHorn(1), action: () => Sound.horn(gp().horn, C.player) }
  ];
  if (C.ret === 'title') {
    items.push({ label: () => L().switchPlayer(2 - C.player), action: () => {
      C.player = 1 - C.player; C.view = MODEL_KEYS.indexOf(gp().model); Sound.sfx.select();
    } });
  }
  items.push({ label: () => L().done, action: () => Game.closeGarage() });
  return new Menu(items);
}

function buyModel() {
  const C = Game.garageCtx, gp = Game.garage[C.player], k = MODEL_KEYS[C.view];
  if (gp.owned.includes(k)) { gp.model = k; Game.savePrefs(); Sound.sfx.select(); return; }
  const r = C.ret === 'shop' ? Game.racers.find(x => x.player === C.player) : null, price = MODELS[k].price;
  if (r && r.money >= price) {
    r.money -= price; gp.owned.push(k); gp.model = k;

  } else {
    Sound.sfx.nope(); Game.showToast(r ? L().noMoney : L().earnHint);
  }
}

const EDITOR_KEY = 'turbobarro4x4.tracks', TRACK_SLOTS = 3, MAX_FEATS = 14;
const THEME_KEYS = ['pasto', 'desierto', 'canon', 'pantano', 'nieve'];
const ED_ICONS = ['✏️', '🚀', '🟫', '💧', '〰️', '🏁', '🌉', '⛰️', '🎨', '📁', '↩️', '🗑️', '▶️', '🚪'];

customTracks = (() => {
  try { const a = JSON.parse(localStorage.getItem(EDITOR_KEY)); return Array.isArray(a) ? a.slice(0, TRACK_SLOTS) : []; }
  catch (e) { return []; }
})();

const isRange = f => f[0] === 'bumps' || f[0] === 'bridge' || f[0] === 'tunnel';

const Editor = {
  slot: 0, def: null, track: null, tool: 0, drag: -1, hover: -1, hoverBtn: -1, undoStack: [], clearArm: 0,

  // pista inicial: un óvalo para que haya algo con qué jugar
  newDef(slot) {
    const pts = [];
    for (let i = 0; i < 8; i++) {
      const a = i / 8 * Math.PI * 2 - Math.PI;
      pts.push([Math.round(512 + Math.cos(a) * 330), Math.round(345 + Math.sin(a) * 200)]);
    }
    return { slot, theme: THEME_KEYS[slot % THEME_KEYS.length], width: 76, start: 0.5, seed: 101 + slot * 7, pts, feats: [['jump', 2.5], ['mud', 6.5, 0, 28]] };
  },

  open(slot) {
    this.slot = slot;
    const saved = customTracks[slot];
    this.def = saved ? JSON.parse(JSON.stringify(saved)) : this.newDef(slot);
    this.def.slot = slot;
    this.undoStack = []; this.tool = 0; this.drag = -1; this.hover = -1;
    this.ready = false;
    this.rebuild();
    this.ready = true;
    if (!saved) this.save();
    this.resume();
  },
  resume() { Game.scene = 'editor'; Game.menu = null; Sound.stopEngines(); Sound.play('menu'); },
  exit() { this.save(); Game.toTitle(); },

  rebuild() {
    const before = this.track ? this.track.autoBridges : 0;
    this.track = this.def.pts.length >= 4 ? buildTrack(this.def) : null;
    if (this.ready && this.track && this.track.autoBridges > before) { Game.showToast(L().editor.autoBridge); Sound.sfx.buy(); }
  },
  save() {
    const old = customTracks[this.slot];
    if (old) trackCache.delete(old);
    customTracks[this.slot] = JSON.parse(JSON.stringify(this.def));
    try { localStorage.setItem(EDITOR_KEY, JSON.stringify(customTracks)); } catch (e) { /* sin guardado */ }
  },
  snapshot() {
    this.undoStack.push(JSON.stringify(this.def));
    if (this.undoStack.length > 40) this.undoStack.shift();
  },
  change(fn) { this.snapshot(); fn(); this.rebuild(); this.save(); },
  undo() {
    if (!this.undoStack.length) { Sound.sfx.nope(); return; }
    this.def = JSON.parse(this.undoStack.pop());
    this.rebuild(); this.save(); Sound.sfx.select();
  },

  clampPt(x, y) { return [Math.round(clamp(x, 55, W - 55)), Math.round(clamp(y, HUD_H + 50, H - 50))]; },
  pointAt(x, y) { return this.def.pts.findIndex(p => Math.hypot(p[0] - x, p[1] - y) < 14); },

  // Insertar un punto parte un tramo en dos: las cosas puestas en la pista se corren para quedar en su lugar
  insertPoint(x, y) {
    const P = this.def.pts, n = P.length, np = this.clampPt(x, y);
    if (n < 3) { P.push(np); return; }
    let best = 0, bd = Infinity;
    for (let i = 0; i < n; i++) {
      const [ax, ay] = P[i], [bx, by] = P[(i + 1) % n], dx = bx - ax, dy = by - ay;
      const u = clamp(((np[0] - ax) * dx + (np[1] - ay) * dy) / (dx * dx + dy * dy || 1), 0, 1);
      const d = Math.hypot(ax + dx * u - np[0], ay + dy * u - np[1]);
      if (d < bd) { bd = d; best = i; }
    }
    const remap = a => (a >= best + 1 ? a + 1 : a >= best ? best + 2 * (a - best) : a);
    P.splice(best + 1, 0, np);
    this.def.start = remap(this.def.start);
    this.def.feats.forEach(f => { f[1] = remap(f[1]); if (isRange(f)) f[2] = remap(f[2]); });
  },

  // Borrar un punto junta dos tramos: lo que estaba en ellos se quita
  removePoint(k) {
    const P = this.def.pts, n = P.length, prev = (k - 1 + n) % n;
    const remap = a => { const s = Math.floor(a); return s === k || s === prev ? null : (s > k ? a - 1 : a); };
    P.splice(k, 1);
    const st = remap(this.def.start);
    this.def.start = st === null ? (k === 0 ? Math.max(0, n - 2) : prev) + 0.5 : st;
    this.def.feats = this.def.feats.filter(f => {
      const a = remap(f[1]), b = isRange(f) ? remap(f[2]) : 0;
      if (a === null || b === null) return false;
      f[1] = a; if (isRange(f)) f[2] = b;
      return true;
    });
  },

  nearestOnTrack(x, y) {
    const t = this.track;
    let best = 0, bd = Infinity;
    t.pts.forEach((p, i) => { const d = (p.x - x) ** 2 + (p.y - y) ** 2; if (d < bd) { bd = d; best = i; } });
    const p = t.pts[best];
    return { i: best, d: Math.sqrt(bd), off: (x - p.x) * p.nx + (y - p.y) * p.ny, s: Math.round(p.s * 1000) / 1000 };
  },

  featureAt(x, y) {
    const t = this.track, hit = this.nearestOnTrack(x, y), onTrack = hit.d < t.hw + 6;
    const dist = (a, b) => Math.min(wrap(t, a - b), wrap(t, b - a));
    return this.def.feats.findIndex(f => {
      if (f[0] === 'jump') return onTrack && dist(t.idxOf(f[1]), hit.i) <= 3;
      if (isRange(f)) return onTrack && inRange(t, hit.i, t.idxOf(f[1]), t.idxOf(f[2]));
      const p = t.pts[t.idxOf(f[1])];
      return Math.hypot(p.x + p.nx * f[2] * t.hw - x, p.y + p.ny * f[2] * t.hw - y) < f[3] + 4;
    });
  },

  button(i) {
    const now = performance.now() / 1000;
    if (i <= 7) { this.tool = i; Sound.sfx.select(); return; }
    if (i === 8) { this.change(() => { this.def.theme = THEME_KEYS[cycle(THEME_KEYS.indexOf(this.def.theme), 1, THEME_KEYS.length)]; }); Sound.sfx.select(); }
    else if (i === 9) { this.save(); this.open((this.slot + 1) % TRACK_SLOTS); Sound.sfx.select(); }
    else if (i === 10) this.undo();
    else if (i === 11) {
      if (now < this.clearArm) { this.change(() => { this.def.pts = []; this.def.feats = []; this.def.start = 0.5; }); this.clearArm = 0; this.tool = 0; }
      else { this.clearArm = now + 2.5; Game.showToast(L().editor.confirmClear); }
    } else if (i === 12) {
      if (!this.track) { Sound.sfx.nope(); Game.showToast(L().editor.needPoints(4 - this.def.pts.length)); return; }
      this.save(); Game.testTrack(customTracks[this.slot]);
    } else if (i === 13) this.exit();
  },

  pointer(type, x, y, button) {
    if (type === 'move') {
      this.hoverBtn = y < HUD_H ? Math.floor(x / (W / 14)) : -1;
      if (this.drag >= 0) { this.def.pts[this.drag] = this.clampPt(x, y); this.rebuild(); }
      else this.hover = this.tool === 0 ? this.pointAt(x, y) : -1;
      return;
    }
    if (type === 'up') { if (this.drag >= 0) { this.drag = -1; this.save(); } return; }
    if (y < HUD_H) { if (button === 0) this.button(Math.floor(x / (W / 14))); return; }
    if (this.tool === 0) {
      const hit = this.pointAt(x, y);
      if (button === 2) { if (hit >= 0) { this.change(() => this.removePoint(hit)); this.hover = -1; Sound.sfx.select(); } return; }
      if (hit >= 0) { this.snapshot(); this.drag = hit; return; }
      if (button !== 0 || this.def.pts.some(p => Math.hypot(p[0] - x, p[1] - y) < 30)) return;
      this.change(() => this.insertPoint(x, y)); Sound.sfx.select();
      return;
    }
    if (!this.track) return;
    const t = this.track, hit = this.nearestOnTrack(x, y);
    if (hit.d > t.hw + 8) return;
    if (this.tool === 5) { this.change(() => { this.def.start = hit.s; }); Sound.sfx.select(); return; }
    const fi = this.featureAt(x, y);
    if (fi >= 0) { this.change(() => this.def.feats.splice(fi, 1)); Sound.sfx.select(); return; }
    if (button !== 0 || this.def.feats.length >= MAX_FEATS) return;
    const off = Math.round(clamp(hit.off / t.hw, -0.5, 0.5) * 100) / 100;
    const sAt = d => Math.round(t.pts[wrap(t, hit.i + d)].s * 1000) / 1000;
    const f = { 1: ['jump', hit.s], 2: ['mud', hit.s, off, 28], 3: ['water', hit.s, off, 26], 4: ['bumps', hit.s, sAt(18)],
                6: ['bridge', sAt(-22), sAt(22)], 7: ['tunnel', sAt(-15), sAt(15)] }[this.tool];
    this.change(() => this.def.feats.push(f)); Sound.sfx.buy();
  },

  // Teclas propias del editor; devuelve true si la usó
  key(e) {
    if (e.code === 'Escape') { this.exit(); return true; }
    if (e.code === 'KeyZ') { this.undo(); return true; }
    if ((e.code === 'Backspace' || e.code === 'Delete') && this.tool === 0 && this.hover >= 0) {
      const k = this.hover; this.change(() => this.removePoint(k)); this.hover = -1; return true;
    }
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= 8 && !e.repeat) { this.tool = n - 1; Sound.sfx.select(); return true; }
    return false;
  },

  draw(g) {
    const th = THEMES[this.def.theme], t = this.track, P = this.def.pts, E = L().editor;
    g.fillStyle = th.ground; g.fillRect(0, 0, W, H);
    g.strokeStyle = 'rgba(0,0,0,0.07)'; g.lineWidth = 1; g.beginPath();
    for (let x = 0; x <= W; x += 32) { g.moveTo(x, 0); g.lineTo(x, H); }
    for (let y = 0; y <= H; y += 32) { g.moveTo(0, y); g.lineTo(W, y); }
    g.stroke();
    if (t) {
      const ground = t.bridges.length ? i => !t.bridgeAt[i] : null, path = trackPath(t, 0, ground);
      g.lineJoin = 'round'; g.lineCap = 'round';
      g.strokeStyle = th.wall; g.lineWidth = t.def.width + 16; g.stroke(path);
      g.setLineDash([9, 9]); g.strokeStyle = th.wall2; g.stroke(path); g.setLineDash([]);
      g.strokeStyle = th.dirt; g.lineWidth = t.def.width; g.stroke(path);
      const rnd = mulberry32(5);
      for (const pd of t.puddles) drawPuddle(g, pd, rnd);
      for (const b of t.bumps) { const cnt = wrap(t, b.i1 - b.i0); for (let s = 0; s <= cnt; s += 3) drawBumpRow(g, t, wrap(t, b.i0 + s), s / 3); }
      for (const j of t.jumps) drawJump(g, t, j);
      drawStartLine(g, t);
      if (t.bridges.length) drawBridges(g, t);
      if (t.tunnels.length) { g.globalAlpha = 0.8; drawTunnels(g, t); g.globalAlpha = 1; }
      g.fillStyle = 'rgba(255,255,255,0.5)';
      for (let i = 14; i < t.N; i += 30) {
        const p = t.pts[i];
        g.save(); g.translate(p.x, p.y); g.rotate(Math.atan2(p.ty, p.tx)); tri(g, -6, -6, -6, 6, 7, 0); g.fill(); g.restore();
      }
    } else if (P.length) {
      g.strokeStyle = 'rgba(255,255,255,0.7)'; g.lineWidth = 4; g.setLineDash([10, 8]);
      g.beginPath(); P.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); g.setLineDash([]);
    }
    // puntos de control numerados
    g.globalAlpha = this.tool === 0 ? 1 : 0.45;
    P.forEach(([x, y], i) => {
      const on = i === this.hover || i === this.drag;
      g.fillStyle = on ? '#ffd23f' : '#fff'; ellipse(g, x, y, 11, 11);
      g.lineWidth = 3; g.strokeStyle = '#2a1405'; g.beginPath(); g.arc(x, y, 11, 0, Math.PI * 2); g.stroke();
      g.font = font(11); g.fillStyle = '#2a1405'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(i + 1, x, y + 1);
    });
    g.globalAlpha = 1;
    if (P.length < 4) bigText(g, E.needPoints(4 - P.length), W / 2, H / 2, 26, '#fff');

    // barra de herramientas
    g.fillStyle = 'rgba(15,10,5,0.92)'; g.fillRect(0, 0, W, HUD_H);
    const labels = [...E.tools, L().themes[this.def.theme], E.slot(this.slot + 1), E.undo, E.clear, E.test, E.exit], bw = W / 14;
    labels.forEach((lab, i) => {
      const x = i * bw, on = i === this.tool;
      g.fillStyle = on ? '#ffd23f' : i === 12 ? '#2fa84a' : i === this.hoverBtn ? 'rgba(255,255,255,0.18)' : 'rgba(255,255,255,0.07)';
      roundRect(g, x + 3, 4, bw - 6, HUD_H - 8, 8); g.fill();
      g.textAlign = 'center'; g.textBaseline = 'middle';
      // los emojis toman la transparencia del color de relleno: van con color opaco
      g.fillStyle = '#fff';
      g.font = '15px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif'; g.fillText(ED_ICONS[i], x + bw / 2, 16);
      g.font = font(10, 800); g.fillStyle = on ? '#3a1d00' : '#fff'; g.fillText(lab, x + bw / 2, 35);
    });
    g.fillStyle = 'rgba(255,255,255,0.3)'; g.fillRect(8 * bw - 1, 8, 2, HUD_H - 16);
    // ayuda de la herramienta elegida
    const hint = E.hints[this.tool];
    g.font = font(13, 700);
    const hw = g.measureText(hint).width / 2 + 16;
    g.fillStyle = 'rgba(0,0,0,0.6)'; roundRect(g, W / 2 - hw, H - 34, hw * 2, 26, 13); g.fill();
    g.fillStyle = '#fff'; g.textAlign = 'center'; g.fillText(hint, W / 2, H - 21);
  }
};
